<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6edf3;--muted:#7d8590;
  --accent:#ff7a1a;--accent2:#ff4d1a;--accent-rgb:255,122,26;
  --success:#3fb950;--warning:#d29922;--danger:#f85149;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
  --topbar-h:54px;
}
[data-theme="light"]{
  --bg:#f4f5f7;--bg2:#ffffff;--bg3:#eceef2;--bg4:#e3e6ec;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1f26;--muted:#5b6472;
  --success:#1a7f37;--warning:#9a6700;--danger:#cf222e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%}
#root{min-height:100vh}
h1,h2,h3,.fh{font-family:var(--font-head);font-weight:800;letter-spacing:-0.01em}
a{color:inherit}
button{font-family:var(--font-body);cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:var(--font-body);background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.muted{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{font-family:var(--font-head);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn{border:1px solid var(--border2);background:var(--bg3);color:var(--text);border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(0.97)}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.btn-s{background:transparent}
.btn-danger{border-color:rgba(248,81,73,0.4);color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.shell{display:flex;min-height:calc(100vh - var(--topbar-h))}
.nav{width:210px;flex-shrink:0;border-right:1px solid var(--border);padding:14px 10px;background:var(--bg2)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px}
.nav-item.active{background:rgba(var(--accent-rgb),0.13);color:var(--accent)}
.nav-item:hover{background:var(--bg3)}
.main{flex:1;padding:20px;max-width:1200px}
@media(max-width:760px){.nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;display:flex;flex-direction:row;justify-content:space-around;border-right:none;border-top:1px solid var(--border);padding:6px;z-index:39}.nav-item{flex-direction:column;font-size:10.5px;gap:3px;padding:6px}.main{padding-bottom:80px}.remind-cols{grid-template-columns:1fr !important}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.pipe{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.pipe-col{min-width:250px;flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px}
.pipe-col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em}
.opp-card{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:11px;margin-bottom:8px;cursor:pointer}
.opp-card:hover{border-color:var(--accent)}
.opp-card .t{font-weight:700;font-size:13.5px;margin-bottom:3px}
.opp-card .a{font-size:12px;color:var(--muted)}
.opp-card .m{font-size:13px;font-weight:700;color:var(--accent);margin-top:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.modal-title{font-family:var(--font-head);font-weight:800;font-size:18px;margin:0 0 14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg3)}
.item-row{display:grid;grid-template-columns:1fr 60px 90px 90px 28px;gap:6px;margin-bottom:6px;align-items:center}
.total-line{display:flex;justify-content:flex-end;gap:16px;font-size:15px;font-weight:800;padding-top:10px;border-top:1px solid var(--border);margin-top:8px}
.remind-item{display:flex;justify-content:space-between;align-items:center;padding:11px;border-bottom:1px solid var(--border)}
.remind-item:last-child{border-bottom:none}
.remind-item.late{border-left:3px solid var(--danger);padding-left:8px}
.tag-input textarea{min-height:80px;resize:vertical;font-family:var(--font-body)}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.spin{width:26px;height:26px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--border2);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:200}
.toast.err{border-color:rgba(248,81,73,0.5);color:var(--danger)}
.toast.ok{border-color:rgba(63,185,80,0.5);color:var(--success)}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;padding:4px}

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef} = React;

// ── CONFIG ────────────────────────────────────────────────────────────────
// clientId : créé dans Google Cloud Console (même projet que PunchPro),
//            type "Application Web", origine JS autorisée = domaine d'hébergement
//            de CETTE app.
// crmSpreadsheetId : ID du Google Sheet du CRM — contient 3 onglets:
//            Contacts, Opportunites, Soumissions.
// projetsSpreadsheetId : ID d'un Google Sheet SÉPARÉ ("PROJETS SARAN ÉLECTRIQUE"),
//            dédié uniquement à l'onglet "Projets". Quand une opportunité est marquée
//            "Gagné", une ligne est ajoutée ici + un événement Calendar est créé.
//            Ce sheet sera "donné" à PunchPro (PunchPro sera adapté pour le lire) dans
//            une étape séparée, plus tard — l'onglet "Projets" existant DE PunchPro
//            (dans son propre sheet d'heures) n'est PAS touché par le CRM.
// calendarIds : calendriers Google sur lesquels créer les événements de job (le premier
//            de la liste est utilisé).
// punchproSpreadsheetId : Sheet "HEURES & EMPLOYÉS APP SARAN ÉLECTRIQUE" — LECTURE SEULE.
//            Le CRM y lit les onglets Employés/Pointages pour afficher les heures des
//            employés et n'y écrit JAMAIS rien.
// memoireJobsSpreadsheetId / memoireFacturesSpreadsheetId / memoireAppelsSpreadsheetId : registres
//            « La mémoire — Jobs », « La mémoire — Factures » et « La mémoire — Appels de service » (Drive info@, dossier La mémoire) — LECTURE SEULE.
//            Une ligne par PO (montant, client, dossier Drive) et une ligne par facture
//            (montant, date, envoi, PDF). Remplis par La mémoire; lus par l'onglet Clients.
// suiviTravauxSpreadsheetId : Sheet "SUIVI TRAVAUX SARAN ÉLECTRIQUE" — LECTURE SEULE.
//            Un onglet par contracteur (Particuliers/ASC/CRS/PAY/SAR/GGP/BOM/RROY/5PIL),
//            utilisé pour détecter les appels de service sans facture ("factures
//            manquantes"). Le CRM lit les en-têtes dynamiquement (pas d'écriture).
const DEFAULT_CFG = {
  apiKey: 'AIzaSyAWO2raCV3cUYpouxyyaPZ9VamrkRXqDKY',
  clientId: '718428072431-tnd2rngvrgg5kbav31le67gmi0m0qr3f.apps.googleusercontent.com',
  crmSpreadsheetId: '1AvjMWcAVPeLJrGUeyjuo0yypZC9hSbaQJGaSW3mP8M0',
  projetsSpreadsheetId: '1XJldTQODgo207rnwneF1CsHYS7PKwGR80pkXn741Oug',
  punchproSpreadsheetId: '1uj7S1uHsE0BZwbNSJdtAEjpy_9YWqfh6mXoJwwLJ9UA',
  suiviTravauxSpreadsheetId: '1uHgs4eiD0t25hYHp69q27tESsuVB4HraCud3c04vLwY',
  calendarIds: 'saranelectrique@gmail.com,info@saranelectrique.com',
  memoireJobsSpreadsheetId: '1POqSf9_TAJCr8cYsV2QEGYzcPdLOeIGeWnIX8Y_swBg',
  memoireFacturesSpreadsheetId: '1I6QfEObkpfrSAqz2vSO_XdCKABWYoe2e5TOG3so3Uks',
  memoireAppelsSpreadsheetId: '1FJvH7oh82oRlEAyg2ddHOrJEDc-NGI6849m7StONcD8',
  memoireAchatsSpreadsheetId: '1i6DNjPmxKRubA8IcSxNoC12SEwefVLcNF39F-dvEnmw',  // La mémoire — Achats (factures fournisseurs)
  memoireMajUrl: 'https://script.google.com/a/macros/saranelectrique.com/s/AKfycbwimU1z8lsEwIaL7zIx6Nqf1m8xSrCTPpmTEtTYaVs5PMbPqxhz91VIkcbthP56ZmDubA/exec'  // adresse de l'application Web Apps Script (bouton « Mettre à jour »)
};
function loadCfg(){
  try{ const raw=localStorage.getItem('crm_cfg'); return raw?{...DEFAULT_CFG,...JSON.parse(raw)}:{...DEFAULT_CFG}; }
  catch{ return {...DEFAULT_CFG}; }
}
function saveCfg(cfg){ localStorage.setItem('crm_cfg', JSON.stringify(cfg)); }

const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/userinfo.email';
const DISCOVERY = ['https://sheets.googleapis.com/$discovery/rest?version=v4','https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'];
const APP_VERSION = 'v51';

const ETAPES = ['Prospect','Contacté','Soumission envoyée','Gagné','Perdu'];
const ETAPE_COLORS = {'Prospect':'#7d8590','Contacté':'#0ea5e9','Soumission envoyée':'#d29922','Gagné':'#3fb950','Perdu':'#f85149'};

const CONTACTS_HEADERS = ['id','nom','entreprise','telephone','email','adresse','source','notes','dateCreation'];
const OPP_HEADERS = ['id','contactId','titre','adresse','typeTravail','etape','montantEstime','dateCreation','dateRelance','dateCloture','notes','punchproJobCree','punchproEventId'];
const SOUM_HEADERS = ['id','opportuniteId','date','itemsJson','total','statut','courrielEnvoye','dateEnvoi'];
// Onglet "Projets" du CRM — sera donné à PunchPro plus tard (voir commentaire CONFIG plus haut)
// adressesLiees: adresses SECONDAIRES (séparées par ';') attachées manuellement à ce
// projet depuis "Projets par adresse" — pour qu'un job dont l'adresse ne correspond
// pas exactement puisse quand même être rattaché au bon projet CRM.
// stockStatut: '' | 'À commander' | 'Prêt' — suivi utilisé par le Tableau de bord.
const PROJETS_HEADERS = ['id','opportuniteId','adresse','titre','contracteur','phase','typeTravail','client','telephone','notes','statut','dateCreation','eventId','po','adressesLiees','stockStatut'];
// Statuts de suivi d'un projet CRM (indépendant de l'étape "Gagné" du pipeline —
// une fois la job créée, on suit ici si le chantier est à venir/en cours/fermé).
const PROJET_STATUTS = ['À venir','Actif','Fermé'];
const PROJET_STATUT_COLORS = {'À venir':'#0ea5e9','Actif':'#3fb950','Fermé':'#7d8590'};
const STOCK_STATUTS = ['','À commander','Prêt'];
const STOCK_LABELS = {'':'Stock: —','À commander':'Stock: à commander','Prêt':'Stock: prêt'};
const STOCK_COLORS = {'À commander':'#d29922','Prêt':'#3fb950'};
// Retourne toutes les clés d'adresse (principale + liées) qui identifient un projet,
// pour retrouver les événements Calendar qui lui appartiennent.
function projetAddressKeys(projet){
  const keys = [String(projet.adresse||'').trim().toLowerCase()];
  String(projet.adressesLiees||'').split(';').forEach(a=>{ const k=a.trim().toLowerCase(); if(k) keys.push(k); });
  return keys.filter(Boolean);
}
function eventAddressKey(e){
  return String((e.location && e.location.trim()) || parseCivicStreet(e.title) || e.title || '').trim().toLowerCase();
}
// Tous les événements Calendar dont l'adresse correspond à ce projet (principale OU liée).
function projetLinkedEvents(projet, events){
  const keys = new Set(projetAddressKeys(projet));
  if(keys.size===0) return [];
  return (events||[]).filter(e=>keys.has(eventAddressKey(e))).sort((a,b)=>String(b.start).localeCompare(String(a.start)));
}
// Map "clé d'adresse" -> projet, pour savoir si une adresse du calendrier a déjà un
// projet CRM (via son adresse principale OU une adresse liée).
function buildProjetAddressIndex(projets){
  const map = {};
  (projets||[]).forEach(p=>{ projetAddressKeys(p).forEach(k=>{ map[k]=p; }); });
  return map;
}
// Onglet "Rappels" du CRM — suivis/rappels créés manuellement (indépendants du pipeline
// Opportunités). statut: 'A faire' | 'Fait'. assigneA: 'William' | 'Isabelle'.
const RAPPELS_HEADERS = ['id','titre','description','dateEcheance','adresse','statut','dateCreation','assigneA'];

// ── Contracteurs (mêmes abréviations que PunchPro) ───────────────────────
// 'PARTICULIER' = client résidentiel, pas de contracteur associé.
const JOB_PREFIXES = ['PAY','CRS','ASC','GGP','SAR','BOM','5PIL','RROY','GOU'];
const CONTRACTEURS = [...JOB_PREFIXES, 'PARTICULIER'];
const JOB_PHASES = ['ROUGH','FINITION','BORNES','SERV','PISCINE','ENTREE','AUTRE'];
const JOB_PHASE_LABELS = {ROUGH:'ROUGH',FINITION:'FINITION',BORNES:'BORNES',SERV:'SERV',PISCINE:'PISCINE',ENTREE:'ENTRÉE',AUTRE:'AUTRE'};
// Même logique que PunchPro pour composer le titre d'une job: PREFIXE + PHASE + NUMÉRO+RUE
function parseCivicStreet(addr){
  if(!addr) return '';
  const first = addr.split(',')[0].trim();
  const m = first.match(/^(\d+[a-zA-Z]?)\s+(.*)$/);
  if(!m) return first.toUpperCase().replace(/\s+/g,'');
  const num = m[1];
  const street = m[2].replace(/\b(rue|avenue|ave|boulevard|blvd|chemin|ch\.?|route|rte|impasse|place|all[ée]e|mont[ée]e)\b\.?/gi,'').trim();
  return (num+street).toUpperCase().replace(/\s+/g,'');
}
function buildJobTitle(prefixe, phase, adresse){
  const parts = [];
  if(prefixe && prefixe!=='PARTICULIER') parts.push(prefixe);
  if(phase) parts.push(phase);
  const street = parseCivicStreet(adresse);
  if(street) parts.push(street);
  return parts.join(' ');
}

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ return (parseFloat(n)||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}); }
function safeFloat(v){ try{ return parseFloat(String(v).replace(',','.'))||0; }catch{ return 0; } }
// Les erreurs gapi (Sheets/Calendar) ne sont PAS des Error JS standards — le vrai
// message est niché dans e.result.error.message ; un simple "e.message" est donc
// souvent undefined (d'où les toasts "Erreur: undefined" vus dans l'app).
function apiErrMsg(e){
  if(e && e.result && e.result.error && e.result.error.message) return e.result.error.message;
  if(e && e.message) return e.message;
  if(typeof e==='string') return e;
  try{ return JSON.stringify(e); }catch(err){ return 'Erreur inconnue.'; }
}
function localDateStr(d){ const dt=d||new Date(); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fmtH(h){ if(!h) return '0h'; const totalMin=Math.round(h*60/15)*15; const hh=Math.floor(totalMin/60), mm=totalMin%60; return hh+'h'+(mm?String(mm).padStart(2,'0'):''); }

// ── Semaines (même logique que PunchPro, pour aligner les libellés) ──────
function getWeek(d){
  const dt=new Date(d); dt.setHours(0,0,0,0); dt.setDate(dt.getDate()+3-(dt.getDay()+6)%7);
  const w1=new Date(dt.getFullYear(),0,4);
  return dt.getFullYear()+'-S'+String(1+Math.round(((dt-w1)/86400000-3+(w1.getDay()+6)%7)/7)).padStart(2,'0');
}
function mondayOfWeek(weekLabel){
  const [yr,sw] = String(weekLabel).split('-S');
  const year=parseInt(yr), week=parseInt(sw);
  const jan1=new Date(year,0,1);
  const dayOfWeek=jan1.getDay()||7;
  const monday=new Date(jan1);
  monday.setDate(jan1.getDate()+(week-1)*7-(dayOfWeek-1));
  return monday;
}
function weekDatesArr(weekLabel){
  const mon=mondayOfWeek(weekLabel);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function weekRangeLabel(weekLabel){
  try{
    const dates=weekDatesArr(weekLabel);
    const monday=dates[0], sunday=dates[6];
    const moisAbr=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    if(monday.getMonth()===sunday.getMonth()) return monday.getDate()+' – '+sunday.getDate()+' '+moisAbr[monday.getMonth()];
    return monday.getDate()+' '+moisAbr[monday.getMonth()]+' – '+sunday.getDate()+' '+moisAbr[sunday.getMonth()];
  }catch(e){ return String(weekLabel); }
}

// ── Lecture SEULE des données PunchPro (Employés/Pointages) ──────────────
// Ne fait jamais d'écriture sur ce Sheet. Colonnes confirmées depuis le code
// source de PunchPro: Employés!A2:I, Pointages!A2:P.
async function getPunchProEmployees(sid){
  const rows = await sheetsGetAll(sid,'Employés');
  return rows.map(r=>({
    nom:r[0]||'', pin:r[1]||'', statut:r[2]||'out', heuresBanque:safeFloat(r[3]),
    couleur:r[4]||'#ff7a1a', code:r[5]||(r[0]||'??').slice(0,2).toUpperCase(),
    email:r[6]||'', telephone:r[7]||''
  })).filter(e=>e.nom);
}
async function getPunchProPointages(sid){
  const rows = await sheetsGetAll(sid,'Pointages');
  return rows.map(r=>({
    nom:r[0]||'', type:r[1]||'', datetime:r[2]||'', date:r[3]||'', heure:r[4]||'',
    semaine:r[5]||'', mois:r[6]||'', job:r[7]||'', jobColor:r[8]||'',
    deplacement:safeFloat(r[9]), heures:safeFloat(r[10]), note:r[11]||''
  })).filter(p=>p.nom);
}
function mapEmployeRows(rows){
  return rows.map(r=>({
    nom:r[0]||'', pin:r[1]||'', statut:r[2]||'out', heuresBanque:safeFloat(r[3]),
    couleur:r[4]||'#ff7a1a', code:r[5]||(r[0]||'??').slice(0,2).toUpperCase(),
    email:r[6]||'', telephone:r[7]||''
  })).filter(e=>e.nom);
}
function mapPointageRows(rows){
  return rows.map(r=>({
    nom:r[0]||'', type:r[1]||'', datetime:r[2]||'', date:r[3]||'', heure:r[4]||'',
    semaine:r[5]||'', mois:r[6]||'', job:r[7]||'', jobColor:r[8]||'',
    deplacement:safeFloat(r[9]), heures:safeFloat(r[10]), note:r[11]||''
  })).filter(p=>p.nom);
}
// Employés + Pointages en UN SEUL appel batchGet (au lieu de deux) — ce sont
// deux onglets fixes de PunchPro (dont l'app dépend déjà), donc sans risque
// de "l'un des deux manque" comme pour les onglets contracteur de Factures.
async function getPunchProDataBatched(sid){
  const [empRows, ptRows] = await sheetsBatchGet(sid, ['Employés!A2:Z','Pointages!A2:Z']);
  return {emps: mapEmployeRows(empRows), pts: mapPointageRows(ptRows)};
}
// Heures par employé pour une semaine donnée: on additionne la colonne "heures"
// des lignes 'out' et 'confirm' (les lignes 'in' n'ont pas de heures propres —
// même convention que PunchPro, où le calcul final vient de la ligne de sortie).
function heuresParEmployeSemaine(pointages, weekLabel){
  const dateStrs = weekDatesArr(weekLabel).map(localDateStr);
  const map = {};
  pointages.forEach(p=>{
    if(p.type!=='out' && p.type!=='confirm') return;
    if(!dateStrs.includes(p.date)) return;
    if(!map[p.nom]) map[p.nom]={};
    map[p.nom][p.date] = (map[p.nom][p.date]||0) + p.heures;
  });
  return map;
}

// Regroupe une liste d'événements Calendar par adresse (location de l'événement,
// ou à défaut le "numéro+rue" extrait du titre) — pour retrouver "le projet"
// derrière plusieurs jobs planifiées au même endroit, comme dans PunchPro.
function groupEventsByAddress(events){
  const map = {};
  events.forEach(e=>{
    const key = (e.location && e.location.trim()) || parseCivicStreet(e.title) || e.title;
    if(!key) return;
    if(!map[key]) map[key] = [];
    map[key].push(e);
  });
  return Object.entries(map).map(([adresse,evs])=>{
    const sorted = [...evs].sort((a,b)=>String(b.start).localeCompare(String(a.start)));
    const prefixCounts = {};
    evs.forEach(e=>{ const p=getJobPrefix(e.title); prefixCounts[p]=(prefixCounts[p]||0)+1; });
    const contracteur = Object.entries(prefixCounts).sort((a,b)=>b[1]-a[1])[0][0];
    return {adresse, contracteur, count:evs.length, dernier:sorted[0], evenements:sorted};
  }).sort((a,b)=>String(b.dernier.start).localeCompare(String(a.dernier.start)));
}

// Calcule une disposition côte-à-côte pour les événements d'une journée qui se
// chevauchent dans le temps (sinon ils s'empilent exactement l'un sur l'autre
// et "les carrés ne fittent pas ensemble").
function layoutDayEvents(dayEvents){
  const sorted = [...dayEvents].sort((a,b)=>new Date(a.start)-new Date(b.start));
  const columns = [];
  const placed = [];
  sorted.forEach(e=>{
    const startMs = new Date(e.start).getTime();
    const end = e.end ? new Date(e.end) : new Date(startMs+3600000);
    const endMs = Math.max(end.getTime(), startMs+15*60000);
    let col = columns.findIndex(c=>c.endMs<=startMs);
    if(col===-1){ col = columns.length; columns.push({endMs}); }
    else columns[col].endMs = endMs;
    placed.push({event:e, col, startMs, endMs});
  });
  placed.forEach(p=>{
    let maxCol = p.col;
    placed.forEach(q=>{ if(q.startMs<p.endMs && q.endMs>p.startMs) maxCol=Math.max(maxCol,q.col); });
    p.totalCols = maxCol+1;
  });
  return placed;
}

function getRangeDays(viewMode, anchor){

  if(viewMode==='mois'){
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const startDow = (first.getDay()+6)%7;
    const gridStart = new Date(first); gridStart.setDate(first.getDate()-startDow);
    return Array.from({length:42},(_,i)=>{ const d=new Date(gridStart); d.setDate(gridStart.getDate()+i); return d; });
  }
  return weekDatesArr(getWeek(anchor));
}

// ── Lecture SEULE du Sheet "SUIVI TRAVAUX" (appels de service / factures) ─
// Un onglet par contracteur, en-têtes légèrement variables selon l'onglet —
// on lit donc la ligne d'en-tête dynamiquement plutôt que de fixer des colonnes.
const SUIVI_TAB_NAMES = {PAY:'PAY',CRS:'CRS',ASC:'ASC',GGP:'GGP',SAR:'SAR',BOM:'BOM','5PIL':'5PIL',RROY:'RROY',GOU:'GOU',PARTICULIER:'Particuliers'};

  return (resp.result.values && resp.result.values[0]) || [];

function findColIdx(headers, regex){ return headers.findIndex(h=>regex.test(String(h||''))); }
// Essaie de parser une date de cellule Sheets, quel que soit son format d'affichage
// (ISO, DD/MM/YYYY, texte reconnu par Date()...). Retourne null si impossible à lire.
function parseSheetDate(str){
  if(!str) return null;
  const s = String(str).trim();
  // Le Sheet "SUIVI TRAVAUX" utilise le format DD/MM/YYYY (confirmé en inspectant
  // les données réelles) — on le tente EN PREMIER. new Date("07/08/2026") serait
  // sinon lu comme MM/DD/YYYY par le moteur JS (7 juillet au lieu du 7 août),
  // ce qui faussait silencieusement le calcul "passé vs futur" pour la plupart
  // des dates (tout jour ≤ 12 est ambigu).
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    let [,dd,mm,yy]=m; yy = yy.length===2 ? '20'+yy : yy;
    const d = new Date(parseInt(yy,10), parseInt(mm,10)-1, parseInt(dd,10));
    if(!isNaN(d.getTime())) return d;
  }
  const d2 = new Date(s);
  if(!isNaN(d2.getTime())) return d2;
  return null;
}
// Retourne les lignes d'un onglet contracteur. Date/Projet/Adresse sont détectées
// par en-tête (peu de risque de variation). Appel de service / Ordre de travail /
// Factures sont en revanche des colonnes FIXES — K, L, M — car ces en-têtes sont
// fusionnés sur 2 lignes dans le Sheet et la détection par texte ramenait le mauvais
// texte ("Services et travail"). ID événement Calendar reste détecté par en-tête.
const SUIVI_COL_APPEL = 10;  // colonne K (0-indexé: A=0 ... K=10)
const SUIVI_COL_ORDRE = 11;  // colonne L
const SUIVI_COL_FACTURE = 12; // colonne M
// Une ligne marquée « ** » (colonne K ou M) = pas à facturer (annulée). On garde le numéro de ligne pour pouvoir écrire.
function parseSuiviRows(all, contracteurKey){
  const tabName = SUIVI_TAB_NAMES[contracteurKey];
  const headers = all[0] || [], rows = all.slice(1);
  const idxDate = findColIdx(headers, /date/i);
  const idxProjet = findColIdx(headers, /projet/i);
  const idxAdresse = findColIdx(headers, /adresse/i);
  const idxEvent = findColIdx(headers, /calendar/i);
  const out = [];
  rows.forEach((r,i)=>{
    const date=(idxDate>=0?r[idxDate]:'')||'';
    const projet=(idxProjet>=0?r[idxProjet]:'')||'';
    const adresse=(idxAdresse>=0?r[idxAdresse]:'')||'';
    const appelService=String(r[SUIVI_COL_APPEL]||'').trim();
    const ordreTravail=r[SUIVI_COL_ORDRE]||'';
    const facture=String(r[SUIVI_COL_FACTURE]||'').trim();
    const eventId=(idxEvent>=0?r[idxEvent]:'')||'';
    // ligne "réelle": au moins une date ou un projet/adresse — filtre les lignes orphelines et les diviseurs de mois.
    if(!date && !projet && !adresse && !appelService) return;
    // 'manquant' = pas d'appel de service (K vide) ; 'en_traitement' = appel fait, pas de facture (M vide) ;
    // 'complet' = facture (M) ; 'annule' = « ** » dans K ou M (pas à facturer).
    let statutFacture = 'complet';
    if(/^\*\*/.test(appelService) || /^\*\*/.test(facture)) statutFacture = 'annule';
    else if(!appelService) statutFacture = 'manquant';
    else if(!facture) statutFacture = 'en_traitement';
    const dateObj = parseSheetDate(date);
    const endOfToday = new Date(); endOfToday.setHours(23,59,59,999);
    const estPasseOuAujourdhui = dateObj ? dateObj<=endOfToday : false;
    out.push({contracteur:contracteurKey, onglet:tabName, ligne:i+2, date, dateObj, projet, adresse, appelService, ordreTravail, facture, eventId,
      statutFacture, dateConnue: !!dateObj, estPasseOuAujourdhui,
      factureManquante: (statutFacture==='manquant' || statutFacture==='en_traitement') && estPasseOuAujourdhui});
  });
  return out;
}
// Tous les onglets contracteurs en 2 lectures (liste des onglets + lecture groupée), au lieu d'une lecture par onglet.
const SUIVI_CACHE = {};
async function getAllSuiviTravaux(spreadsheetId, force){
  const c = SUIVI_CACHE[spreadsheetId];
  if(!force && c && Date.now()-c.t < 120000) return c.rows;
  const meta = await window.gapi.client.sheets.spreadsheets.get({spreadsheetId, fields:'sheets.properties.title'});
  const titres = (meta.result.sheets||[]).map(x=>x.properties.title);
  const keys = Object.keys(SUIVI_TAB_NAMES).filter(k=>titres.includes(SUIVI_TAB_NAMES[k]));
  if(!keys.length) return [];
  const vals = await sheetsBatchGet(spreadsheetId, keys.map(k=>"'"+SUIVI_TAB_NAMES[k].replace(/'/g,"''")+"'!A1:Z"));
  const rows = keys.flatMap((k,i)=>parseSuiviRows(vals[i]||[], k));
  SUIVI_CACHE[spreadsheetId] = {t:Date.now(), rows};
  return rows;
}
// « Pas à facturer » : écrit « ** » dans K et M (seulement si vides) ; « Remettre » efface les « ** ».
async function suiviMarquerAnnule(spreadsheetId, r, annule){
  const plage = c => "'"+r.onglet.replace(/'/g,"''")+"'!"+c+r.ligne;
  const k = annule ? (r.appelService || '**') : (/^\*\*/.test(r.appelService) ? '' : r.appelService);
  const m = annule ? (r.facture || '**') : (/^\*\*/.test(r.facture) ? '' : r.facture);
  await window.gapi.client.sheets.spreadsheets.values.batchUpdate({spreadsheetId, resource:{valueInputOption:'RAW', data:[{range:plage('K'), values:[[k]]},{range:plage('M'), values:[[m]]}]}});
  delete SUIVI_CACHE[spreadsheetId];
  // Ton script Suivi Travaux recopie K/L/M dans la description de l'événement quand TU modifies le Sheet,
  // mais il ne voit pas une modification faite par le CRM : on met donc la description à jour ici aussi.
  if(r.eventId){
    for(const calendarId of [CREW_CAL, EN_ATTENTE_CAL]){
      try{
        const ev = await window.gapi.client.calendar.events.get({calendarId, eventId:r.eventId});
        let d = ev.result.description || '';
        const poser = (lab, val)=>{ const re = new RegExp('('+lab+'\\s*:)[^\\n<]*','i'); if(re.test(d)) d = d.replace(re, '$1 '+val); else if(val) d = (d ? d+'\n' : '')+lab+' : '+val; };
        poser('Appel de service', k); poser('Facture', m);
        await window.gapi.client.calendar.events.patch({calendarId, eventId:r.eventId, resource:{description:d}});
        break;
      }catch(e){ /* pas dans ce calendrier : on essaie le suivant */ }
    }
  }
}

// ── Google API loading ───────────────────────────────────────────────────
// Google Sheets limite à 60 lectures par minute. Si on dépasse (erreur 429 « Quota exceeded »),
// on attend et on réessaie tout seul (3 s, 10 s, 25 s) au lieu d'afficher une erreur.
function avecReessaiSheets(){
  const sp = window.gapi.client.sheets && window.gapi.client.sheets.spreadsheets; if(!sp || sp.__reessai) return;
  const envelopper = (obj, nom)=>{ const f = obj[nom]; if(typeof f!=='function') return;
    obj[nom] = function(params){
      const essai = async (n)=>{
        try{ return await f.call(obj, params); }
        catch(e){
          const code = e && (e.status || (e.result && e.result.error && e.result.error.code));
          const quota = code===429 || /quota/i.test(JSON.stringify((e && e.result) || '')) ;
          if(quota && n<3){ await new Promise(r=>setTimeout(r, [3000,10000,25000][n])); return essai(n+1); }
          throw e;
        }
      };
      return essai(0);
    };
  };
  ['get','batchUpdate'].forEach(n=>envelopper(sp, n));
  ['get','batchGet','update','append','clear','batchUpdate'].forEach(n=>envelopper(sp.values, n));
  sp.__reessai = true;
}
let tokenClient=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

// Le jeton Google dure 1 h. On garde son heure d'expiration (aussi dans sessionStorage, pour
// qu'un rechargement de la page ne redemande pas la connexion tant qu'il est valide).
let tokenExpire = 0;
function requestToken(prompt){
  return new Promise((resolve,reject)=>{
    tokenClient.callback = (resp)=>{
      if(resp && resp.access_token){
        tokenExpire = Date.now() + (Number(resp.expires_in)||3600)*1000;
        try{ sessionStorage.setItem('crm_tok', JSON.stringify({t:resp.access_token, e:tokenExpire})); }catch(e){}
        resolve(resp);
      } else { reject(resp); }
    };
    tokenClient.error_callback = (e)=>reject(e);
    tokenClient.requestAccessToken({prompt: prompt!==undefined ? prompt : (window.gapi.client.getToken()?'':'consent')});
  });
}
function restoreToken(){
  try{
    const o = JSON.parse(sessionStorage.getItem('crm_tok')||'null');
    if(o && o.t && o.e > Date.now()+60000){ window.gapi.client.setToken({access_token:o.t}); tokenExpire=o.e; return true; }
  }catch(e){}
  return false;
}
function tokenExpired(){ return !!tokenExpire && Date.now() > tokenExpire - 60000; }

      setOpps(rowsToObjects(o, OPP_HEADERS));
      setSoums(rowsToObjects(s, SOUM_HEADERS));
    }catch(e){ setErr((e&&e.result&&e.result.error&&e.result.error.message) || 'Erreur de chargement des données.'); }
    // L'onglet "Projets" vit dans un Sheet SÉPARÉ (projetsSpreadsheetId) — isolé
    // dans son propre try/catch pour qu'une erreur ici (ex: onglet pas encore
    // créé) ne bloque pas Contacts/Opportunites/Soumissions partout dans l'app.
    if(cfg.projetsSpreadsheetId){
      try{ const p = await sheetsGetAll(cfg.projetsSpreadsheetId,'Projets'); setProjets(rowsToObjects(p, PROJETS_HEADERS)); }
      catch(e){ setProjets([]); }
    } else { setProjets([]); }
    // L'onglet "Rappels" est nouveau — s'il n'existe pas encore chez un utilisateur
    // existant, on ne veut pas faire échouer tout le chargement du CRM pour ça.
    try{ const r = await sheetsGetAll(cfg.crmSpreadsheetId,'Rappels'); setRappels(rowsToObjects(r, RAPPELS_HEADERS)); }
    catch(e){ setRappels([]); }
    setLoading(false);
  },[cfg.crmSpreadsheetId, cfg.projetsSpreadsheetId, ready]);

  useEffect(()=>{ reload(); },[reload]);

  async function addContact(obj){
    const full = {id:genId(), dateCreation:todayISO(), ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Contacts', objectToRow(full, CONTACTS_HEADERS));
    await reload();
    return full;
  }
  async function updateContact(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Contacts', obj._row, objectToRow(obj, CONTACTS_HEADERS));
    await reload();
  }
  async function addOpp(obj){
    const full = {id:genId(), dateCreation:todayISO(), punchproJobCree:'Non', punchproEventId:'', ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Opportunites', objectToRow(full, OPP_HEADERS));
    await reload();
    return full;
  }
  async function updateOpp(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Opportunites', obj._row, objectToRow(obj, OPP_HEADERS));
    await reload();
  }
  async function addSoumission(obj){
    const full = {id:genId(), date:todayISO(), courrielEnvoye:'Non', dateEnvoi:'', ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Soumissions', objectToRow(full, SOUM_HEADERS));
    await reload();
    return full;
  }
  async function updateSoumission(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Soumissions', obj._row, objectToRow(obj, SOUM_HEADERS));
    await reload();
  }
  async function addProjet(obj){
    const full = {id:genId(), dateCreation:todayISO(), statut:'Actif', po:'', ...obj};
    await sheetsAppendRow(cfg.projetsSpreadsheetId,'Projets', objectToRow(full, PROJETS_HEADERS));
    await reload();
    return full;
  }
  async function updateProjet(obj){
    await sheetsUpdateRow(cfg.projetsSpreadsheetId,'Projets', obj._row, objectToRow(obj, PROJETS_HEADERS));
    await reload();
  }
  async function addRappel(obj){
    const full = {id:genId(), dateCreation:todayISO(), statut:'A faire', ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Rappels', objectToRow(full, RAPPELS_HEADERS));
    await reload();
    return full;
  }
  async function updateRappel(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Rappels', obj._row, objectToRow(obj, RAPPELS_HEADERS));
    await reload();
  }

  return {contacts,opps,soums,projets,rappels,loading,err,reload,addContact,updateContact,addOpp,updateOpp,addSoumission,updateSoumission,addProjet,updateProjet,addRappel,updateRappel};
}

// ── Génération du courriel de soumission (mailto + copie) ───────────────
function buildEmailBody(contact, opp, items, total){
  const lines=[];
  lines.push('Bonjour '+(contact.nom||'')+',');
  lines.push('');
  lines.push('Voici notre soumission pour les travaux au : '+(opp.adresse||''));
  lines.push('');
  lines.push('--- DÉTAILS DE LA SOUMISSION ---');
  items.forEach(it=>{
    lines.push('- '+it.description+'  |  Qté: '+it.qte+'  |  Prix unit.: '+fmtMoney(it.prix)+'  |  Sous-total: '+fmtMoney(it.qte*it.prix));
  });
  lines.push('');
  lines.push('TOTAL: '+fmtMoney(total));
  lines.push('');
  lines.push('--- INFO CLIENT (pour référence comptabilité) ---');
  lines.push('Client: '+(contact.nom||''));
  lines.push('Entreprise: '+(contact.entreprise||''));
  lines.push('Téléphone: '+(contact.telephone||''));
  lines.push('Courriel: '+(contact.email||''));
  lines.push('Adresse des travaux: '+(opp.adresse||''));
  lines.push('Type de travail: '+(opp.typeTravail||''));
  lines.push('Date: '+todayISO());
  lines.push('');
  lines.push('Merci,');
  lines.push('Saran Électrique');
  return lines.join('\n');
}
function openMailto(to, subject, body){
  const url = 'mailto:'+encodeURIComponent(to||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  window.location.href = url;
}

// ── UI: Toast ─────────────────────────────────────────────────────────────
function useToast(){
  const [msg,setMsg]=useState(null);
  const show=useCallback((text,type)=>{ setMsg({text,type:type||'ok'}); setTimeout(()=>setMsg(null),3200); },[]);
  const node = msg ? <div className={"toast "+(msg.type==='err'?'err':msg.type==='ok'?'ok':'')}>{msg.text}</div> : null;
  return [show,node];
}

// ── UI: Constructeur de soumission (items + total + courriel) ───────────
function SoumissionBuilder({opp, contact, existing, onSaved, toast}){
  const [items,setItems]=useState(existing? JSON.parse(existing.itemsJson||'[]') : [{description:'',qte:1,prix:0}]);
  const total = items.reduce((s,it)=>s+(safeFloat(it.qte)*safeFloat(it.prix)),0);
  function upd(i,k,v){ const n=[...items]; n[i]={...n[i],[k]:v}; setItems(n); }
  function addRow(){ setItems([...items,{description:'',qte:1,prix:0}]); }
  function delRow(i){ setItems(items.filter((_,idx)=>idx!==i)); }

  async function handleSave(statut){
    const payload = {itemsJson: JSON.stringify(items), total: total.toFixed(2), statut};
    try{
      if(existing) await onSaved({...existing, ...payload});
      else await onSaved(payload);
      toast('Soumission enregistrée.','ok');
    }catch(e){ toast('Erreur: '+apiErrMsg(e),'err'); }
  }
  function handleEmail(){
    const body = buildEmailBody(contact||{}, opp||{}, items, total);
    openMailto(contact&&contact.email, 'Soumission — '+(opp&&opp.adresse||'Saran Électrique'), body);
    handleSave('Envoyée');
  }
  function handleCopy(){
    const body = buildEmailBody(contact||{}, opp||{}, items, total);
    navigator.clipboard.writeText(body).then(()=>toast('Texte copié.','ok'));
  }

  return <div>
    <div style={{marginBottom:8}}>
      {items.map((it,i)=>
        <div className="item-row" key={i}>
          <input placeholder="Description" value={it.description} onChange={e=>upd(i,'description',e.target.value)}/>
          <input placeholder="Qté" value={it.qte} onChange={e=>upd(i,'qte',e.target.value)}/>
          <input placeholder="Prix" value={it.prix} onChange={e=>upd(i,'prix',e.target.value)}/>
          <div className="muted" style={{fontSize:12.5,textAlign:'right'}}>{fmtMoney(safeFloat(it.qte)*safeFloat(it.prix))}</div>
          <button className="btn btn-sm btn-danger" onClick={()=>delRow(i)}>×</button>
        </div>
      )}
      <button className="btn btn-sm btn-s" onClick={addRow}>+ Item</button>
    </div>
    <div className="total-line"><span className="muted">Total</span><span>{fmtMoney(total)}</span></div>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:14,flexWrap:'wrap'}}>
      <button className="btn btn-s" onClick={()=>handleSave(existing?existing.statut:'Brouillon')}>Enregistrer brouillon</button>
      <button className="btn btn-s" onClick={handleCopy}>Copier le texte</button>
      <button className="btn btn-p" onClick={handleEmail}>Générer le courriel</button>
    </div>
  </div>;
}

// ── UI: Modal création job (écrit l'onglet Projets du CRM + Calendar) ───
// Note: écrit dans l'onglet "Projets" du Sheet DU CRM (pas celui de PunchPro).
// PunchPro sera adapté pour lire ce sheet dans une étape séparée, plus tard.
// Le titre est composé avec la même convention que PunchPro: PREFIXE PHASE NUMÉRO+RUE
function CreateJobModal({opp, contact, cfg, onClose, onDone, addProjet, toast}){
  const [date,setDate]=useState(todayISO());
  const [heure,setHeure]=useState('08:00');
  const entrepriseMatch = contact && CONTRACTEURS.includes((contact.entreprise||'').toUpperCase()) ? (contact.entreprise||'').toUpperCase() : 'PARTICULIER';
  const [prefixe,setPrefixe]=useState(entrepriseMatch);
  const [phase,setPhase]=useState('');
  const [busy,setBusy]=useState(false);
  const titre = buildJobTitle(prefixe, phase, opp.adresse);

  async function handleCreate(){
    setBusy(true);
    try{
      // 1) Crée l'événement Google Calendar
      const start = date+'T'+heure+':00';
      const end = date+'T'+(String(Math.min(23,parseInt(heure.split(':')[0])+2)).padStart(2,'0'))+':'+heure.split(':')[1]+':00';
      const calId = cfg.calendarIds.split(',')[0].trim();
      const ev = await window.gapi.client.calendar.events.insert({
        calendarId: calId,
        resource: {
          summary: titre || opp.adresse,
          description: 'Type de travail: '+(opp.typeTravail||'')+'\nNotes: '+(opp.notes||'')+'\n(créé depuis SoumissionPro)',
          location: opp.adresse,
          start:{dateTime:start, timeZone:'America/Toronto'},
          end:{dateTime:end, timeZone:'America/Toronto'}
        }
      });

      // 2) Écrit une ligne dans l'onglet Projets du CRM
      await addProjet({
        opportuniteId: opp.id, adresse: opp.adresse, titre, contracteur: prefixe, phase, typeTravail: opp.typeTravail,
        client: contact?contact.nom:'', telephone: contact?contact.telephone:'',
        notes: opp.notes||'', eventId: ev.result.id
      });

      toast('Job créée.','ok');
      onDone(ev.result.id);
    }catch(e){ toast('Erreur création job: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }

  return <Modal title="Créer la job (Projets + Calendar)" onClose={onClose}>
    <div className="field"><label>Adresse</label><input value={opp.adresse} disabled/></div>
    <div className="row2">
      <div className="field"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      <div className="field"><label>Heure</label><input type="time" value={heure} onChange={e=>setHeure(e.target.value)}/></div>
    </div>
    <div className="row2">
      <div className="field"><label>Contracteur</label>
        <select value={prefixe} onChange={e=>setPrefixe(e.target.value)}>
          {CONTRACTEURS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="field"><label>Phase</label>
        <select value={phase} onChange={e=>setPhase(e.target.value)}>
          <option value="">—</option>
          {JOB_PHASES.map(p=><option key={p} value={p}>{JOB_PHASE_LABELS[p]}</option>)}
        </select>
      </div>
    </div>
    <div className="field"><label>Titre généré</label><input value={titre} disabled/></div>
    <div className="muted" style={{fontSize:12,marginBottom:10}}>Ceci ajoute une ligne dans l'onglet "Projets" du CRM et crée un événement sur {cfg.calendarIds.split(',')[0]}. (L'onglet Projets de PunchPro n'est pas touché.)</div>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
      <button className="btn btn-s" onClick={onClose}>Annuler</button>
      <button className="btn btn-p" onClick={handleCreate} disabled={busy}>{busy?'Création...':'Confirmer'}</button>
    </div>
  </Modal>;
}

  const contactById = useMemo(()=>Object.fromEntries(data.contacts.map(c=>[c.id,c])),[data.contacts]);

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
      <h2 className="fh" style={{margin:0,fontSize:20}}>Pipeline</h2>

    </div>
    <div className="pipe">
      {ETAPES.map(etape=>{
        const list = data.opps.filter(o=>o.etape===etape);
        return <div className="pipe-col" key={etape}>
          <div className="pipe-col-h"><span style={{color:ETAPE_COLORS[etape]}}>{etape}</span><span className="muted">{list.length}</span></div>
          {list.map(o=>
            <div className="opp-card" key={o.id} onClick={()=>setOpenOpp(o)}>
              <div className="t">{o.titre || o.adresse}</div>

            </div>
          )}
          {list.length===0 && <div className="muted" style={{fontSize:12,padding:'8px 4px'}}>Vide</div>}
        </div>;
      })}
    </div>
    {showForm && <OppForm contacts={data.contacts} onClose={()=>setShowForm(false)} onSave={async(f)=>{
      try{ await data.addOpp(f); setShowForm(false); toast('Opportunité créée.','ok'); }

    {openOpp && <OppDetail opp={data.opps.find(o=>o.id===openOpp.id) || openOpp} contact={contactById[openOpp.contactId]} soums={data.soums} data={data} cfg={cfg}

}

// ── UI: Rappels & Suivi — combine les rappels créés dans le CRM + les
// relances des opportunités (dateRelance) du pipeline. Affiché en cartes
// carrées (plutôt qu'en longues barres) et divisé en deux colonnes,
// William / Isabelle, selon le champ "assigneA" du rappel.
function RemindersView({data, toast}){
  const [showForm,setShowForm]=useState(false);
  const [showDone,setShowDone]=useState(false);
  const today = todayISO();
  const soon = new Date(); soon.setDate(soon.getDate()+7);
  const soonISO = soon.toISOString().slice(0,10);
  const contactById = Object.fromEntries(data.contacts.map(c=>[c.id,c]));

  const oppItems = data.opps.filter(o=>o.dateRelance && o.etape!=='Gagné' && o.etape!=='Perdu' && o.dateRelance<=soonISO)
    .map(o=>({source:'opp', id:o.id, titre:o.titre||o.adresse, sousTitre:(contactById[o.contactId]?contactById[o.contactId].nom:'')+' — '+o.etape, date:o.dateRelance, fait:false, assigneA:'William'}));
  const rappelItems = (data.rappels||[])
    .filter(r=>showDone || r.statut!=='Fait')
    .filter(r=>showDone || (r.dateEcheance && r.dateEcheance<=soonISO) || !r.dateEcheance)
    .map(r=>({source:'rappel', raw:r, id:r.id, titre:r.titre, sousTitre:r.adresse||r.description||'', date:r.dateEcheance, fait:r.statut==='Fait', assigneA:r.assigneA||'William'}));

  const items = [...oppItems, ...rappelItems].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  const williamItems = items.filter(i=>i.assigneA!=='Isabelle');
  const isabelleItems = items.filter(i=>i.assigneA==='Isabelle');

  async function marquerFait(item){
    try{ await data.updateRappel({...item.raw, statut: item.fait?'A faire':'Fait'}); }
    catch(e){ toast && toast('Erreur: '+apiErrMsg(e),'err'); }
  }

  function renderCards(list, emptyMsg){
    return <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:10}}>
      {list.map(item=>
        <div key={item.source+item.id} className="card" style={{padding:12,display:'flex',flexDirection:'column',gap:6,minHeight:92,
          borderLeft:(!item.fait && item.date && item.date<today)?'3px solid var(--danger)':'1px solid var(--border)',
          opacity:item.fait?0.55:1}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:6}}>
            <div style={{fontWeight:700,fontSize:13,textDecoration:item.fait?'line-through':'none'}}>{item.titre}</div>
            {item.source==='rappel' && <input type="checkbox" checked={item.fait} onChange={()=>marquerFait(item)} style={{width:16,height:16,flexShrink:0}}/>}
          </div>
          {item.sousTitre && <div className="muted" style={{fontSize:11.5}}>{item.sousTitre}{item.source==='opp'?' (opportunité)':''}</div>}
          <div style={{fontWeight:700,fontSize:12.5,marginTop:'auto',color:(!item.fait && item.date && item.date<today)?'var(--danger)':'var(--text)'}}>{item.date||'—'}</div>
        </div>
      )}
      {list.length===0 && <div className="muted card" style={{padding:16,gridColumn:'1/-1'}}>{emptyMsg}</div>}
    </div>;
  }

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
      <h2 className="fh" style={{margin:0,fontSize:20}}>Rappels & Suivi</h2>
      <button className="btn btn-p" onClick={()=>setShowForm(true)}>+ Nouveau rappel</button>
    </div>
    <div style={{marginBottom:16}}>
      <button className="btn btn-sm" onClick={()=>setShowDone(v=>!v)} style={showDone?{background:'var(--accent)',color:'#fff',border:'none'}:null}>{showDone?'Cacher les rappels faits':'Afficher aussi les rappels faits'}</button>
    </div>
    <div className="remind-cols" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:22}}>
      <div>
        <h3 style={{margin:'0 0 10px',fontSize:14,fontWeight:800}}>William</h3>
        {renderCards(williamItems, 'Rien pour William.')}
      </div>
      <div>
        <h3 style={{margin:'0 0 10px',fontSize:14,fontWeight:800}}>Isabelle</h3>
        {renderCards(isabelleItems, 'Rien pour Isabelle.')}
      </div>
    </div>
    {showForm && <RappelForm onClose={()=>setShowForm(false)} onSave={async(f)=>{
      try{ await data.addRappel(f); setShowForm(false); toast && toast('Rappel créé.','ok'); }
      catch(e){ toast && toast('Erreur: '+apiErrMsg(e)+' (l\'onglet "Rappels" existe-t-il? Va dans Réglages → Initialiser les onglets.)','err'); }
    }}/>}
  </div>;
}

// TOUS les événements Calendar dont l'adresse correspond (matching dynamique,

  const [f,setF]=useState(projet);
  const [busy,setBusy]=useState(false);
  const linkedEvents = useMemo(()=>projetLinkedEvents(projet, events), [projet.adresse, projet.adressesLiees, events]);

  async function handleSave(){
    setBusy(true);
    try{ await onSave(f); onClose(); }
    catch(e){ /* toast déjà affiché par le parent, on laisse la fiche ouverte */ }
    setBusy(false);
  }

  return <Modal title={f.titre || f.adresse || 'Projet'} onClose={onClose} wide>
    <div className="row2">
      <div className="field"><label>Statut</label>
        <select value={f.statut||'Actif'} onChange={e=>setF({...f,statut:e.target.value})}>
          {PROJET_STATUTS.map(s=><option key={s} value={s}>{s}</option>)}

      </div>
      <div className="field"><label>N° P.O.</label><input value={f.po||''} onChange={e=>setF({...f,po:e.target.value})} placeholder="Numéro de bon de commande"/></div>
    </div>
    <div className="field"><label>Titre</label><input value={f.titre||''} onChange={e=>setF({...f,titre:e.target.value})}/></div>
    <div className="row2">
      <div className="field"><label>Contracteur</label>
        <select value={f.contracteur||'PARTICULIER'} onChange={e=>setF({...f,contracteur:e.target.value})}>
          {CONTRACTEURS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="field"><label>Phase</label>
        <select value={f.phase||''} onChange={e=>setF({...f,phase:e.target.value})}>
          <option value="">—</option>
          {JOB_PHASES.map(p=><option key={p} value={p}>{JOB_PHASE_LABELS[p]}</option>)}
        </select>
      </div>
    </div>
    <div className="field"><label>Adresse principale</label><input value={f.adresse||''} onChange={e=>setF({...f,adresse:e.target.value})}/></div>
    {String(f.adressesLiees||'').split(';').map(s=>s.trim()).filter(Boolean).length>0 && <div className="field">
      <label>Adresses liées (attachées manuellement)</label>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {String(f.adressesLiees||'').split(';').map(s=>s.trim()).filter(Boolean).map((a,i)=>
          <span key={i} className="badge" style={{background:'var(--bg4)',display:'inline-flex',alignItems:'center',gap:6}}>
            {a}
            <button type="button" onClick={()=>setF({...f, adressesLiees: String(f.adressesLiees||'').split(';').map(s=>s.trim()).filter(x=>x && x.toLowerCase()!==a.toLowerCase()).join(';')})}
              style={{background:'none',border:'none',color:'inherit',cursor:'pointer',padding:0,fontSize:13,lineHeight:1}}>×</button>
          </span>
        )}
      </div>
    </div>}
    <div className="muted" style={{fontSize:11,marginTop:-2,marginBottom:11}}>Les événements du calendrier ci-dessous sont retrouvés automatiquement par correspondance d'adresse (principale ou liée) — si un événement manque, vérifie que son lieu correspond exactement, ou attache son adresse depuis "Projets par adresse".</div>
    <div className="row2">
      <div className="field"><label>Client</label><input value={f.client||''} onChange={e=>setF({...f,client:e.target.value})}/></div>
      <div className="field"><label>Téléphone</label><input value={f.telephone||''} onChange={e=>setF({...f,telephone:e.target.value})}/></div>
    </div>
    <div className="field tag-input"><label>Notes</label><textarea value={f.notes||''} onChange={e=>setF({...f,notes:e.target.value})}/></div>

      <button className="btn btn-p" onClick={handleSave} disabled={busy}>{busy?'Enregistrement...':'Enregistrer'}</button>
    </div>
    <h3 style={{margin:'0 0 8px',fontSize:14,fontWeight:800}}>Événements du calendrier à cette adresse ({linkedEvents.length})</h3>

    {linkedEvents.map(e=><div key={e.id} style={{padding:'8px 10px',marginBottom:6,borderLeft:'3px solid '+eventColor(e),background:'var(--bg3)',borderRadius:6}}>
      <div style={{fontWeight:700,fontSize:12.5}}>{String(e.start).slice(0,10)} — {e.title}</div>

      </div>}

  </Modal>;

// ── UI: Attacher une adresse du calendrier à un projet CRM EXISTANT (au lieu
// d'en créer un nouveau) — ajoute cette adresse à "adressesLiees" du projet choisi.
function AttachProjetModal({group, projets, onClose, onSave}){
  const sorted = useMemo(()=>[...projets].sort((a,b)=>(a.titre||a.adresse||'').localeCompare(b.titre||b.adresse||'')), [projets]);
  const [selected,setSelected]=useState(sorted[0] ? sorted[0].id : '');
  const [busy,setBusy]=useState(false);
  async function handleSave(){
    if(!selected) return;
    setBusy(true);
    try{ await onSave(sorted.find(p=>p.id===selected)); onClose(); }
    catch(e){ /* toast déjà géré par le parent */ }
    setBusy(false);
  }
  return <Modal title="Attacher cette adresse à un projet existant" onClose={onClose}>
    <div className="muted" style={{fontSize:12,marginBottom:10}}>Les {group.count} job{group.count!==1?'s':''} à "{group.adresse}" seront désormais aussi retrouvées sous le projet choisi (en plus de son adresse principale) — utile quand l'adresse d'un job diffère légèrement de celle du projet.</div>
    <div className="field"><label>Projet CRM</label>
      <select value={selected} onChange={e=>setSelected(e.target.value)}>
        {sorted.map(p=><option key={p.id} value={p.id}>{p.titre||p.adresse} — {p.contracteur==='PARTICULIER'?'Particuliers':p.contracteur}</option>)}
      </select>
    </div>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
      <button className="btn btn-s" onClick={onClose}>Annuler</button>
      <button className="btn btn-p" onClick={handleSave} disabled={busy || !selected}>{busy?'Enregistrement...':'Attacher'}</button>
    </div>
  </Modal>;
}

function ProjectsFromCalendar({filterC, data, toast, events, loadingEvents, errEvents, onViewProjet}){
  const [expanded,setExpanded]=useState(null);
  const [promoteGroup,setPromoteGroup]=useState(null);
  const [attachGroup,setAttachGroup]=useState(null);
  // Par défaut, on cache les adresses déjà associées à un projet CRM — inutile
  // de les revoir en double ici une fois qu'elles ont déjà "✓ Voir le projet".
  const [hideLinked,setHideLinked]=useState(true);

  const groups = useMemo(()=>groupEventsByAddress(events||[]), [events]);
  const filteredByContracteur = filterC ? groups.filter(g=>g.contracteur===filterC) : groups;
  const projetByAdresse = useMemo(()=>buildProjetAddressIndex(data && data.projets), [data && data.projets]);
  const linkedCount = filteredByContracteur.filter(g=>projetByAdresse[String(g.adresse||'').trim().toLowerCase()]).length;
  const filtered = hideLinked ? filteredByContracteur.filter(g=>!projetByAdresse[String(g.adresse||'').trim().toLowerCase()]) : filteredByContracteur;

  return <div style={{marginTop:26}}>
    <h3 style={{margin:'0 0 4px',fontSize:15,fontWeight:800}}>Projets par adresse (calendrier, ±6 mois)</h3>
    <div className="muted" style={{fontSize:11.5,marginBottom:10}}>Lecture seule sur le calendrier — regroupé par adresse d'événement, comme dans PunchPro. Clique "Détails" pour voir la description et les fichiers joints de chaque job, "Créer un projet CRM" pour en créer un nouveau, "Attacher à existant" pour rattacher cette adresse à un projet CRM déjà créé, ou "Voir le projet" si elle en a déjà un.</div>
    <div style={{marginBottom:10}}>
      <button className="btn btn-sm" onClick={()=>setHideLinked(v=>!v)} style={hideLinked?{background:'var(--accent)',color:'#fff',border:'none'}:null}>
        {hideLinked ? 'Déjà dans un projet CRM cachées ('+linkedCount+')' : 'Afficher aussi celles déjà dans un projet CRM'}
      </button>
    </div>
    {errEvents && <div className="card" style={{borderColor:'var(--danger)',color:'var(--danger)',marginBottom:12}}>{errEvents}</div>}
    {loadingEvents ? <div className="muted">Chargement...</div> :
    <div className="card" style={{padding:0,overflowX:'auto'}}>
      <table>
        <thead><tr><th>Adresse</th><th>Contracteur</th><th>Jobs</th><th>Dernière activité</th><th></th><th></th></tr></thead>
        <tbody>
          {filtered.map(g=>{
            const dejaProjet = projetByAdresse[String(g.adresse||'').trim().toLowerCase()];
            return <React.Fragment key={g.adresse}>
            <tr>
              <td style={{fontWeight:600}}>{g.adresse}</td>
              <td><span className="badge" style={{background:prefixColor(g.contracteur),color:'#fff'}}>{g.contracteur==='PARTICULIER'?'Particuliers':g.contracteur}</span></td>
              <td>{g.count}</td>
              <td className="muted">{String(g.dernier.start).slice(0,10)}</td>
              <td><button className="btn btn-sm" onClick={()=>setExpanded(expanded===g.adresse?null:g.adresse)}>{expanded===g.adresse?'Cacher':'Détails'}</button></td>
              <td>{data && (dejaProjet
                ? <button className="btn btn-sm" onClick={()=>onViewProjet && onViewProjet(dejaProjet)}>✓ Voir le projet</button>
                : <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    <button className="btn btn-sm" onClick={()=>setPromoteGroup(g)}>Créer un projet CRM</button>
                    {data.projets && data.projets.length>0 && <button className="btn btn-sm" onClick={()=>setAttachGroup(g)}>Attacher à existant</button>}
                  </div>)}</td>
            </tr>
            {expanded===g.adresse && g.evenements.map(e=><tr key={e.id} style={{background:'var(--bg2)'}}>
              <td colSpan="6" style={{fontSize:12,paddingLeft:20,paddingTop:8,paddingBottom:8}}>
                <div><span style={{display:'inline-block',width:8,height:8,borderRadius:2,background:eventColor(e),marginRight:6}}></span>
                <strong>{String(e.start).slice(0,10)}</strong> — {e.title}</div>
                {e.description && <div className="muted" style={{marginTop:3,whiteSpace:'pre-wrap'}}>{e.description}</div>}
                {e.attachments && e.attachments.length>0 && <div style={{marginTop:4,display:'flex',gap:8,flexWrap:'wrap'}}>
                  {e.attachments.map((a,i)=><a key={i} href={a.fileUrl} target="_blank" rel="noreferrer" className="btn btn-sm" style={{textDecoration:'none'}}>{a.title||'Fichier joint'}</a>)}
                </div>}
              </td>
            </tr>)}
          </React.Fragment>;})}
          {filtered.length===0 && <tr><td colSpan="6" className="muted" style={{padding:16}}>{hideLinked && linkedCount>0 ? 'Tout est déjà dans un projet CRM — clique "Afficher aussi..." ci-dessus pour les revoir.' : 'Aucun projet trouvé sur cette période.'}</td></tr>}
        </tbody>
      </table>
    </div>}
    {promoteGroup && data && <PromoteProjetModal group={promoteGroup} onClose={()=>setPromoteGroup(null)} onSave={async(f)=>{
      try{ await data.addProjet(f); setPromoteGroup(null); toast && toast('Projet créé.','ok'); }
      catch(e){ toast && toast('Erreur: '+apiErrMsg(e),'err'); }
    }}/>}
    {attachGroup && data && data.projets && <AttachProjetModal group={attachGroup} projets={data.projets} onClose={()=>setAttachGroup(null)} onSave={async(selectedProjet)=>{
      try{
        const cur = String(selectedProjet.adressesLiees||'').split(';').map(s=>s.trim()).filter(Boolean);
        if(!cur.some(a=>a.toLowerCase()===String(attachGroup.adresse).trim().toLowerCase())) cur.push(attachGroup.adresse);
        await data.updateProjet({...selectedProjet, adressesLiees: cur.join(';')});
        toast && toast('Adresse attachée au projet.','ok');
      }catch(e){ toast && toast('Erreur: '+apiErrMsg(e),'err'); throw e; }
    }}/>}
  </div>;
}

// ── UI: Projets — vue centrale, tous contracteurs, regroupés par adresse ──
// Le calendrier n'est chargé qu'UNE FOIS ici (±180 jours) et partagé avec
// ProjectsFromCalendar + la fiche détail, pour que "événements associés à un
// projet" et "projets par adresse" utilisent exactement les mêmes données.
// ── Projets : le miroir de Clients, axé sur la gestion — étapes, ce qui manque et où le compléter ──
function pjEtapes(job, appels, commandes, courriels, manuels){
  const today = cvDay(new Date().toISOString());
  const r = job.reg || {}, pro = job.client!=='PART', ev = job.events.filter(e=>!e.attente), att = job.events.filter(e=>e.attente);
  const passes = ev.filter(e=>e.day<today), avenir = ev.filter(e=>e.day>=today);
  const prochain = avenir[0];
  const ots = pro ? cvJobOTs(job, appels) : [];
  const plans = ev.some(e=>e.attachments.some(a=>/plan|tout le dossier/i.test(a.title||'')));
  const coord = [['adresse', job.address], ['nom du client', r.client], ['téléphone', r.tel], ['courriel', r.courriel]].filter(x=>!x[1]).map(x=>x[0]);
  const ro = ev.filter(e=>e.phase==='ROUGH'), fi = ev.filter(e=>e.phase==='FINITION');
  const sansFac = passes.filter(e=>!e.fac);
  const sansEquipe = avenir.filter(e=>!e.crew.length);
  const cmdAPlacer = avenir.filter(e=>e.day<=cvFinSemaineProchaine() && !CMD_FAIT.includes(((commandes||{})[e.id]||{}).statut));
  const E = [];
  const add = (ok, titre, manque, ou, na) => E.push({ok, titre, manque, ou, na});
  if(pro) add(!!job.po, 'PO reçu', 'Aucun PO trouvé pour cette job', 'Ajoute le numéro P0xxxx au titre de l\'événement (ou demande-le au contracteur)');
  add(!coord.length, 'Coordonnées complètes', 'Il manque : '+coord.join(', '), pro ? 'Registre « La mémoire — Jobs »' : 'Adresse dans l\'événement de l\'agenda', !pro && coord.length===3 && !!job.address);
  add(plans, 'Plans dans l\'événement', 'Aucun plan attaché aux passages', 'Ils s\'ajoutent tout seuls à la passe de 15 h / 3 h si le plan est dans le dossier ; sinon, attache-le à l\'événement', !pro);
  if(pro) add(ro.length>0, 'Rough planifié', 'Pas de passage ROUGH dans l\'agenda', 'Crée l\'événement « '+job.client+' ROUGH '+job.name+' '+(job.po||'')+' »');
  if(pro) add(fi.length>0, 'Finition planifiée', 'Pas de passage FINITION dans l\'agenda', 'Crée l\'événement « '+job.client+' FINITION '+job.name+' '+(job.po||'')+' »');
  if(pro && ro.some(e=>e.day<today)) add(ots.length>0, 'OT du rough reçu (liste de stock pour la finition)', 'Le rough est fait mais aucun OT papier n\'est classé', 'Les gars doivent déposer la photo de l\'OT dans « B- REF OT » ou « 1-PAD »');
  add(!sansEquipe.length, 'Équipe assignée', sansEquipe.map(e=>cvFmtDay(e.day)).join(', ')+' sans employé', 'Couleur ou initiales de l\'employé dans l\'événement', !avenir.length);
  add(!cmdAPlacer.length, 'Commande de stock placée (cette semaine et la prochaine)', cmdAPlacer.map(e=>cvFmtDay(e.day)+(e.phase?' '+e.phase.toLowerCase():'')).join(', ')+' : commande à placer', 'Agenda → Commandes de la semaine → ✅', !avenir.length);
  const fils = (job.po && courriels && courriels[job.po]) || [];
  const aRepondre = fils.filter(f=>/toi de r/i.test(f.statut));
  if(fils.length) add(!aRepondre.length, 'Courriels répondus', aRepondre.map(f=>'« '+f.sujet+' » ('+cvFmtDay(f.dernier)+')').join(', ')+' attend ta réponse', 'Gmail — ouvre le fil dans la section Courriels plus bas');
  add(!sansFac.length, 'Appel ou facture inscrit à chaque passage fait', sansFac.map(e=>cvFmtDay(e.day)+(e.phase?' '+e.phase.toLowerCase():'')).join(', ')+' sans numéro', 'Description de l\'événement : « Appel de service : … / Facture : … »', !passes.length);
  // Étapes cochées à la main (onglet « Etapes » du registre des jobs).
  E.forEach(x=>{ if(!x.ok && manuels && manuels[job.id+'|'+x.titre]){ x.ok=true; x.manuel=true; } });
  const actifs = E.filter(x=>!x.na);
  const manquants = actifs.filter(x=>!x.ok);
  const enAtt = att.length ? 'En attente'+(att[0].phase ? ' ('+att[0].phase.toLowerCase()+')' : '')+' — pas encore cédulée' : '';
  const etape = !ev.length ? (enAtt || 'Rien de planifié')
    : prochain ? (prochain.phase ? prochain.phase.charAt(0)+prochain.phase.slice(1).toLowerCase() : 'Passage')+' le '+cvFmtDay(prochain.day)
    : (sansFac.length ? 'À facturer' : (enAtt || 'Terminée'));
  // Repères rapides : 🎤 mémo vocal attaché, 📝 OT fait, AP appel de service fait.
  const vocal = ev.some(e=>e.attachments.some(a=>/^audio\//.test(a.mimeType||'') || /\.(m4a|mp3|wav|aac|ogg|caf)$/i.test(a.title||'') || /m[ée]mo vocal|vocal|voice/i.test(a.title||'')));
  const otFait = ots.length>0 || ev.some(e=>e.ot);
  const apFait = ev.some(e=>e.as) || (pro && (appels.liste||[]).some(a=>a.as && a.po && a.po===job.po));
  return {E:actifs, manquants, etape, prochain, total:actifs.length, faits:actifs.length-manquants.length, vocal, otFait, apFait};
}

// Fils de courriels d'une job : dates, qui a écrit en dernier, ce qui se passe.
function CvCourriels({liste}){
  if(!liste || !liste.length) return null;
  const couleur = st => /toi de r/i.test(st) ? 'var(--danger)' : /attente/i.test(st) ? 'var(--warning)' : 'var(--muted)';
  return <div style={{marginTop:10}}>
    <div className="fh" style={{fontSize:14,margin:'4px 0 6px'}}>Courriels ({liste.length})</div>
    {liste.map((c,i)=><div key={i} style={{padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:12.5}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:8}}>
        <b>{c.sujet}</b>
        {c.lien && <a href={c.lien} target="_blank" rel="noopener" style={{color:'var(--accent)',whiteSpace:'nowrap'}}>Ouvrir ↗</a>}
      </div>
      <div className="muted" style={{fontSize:12}}>{c.premier===c.dernier ? cvFmtDay(c.dernier) : cvFmtDay(c.premier)+' → '+cvFmtDay(c.dernier)} · {c.n} message{c.n>1?'s':''} · dernier de {c.de}</div>
      <div style={{fontSize:12,fontWeight:700,color:couleur(c.statut)}}>{c.statut}</div>
      {c.extrait && <div className="muted" style={{fontSize:12,fontStyle:'italic'}}>« {c.extrait} »</div>}
    </div>)}
  </div>;
}

// ── Fournisseurs : factures d'achat (Dubo, Lumen, Groupe Gagnon, Westburne), lien avec les jobs, stock ──
function cvJobCle(c, j){ return (c.code!=='PART' ? c.code+' ' : '')+j.name+(j.po?' '+j.po:''); }
// Matériel d'une job : sous-total des achats associés à la job.
const CV_DESTS = ['Inventaire','Shop','Camion 7','Camion 14','Camion 25'];
function cvMateriel(job, achats){
  const l = (achats||[]).filter(a=>a.job && !CV_DESTS.includes(a.job) && ((job.po && a.job.includes(job.po)) || cvNorm(a.job).endsWith(cvNorm(job.name))));
  return {liste:l, total:l.reduce((t,a)=>t+a.st,0)};
}
function CvArticles({a}){
  if(!a.articles) return <div className="muted" style={{fontSize:12}}>Articles pas encore lus pour cette facture.</div>;
  const l = a.articles.filter(x=>x.code);
  if(!l.length) return <div className="muted" style={{fontSize:12}}>Aucun article lu sur cette facture.</div>;
  return <div style={{fontSize:12,margin:'4px 0 2px'}}>
    {l.map((x,i)=><div key={i} style={{display:'grid',gridTemplateColumns:'36px 1fr auto',gap:8,padding:'2px 0',borderBottom:'1px dashed var(--border)'}}>
      <span style={{fontVariantNumeric:'tabular-nums',textAlign:'right'}}>{x.qte}</span>
      <span>{x.desc} <span className="muted">{x.code}</span></span>
      <span style={{fontVariantNumeric:'tabular-nums'}}>{cvMoney(x.montant)}</span>
    </div>)}
  </div>;
}

// Jobs d'un client : liste en ordre alphabétique, avec recherche.
function CvListeJobs({jobs, onChoix}){
  const [q,setQ]=useState('');
  // Ordre alphabétique des noms ; celles avec un PO d'abord, puis (après la double ligne) celles sans PO.
  const trouve = jobs.filter(j=>!q || cvNorm(j.label+' '+(j.po||'')).includes(cvNorm(q))).sort((a,b)=>a.label.localeCompare(b.label,'fr'));
  const avecPO = trouve.filter(j=>j.po), sansPO = trouve.filter(j=>!j.po), liste = [...avecPO, ...sansPO];
  const Ligne = ({j})=><div onClick={()=>onChoix(j.cle)} style={{padding:'7px 10px',borderBottom:'1px solid var(--border)',cursor:'pointer',fontSize:13,display:'flex',justifyContent:'space-between',gap:8}}>
    <span>{j.label}{j.po && <b style={{color:'var(--accent)'}}> · {j.po}</b>}</span>
    <span className="muted" style={{fontSize:11.5,whiteSpace:'nowrap'}}>{j.info}</span>
  </div>;
  // Liste cliquable (un <select> s'affiche en petit menu fermé sur iPhone).
  return <div style={{marginTop:5,paddingLeft:8,borderLeft:'2px solid var(--accent)'}}>
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder={'Chercher parmi '+jobs.length+' jobs (nom ou PO)…'} style={{width:'100%',boxSizing:'border-box',marginBottom:4}}/>
    <div style={{maxHeight:260,overflowY:'auto',border:'1px solid var(--border2)',borderRadius:8}}>
      {avecPO.map(j=><Ligne key={j.cle} j={j}/>)}
      {avecPO.length>0 && sansPO.length>0 && <div style={{borderTop:'3px double var(--muted)',margin:'2px 0'}}/>}
      {sansPO.length>0 && <div className="muted" style={{fontSize:11.5,padding:'4px 10px'}}>Sans PO</div>}
      {sansPO.map(j=><Ligne key={j.cle} j={j}/>)}
    </div>
    {!liste.length && <div className="muted" style={{fontSize:12}}>Aucune job ne correspond.</div>}
  </div>;
}

// Choix de destination : inventaire, shop, camions, puis contracteur → job, ou ton propre texte.
function CvChoixJob({clients, propose, onChoix}){
  const [groupe,setGroupe]=useState('');
  const [autre,setAutre]=useState(null);
  const today = cvDay(new Date(Date.now()-120*864e5).toISOString());
  const groupes = Object.values(clients).filter(c=>c.jobs.some(j=>j.last>=today)).sort((a,b)=>(a.code==='PART')-(b.code==='PART')||a.code.localeCompare(b.code));
  const g = groupes.find(c=>c.code===groupe);
  const pill = (txt, on, extra) => <button key={txt} className="btn btn-sm" onClick={on} style={extra}>{txt}</button>;
  return <div style={{marginTop:6}}>
    <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
      {propose && pill('✓ '+propose, ()=>onChoix(propose), {background:'var(--accent)',color:'#fff',border:'none'})}
      {CV_DESTS.map(d=>pill((d==='Inventaire'?'📦 ':d==='Shop'?'🏠 ':'🚚 ')+d, ()=>onChoix(d)))}
      {pill('✏️ Autre…', ()=>setAutre(autre===null?'':null))}
    </div>
    <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:5}}>
      {groupes.map(c=>pill(c.code==='PART'?'Particuliers':c.code, ()=>setGroupe(groupe===c.code?'':c.code), groupe===c.code?{borderColor:'var(--accent)',color:'var(--accent)',fontWeight:700}:null))}
    </div>
    {g && <CvListeJobs key={g.code} jobs={g.jobs.filter(j=>j.last>=today).map(j=>({cle:cvJobCle(g,j), po:j.po, label:j.name, info:(CV_STATUS[j.status]||[''])[0]+' · '+cvFmtDay(j.last)}))} onChoix={onChoix}/>}
    {autre!==null && <div style={{display:'flex',gap:5,marginTop:5}}>
      <input value={autre} onChange={e=>setAutre(e.target.value)} placeholder="Ex. : Outils, Bureau, Job Rejean Roy…" style={{flex:1}}/>
      <button className="btn btn-sm btn-p" disabled={!autre.trim()} onClick={()=>onChoix(autre.trim())}>OK</button>
    </div>}
  </div>;
}

        <button className="btn btn-sm" onClick={()=>setOuvert(null)}>✕ Fermer</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:8,margin:'10px 0'}}>
        {vue.tuiles.map(([n,l],i)=><div key={i} style={{background:'var(--bg3)',borderRadius:8,padding:'8px 10px'}}><div style={{fontWeight:800,fontSize:16}}>{n}</div><div className="muted" style={{fontSize:11.5}}>{l}</div></div>)}
      </div>
      {vue.fournisseur && <div style={{display:'flex',gap:6,marginBottom:6}}>
        <button className={'btn btn-sm'+(!seulAAssocier?' btn-p':'')} onClick={()=>setSeulAAssocier(false)}>Toutes ({vue.liste.length})</button>
        <button className={'btn btn-sm'+(seulAAssocier?' btn-p':'')} onClick={()=>setSeulAAssocier(true)}>À associer ({vue.liste.filter(a=>!a.job).length})</button>
      </div>}
      {vue.parJob && <div style={{fontSize:12.5,marginBottom:8}}>{vue.parJob.map(([j,t])=><div key={j} style={{display:'flex',justifyContent:'space-between',padding:'2px 0'}}><span>{j}</span><b>{cvMoney(t)}</b></div>)}</div>}
      {(seulAAssocier ? vue.liste.filter(a=>!a.job) : vue.liste).map(a=><Facture key={a.row} a={a} assoc={!a.job}/>)}
      {!vue.liste.length && <div className="muted" style={{fontSize:13}}>Aucune facture.</div>}
    </div>}
    {!vue && <div className="card" style={{marginBottom:16,borderColor:aAssocier.length?'var(--warning)':undefined}}>
      <div className="fh" style={{fontSize:15}}>À associer {aAssocier.length>0 && <span className="badge" style={{background:'rgba(210,153,34,0.15)',color:'var(--warning)'}}>{aAssocier.length}</span>}</div>
      {aAssocier.length ? aAssocier.slice(0,30).map(a=><Facture key={a.row} a={a} assoc/>) : <div className="muted" style={{fontSize:13}}>✅ Toutes les factures sont associées.</div>}
    </div>}
    <CvDocuments docs={(documents||[]).filter(d=>!vue || !vue.fournisseur || d.fournisseur===vue.fournisseur)} type={docType} setType={setDocType} fournisseur={vue && vue.fournisseur}/>
    {!A.length && <div className="card muted">Aucun achat encore lu. Le script « achats » remplit ce registre à midi et à minuit.</div>}
  </div>;
}

function ProjetsView(props){
