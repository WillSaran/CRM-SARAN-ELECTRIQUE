<style>
:root{

}
[data-theme="light"]{
  --bg:#f4f5f7;--bg2:#ffffff;--bg3:#eceef2;--bg4:#e3e6ec;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%}
#root{min-height:100vh}
h1,h2,h3,.fh{font-family:var(--font-head);font-weight:800;letter-spacing:-0.01em}
a{color:inherit}
button{font-family:var(--font-body);cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:var(--font-body);background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.muted{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border)}

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef} = React;

// ── CONFIG ────────────────────────────────────────────────────────────────
// clientId : créé dans Google Cloud Console (même projet que PunchPro),
//            type "Application Web", origine JS autorisée = domaine d'hébergement
//            de CETTE app.
// crmSpreadsheetId : ID du Google Sheet du CRM — contient 3 onglets:
//            Contacts, Opportunites, Soumissions.
// projetsSpreadsheetId : ID d'un Google Sheet SÉPARÉ ("PROJETS SARAN ÉLECTRIQUE"),
//            dédié uniquement à l'onglet "Projets". Quand une opportunité est marquée
//            "Gagné", une ligne est ajoutée ici + un événement Calendar est créé.
//            Ce sheet sera "donné" à PunchPro (PunchPro sera adapté pour le lire) dans
//            une étape séparée, plus tard — l'onglet "Projets" existant DE PunchPro
//            (dans son propre sheet d'heures) n'est PAS touché par le CRM.
// calendarIds : calendriers Google sur lesquels créer les événements de job (le premier
//            de la liste est utilisé).
// punchproSpreadsheetId : Sheet "HEURES & EMPLOYÉS APP SARAN ÉLECTRIQUE" — LECTURE SEULE.
//            Le CRM y lit les onglets Employés/Pointages pour afficher les heures des
//            employés et n'y écrit JAMAIS rien.
// suiviTravauxSpreadsheetId : Sheet "SUIVI TRAVAUX SARAN ÉLECTRIQUE" — LECTURE SEULE.
//            Un onglet par contracteur (Particuliers/ASC/CRS/PAY/SAR/GGP/BOM/RROY/5PIL),
//            utilisé pour détecter les appels de service sans facture ("factures
//            manquantes"). Le CRM lit les en-têtes dynamiquement (pas d'écriture).
const DEFAULT_CFG = {
  apiKey: 'AIzaSyAWO2raCV3cUYpouxyyaPZ9VamrkRXqDKY',
  clientId: '718428072431-tnd2rngvrgg5kbav31le67gmi0m0qr3f.apps.googleusercontent.com',
  crmSpreadsheetId: '1AvjMWcAVPeLJrGUeyjuo0yypZC9hSbaQJGaSW3mP8M0',
  projetsSpreadsheetId: '1XJldTQODgo207rnwneF1CsHYS7PKwGR80pkXn741Oug',
  punchproSpreadsheetId: '1uj7S1uHsE0BZwbNSJdtAEjpy_9YWqfh6mXoJwwLJ9UA',
  suiviTravauxSpreadsheetId: '1uHgs4eiD0t25hYHp69q27tESsuVB4HraCud3c04vLwY',
  calendarIds: 'saranelectrique@gmail.com,info@saranelectrique.com'
};
function loadCfg(){
  try{ const raw=localStorage.getItem('crm_cfg'); return raw?{...DEFAULT_CFG,...JSON.parse(raw)}:{...DEFAULT_CFG}; }
  catch{ return {...DEFAULT_CFG}; }
}
function saveCfg(cfg){ localStorage.setItem('crm_cfg', JSON.stringify(cfg)); }

const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/userinfo.email';
const DISCOVERY = ['https://sheets.googleapis.com/$discovery/rest?version=v4','https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'];
const APP_VERSION = 'v13';

const ETAPES = ['Prospect','Contacté','Soumission envoyée','Gagné','Perdu'];
const ETAPE_COLORS = {'Prospect':'#7d8590','Contacté':'#0ea5e9','Soumission envoyée':'#d29922','Gagné':'#3fb950','Perdu':'#f85149'};

const CONTACTS_HEADERS = ['id','nom','entreprise','telephone','email','adresse','source','notes','dateCreation'];
const OPP_HEADERS = ['id','contactId','titre','adresse','typeTravail','etape','montantEstime','dateCreation','dateRelance','dateCloture','notes','punchproJobCree','punchproEventId'];
const SOUM_HEADERS = ['id','opportuniteId','date','itemsJson','total','statut','courrielEnvoye','dateEnvoi'];
// Onglet "Projets" du CRM — sera donné à PunchPro plus tard (voir commentaire CONFIG plus haut)
const PROJETS_HEADERS = ['id','opportuniteId','adresse','titre','contracteur','phase','typeTravail','client','telephone','notes','statut','dateCreation','eventId'];
// Onglet "Rappels" du CRM — suivis/rappels créés manuellement (indépendants du pipeline
// Opportunités). statut: 'A faire' | 'Fait'.
const RAPPELS_HEADERS = ['id','titre','description','dateEcheance','adresse','statut','dateCreation'];

// ── Contracteurs (mêmes abréviations que PunchPro) ───────────────────────
// 'PARTICULIER' = client résidentiel, pas de contracteur associé.
const JOB_PREFIXES = ['PAY','CRS','ASC','GGP','SAR','BOM','5PIL','RROY','GOU'];
const CONTRACTEURS = [...JOB_PREFIXES, 'PARTICULIER'];
const JOB_PHASES = ['ROUGH','FINITION','BORNES','SERV','PISCINE','ENTREE','AUTRE'];
const JOB_PHASE_LABELS = {ROUGH:'ROUGH',FINITION:'FINITION',BORNES:'BORNES',SERV:'SERV',PISCINE:'PISCINE',ENTREE:'ENTRÉE',AUTRE:'AUTRE'};
// Même logique que PunchPro pour composer le titre d'une job: PREFIXE + PHASE + NUMÉRO+RUE
function parseCivicStreet(addr){
  if(!addr) return '';
  const first = addr.split(',')[0].trim();
  const m = first.match(/^(\d+[a-zA-Z]?)\s+(.*)$/);
  if(!m) return first.toUpperCase().replace(/\s+/g,'');
  const num = m[1];
  const street = m[2].replace(/\b(rue|avenue|ave|boulevard|blvd|chemin|ch\.?|route|rte|impasse|place|all[ée]e|mont[ée]e)\b\.?/gi,'').trim();
  return (num+street).toUpperCase().replace(/\s+/g,'');
}
function buildJobTitle(prefixe, phase, adresse){
  const parts = [];
  if(prefixe && prefixe!=='PARTICULIER') parts.push(prefixe);
  if(phase) parts.push(phase);
  const street = parseCivicStreet(adresse);
  if(street) parts.push(street);
  return parts.join(' ');
}

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ return (parseFloat(n)||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}); }
function safeFloat(v){ try{ return parseFloat(String(v).replace(',','.'))||0; }catch{ return 0; } }
// Les erreurs gapi (Sheets/Calendar) ne sont PAS des Error JS standards — le vrai
// message est niché dans e.result.error.message ; un simple "e.message" est donc
// souvent undefined (d'où les toasts "Erreur: undefined" vus dans l'app).
function apiErrMsg(e){
  if(e && e.result && e.result.error && e.result.error.message) return e.result.error.message;
  if(e && e.message) return e.message;
  if(typeof e==='string') return e;
  try{ return JSON.stringify(e); }catch(err){ return 'Erreur inconnue.'; }
}
function localDateStr(d){ const dt=d||new Date(); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fmtH(h){ if(!h) return '0h'; const totalMin=Math.round(h*60/15)*15; const hh=Math.floor(totalMin/60), mm=totalMin%60; return hh+'h'+(mm?String(mm).padStart(2,'0'):''); }

// ── Semaines (même logique que PunchPro, pour aligner les libellés) ──────
function getWeek(d){
  const dt=new Date(d); dt.setHours(0,0,0,0); dt.setDate(dt.getDate()+3-(dt.getDay()+6)%7);
  const w1=new Date(dt.getFullYear(),0,4);
  return dt.getFullYear()+'-S'+String(1+Math.round(((dt-w1)/86400000-3+(w1.getDay()+6)%7)/7)).padStart(2,'0');
}
function mondayOfWeek(weekLabel){
  const [yr,sw] = String(weekLabel).split('-S');
  const year=parseInt(yr), week=parseInt(sw);
  const jan1=new Date(year,0,1);
  const dayOfWeek=jan1.getDay()||7;
  const monday=new Date(jan1);
  monday.setDate(jan1.getDate()+(week-1)*7-(dayOfWeek-1));
  return monday;
}
function weekDatesArr(weekLabel){
  const mon=mondayOfWeek(weekLabel);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function weekRangeLabel(weekLabel){
  try{
    const dates=weekDatesArr(weekLabel);
    const monday=dates[0], sunday=dates[6];
    const moisAbr=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    if(monday.getMonth()===sunday.getMonth()) return monday.getDate()+' – '+sunday.getDate()+' '+moisAbr[monday.getMonth()];
    return monday.getDate()+' '+moisAbr[monday.getMonth()]+' – '+sunday.getDate()+' '+moisAbr[sunday.getMonth()];
  }catch(e){ return String(weekLabel); }
}

// ── Lecture SEULE des données PunchPro (Employés/Pointages) ──────────────
// Ne fait jamais d'écriture sur ce Sheet. Colonnes confirmées depuis le code
// source de PunchPro: Employés!A2:I, Pointages!A2:P.
async function getPunchProEmployees(sid){
  const rows = await sheetsGetAll(sid,'Employés');
  return rows.map(r=>({
    nom:r[0]||'', pin:r[1]||'', statut:r[2]||'out', heuresBanque:safeFloat(r[3]),
    couleur:r[4]||'#ff7a1a', code:r[5]||(r[0]||'??').slice(0,2).toUpperCase(),
    email:r[6]||'', telephone:r[7]||''
  })).filter(e=>e.nom);
}
async function getPunchProPointages(sid){
  const rows = await sheetsGetAll(sid,'Pointages');
  return rows.map(r=>({
    nom:r[0]||'', type:r[1]||'', datetime:r[2]||'', date:r[3]||'', heure:r[4]||'',
    semaine:r[5]||'', mois:r[6]||'', job:r[7]||'', jobColor:r[8]||'',
    deplacement:safeFloat(r[9]), heures:safeFloat(r[10]), note:r[11]||''
  })).filter(p=>p.nom);
}
// Heures par employé pour une semaine donnée: on additionne la colonne "heures"
// des lignes 'out' et 'confirm' (les lignes 'in' n'ont pas de heures propres —
// même convention que PunchPro, où le calcul final vient de la ligne de sortie).
function heuresParEmployeSemaine(pointages, weekLabel){
  const dateStrs = weekDatesArr(weekLabel).map(localDateStr);
  const map = {};
  pointages.forEach(p=>{
    if(p.type!=='out' && p.type!=='confirm') return;
    if(!dateStrs.includes(p.date)) return;
    if(!map[p.nom]) map[p.nom]={};
    map[p.nom][p.date] = (map[p.nom][p.date]||0) + p.heures;
  });
  return map;
}

// ── Lecture SEULE du Calendar PunchPro (jobs) ─────────────────────────────
async function listCalendarEventsRange(calendarIds, timeMinISO, timeMaxISO){
  const all=[];
  for(const calId of calendarIds){
    try{
      let pageToken=undefined;
      do{
        const resp = await window.gapi.client.calendar.events.list({
          calendarId:calId.trim(), timeMin:timeMinISO, timeMax:timeMaxISO,
          singleEvents:true, orderBy:'startTime', maxResults:250, pageToken
        });
        (resp.result.items||[]).forEach(e=>{
          all.push({
            id:e.id, title:e.summary||'Sans titre',
            start:(e.start&&(e.start.dateTime||e.start.date))||'',
            end:(e.end&&(e.end.dateTime||e.end.date))||'',
            allDay:!(e.start&&e.start.dateTime), location:e.location||'', description:e.description||'',
            colorId:e.colorId||'', calendarId:calId.trim(), attachments:e.attachments||[]
          });
        });
        pageToken = resp.result.nextPageToken;
      }while(pageToken);
    }catch(err){ /* calendrier inaccessible, on ignore et continue */ }
  }
  return all.sort((a,b)=>String(a.start).localeCompare(String(b.start)));
}
// Regroupe une liste d'événements Calendar par adresse (location de l'événement,
// ou à défaut le "numéro+rue" extrait du titre) — pour retrouver "le projet"
// derrière plusieurs jobs planifiées au même endroit, comme dans PunchPro.
function groupEventsByAddress(events){
  const map = {};
  events.forEach(e=>{
    const key = (e.location && e.location.trim()) || parseCivicStreet(e.title) || e.title;
    if(!key) return;
    if(!map[key]) map[key] = [];
    map[key].push(e);
  });
  return Object.entries(map).map(([adresse,evs])=>{
    const sorted = [...evs].sort((a,b)=>String(b.start).localeCompare(String(a.start)));
    const prefixCounts = {};
    evs.forEach(e=>{ const p=getJobPrefix(e.title); prefixCounts[p]=(prefixCounts[p]||0)+1; });
    const contracteur = Object.entries(prefixCounts).sort((a,b)=>b[1]-a[1])[0][0];
    return {adresse, contracteur, count:evs.length, dernier:sorted[0], evenements:sorted};
  }).sort((a,b)=>String(b.dernier.start).localeCompare(String(a.dernier.start)));
}
// Préférences retenues pour préremplir la prochaine création de job (contracteur/phase).
function getLastJobDefaults(){
  try{ return {prefixe:localStorage.getItem('crm_last_prefixe')||'PARTICULIER', phase:localStorage.getItem('crm_last_phase')||''}; }
  catch(e){ return {prefixe:'PARTICULIER', phase:''}; }
}
function saveLastJobDefaults(prefixe, phase){
  try{ localStorage.setItem('crm_last_prefixe', prefixe||'PARTICULIER'); localStorage.setItem('crm_last_phase', phase||''); }catch(e){}
}
// Modifie l'heure de début/fin d'un événement Calendar existant (drag ou modale).
async function patchEventTimes(calendarId, eventId, startISO, endISO){
  return window.gapi.client.calendar.events.patch({
    calendarId, eventId,
    resource:{ start:{dateTime:startISO, timeZone:'America/Toronto'}, end:{dateTime:endISO, timeZone:'America/Toronto'} }
  });
}
// Calcule une disposition côte-à-côte pour les événements d'une journée qui se
// chevauchent dans le temps (sinon ils s'empilent exactement l'un sur l'autre
// et "les carrés ne fittent pas ensemble").
function layoutDayEvents(dayEvents){
  const sorted = [...dayEvents].sort((a,b)=>new Date(a.start)-new Date(b.start));
  const columns = [];
  const placed = [];
  sorted.forEach(e=>{
    const startMs = new Date(e.start).getTime();
    const end = e.end ? new Date(e.end) : new Date(startMs+3600000);
    const endMs = Math.max(end.getTime(), startMs+15*60000);
    let col = columns.findIndex(c=>c.endMs<=startMs);
    if(col===-1){ col = columns.length; columns.push({endMs}); }
    else columns[col].endMs = endMs;
    placed.push({event:e, col, startMs, endMs});
  });
  placed.forEach(p=>{
    let maxCol = p.col;
    placed.forEach(q=>{ if(q.startMs<p.endMs && q.endMs>p.startMs) maxCol=Math.max(maxCol,q.col); });
    p.totalCols = maxCol+1;
  });
  return placed;
}
// Jours à afficher dans l'Agenda selon le mode (jour/semaine/mois).
function getRangeDays(viewMode, anchor){
  if(viewMode==='jour'){ const d=new Date(anchor); d.setHours(0,0,0,0); return [d]; }
  if(viewMode==='mois'){
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const startDow = (first.getDay()+6)%7;
    const gridStart = new Date(first); gridStart.setDate(first.getDate()-startDow);
    return Array.from({length:42},(_,i)=>{ const d=new Date(gridStart); d.setDate(gridStart.getDate()+i); return d; });
  }
  return weekDatesArr(getWeek(anchor));
}
function getJobPrefix(title){
  const u=(title||'').toUpperCase();
  for(const p of JOB_PREFIXES) if(u.startsWith(p)) return p;
  return 'PARTICULIER';
}
const PREFIX_COLORS = {PAY:'#e5484d',CRS:'#f2994a',ASC:'#f2c94c',GGP:'#27ae60',SAR:'#2f80ed',BOM:'#9b51e0','5PIL':'#56ccf2',RROY:'#eb5757',GOU:'#219653',PARTICULIER:'#7d8590'};
function prefixColor(titleOrPrefix){
  const p = JOB_PREFIXES.includes(titleOrPrefix) || titleOrPrefix==='PARTICULIER' ? titleOrPrefix : getJobPrefix(titleOrPrefix);
  return PREFIX_COLORS[p] || '#2f80ed';
}
// Palette officielle des colorId d'événements Google Calendar (1-11) — ce sont
// les VRAIES couleurs que Google/PunchPro assigne à chaque événement (souvent
// une couleur par employé via hexToGcalColorId côté PunchPro).
const GCAL_COLOR_MAP = {
  '1':'#a4bdfc','2':'#7ae7bf','3':'#dbadff','4':'#ff887c','5':'#fbd75b',
  '6':'#ffb878','7':'#46d6db','8':'#e1e1e1','9':'#5484ed','10':'#51b749','11':'#dc2127'
};
function eventColor(e){ return (e && e.colorId && GCAL_COLOR_MAP[e.colorId]) || prefixColor(e?e.title:''); }

// ── Lecture SEULE du Sheet "SUIVI TRAVAUX" (appels de service / factures) ─
// Un onglet par contracteur, en-têtes légèrement variables selon l'onglet —
// on lit donc la ligne d'en-tête dynamiquement plutôt que de fixer des colonnes.
const SUIVI_TAB_NAMES = {PAY:'PAY',CRS:'CRS',ASC:'ASC',GGP:'GGP',SAR:'SAR',BOM:'BOM','5PIL':'5PIL',RROY:'RROY',GOU:'GOU',PARTICULIER:'Particuliers'};
async function sheetsGetHeaderRow(spreadsheetId, sheetName){
  const resp = await window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId, range: sheetName+'!A1:Z1'});
  return (resp.result.values && resp.result.values[0]) || [];
}
function findColIdx(headers, regex){ return headers.findIndex(h=>regex.test(String(h||''))); }
// Essaie de parser une date de cellule Sheets, quel que soit son format d'affichage
// (ISO, DD/MM/YYYY, texte reconnu par Date()...). Retourne null si impossible à lire.
function parseSheetDate(str){
  if(!str) return null;
  const s = String(str).trim();
  // Le Sheet "SUIVI TRAVAUX" utilise le format DD/MM/YYYY (confirmé en inspectant
  // les données réelles) — on le tente EN PREMIER. new Date("07/08/2026") serait
  // sinon lu comme MM/DD/YYYY par le moteur JS (7 juillet au lieu du 7 août),
  // ce qui faussait silencieusement le calcul "passé vs futur" pour la plupart
  // des dates (tout jour ≤ 12 est ambigu).
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    let [,dd,mm,yy]=m; yy = yy.length===2 ? '20'+yy : yy;
    const d = new Date(parseInt(yy,10), parseInt(mm,10)-1, parseInt(dd,10));
    if(!isNaN(d.getTime())) return d;
  }
  const d2 = new Date(s);
  if(!isNaN(d2.getTime())) return d2;
  return null;
}
// Retourne les lignes d'un onglet contracteur. Date/Projet/Adresse sont détectées
// par en-tête (peu de risque de variation). Appel de service / Ordre de travail /
// Factures sont en revanche des colonnes FIXES — K, L, M — car ces en-têtes sont
// fusionnés sur 2 lignes dans le Sheet et la détection par texte ramenait le mauvais
// texte ("Services et travail"). ID événement Calendar reste détecté par en-tête.
const SUIVI_COL_APPEL = 10;  // colonne K (0-indexé: A=0 ... K=10)
const SUIVI_COL_ORDRE = 11;  // colonne L
const SUIVI_COL_FACTURE = 12; // colonne M
async function getSuiviTravauxRows(spreadsheetId, contracteurKey){
  const tabName = SUIVI_TAB_NAMES[contracteurKey];
  if(!tabName) return [];
  let headers, rows;
  try{
    headers = await sheetsGetHeaderRow(spreadsheetId, tabName);
    rows = await sheetsGetAll(spreadsheetId, tabName);
  }catch(e){ return []; } // onglet absent ou inaccessible — on l'ignore simplement
  const idxDate = findColIdx(headers, /date/i);
  const idxProjet = findColIdx(headers, /projet/i);
  const idxAdresse = findColIdx(headers, /adresse/i);
  const idxEvent = findColIdx(headers, /calendar/i);
  const out = [];
  rows.forEach(r=>{
    const date=(idxDate>=0?r[idxDate]:'')||'';
    const projet=(idxProjet>=0?r[idxProjet]:'')||'';
    const adresse=(idxAdresse>=0?r[idxAdresse]:'')||'';
    const appelService=r[SUIVI_COL_APPEL]||'';
    const ordreTravail=r[SUIVI_COL_ORDRE]||'';
    const facture=r[SUIVI_COL_FACTURE]||'';
    const eventId=(idxEvent>=0?r[idxEvent]:'')||'';
    // ligne "réelle": au moins une date ou un projet/adresse — filtre les lignes
    // orphelines (ex: bloc d'IDs Calendar collé en fin d'onglet) et les diviseurs de mois.
    if(!date && !projet && !adresse && !appelService) return;
    // Statut: 'manquant' = pas d'appel de service du tout (K vide) — à créer.
    // 'en_traitement' = appel de service (K) présent mais pas encore de facture (M).
    // 'complet' = facture (M) présente.
    let statutFacture = 'complet';
    if(!appelService) statutFacture = 'manquant';
    else if(!facture) statutFacture = 'en_traitement';
    // Une facture "manquante" ne compte que si la date est aujourd'hui ou avant —
    // un job planifié plus tard n'a normalement pas encore de facture.
    const dateObj = parseSheetDate(date);
    const endOfToday = new Date(); endOfToday.setHours(23,59,59,999);
    const estPasseOuAujourdhui = dateObj ? dateObj<=endOfToday : false;
    out.push({contracteur:contracteurKey, date, projet, adresse, appelService, ordreTravail, facture, eventId,
      statutFacture, dateConnue: !!dateObj, estPasseOuAujourdhui,
      factureManquante: statutFacture!=='complet' && estPasseOuAujourdhui});
  });
  return out;
}
async function getAllSuiviTravaux(spreadsheetId){
  const keys = Object.keys(SUIVI_TAB_NAMES);
  const results = await Promise.all(keys.map(k=>getSuiviTravauxRows(spreadsheetId, k)));
  return results.flat();
}

// ── Thème clair/sombre ───────────────────────────────────────────────────
function getThemePref(){ return localStorage.getItem('crm_theme')||'dark'; }
function setThemePref(v){ localStorage.setItem('crm_theme',v); document.documentElement.setAttribute('data-theme',v); window.dispatchEvent(new Event('crm-theme-change')); }
function useTheme(){
  const [t,setT]=useState(getThemePref);
  useEffect(()=>{ document.documentElement.setAttribute('data-theme',t);
    const onC=()=>setT(getThemePref());
    window.addEventListener('crm-theme-change',onC);
    return ()=>window.removeEventListener('crm-theme-change',onC);
  },[]);
  return [t,setThemePref];
}
// Détecte desktop (≥900px) vs téléphone, réactif au redimensionnement — utilisé
// pour agrandir l'Agenda/Mois en plein écran sur desktop.
function useIsDesktop(){
  const [isDesktop,setIsDesktop]=useState(()=>typeof window!=='undefined' && window.innerWidth>=900);
  useEffect(()=>{
    function onResize(){ setIsDesktop(window.innerWidth>=900); }
    window.addEventListener('resize',onResize);
    return ()=>window.removeEventListener('resize',onResize);
  },[]);
  return isDesktop;
}

let tokenClient=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function initGoogle(cfg){
  await loadScript('https://apis.google.com/js/api.js');
  await new Promise(res=>window.gapi.load('client',res));
  await window.gapi.client.init({apiKey:cfg.apiKey, discoveryDocs:DISCOVERY});
  await loadScript('https://accounts.google.com/gsi/client');
  return new Promise((resolve)=>{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId,
      scope: SCOPES,
      callback: ()=>{}
    });
    resolve();
  });
}
function requestToken(){
  return new Promise((resolve,reject)=>{
    tokenClient.callback = (resp)=>{
      if(resp && resp.access_token){ resolve(resp); } else { reject(resp); }
    };
    tokenClient.requestAccessToken({prompt: window.gapi.client.getToken()?'':'consent'});
  });
}

// ── Sheets helpers ───────────────────────────────────────────────────────
async function sheetsGetAll(spreadsheetId, sheetName){
  const resp = await window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId, range: sheetName+'!A2:Z'});
  return resp.result.values || [];
}
async function sheetsAppendRow(spreadsheetId, sheetName, rowArray){
  return window.gapi.client.sheets.spreadsheets.values.append({
    spreadsheetId, range: sheetName+'!A:A', valueInputOption:'RAW', insertDataOption:'INSERT_ROWS',
    resource:{values:[rowArray]}
  });
}
async function sheetsUpdateRow(spreadsheetId, sheetName, rowIndex1Based, rowArray){
  const lastCol = String.fromCharCode(65+rowArray.length-1);
  return window.gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId, range: sheetName+'!A'+rowIndex1Based+':'+lastCol+rowIndex1Based, valueInputOption:'RAW',
    resource:{values:[rowArray]}
  });
}
async function ensureSheetsExist(spreadsheetId, sheetsSpec){
  const meta = await window.gapi.client.sheets.spreadsheets.get({spreadsheetId});
  const existing = (meta.result.sheets||[]).map(s=>s.properties.title);
  const requests=[];
  for(const spec of sheetsSpec){ if(!existing.includes(spec.name)) requests.push({addSheet:{properties:{title:spec.name}}}); }
  if(requests.length) await window.gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId, resource:{requests}});
  for(const spec of sheetsSpec){
    await window.gapi.client.sheets.spreadsheets.values.update({
      spreadsheetId, range: spec.name+'!A1', valueInputOption:'RAW', resource:{values:[spec.headers]}
    });
  }
}

// ── Row <-> object mapping ───────────────────────────────────────────────
function rowsToObjects(rows, headers){
  return rows.map((r,i)=>{
    const o={_row:i+2};
    headers.forEach((h,idx)=>{ o[h]=r[idx]!==undefined?r[idx]:''; });
    return o;
  });
}
function objectToRow(o, headers){ return headers.map(h=>o[h]!==undefined?o[h]:''); }

// ── Data hook: charge/écrit les 4 onglets CRM ────────────────────────────
function useCrmData(cfg, ready){
  const [contacts,setContacts]=useState([]);
  const [opps,setOpps]=useState([]);
  const [soums,setSoums]=useState([]);
  const [projets,setProjets]=useState([]);
  const [rappels,setRappels]=useState([]);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');

  const reload = useCallback(async ()=>{
    if(!ready || !cfg.crmSpreadsheetId) return;
    setLoading(true); setErr('');
    try{
      const [c,o,s] = await Promise.all([
        sheetsGetAll(cfg.crmSpreadsheetId,'Contacts'),
        sheetsGetAll(cfg.crmSpreadsheetId,'Opportunites'),
        sheetsGetAll(cfg.crmSpreadsheetId,'Soumissions')
      ]);
      setContacts(rowsToObjects(c, CONTACTS_HEADERS));
      setOpps(rowsToObjects(o, OPP_HEADERS));
      setSoums(rowsToObjects(s, SOUM_HEADERS));
    }catch(e){ setErr((e&&e.result&&e.result.error&&e.result.error.message) || 'Erreur de chargement des données.'); }
    // L'onglet "Projets" vit dans un Sheet SÉPARÉ (projetsSpreadsheetId) — isolé
    // dans son propre try/catch pour qu'une erreur ici (ex: onglet pas encore
    // créé) ne bloque pas Contacts/Opportunites/Soumissions partout dans l'app.
    if(cfg.projetsSpreadsheetId){
      try{ const p = await sheetsGetAll(cfg.projetsSpreadsheetId,'Projets'); setProjets(rowsToObjects(p, PROJETS_HEADERS)); }
      catch(e){ setProjets([]); }
    } else { setProjets([]); }
    // L'onglet "Rappels" est nouveau — s'il n'existe pas encore chez un utilisateur
    // existant, on ne veut pas faire échouer tout le chargement du CRM pour ça.
    try{ const r = await sheetsGetAll(cfg.crmSpreadsheetId,'Rappels'); setRappels(rowsToObjects(r, RAPPELS_HEADERS)); }
    catch(e){ setRappels([]); }
    setLoading(false);
  },[cfg.crmSpreadsheetId, cfg.projetsSpreadsheetId, ready]);

  useEffect(()=>{ reload(); },[reload]);

  async function addContact(obj){
    const full = {id:genId(), dateCreation:todayISO(), ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Contacts', objectToRow(full, CONTACTS_HEADERS));
    await reload();
    return full;
  }
  async function updateContact(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Contacts', obj._row, objectToRow(obj, CONTACTS_HEADERS));
    await reload();
  }
  async function addOpp(obj){
    const full = {id:genId(), dateCreation:todayISO(), punchproJobCree:'Non', punchproEventId:'', ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Opportunites', objectToRow(full, OPP_HEADERS));
    await reload();
    return full;
  }
  async function updateOpp(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Opportunites', obj._row, objectToRow(obj, OPP_HEADERS));
    await reload();
  }
  async function addSoumission(obj){
    const full = {id:genId(), date:todayISO(), courrielEnvoye:'Non', dateEnvoi:'', ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Soumissions', objectToRow(full, SOUM_HEADERS));
    await reload();
    return full;
  }
  async function updateSoumission(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Soumissions', obj._row, objectToRow(obj, SOUM_HEADERS));
    await reload();
  }
  async function addProjet(obj){
    const full = {id:genId(), dateCreation:todayISO(), statut:'Actif', ...obj};
    await sheetsAppendRow(cfg.projetsSpreadsheetId,'Projets', objectToRow(full, PROJETS_HEADERS));
    await reload();
    return full;
  }
  async function addRappel(obj){
    const full = {id:genId(), dateCreation:todayISO(), statut:'A faire', ...obj};
    await sheetsAppendRow(cfg.crmSpreadsheetId,'Rappels', objectToRow(full, RAPPELS_HEADERS));
    await reload();
    return full;
  }
  async function updateRappel(obj){
    await sheetsUpdateRow(cfg.crmSpreadsheetId,'Rappels', obj._row, objectToRow(obj, RAPPELS_HEADERS));
    await reload();
  }

  return {contacts,opps,soums,projets,rappels,loading,err,reload,addContact,updateContact,addOpp,updateOpp,addSoumission,updateSoumission,addProjet,addRappel,updateRappel};
}

// ── Génération du courriel de soumission (mailto + copie) ───────────────
function buildEmailBody(contact, opp, items, total){
  const lines=[];
  lines.push('Bonjour '+(contact.nom||'')+',');
  lines.push('');
  lines.push('Voici notre soumission pour les travaux au : '+(opp.adresse||''));
  lines.push('');
  lines.push('--- DÉTAILS DE LA SOUMISSION ---');
  items.forEach(it=>{
    lines.push('- '+it.description+'  |  Qté: '+it.qte+'  |  Prix unit.: '+fmtMoney(it.prix)+'  |  Sous-total: '+fmtMoney(it.qte*it.prix));
  });
  lines.push('');
  lines.push('TOTAL: '+fmtMoney(total));
  lines.push('');
  lines.push('--- INFO CLIENT (pour référence comptabilité) ---');
  lines.push('Client: '+(contact.nom||''));
  lines.push('Entreprise: '+(contact.entreprise||''));
  lines.push('Téléphone: '+(contact.telephone||''));
  lines.push('Courriel: '+(contact.email||''));
  lines.push('Adresse des travaux: '+(opp.adresse||''));
  lines.push('Type de travail: '+(opp.typeTravail||''));
  lines.push('Date: '+todayISO());
  lines.push('');
  lines.push('Merci,');
  lines.push('Saran Électrique');
  return lines.join('\n');
}
function openMailto(to, subject, body){
  const url = 'mailto:'+encodeURIComponent(to||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  window.location.href = url;
}

// ── UI: Toast ─────────────────────────────────────────────────────────────
function useToast(){
  const [msg,setMsg]=useState(null);
  const show=useCallback((text,type)=>{ setMsg({text,type:type||'ok'}); setTimeout(()=>setMsg(null),3200); },[]);
  const node = msg ? <div className={"toast "+(msg.type==='err'?'err':msg.type==='ok'?'ok':'')}>{msg.text}</div> : null;
  return [show,node];
}

      <button className="close-x" onClick={onClose}>×</button>
      <div className="modal-title">{title}</div>
      {children}
    </div>
  </div>;
}

function ContactForm({initial, onSave, onClose}){
  const [f,setF]=useState(initial || {nom:'',entreprise:'',telephone:'',email:'',adresse:'',source:'',notes:''});
  const addrRef = useRef(null);
  useEffect(()=>{
    if(window.google && window.google.maps && addrRef.current){

    </div>
    <div className="row2">

      <div className="field"><label>Courriel</label><input value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></div>
    </div>
    <div className="field"><label>Adresse</label><input ref={addrRef} value={f.adresse} onChange={e=>setF({...f,adresse:e.target.value})}/></div>

// ── UI: Constructeur de soumission (items + total + courriel) ───────────
function SoumissionBuilder({opp, contact, existing, onSaved, toast}){
  const [items,setItems]=useState(existing? JSON.parse(existing.itemsJson||'[]') : [{description:'',qte:1,prix:0}]);
  const total = items.reduce((s,it)=>s+(safeFloat(it.qte)*safeFloat(it.prix)),0);
  function upd(i,k,v){ const n=[...items]; n[i]={...n[i],[k]:v}; setItems(n); }
  function addRow(){ setItems([...items,{description:'',qte:1,prix:0}]); }
  function delRow(i){ setItems(items.filter((_,idx)=>idx!==i)); }

  async function handleSave(statut){
    const payload = {itemsJson: JSON.stringify(items), total: total.toFixed(2), statut};
    try{
      if(existing) await onSaved({...existing, ...payload});
      else await onSaved(payload);
      toast('Soumission enregistrée.','ok');
    }catch(e){ toast('Erreur: '+apiErrMsg(e),'err'); }
  }
  function handleEmail(){
    const body = buildEmailBody(contact||{}, opp||{}, items, total);
    openMailto(contact&&contact.email, 'Soumission — '+(opp&&opp.adresse||'Saran Électrique'), body);
    handleSave('Envoyée');
  }
  function handleCopy(){
    const body = buildEmailBody(contact||{}, opp||{}, items, total);
    navigator.clipboard.writeText(body).then(()=>toast('Texte copié.','ok'));
  }

  return <div>

// ── UI: Modal création job (écrit l'onglet Projets du CRM + Calendar) ───
// Note: écrit dans l'onglet "Projets" du Sheet DU CRM (pas celui de PunchPro).
// PunchPro sera adapté pour lire ce sheet dans une étape séparée, plus tard.
// Le titre est composé avec la même convention que PunchPro: PREFIXE PHASE NUMÉRO+RUE
function CreateJobModal({opp, contact, cfg, onClose, onDone, addProjet, toast}){
  const [date,setDate]=useState(todayISO());
  const [heure,setHeure]=useState('08:00');
  const entrepriseMatch = contact && CONTRACTEURS.includes((contact.entreprise||'').toUpperCase()) ? (contact.entreprise||'').toUpperCase() : 'PARTICULIER';
  const [prefixe,setPrefixe]=useState(entrepriseMatch);
  const [phase,setPhase]=useState('');
  const [busy,setBusy]=useState(false);
  const titre = buildJobTitle(prefixe, phase, opp.adresse);

  async function handleCreate(){
    setBusy(true);
    try{
      // 1) Crée l'événement Google Calendar
      const start = date+'T'+heure+':00';
      const end = date+'T'+(String(Math.min(23,parseInt(heure.split(':')[0])+2)).padStart(2,'0'))+':'+heure.split(':')[1]+':00';
      const calId = cfg.calendarIds.split(',')[0].trim();
      const ev = await window.gapi.client.calendar.events.insert({
        calendarId: calId,
        resource: {
          summary: titre || opp.adresse,
          description: 'Type de travail: '+(opp.typeTravail||'')+'\nNotes: '+(opp.notes||'')+'\n(créé depuis SoumissionPro)',
          location: opp.adresse,
          start:{dateTime:start, timeZone:'America/Toronto'},
          end:{dateTime:end, timeZone:'America/Toronto'}
        }
      });

      // 2) Écrit une ligne dans l'onglet Projets du CRM
      await addProjet({
        opportuniteId: opp.id, adresse: opp.adresse, titre, contracteur: prefixe, phase, typeTravail: opp.typeTravail,
        client: contact?contact.nom:'', telephone: contact?contact.telephone:'',
        notes: opp.notes||'', eventId: ev.result.id
      });

      toast('Job créée.','ok');
      onDone(ev.result.id);
    }catch(e){ toast('Erreur création job: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }

  return <Modal title="Créer la job (Projets + Calendar)" onClose={onClose}>
    <div className="field"><label>Adresse</label><input value={opp.adresse} disabled/></div>
    <div className="row2">
      <div className="field"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      <div className="field"><label>Heure</label><input type="time" value={heure} onChange={e=>setHeure(e.target.value)}/></div>
    </div>
    <div className="row2">
      <div className="field"><label>Contracteur</label>
        <select value={prefixe} onChange={e=>setPrefixe(e.target.value)}>
          {CONTRACTEURS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="field"><label>Phase</label>
        <select value={phase} onChange={e=>setPhase(e.target.value)}>
          <option value="">—</option>
          {JOB_PHASES.map(p=><option key={p} value={p}>{JOB_PHASE_LABELS[p]}</option>)}
        </select>
      </div>
    </div>
    <div className="field"><label>Titre généré</label><input value={titre} disabled/></div>
    <div className="muted" style={{fontSize:12,marginBottom:10}}>Ceci ajoute une ligne dans l'onglet "Projets" du CRM et crée un événement sur {cfg.calendarIds.split(',')[0]}. (L'onglet Projets de PunchPro n'est pas touché.)</div>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
      <button className="btn btn-s" onClick={onClose}>Annuler</button>
      <button className="btn btn-p" onClick={handleCreate} disabled={busy}>{busy?'Création...':'Confirmer'}</button>
    </div>
  </Modal>;
}

function RemindersView({data, toast}){
  const [showForm,setShowForm]=useState(false);
  const [showDone,setShowDone]=useState(false);
  const today = todayISO();
  const soon = new Date(); soon.setDate(soon.getDate()+7);
  const soonISO = soon.toISOString().slice(0,10);
  const contactById = Object.fromEntries(data.contacts.map(c=>[c.id,c]));

  const oppItems = data.opps.filter(o=>o.dateRelance && o.etape!=='Gagné' && o.etape!=='Perdu' && o.dateRelance<=soonISO)
    .map(o=>({source:'opp', id:o.id, titre:o.titre||o.adresse, sousTitre:(contactById[o.contactId]?contactById[o.contactId].nom:'')+' — '+o.etape, date:o.dateRelance, fait:false}));
  const rappelItems = (data.rappels||[])
    .filter(r=>showDone || r.statut!=='Fait')
    .filter(r=>showDone || (r.dateEcheance && r.dateEcheance<=soonISO) || !r.dateEcheance)
    .map(r=>({source:'rappel', raw:r, id:r.id, titre:r.titre, sousTitre:r.adresse||r.description||'', date:r.dateEcheance, fait:r.statut==='Fait'}));

  const items = [...oppItems, ...rappelItems].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));

  async function marquerFait(item){
    try{ await data.updateRappel({...item.raw, statut: item.fait?'A faire':'Fait'}); }
    catch(e){ toast && toast('Erreur: '+apiErrMsg(e),'err'); }
  }

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
      <h2 className="fh" style={{margin:0,fontSize:20}}>Rappels & Suivi</h2>
      <button className="btn btn-p" onClick={()=>setShowForm(true)}>+ Nouveau rappel</button>
    </div>
    <div style={{marginBottom:10}}>
      <button className="btn btn-sm" onClick={()=>setShowDone(v=>!v)} style={showDone?{background:'var(--accent)',color:'#fff',border:'none'}:null}>{showDone?'Cacher les rappels faits':'Afficher aussi les rappels faits'}</button>
    </div>
    <div className="card" style={{padding:0}}>
      {items.map(item=>
        <div className={"remind-item"+(!item.fait && item.date && item.date<today?' late':'')} key={item.source+item.id} style={item.fait?{opacity:.55}:null}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            {item.source==='rappel' && <input type="checkbox" checked={item.fait} onChange={()=>marquerFait(item)} style={{width:16,height:16}}/>}
            <div>
              <div style={{fontWeight:700,fontSize:13.5,textDecoration:item.fait?'line-through':'none'}}>{item.titre}</div>
              <div className="muted" style={{fontSize:12}}>{item.sousTitre}{item.source==='opp'?' (opportunité)':''}</div>
            </div>
          </div>
          <div style={{fontWeight:700,color:(!item.fait && item.date && item.date<today)?'var(--danger)':'var(--text)'}}>{item.date||'—'}</div>
        </div>
      )}
      {items.length===0 && <div className="muted" style={{padding:16}}>Aucun rappel ou suivi en attente. Clique "+ Nouveau rappel" pour en créer un.</div>}
    </div>
    {showForm && <RappelForm onClose={()=>setShowForm(false)} onSave={async(f)=>{
      try{ await data.addRappel(f); setShowForm(false); toast && toast('Rappel créé.','ok'); }
      catch(e){ toast && toast('Erreur: '+apiErrMsg(e)+' (l\'onglet "Rappels" existe-t-il? Va dans Réglages → Initialiser les onglets.)','err'); }
    }}/>}
  </div>;
}

function ProjectsFromCalendar({cfg, filterC, data, toast, refreshKey}){
  const [loading,setLoading]=useState(true);
  const [events,setEvents]=useState([]);
  const [err,setErr]=useState('');
  const [expanded,setExpanded]=useState(null);
  const [promoteGroup,setPromoteGroup]=useState(null);

  useEffect(()=>{
    let cancelled=false;
    setLoading(true); setErr('');
    const now=new Date();
    const timeMin=new Date(now); timeMin.setDate(timeMin.getDate()-180);
    const timeMax=new Date(now); timeMax.setDate(timeMax.getDate()+180);
    const calIds=(cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
    listCalendarEventsRange(calIds, timeMin.toISOString(), timeMax.toISOString())
      .then(evs=>{ if(!cancelled) setEvents(evs); })
      .catch(e=>{ if(!cancelled) setErr(apiErrMsg(e)||'Erreur de chargement du calendrier.'); })
      .finally(()=>{ if(!cancelled) setLoading(false); });
    return ()=>{ cancelled=true; };
  },[cfg.calendarIds, refreshKey]);

  const groups = useMemo(()=>groupEventsByAddress(events), [events]);
  const filtered = filterC ? groups.filter(g=>g.contracteur===filterC) : groups;
  const projetAdresses = useMemo(()=>new Set((data && data.projets ? data.projets : []).map(p=>String(p.adresse||'').trim().toLowerCase())), [data && data.projets]);

  return <div style={{marginTop:26}}>
    <h3 style={{margin:'0 0 4px',fontSize:15,fontWeight:800}}>Projets par adresse (calendrier, ±6 mois)</h3>
    <div className="muted" style={{fontSize:11.5,marginBottom:10}}>Lecture seule sur le calendrier — regroupé par adresse d'événement, comme dans PunchPro. Clique "Détails" pour voir la description et les fichiers joints de chaque job, ou "Créer un projet CRM" pour rassembler cette adresse sous un projet.</div>
    {err && <div className="card" style={{borderColor:'var(--danger)',color:'var(--danger)',marginBottom:12}}>{err}</div>}
    {loading ? <div className="muted">Chargement...</div> :
    <div className="card" style={{padding:0,overflowX:'auto'}}>
      <table>
        <thead><tr><th>Adresse</th><th>Contracteur</th><th>Jobs</th><th>Dernière activité</th><th></th><th></th></tr></thead>
        <tbody>
          {filtered.map(g=>{
            const dejaProjet = projetAdresses.has(String(g.adresse||'').trim().toLowerCase());
            return <React.Fragment key={g.adresse}>

  const [pts,setPts]=useState([]);
  const [err,setErr]=useState('');
  const [week,setWeek]=useState(()=>getWeek(new Date()));

  useEffect(()=>{
    if(!cfg.punchproSpreadsheetId) { setLoading(false); return; }
    let cancelled=false;
    setLoading(true); setErr('');
    Promise.all([getPunchProEmployees(cfg.punchproSpreadsheetId), getPunchProPointages(cfg.punchproSpreadsheetId)])
      .then(([e,p])=>{ if(!cancelled){ setEmps(e); setPts(p); } })
      .catch(e=>{ if(!cancelled) setErr((e&&e.result&&e.result.error&&e.result.error.message)||'Erreur de chargement (accès au Sheet PunchPro?).'); })
      .finally(()=>{ if(!cancelled) setLoading(false); });
    return ()=>{ cancelled=true; };
  },[cfg.punchproSpreadsheetId, refreshKey]);

  const dates = weekDatesArr(week);

  function prevWeek(){ const d=mondayOfWeek(week); d.setDate(d.getDate()-7); setWeek(getWeek(d)); }
  function nextWeek(){ const d=mondayOfWeek(week); d.setDate(d.getDate()+7); setWeek(getWeek(d)); }

      <div className="card" style={{padding:0,overflowX:'auto'}}>
        <table>
          <thead><tr>
            <th>Employé</th>
            {joursLabel.map((j,i)=><th key={i}>{j} {dates[i].getDate()}</th>)}
            <th>Total</th>
          </tr></thead>
          <tbody>
            {empsSorted.map(e=>{
              const row = table[e.nom]||{};
              const total = dateStrs.reduce((s,d)=>s+(row[d]||0),0);
              return <tr key={e.nom}>
                <td><span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:e.couleur,marginRight:6}}></span>{e.nom}</td>

function QuickJobModal({cfg, addProjet, toast, onClose, onDone, initialDate, initialHeure}){
  const defaults = useMemo(()=>getLastJobDefaults(),[]);
  const [adresse,setAdresse]=useState('');
  const [client,setClient]=useState('');
  const [telephone,setTelephone]=useState('');
  const [date,setDate]=useState(initialDate||todayISO());
  const [heure,setHeure]=useState(initialHeure||'08:00');
  const [prefixe,setPrefixe]=useState(defaults.prefixe);
  const [phase,setPhase]=useState(defaults.phase);
  const [notes,setNotes]=useState('');
  const [busy,setBusy]=useState(false);
  const addrRef = useRef(null);
  useEffect(()=>{
    if(window.google && window.google.maps && addrRef.current){
      const ac = new google.maps.places.Autocomplete(addrRef.current, {types:['address'],componentRestrictions:{country:'ca'}});
      ac.addListener('place_changed', ()=>{
        const place = ac.getPlace();
        if(place && place.formatted_address) setAdresse(place.formatted_address);
      });
    }
  },[]);
  const titre = buildJobTitle(prefixe, phase, adresse);

  async function handleCreate(){
    if(!adresse){ toast('Indique une adresse.','err'); return; }
    setBusy(true);
    try{
      const start = date+'T'+heure+':00';
      const end = date+'T'+(String(Math.min(23,parseInt(heure.split(':')[0])+2)).padStart(2,'0'))+':'+heure.split(':')[1]+':00';
      const calId = cfg.calendarIds.split(',')[0].trim();
      const ev = await window.gapi.client.calendar.events.insert({
        calendarId: calId,
        resource: {
          summary: titre || adresse,
          description: 'Client: '+(client||'')+'\nTéléphone: '+(telephone||'')+'\nNotes: '+(notes||'')+'\n(créé depuis SoumissionPro — Agenda)',
          location: adresse,
          start:{dateTime:start, timeZone:'America/Toronto'},
          end:{dateTime:end, timeZone:'America/Toronto'}
        }
      });
      await addProjet({
        opportuniteId:'', adresse, titre, contracteur:prefixe, phase, typeTravail:'',
        client, telephone, notes, eventId: ev.result.id
      });
      saveLastJobDefaults(prefixe, phase);
      toast('Job créée.','ok');
      onDone && onDone();
      onClose();
    }catch(e){ toast('Erreur création job: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }

  return <Modal title="Nouvelle job (depuis l'Agenda)" onClose={onClose}>
    <div className="field"><label>Adresse</label><input ref={addrRef} value={adresse} onChange={e=>setAdresse(e.target.value)} placeholder="Commence à taper une adresse..."/></div>
    <div className="row2">
      <div className="field"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      <div className="field"><label>Heure</label><input type="time" value={heure} onChange={e=>setHeure(e.target.value)}/></div>
    </div>
    <div className="row2">
      <div className="field"><label>Contracteur</label>
        <select value={prefixe} onChange={e=>setPrefixe(e.target.value)}>
          {CONTRACTEURS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="field"><label>Phase</label>
        <select value={phase} onChange={e=>setPhase(e.target.value)}>
          <option value="">—</option>
          {JOB_PHASES.map(p=><option key={p} value={p}>{JOB_PHASE_LABELS[p]}</option>)}
        </select>
      </div>
    </div>
    <div className="row2">
      <div className="field"><label>Client (optionnel)</label><input value={client} onChange={e=>setClient(e.target.value)}/></div>
      <div className="field"><label>Téléphone</label><input value={telephone} onChange={e=>setTelephone(e.target.value)}/></div>
    </div>
    <div className="field tag-input"><label>Notes</label><textarea value={notes} onChange={e=>setNotes(e.target.value)}/></div>
    <div className="field"><label>Titre généré</label><input value={titre} disabled/></div>
    <div className="muted" style={{fontSize:12,marginBottom:10}}>Ajoute une ligne dans "Projets" (CRM) + crée l'événement sur {cfg.calendarIds.split(',')[0]}.</div>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
      <button className="btn btn-s" onClick={onClose}>Annuler</button>
      <button className="btn btn-p" onClick={handleCreate} disabled={busy}>{busy?'Création...':'Créer la job'}</button>
    </div>
  </Modal>;
}

function AgendaView({cfg, data, toast, isDesktop, refreshKey}){
  const [viewMode,setViewMode]=useState('semaine'); // 'jour'|'semaine'|'mois'
  const [anchor,setAnchor]=useState(()=>new Date());
  const [loading,setLoading]=useState(true);
  const [events,setEvents]=useState([]);
  const [err,setErr]=useState('');
  const [showJobModal,setShowJobModal]=useState(false);
  const [jobDate,setJobDate]=useState(null);
  const [jobHeure,setJobHeure]=useState(null);
  const [editEvent,setEditEvent]=useState(null);
  const [reloadKey,setReloadKey]=useState(0);
  const dayColRefs = useRef([]);
  const dragInfoRef = useRef(null);
  const draggedElRef = useRef(null);
  const resizeInfoRef = useRef(null);

  const days = useMemo(()=>getRangeDays(viewMode, anchor), [viewMode, anchor.getTime()]);

  useEffect(()=>{
    let cancelled=false;
    setLoading(true); setErr('');
    const timeMin = new Date(days[0]); timeMin.setHours(0,0,0,0);
    const timeMax = new Date(days[days.length-1]); timeMax.setHours(23,59,59,999);
    const calIds = (cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
    listCalendarEventsRange(calIds, timeMin.toISOString(), timeMax.toISOString())
      .then(evs=>{ if(!cancelled) setEvents(evs); })
      .catch(e=>{ if(!cancelled) setErr(apiErrMsg(e)||'Erreur de chargement du calendrier.'); })
      .finally(()=>{ if(!cancelled) setLoading(false); });
    return ()=>{ cancelled=true; };
  },[viewMode, anchor.getTime(), cfg.calendarIds, reloadKey, refreshKey]);

  function goPrev(){ const d=new Date(anchor); if(viewMode==='jour') d.setDate(d.getDate()-1); else if(viewMode==='mois') d.setMonth(d.getMonth()-1); else d.setDate(d.getDate()-7); setAnchor(d); }
  function goNext(){ const d=new Date(anchor); if(viewMode==='jour') d.setDate(d.getDate()+1); else if(viewMode==='mois') d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+7); setAnchor(d); }
  function goToday(){ setAnchor(new Date()); }
  function openNewJob(dStr, heureStr){ setJobDate(dStr||todayISO()); setJobHeure(heureStr||null); setShowJobModal(true); }
  function rangeLabel(){
    if(viewMode==='jour') return anchor.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    if(viewMode==='mois') return anchor.toLocaleDateString('fr-CA',{month:'long',year:'numeric'});
    return weekRangeLabel(getWeek(anchor));
  }

  const HOUR_START=6, HOUR_END=20, PX_H=isDesktop?64:46;
  const hours = Array.from({length:HOUR_END-HOUR_START+1},(_,i)=>HOUR_START+i);
  const todayStr = localDateStr(new Date());
  // Colonnes de largeur FIXE (pas minmax(...,1fr)) quand il y en a plusieurs:
  // certains navigateurs mobiles compriment mal minmax(...,1fr) dans un conteneur
  // overflow-x:auto (colonnes qui rapetissent au lieu de faire défiler), ce qui
  // causait le désalignement "les carrés ne fittent pas". Une largeur fixe +
  // width:max-content sur la grille est beaucoup plus fiable.
  const DAY_COL_PX = isDesktop?180:130;
  const gridCols = days.length>1 ? 'repeat('+days.length+','+DAY_COL_PX+'px)' : 'minmax(120px,1fr)';

  function eventsForDay(dStr){ return events.filter(e=>String(e.start).slice(0,10)===dStr && !e.allDay); }
  function allDayForDay(dStr){ return events.filter(e=>String(e.start).slice(0,10)===dStr && e.allDay); }

  // ── Glisser un événement pour changer son heure/jour directement dans la grille ──
  function handleEventPointerDown(e, ev){
    if(e.button!==undefined && e.button!==0) return;
    const el = e.currentTarget;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const startMs = new Date(ev.start).getTime();
    const endMs = ev.end ? new Date(ev.end).getTime() : startMs+3600000;
    const elRect = el.getBoundingClientRect();
    // Offset du point où on a "attrapé" le bloc, par rapport à SON PROPRE haut —
    // sans ça, si on saisit l'événement au milieu, le drop est décalé (ex: on vise
    // 7h00 mais ça tombe à 7h15) puisqu'on utiliserait la position du curseur telle
    // quelle au lieu de la position du haut du bloc.
    const grabOffsetY = e.clientY - elRect.top;
    dragInfoRef.current = {pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, grabOffsetY, moved:false, ev, origStartMs:startMs, durationMs:endMs-startMs};
    draggedElRef.current = el;
  }
  function handleEventPointerMove(e){
    const info = dragInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const dx=e.clientX-info.startX, dy=e.clientY-info.startY;
    if(!info.moved && Math.hypot(dx,dy)>6) info.moved=true;
    if(info.moved && draggedElRef.current){
      draggedElRef.current.style.transform='translate('+dx+'px,'+dy+'px)';
      draggedElRef.current.style.zIndex='30';
      draggedElRef.current.style.opacity='0.85';
      draggedElRef.current.style.boxShadow='0 4px 14px rgba(0,0,0,.4)';
    }
  }
  function handleEventPointerUp(e){
    const info = dragInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const el = draggedElRef.current;
    if(el){ el.style.transform=''; el.style.zIndex=''; el.style.opacity=''; el.style.boxShadow='0 1px 3px rgba(0,0,0,.25)'; }
    if(!info.moved){
      setEditEvent(info.ev);
    } else {
      let targetDayIdx=null;
      for(let i=0;i<dayColRefs.current.length;i++){
        const rect = dayColRefs.current[i] && dayColRefs.current[i].getBoundingClientRect();
        if(rect && e.clientX>=rect.left && e.clientX<=rect.right){ targetDayIdx=i; break; }
      }
      let newStartMs = info.origStartMs;
      if(targetDayIdx!==null){
        const rect = dayColRefs.current[targetDayIdx].getBoundingClientRect();
        const blockTopY = e.clientY - info.grabOffsetY;
        let hourFloat = HOUR_START + (blockTopY-rect.top)/PX_H;
        hourFloat = Math.max(0, Math.min(24, Math.round(hourFloat*4)/4));
        const target = new Date(days[targetDayIdx]); target.setHours(0,0,0,0);
        target.setMinutes(Math.round(hourFloat*60));
        newStartMs = target.getTime();
      }
      const newEndMs = newStartMs + info.durationMs;
      patchEventTimes(info.ev.calendarId, info.ev.id, new Date(newStartMs).toISOString(), new Date(newEndMs).toISOString())
        .then(()=>{ toast('Job déplacée.','ok'); setReloadKey(k=>k+1); })
        .catch(err=>toast('Erreur: '+apiErrMsg(err),'err'));
    }
    dragInfoRef.current=null; draggedElRef.current=null;
  }

  // ── Redimensionner un événement (poignée en bas) — change seulement la fin ──
  function handleResizePointerDown(e, ev){
    e.stopPropagation();
    const handleEl = e.currentTarget;
    const blockEl = handleEl.parentElement;
    try{ handleEl.setPointerCapture(e.pointerId); }catch(err){}
    const startMs = new Date(ev.start).getTime();
    const origEndMs = ev.end ? new Date(ev.end).getTime() : startMs+3600000;
    resizeInfoRef.current = {pointerId:e.pointerId, startY:e.clientY, ev, startMs, origEndMs, blockEl, origHeight: blockEl.offsetHeight};
  }
  function handleResizePointerMove(e){
    const info = resizeInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const dy = e.clientY-info.startY;
    info.blockEl.style.height = Math.max(18, info.origHeight+dy)+'px';
    info.blockEl.style.zIndex='30';
    info.blockEl.style.boxShadow='0 4px 14px rgba(0,0,0,.4)';
  }
  function handleResizePointerUp(e){
    const info = resizeInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const dy = e.clientY-info.startY;
    info.blockEl.style.zIndex=''; info.blockEl.style.boxShadow='0 1px 3px rgba(0,0,0,.25)';
    const deltaMin = Math.round((dy/PX_H*60)/15)*15; // arrondi au 1/4h
    let newEndMs = Math.max(info.startMs+15*60000, info.origEndMs + deltaMin*60000);
    patchEventTimes(info.ev.calendarId, info.ev.id, new Date(info.startMs).toISOString(), new Date(newEndMs).toISOString())
      .then(()=>{ toast('Durée mise à jour.','ok'); setReloadKey(k=>k+1); })
      .catch(err=>{ toast('Erreur: '+apiErrMsg(err),'err'); info.blockEl.style.height=info.origHeight+'px'; });
    resizeInfoRef.current=null;
  }

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
      <div>
        <h2 className="fh" style={{margin:'0 0 6px',fontSize:20}}>Agenda</h2>
        <div className="muted" style={{fontSize:11.5,marginBottom:14}}>Calendrier Google utilisé par PunchPro. Les couleurs sont celles réellement assignées dans Google Calendar.</div>
      </div>
      {data && <button className="btn btn-p" onClick={()=>openNewJob(todayISO())}>+ Nouvelle job</button>}
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap'}}>
      <button className="btn btn-sm" onClick={goPrev}>←</button>
      <div style={{fontWeight:700,textTransform:'capitalize',minWidth:160}}>{rangeLabel()}</div>
      <button className="btn btn-sm" onClick={goNext}>→</button>
      <button className="btn btn-sm" onClick={goToday}>Aujourd'hui</button>
      <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
        {[['jour','Jour'],['semaine','Semaine'],['mois','Mois']].map(([id,label])=>
          <button key={id} className="btn btn-sm" onClick={()=>setViewMode(id)} style={viewMode===id?{background:'var(--accent)',color:'#fff',border:'none'}:null}>{label}</button>
        )}
      </div>
    </div>
    {err && <div className="card" style={{borderColor:'var(--danger)',color:'var(--danger)',marginBottom:12}}>{err}</div>}
    {loading ? <div className="muted">Chargement...</div> :

    viewMode==='mois' ?
    <div className="card" style={{padding:8}}>
      {/* Une seule grille (7 colonnes x 7 rangées: en-têtes + 6 semaines) pour que
          les jours de la semaine et les cases du mois restent alignés. */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gridTemplateRows:'auto repeat(6,1fr)',gap:isDesktop?8:4}}>
        {['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map((j,i)=><div key={j} style={{gridColumn:i+1,gridRow:1}} className="muted"><div style={{textAlign:'center',fontSize:isDesktop?13:11,fontWeight:700}}>{j}</div></div>)}
        {days.map((d,i)=>{
          const dStr = localDateStr(d);
          const inMonth = d.getMonth()===anchor.getMonth();
          const dayEvents = [...eventsForDay(dStr), ...allDayForDay(dStr)].sort((a,b)=>String(a.start).localeCompare(String(b.start)));
          const maxShow = isDesktop?6:3;
          return <div key={i} onClick={()=>{ setViewMode('jour'); setAnchor(new Date(d)); }}
            style={{gridColumn:(i%7)+1, gridRow:Math.floor(i/7)+2, minHeight:isDesktop?150:80,border:'1px solid var(--border)',borderRadius:6,padding:isDesktop?8:4,cursor:'pointer',opacity:inMonth?1:.4,background:dStr===todayStr?'rgba(47,128,237,.08)':'transparent'}}>
            <div style={{fontSize:isDesktop?15:11,fontWeight:700,marginBottom:5}}>{d.getDate()}</div>
            {dayEvents.slice(0,maxShow).map(e=><div key={e.id} title={e.title} onClick={(ev)=>{ ev.stopPropagation(); setEditEvent(e); }} style={{cursor:'pointer',background:eventColor(e),color:'#1d1d1d',fontSize:isDesktop?11.5:9.5,padding:isDesktop?'3px 6px':'1px 4px',borderRadius:3,marginBottom:3,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{e.title}</div>)}
            {dayEvents.length>maxShow && <div className="muted" style={{fontSize:isDesktop?11:9.5}}>+{dayEvents.length-maxShow} de plus</div>}
          </div>;
        })}
      </div>
    </div>
    :
    <div className="card" style={{padding:0,overflowX:'auto'}}>
      {/* Une SEULE grille pour l'en-tête, la rangée "toute la journée" et les heures,
          pour que les colonnes s'alignent parfaitement (sinon 3 grilles séparées
          calculent chacune leurs largeurs indépendamment et ça ne s'aligne plus). */}
      <div style={{display:'grid',gridTemplateColumns:'50px '+gridCols,gridTemplateRows:'auto auto '+(PX_H*hours.length)+'px',width:days.length>1?'max-content':'100%',minWidth:days.length>1?(50+DAY_COL_PX*days.length):undefined}}>
        <div style={{gridColumn:1,gridRow:1}}></div>
        {days.map((d,i)=><div key={'h'+i} style={{gridColumn:i+2,gridRow:1,padding:'8px 6px',borderLeft:'1px solid var(--border)',textAlign:'center',fontWeight:700,fontSize:12,background:localDateStr(d)===todayStr?'rgba(47,128,237,.10)':'transparent'}}>
          <div style={{textTransform:'capitalize'}}>{d.toLocaleDateString('fr-CA',{weekday:'short'})}</div>
          <div className="muted" style={{fontWeight:500}}>{d.getDate()}</div>
        </div>)}

        <div style={{gridColumn:1,gridRow:2}}></div>
        {days.map((d,i)=>{
          const dStr = localDateStr(d);
          const adEvents = allDayForDay(dStr);
          return <div key={'a'+i} style={{gridColumn:i+2,gridRow:2,borderTop:'1px solid var(--border)',borderLeft:'1px solid var(--border)',padding:4,minHeight:22}}>
            {adEvents.map(e=><div key={e.id} title={e.title} onClick={()=>setEditEvent(e)} style={{cursor:'pointer',background:eventColor(e),color:'#1d1d1d',fontSize:10.5,padding:'2px 5px',borderRadius:4,marginBottom:2,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{e.title}</div>)}
          </div>;
        })}

        <div style={{gridColumn:1,gridRow:3}}>
          {hours.map(h=><div key={h} style={{height:PX_H,fontSize:10.5,color:'var(--muted)',textAlign:'right',paddingRight:6,borderTop:'1px solid var(--border)',boxSizing:'border-box'}}>{h}h</div>)}
        </div>
        {days.map((d,i)=>{
          const dStr = localDateStr(d);
          const dayEvents = eventsForDay(dStr);
          const placed = layoutDayEvents(dayEvents);
          return <div key={'d'+i} ref={el=>dayColRefs.current[i]=el} style={{gridColumn:i+2,gridRow:3,position:'relative',borderLeft:'1px solid var(--border)'}}>
            {hours.map(h=><div key={h} onClick={()=>{ if(data) openNewJob(dStr, String(h).padStart(2,'0')+':00'); }}
              style={{height:PX_H,borderTop:'1px solid var(--border)',boxSizing:'border-box',cursor:data?'copy':'default'}}
              title={data?'Cliquer pour créer une job à '+h+'h':''}></div>)}
            {placed.map(({event:e,col,totalCols})=>{
              const start=new Date(e.start), end=e.end?new Date(e.end):new Date(start.getTime()+3600000);
              const startH=Math.max(HOUR_START, start.getHours()+start.getMinutes()/60);
              const endHraw=end.getHours()+end.getMinutes()/60;
              const endH=Math.min(HOUR_END+1, endHraw>startH?endHraw:startH+1);
              const top=(startH-HOUR_START)*PX_H;
              const height=Math.max(18,(endH-startH)*PX_H-2);
              const widthPct=100/totalCols, leftPct=col*widthPct;
              return <div key={e.id} title={'Glisser pour déplacer, cliquer pour modifier — '+e.title}
                onPointerDown={ev=>handleEventPointerDown(ev,e)}
                onPointerMove={handleEventPointerMove}
                onPointerUp={handleEventPointerUp}
                style={{position:'absolute',top,height,left:'calc('+leftPct+'% + 2px)',width:'calc('+widthPct+'% - 4px)',background:eventColor(e),color:'#1d1d1d',fontSize:10.5,padding:'2px 5px',borderRadius:5,overflow:'visible',boxShadow:'0 1px 3px rgba(0,0,0,.25)',cursor:'grab',touchAction:'none',userSelect:'none'}}>
                <div style={{overflow:'hidden',height:'100%'}}>
                  <div style={{fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{e.title}</div>
                  <div style={{opacity:.85}}>{start.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}–{end.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}</div>
                </div>
                <div onPointerDown={ev2=>handleResizePointerDown(ev2,e)} onPointerMove={handleResizePointerMove} onPointerUp={handleResizePointerUp}
                  title="Glisser pour changer la durée"
                  style={{position:'absolute',left:0,right:0,bottom:-4,height:9,cursor:'ns-resize',touchAction:'none',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <div style={{width:22,height:3,borderRadius:2,background:'rgba(29,29,29,.55)'}}></div>
                </div>
              </div>;
            })}
          </div>;
        })}
      </div>
    </div>}
    {showJobModal && data && <QuickJobModal cfg={cfg} addProjet={data.addProjet} toast={toast} initialDate={jobDate} initialHeure={jobHeure}
      onClose={()=>setShowJobModal(false)} onDone={()=>setReloadKey(k=>k+1)}/>}
    {editEvent && <EditEventModal event={editEvent} toast={toast} onClose={()=>setEditEvent(null)} onSaved={()=>setReloadKey(k=>k+1)}/>}
  </div>;
}

// ── UI: Factures — LECTURE SEULE depuis "SUIVI TRAVAUX SARAN ÉLECTRIQUE" ──
// Un appel de service sans facture associée = "facture manquante".
function FacturesView({cfg, refreshKey}){
  const [loading,setLoading]=useState(true);
  const [rows,setRows]=useState([]);
  const [err,setErr]=useState('');
  const [onlyMissing,setOnlyMissing]=useState(true);
  const [filterC,setFilterC]=useState(null);

  useEffect(()=>{
    if(!cfg.suiviTravauxSpreadsheetId){ setLoading(false); return; }
    let cancelled=false;
    setLoading(true); setErr('');
    getAllSuiviTravaux(cfg.suiviTravauxSpreadsheetId)
      .then(r=>{ if(!cancelled) setRows(r); })
      .catch(e=>{ if(!cancelled) setErr(apiErrMsg(e)||'Erreur de chargement.'); })
      .finally(()=>{ if(!cancelled) setLoading(false); });
    return ()=>{ cancelled=true; };
  },[cfg.suiviTravauxSpreadsheetId, refreshKey]);

  const contracteursPresent = [...new Set(rows.map(r=>r.contracteur))];
  let base = filterC ? rows.filter(r=>r.contracteur===filterC) : rows;
  const byDateDesc = (a,b)=>(b.date||'').localeCompare(a.date||'');
  const manquantList = [...base.filter(r=>r.statutFacture==='manquant' && r.estPasseOuAujourdhui)].sort(byDateDesc);
  const traitementList = [...base.filter(r=>r.statutFacture==='en_traitement' && r.estPasseOuAujourdhui)].sort(byDateDesc);
  const allList = [...base].sort(byDateDesc);
  const missingCount = rows.filter(r=>r.factureManquante).length;

  function renderTable(list, emptyMsg){
    return <div className="card" style={{padding:0,overflowX:'auto'}}>
      <table>
        <thead><tr><th>Contracteur</th><th>Date</th><th>Projet</th><th>Adresse</th><th>Appel de service</th><th>Ordre de travail</th><th>Facture</th></tr></thead>
        <tbody>
          {list.map((r,i)=><tr key={i} style={r.factureManquante?{background:'rgba(248,81,73,.08)'}:null}>
            <td>{r.contracteur==='PARTICULIER'?'Particuliers':r.contracteur}</td>
            <td className="muted">{r.date}</td>
            <td style={{fontWeight:600}}>{r.projet}</td>
            <td className="muted">{r.adresse}</td>
            <td>{r.appelService||'—'}</td>
            <td>{r.ordreTravail||'—'}</td>
            <td>
              {r.statutFacture==='complet' && r.facture}
              {r.statutFacture==='en_traitement' && <span style={{color:'#d29922',fontWeight:700}}>En traitement</span>}
              {r.statutFacture==='manquant' && <span style={{color:'var(--danger)',fontWeight:700}}>Manquant</span>}
            </td>
          </tr>)}
          {list.length===0 && <tr><td colSpan="7" className="muted" style={{padding:16}}>{emptyMsg}</td></tr>}
        </tbody>
      </table>
    </div>;
  }

  return <div>
    <h2 className="fh" style={{margin:'0 0 6px',fontSize:20}}>Factures</h2>
    <div className="muted" style={{fontSize:11.5,marginBottom:14}}>Lecture seule — Sheet "SUIVI TRAVAUX SARAN ÉLECTRIQUE" (colonnes K/L/M). "Manquant" = pas d'appel de service (K vide). "En traitement" = appel de service fait mais pas encore de facture (M vide). Seules les lignes datées d'aujourd'hui ou avant comptent comme manquantes — un job futur n'a normalement pas encore de facture.</div>
    {!cfg.suiviTravauxSpreadsheetId && <div className="card">Configure l'ID du Sheet "SUIVI TRAVAUX" dans Réglages.</div>}
    {err && <div className="card" style={{borderColor:'var(--danger)',color:'var(--danger)',marginBottom:12}}>{err}</div>}
    {cfg.suiviTravauxSpreadsheetId && <>
      {!loading && <div className="card" style={{marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
        <div style={{fontSize:28,fontWeight:800,color:missingCount>0?'var(--danger)':'var(--success)'}}>{missingCount}</div>
        <div className="muted" style={{fontSize:12.5}}>facture{missingCount!==1?'s':''} manquante{missingCount!==1?'s':''} sur {rows.length} lignes lues, tous contracteurs confondus.</div>
      </div>}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
        <button className="btn btn-sm" onClick={()=>setOnlyMissing(true)} style={onlyMissing?{background:'var(--danger)',color:'#fff',border:'none'}:null}>Manquantes seulement</button>
        <button className="btn btn-sm" onClick={()=>setOnlyMissing(false)} style={!onlyMissing?{background:'var(--accent)',color:'#fff',border:'none'}:null}>Toutes les lignes</button>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
        <button className="btn btn-sm" onClick={()=>setFilterC(null)} style={!filterC?{background:'var(--accent)',color:'#fff',border:'none'}:null}>Tous contracteurs</button>
        {contracteursPresent.map(c=><button key={c} className="btn btn-sm" onClick={()=>setFilterC(c)} style={filterC===c?{background:prefixColor(c),color:'#fff',border:'none'}:null}>{c==='PARTICULIER'?'Particuliers':c}</button>)}
      </div>
      {loading ? <div className="muted">Chargement...</div> :
      onlyMissing ? <>
        <h3 style={{margin:'0 0 8px',fontSize:14,fontWeight:800,color:'var(--danger)'}}>Manquantes ({manquantList.length})</h3>
        {renderTable(manquantList, 'Aucune facture manquante 🎉')}
        <h3 style={{margin:'22px 0 8px',fontSize:14,fontWeight:800,color:'#d29922'}}>En traitement ({traitementList.length})</h3>
        {renderTable(traitementList, 'Rien en traitement.')}
      </> : renderTable(allList, 'Aucune ligne trouvée.')}
    </>}
  </div>;
}

// ── UI: Réglages ──────────────────────────────────────────────────────────
function SettingsView({cfg, setCfg, toast}){
  const [f,setF]=useState(cfg);
  const [theme,setTheme]=useTheme();
  const [busy,setBusy]=useState(false);
  async function handleInit(){
    if(!f.crmSpreadsheetId){ toast('Indique d\'abord l\'ID du Google Sheet du CRM.','err'); return; }
    setBusy(true);
    try{
      await ensureSheetsExist(f.crmSpreadsheetId, [
        {name:'Contacts', headers:CONTACTS_HEADERS},
        {name:'Opportunites', headers:OPP_HEADERS},
        {name:'Soumissions', headers:SOUM_HEADERS},
        {name:'Rappels', headers:RAPPELS_HEADERS}
      ]);
      if(f.projetsSpreadsheetId){
        await ensureSheetsExist(f.projetsSpreadsheetId, [{name:'Projets', headers:PROJETS_HEADERS}]);
      }
      toast('Onglets initialisés.','ok');
    }catch(e){ toast('Erreur: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }
  return <div style={{maxWidth:520}}>
    <h2 className="fh" style={{margin:'0 0 14px',fontSize:20}}>Réglages</h2>
    <div className="card grid" style={{gap:12}}>
      <div className="field"><label>Thème</label>
        <select value={theme} onChange={e=>setTheme(e.target.value)}><option value="dark">Sombre</option><option value="light">Clair</option></select>
      </div>
      <div className="field"><label>ID du Google Sheet CRM</label><input value={f.crmSpreadsheetId} onChange={e=>setF({...f,crmSpreadsheetId:e.target.value})} placeholder="Coller l'ID du Sheet ici"/></div>
      <div className="field"><label>ID du Google Sheet "PROJETS SARAN ÉLECTRIQUE"</label><input value={f.projetsSpreadsheetId} onChange={e=>setF({...f,projetsSpreadsheetId:e.target.value})} placeholder="Sheet séparé, sera donné à PunchPro plus tard"/></div>
      <button className="btn btn-s" onClick={handleInit} disabled={busy}>{busy?'Initialisation...':'Initialiser les onglets (Contacts/Opportunites/Soumissions/Rappels/Projets)'}</button>
      <hr style={{border:'none',borderTop:'1px solid var(--border)'}}/>
      <div className="field"><label>ID du Sheet PunchPro (Heures &amp; Employés) — lecture seule</label><input value={f.punchproSpreadsheetId} onChange={e=>setF({...f,punchproSpreadsheetId:e.target.value})} placeholder="Sheet de pointage PunchPro, jamais modifié par le CRM"/></div>
      <div className="field"><label>ID du Sheet "SUIVI TRAVAUX" (Factures) — lecture seule</label><input value={f.suiviTravauxSpreadsheetId} onChange={e=>setF({...f,suiviTravauxSpreadsheetId:e.target.value})} placeholder="Sheet des appels de service / factures, jamais modifié par le CRM"/></div>
      <div className="field"><label>Calendriers (séparés par virgule)</label><input value={f.calendarIds} onChange={e=>setF({...f,calendarIds:e.target.value})}/></div>
      <button className="btn btn-p" onClick={()=>{ saveCfg(f); setCfg(f); toast('Réglages enregistrés.','ok'); }}>Enregistrer les réglages</button>
      <div className="muted" style={{fontSize:11.5}}>Version {APP_VERSION}</div>
    </div>
  </div>;
}

// ── App root ──────────────────────────────────────────────────────────────
function App(){
  const [cfg,setCfg]=useState(loadCfg);
  const [ready,setReady]=useState(false);
  const [authed,setAuthed]=useState(false);
  const [nav,setNav]=useState('pipeline');
  const [initErr,setInitErr]=useState('');
  const [show,toastNode]=useToast();
  const [refreshKey,setRefreshKey]=useState(0);
  const [refreshing,setRefreshing]=useState(false);
  useTheme();
  const isDesktop = useIsDesktop();

  async function handleRefresh(){
    setRefreshing(true);
    try{ await data.reload(); }catch(e){}
    setRefreshKey(k=>k+1);
    setRefreshing(false);
    show('Données actualisées.','ok');
  }

  useEffect(()=>{
    initGoogle(cfg).then(()=>setReady(true)).catch(e=>setInitErr('Erreur d\'initialisation Google: '+apiErrMsg(e)));
  },[]);

  const data = useCrmData(cfg, ready && authed);

  async function handleLogin(){
    try{ await requestToken(); setAuthed(true); }
    catch(e){ show('Connexion refusée ou annulée.','err'); }
  }

  if(!ready) return <div className="login-screen"><div className="spin"></div>{initErr && <div className="muted">{initErr}</div>}</div>;
  if(!authed) return <div className="login-screen">
    <div className="logo"><span className="dot"></span>SoumissionPro</div>
    <div className="muted" style={{fontSize:11.5,marginTop:-12}}>{APP_VERSION}</div>
    <div className="muted">Gestion de contacts, pipeline de vente et soumissions — Saran Électrique</div>
    <button className="btn btn-p" onClick={handleLogin}>Se connecter avec Google</button>
    {!cfg.crmSpreadsheetId && <div className="muted" style={{fontSize:12,maxWidth:320,textAlign:'center'}}>Astuce: connecte-toi puis va dans Réglages pour indiquer l'ID du Google Sheet du CRM et l'initialiser.</div>}
  </div>;

  const navItems = [
    {id:'pipeline',label:'Pipeline'},
    {id:'contacts',label:'Contacts'},
    {id:'projets',label:'Projets'},
    {id:'agenda',label:'Agenda'},
    {id:'heures',label:'Heures'},
    {id:'factures',label:'Factures'},
    {id:'rappels',label:'Rappels & Suivi'},
    {id:'reglages',label:'Réglages'}
  ];

  return <div>
    <div className="topbar">
      <div className="logo"><span className="dot"></span>SoumissionPro <span className="muted" style={{fontWeight:400,fontSize:11.5,fontFamily:'var(--font-body)'}}>{APP_VERSION}</span></div>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        {data.loading && <div className="muted" style={{fontSize:12}}>Chargement...</div>}
        <button className="btn btn-sm" onClick={handleRefresh} disabled={refreshing} title="Relire les Google Sheets et le calendrier">
          {refreshing ? 'Actualisation...' : '⟳ Refresh'}
        </button>
      </div>
    </div>
    <div className="shell">
      <div className="nav">
        {navItems.map(n=><div key={n.id} className={"nav-item"+(nav===n.id?' active':'')} onClick={()=>setNav(n.id)}>{n.label}</div>)}
      </div>
      <div className="main" style={(nav==='agenda' && isDesktop) ? {maxWidth:'none',width:'100%'} : null}>
        {data.err && <div className="card" style={{borderColor:'var(--danger)',marginBottom:14,color:'var(--danger)'}}>{data.err}</div>}
        {!cfg.crmSpreadsheetId && <div className="card" style={{marginBottom:14}}>Configure d'abord l'ID du Google Sheet du CRM dans Réglages, puis clique "Initialiser les onglets".</div>}
        {nav==='pipeline' && <PipelineView data={data} cfg={cfg} toast={show}/>}
        {nav==='contacts' && <ContactsView data={data} toast={show}/>}
        {nav==='projets' && <ProjetsView data={data} cfg={cfg} toast={show} refreshKey={refreshKey}/>}
        {nav==='agenda' && <AgendaView cfg={cfg} data={data} toast={show} isDesktop={isDesktop} refreshKey={refreshKey}/>}
        {nav==='heures' && <HeuresView cfg={cfg} refreshKey={refreshKey}/>}
        {nav==='factures' && <FacturesView cfg={cfg} refreshKey={refreshKey}/>}
        {nav==='rappels' && <RemindersView data={data} toast={show}/>}
        {nav==='reglages' && <SettingsView cfg={cfg} setCfg={setCfg} toast={show}/>}
      </div>
    </div>
    {toastNode}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
