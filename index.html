                <button className="btn btn-sm btn-p" disabled={busy || !renomme.nom.trim()} onClick={()=>ecrire(ligneJob([j], renomme.nom.trim()), 'Job renommée « '+renomme.nom.trim()+' ».').then(ok=>ok&&setRenomme(null))}>OK</button>
                <button className="btn btn-sm" onClick={()=>setRenomme(null)}>Annuler</button></div>
            : <span style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
                <button className="btn btn-sm" onClick={()=>setRenomme({key:j.key, nom:j.label})}>✏️ Nommer la job</button>
                {retire===j.key
                  ? <span style={{display:'inline-flex',gap:4,alignItems:'center',padding:'2px 6px',border:'1px solid var(--danger)',borderRadius:8,fontSize:12}}>
                      <span style={{color:'var(--danger)'}}>Retirer « {j.label} » de {pers ? c.nom : c.code} ?</span>
                      <button className="btn btn-sm" style={{background:'var(--danger)',color:'#fff',border:'none'}} disabled={busy} onClick={()=>ecrire([{type:'Job retirée', code, nom:j.label,
                        alias:[...new Set([...j.cles].filter(Boolean)), ...[...j.ids].map(i=>'id:'+i)], po:j.po||'', client: pers ? c.nom : '', notes:'Retirée dans le Répertoire'}], '« '+j.label+' » est retirée de '+(pers ? c.nom : c.code)+'.').then(ok=>ok&&setRetire(null))}>Oui, retirer</button>
                      <button className="btn btn-sm" onClick={()=>setRetire(null)}>Non</button></span>
                  : <button className="btn btn-sm" disabled={busy} title={'Cette job n\'a pas rapport avec '+(pers ? c.nom : c.code)+' (ton agenda n\'est pas modifié)'} onClick={()=>setRetire(j.key)}>🗑 Retirer cette job</button>}
              </span>}
          {j.cles.size>1 && <div className="muted" style={{fontSize:11.5,marginBottom:4}}>Écrit dans l'agenda/les achats : {[...j.cles].slice(0,6).join(' · ')}</div>}
          {j.factures.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(f=><RepLigneFacture key={'f'+f.num} f={f}/>)}
          {j.achats.sort((a,b)=>String(b.date||b.recue).localeCompare(String(a.date||a.recue))).map(a=><RepLigneAchat key={'a'+a.row} a={a}/>)}
          {!j.factures.length && !j.achats.length && <div className="muted" style={{fontSize:12}}>Aucune facture ni achat rattaché à cette job.</div>}
        </div>}
      </div>; })}
    {!c.listeJobs.length && <div className="muted" style={{fontSize:13,marginBottom:10}}>Aucune job connue.</div>}
    {(c.retirees||[]).length>0 && <div style={{fontSize:12.5,margin:'2px 0 10px'}}>
      <a href="#" className="muted" onClick={e=>{ e.preventDefault(); setVoirRet(!voirRet); }}>🗑 {c.retirees.length} job{c.retirees.length>1?'s':''} retirée{c.retirees.length>1?'s':''} {voirRet?'▲':'▼'}</a>
      {voirRet && c.retirees.map(r=><div key={r.row} style={{display:'flex',justifyContent:'space-between',gap:8,alignItems:'center',padding:'4px 0',borderBottom:'1px dashed var(--border)'}}>
        <span className="muted">{r.nom}{r.po ? ' · '+r.po : ''}</span>
        <button className="btn btn-sm" disabled={busy} onClick={()=>ecrire([{...r, alias:[...r.alias, ...[...r.ids].map(i=>'id:'+i)], type:'Retiré'}], '« '+r.nom+' » est remise.')}>↩ Remettre</button></div>)}
    </div>}
    {(c.achatsSans||[]).length>0 && <div className="card" style={{marginTop:10}}>
      <b>Achats associés à {c.code} (sans job précise)</b>
      {c.achatsSans.slice().sort((a,b)=>String(b.date||b.recue).localeCompare(String(a.date||a.recue))).map(a=><RepLigneAchat key={'s'+a.row} a={a}/>)}
    </div>}
    {c.facturesSans.length>0 && <div className="card" style={{marginTop:10}}>
      <b>Factures envoyées {pers ? 'sans job précise' : 'à la compagnie'}</b>
      {c.facturesSans.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(f=><RepLigneFacture key={f.num} f={f}/>)}
    </div>}
    {c.soum.length>0 && <div className="card" style={{marginTop:10}}>
      <b>Soumissions et ordres de travail</b>
      {c.soum.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map((s,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap',padding:'4px 0',borderBottom:'1px dashed var(--border)',fontSize:12.5}}>
        <span>📄 <b>#{s.no}</b> <span className="muted">· {cvFmtDay(s.date)} {String(s.date).slice(0,4)}{s.statut ? ' · '+s.statut : ''}</span>{s.extrait ? ' · '+s.extrait : ''}</span>
        <span>{s.montant ? cvMoney(s.montant) : ''}{s.pdf && <> · <a href={repPdf(s.pdf)} target="_blank" rel="noopener" style={{color:'var(--accent)'}}>PDF</a></>}</span>
      </div>)}
    </div>}
  </div>;
}

function RepFicheFournisseur({f, K, toast}){
  const [q,setQ]=useState('');
  const [n,setN]=useState(40);
  const parAn = {}; f.achats.forEach(a=>{ const y = String(a.date||a.recue||'').slice(0,4)||'?'; parAn[y] = (parAn[y]||0) + (a.st||0); });
  const l = f.achats.filter(a=>!q || rechercheOk([a.num, a.ref, a.job, (a.articles||[]).map(x=>x.code+' '+x.desc).join(' ')].join(' '), q));
  return <div>
    <div className="card" style={{marginBottom:12}}>
      <h3 className="fh" style={{margin:'0 0 6px',fontSize:20}}>{f.nom}</h3>
      <div style={{display:'flex',gap:16,flexWrap:'wrap',fontSize:13,marginBottom:8,fontVariantNumeric:'tabular-nums'}}>
        {Object.entries(parAn).sort((a,b)=>b[0].localeCompare(a[0])).map(([y,t])=><span key={y}>{y} : <b>{cvMoney(t)}</b></span>)}
        <span className="muted">{f.achats.length} facture{f.achats.length>1?'s':''} · avant taxes</span>
      </div>
      {K.map[f.nom] && K.map[f.nom].courriel && <div style={{fontSize:13}}>✉️ <a href={'mailto:'+K.map[f.nom].courriel} style={{color:'var(--accent)'}}>{K.map[f.nom].courriel}</a></div>}
      <ContactFournisseur f={f.nom} K={K} toast={toast} onCourriel={()=>{}}/>
    </div>
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:6}}>
        <b>Factures d'achat</b>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="No, référence, job, produit…" style={{flex:'1 1 180px',width:'auto',minWidth:0,padding:'5px 9px',maxWidth:320}}/>
      </div>
      {l.slice(0,n).map(a=><RepLigneAchat key={a.row} a={a} montrerJob/>)}
      {l.length>n && <div style={{textAlign:'center',padding:8}}><button className="btn btn-sm" onClick={()=>setN(n+60)}>Voir plus ({l.length-n})</button></div>}
      {!l.length && <div className="muted" style={{fontSize:12.5}}>Aucune facture.</div>}
    </div>
    {f.docs.length>0 && <div className="card">
      <b>Soumissions, relevés et confirmations</b>
      {f.docs.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map((x,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap',padding:'4px 0',borderBottom:'1px dashed var(--border)',fontSize:12.5}}>
        <span>{x.type} <b>{x.num}</b> <span className="muted">· {cvFmtDay(x.date)} {String(x.date).slice(0,4)}{x.ref ? ' · « '+x.ref+' »' : ''}</span></span>
        <span>{x.total ? cvMoney(x.total) : ''}{x.pdf && <> · <a href={repPdf(x.pdf)} target="_blank" rel="noopener" style={{color:'var(--accent)'}}>PDF</a></>}</span>
      </div>)}
    </div>}
  </div>;
}

// ── App root ──────────────────────────────────────────────────────────────
function App(){
  const [cfg,setCfg]=useState(loadCfg);
  const [ready,setReady]=useState(false);
  const [authed,setAuthed]=useState(false);
  const [nav,setNav]=useState('dashboard');
  const [navKey,setNavKey]=useState(0);   // recliquer sur l'onglet du menu = revenir à son accueil (ex. tous les clients)
  const [initErr,setInitErr]=useState('');
  const [show,toastNode]=useToast();
  const [refreshKey,setRefreshKey]=useState(0);
  const [refreshing,setRefreshing]=useState(false);
  const [navCollapsed,setNavCollapsedState]=useState(()=>{ try{ return localStorage.getItem('crm_nav_collapsed')==='1'; }catch(e){ return false; } });
  // Calendriers actifs — cases à cocher dans la barre du haut pour choisir de
  // voir les événements d'un seul compte (info@saranelectrique / gmail) ou des
  // deux. Persisté, mais toujours au moins un calendrier reste actif.
  const configuredCals = (cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
  const [activeCalsList,setActiveCalsList]=useState(()=>{
    try{ const raw=localStorage.getItem('crm_active_cals'); if(raw){ const arr=JSON.parse(raw); if(Array.isArray(arr) && arr.length) return arr; } }catch(e){}
    return null; // null = pas encore choisi → tous actifs par défaut
  });
  const activeCals = new Set(activeCalsList && activeCalsList.length ? activeCalsList.filter(c=>configuredCals.includes(c)) : configuredCals);
  function toggleCal(email){
    const next = new Set(activeCals);
    if(next.has(email)) next.delete(email); else next.add(email);
    if(next.size===0) return; // toujours garder au moins un calendrier actif
    const arr=[...next];
    setActiveCalsList(arr);
    try{ localStorage.setItem('crm_active_cals', JSON.stringify(arr)); }catch(e){}
  }
  const effectiveCfg = {...cfg, calendarIds: configuredCals.filter(c=>activeCals.has(c)).join(',')};
  useTheme();
  const isDesktop = useIsDesktop();
  const [menuMobile,setMenuMobile]=useState(false);   // v119 : menu à gauche, rétractable, sur téléphone
  function toggleNav(){ const v=!navCollapsed; setNavCollapsedState(v); try{ localStorage.setItem('crm_nav_collapsed', v?'1':'0'); }catch(e){} }

  async function handleRefresh(){
    if(tokenExpired()){ await reconnecter(); return; }
    setRefreshing(true);
    try{ await data.reload(); }catch(e){}
    setRefreshKey(k=>k+1);
    setRefreshing(false);
    show('Données actualisées.','ok');
  }

  const [expired,setExpired]=useState(false);
  useEffect(()=>{
    initGoogle(cfg).then(()=>{ if(restoreToken()) setAuthed(true); setReady(true); }).catch(e=>setInitErr('Erreur d\'initialisation Google: '+apiErrMsg(e)));
  },[]);
  // Surveille l'expiration du jeton (1 h) : au retour sur la page ou toutes les 30 s.
  useEffect(()=>{
    if(!authed) return;
    const verifier = ()=>{ if(tokenExpired()) setExpired(true); };
    const expire = ()=>setExpired(true), neuf = ()=>setExpired(false);
    window.addEventListener('crm-jeton-expire', expire); window.addEventListener('crm-jeton', neuf);
    const id = setInterval(verifier, 30000);
    window.addEventListener('focus', verifier);
    document.addEventListener('visibilitychange', verifier);
    return ()=>{ clearInterval(id); window.removeEventListener('focus', verifier); document.removeEventListener('visibilitychange', verifier);
      window.removeEventListener('crm-jeton-expire', expire); window.removeEventListener('crm-jeton', neuf); };
  },[authed]);
  // Reconnexion (clic = geste de l'utilisateur, donc la fenêtre Google n'est pas bloquée), puis on relit tout.
  async function reconnecter(){
    try{ await requestToken(''); setExpired(false); try{ await data.reload(); }catch(e){} setRefreshKey(k=>k+1); show('Reconnecté.','ok'); }
    catch(e){ show('Reconnexion annulée.','err'); }
  }

  const data = useCrmData(cfg, ready && authed);

  async function handleLogin(){
    try{ await requestToken(); setAuthed(true); setExpired(false); }
    catch(e){ show('Connexion refusée ou annulée.','err'); }
  }

  if(!ready) return <div className="login-screen"><div className="spin"></div>{initErr && <div className="muted">{initErr}</div>}</div>;
  if(!authed) return <div className="login-screen">
    <div className="logo"><span className="dot"></span>SoumissionPro</div>
    <div className="muted" style={{fontSize:11.5,marginTop:-12}}>{APP_VERSION}</div>
    <div className="muted">Gestion de contacts, pipeline de vente et soumissions — Saran Électrique</div>
    <button className="btn btn-p" onClick={handleLogin}>Se connecter avec Google</button>
    {!cfg.crmSpreadsheetId && <div className="muted" style={{fontSize:12,maxWidth:320,textAlign:'center'}}>Astuce: connecte-toi puis va dans Réglages pour indiquer l'ID du Google Sheet du CRM et l'initialiser.</div>}
  </div>;

  const navItems = [
    {id:'dashboard',label:'Tableau de bord'},
    {id:'repertoire',label:'Répertoire'},
    {id:'projets',label:'Projets'},
    {id:'agenda',label:'Agenda'},
    {id:'fournisseurs',label:'Fournisseurs'},
    {id:'courriels',label:'Courriels'},
    {id:'heures',label:'Employés'},
    {id:'factures',label:'Factures'},
    {id:'rappels',label:'Rappels & Suivi'},
    {id:'soumissions',label:'Soumissions'},
    {id:'appel',label:'Appel de service'},
    {id:'commandes',label:'Commandes'},
    {id:'produits',label:'Produits'},
    {id:'stock',label:'Stock'},
    {id:'reglages',label:'Réglages'}
  ];

  return <div>
    <div className="topbar">
      <div style={{display:'flex',alignItems:'center',gap:10}}>{!isDesktop && <button className="btn btn-sm" onClick={()=>setMenuMobile(true)} aria-label="Menu" style={{fontSize:18,padding:'4px 11px'}}>☰</button>}<div className="logo"><span className="dot"></span>SoumissionPro <span className="muted" style={{fontWeight:400,fontSize:11.5,fontFamily:'var(--font-body)'}}>{APP_VERSION}</span></div></div>
      <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
        {configuredCals.length>1 && <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {configuredCals.map(email=>
            <label key={email} className="muted" style={{display:'flex',alignItems:'center',gap:4,fontSize:11,cursor:'pointer'}} title={email}>
              <input type="checkbox" checked={activeCals.has(email)} onChange={()=>toggleCal(email)} style={{width:14,height:14}}/>
              {email.split('@')[0]}
            </label>
          )}
        </div>}
        {data.loading && <div className="muted" style={{fontSize:12}}>Chargement...</div>}
        {isDesktop && <button className="btn btn-sm" onClick={toggleNav} title="Afficher/cacher le menu">{navCollapsed?'☰ Menu':'⟨⟨ Cacher le menu'}</button>}
        <button className="btn btn-sm" onClick={handleRefresh} disabled={refreshing} title="Relire les Google Sheets et le calendrier">
          {refreshing ? 'Actualisation...' : '⟳ Refresh'}
        </button>
      </div>
    </div>
    {expired && <div style={{background:'rgba(210,153,34,0.15)',borderBottom:'1px solid var(--warning)',padding:'10px 16px',display:'flex',gap:12,alignItems:'center',justifyContent:'center',flexWrap:'wrap',fontSize:13.5}}>
      <span>⏱ Ta connexion Google a expiré (elle dure 1 h). Rien n'est perdu.</span>
      <button className="btn btn-sm btn-p" onClick={reconnecter}>Reconnecter</button>
    </div>}
    <div className="shell">
      {!isDesktop && menuMobile && <div className="nav-fond" onClick={()=>setMenuMobile(false)}/>}
      <div className={'nav'+(!isDesktop && menuMobile ? ' ouvert' : '')} style={(isDesktop && navCollapsed) ? {width:0,minWidth:0,padding:0,overflow:'hidden',border:'none'} : null}>
        {!isDesktop && <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'2px 4px 10px'}}><b className="fh" style={{fontSize:15}}>Menu</b><button className="btn btn-sm" onClick={()=>setMenuMobile(false)} aria-label="Fermer">✕</button></div>}
        {navItems.map(n=><div key={n.id} className={"nav-item"+(nav===n.id?' active':'')} onClick={()=>{ if(nav===n.id) setNavKey(k=>k+1); setNav(n.id); setMenuMobile(false); window.scrollTo(0,0); }}>{n.label}</div>)}
      </div>
      <div className="main" style={(nav==='agenda' && isDesktop) ? {maxWidth:'none',width:'100%'} : null}>
        {data.err && <div className="card" style={{borderColor:'var(--danger)',marginBottom:14,color:'var(--danger)'}}>{data.err}</div>}
        {!cfg.crmSpreadsheetId && <div className="card" style={{marginBottom:14}}>Configure d'abord l'ID du Google Sheet du CRM dans Réglages, puis clique "Initialiser les onglets".</div>}
        {nav==='dashboard' && <TableauDeBordView cfg={effectiveCfg} data={data} toast={show} refreshKey={refreshKey} onNavigate={setNav}/>}
        {(nav==='repertoire' || nav==='clients') && <RepertoireView key={'r'+navKey} cfg={effectiveCfg} refreshKey={refreshKey} toast={show} isDesktop={isDesktop} contacts={data.contacts}/>}
        {nav==='courriels' && <CourrielsView cfg={effectiveCfg} refreshKey={refreshKey}/>}
        {nav==='fournisseurs' && <FournisseursView key={'f'+navKey} cfg={effectiveCfg} refreshKey={refreshKey} isDesktop={isDesktop}/>}
        {nav==='contacts' && <RepertoireView key={'rc'+navKey} cfg={effectiveCfg} refreshKey={refreshKey} toast={show} isDesktop={isDesktop} contacts={data.contacts}/>}
        {nav==='projets' && <ProjetsView key={'p'+navKey} data={data} cfg={effectiveCfg} toast={show} refreshKey={refreshKey}/>}
        {nav==='agenda' && <AgendaView cfg={effectiveCfg} data={data} toast={show} isDesktop={isDesktop} refreshKey={refreshKey}/>}
        {nav==='heures' && <HeuresView cfg={cfg} refreshKey={refreshKey}/>}
        {nav==='factures' && <FacturesView key={'x'+navKey} cfg={cfg} cfgRep={effectiveCfg} refreshKey={refreshKey} contacts={data.contacts}/>}
        {nav==='rappels' && <RemindersView data={data} toast={show}/>}
        {nav==='soumissions' && <SoumissionsView key={'s'+navKey} cfg={effectiveCfg} data={data} toast={show} refreshKey={refreshKey} onNavigate={setNav}/>}
        {nav==='appel' && <AppelServiceView key={'a'+navKey} cfg={effectiveCfg} toast={show}/>}
        {nav==='commandes' && <CommandesView key={'bc'+navKey} cfg={effectiveCfg} toast={show} refreshKey={refreshKey}/>}
        {nav==='produits' && <ProduitsView key={'pr'+navKey} cfg={effectiveCfg} toast={show}/>}
        {nav==='stock' && <StockView data={data}/>}
        {nav==='reglages' && <SettingsView cfg={cfg} setCfg={setCfg} toast={show}/>}
      </div>
    </div>
    {toastNode}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
