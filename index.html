    let liste=[], existe=false, recues=[];
    try{
      const r = await lireCache(id, 'Soumissions!A1:S', force);
      existe = true;
      liste = (r.result.values||[]).slice(1).map((x,i)=>({row:i+2, cle:x[0]||'', type:x[1]||'', date:String(x[2]||'').slice(0,10), no:x[3]||'', client:x[4]||'', courriel:(x[5]||'').toLowerCase(),
        sujet:x[6]||'', extrait:x[7]||'', montant:cvNum(x[8]), pdf:x[9]||'', lien:x[10]||'', reponse:x[11]||'', statut:x[12]||'', le:x[13]||'', note:x[14]||'', photos:x[15]||'', infos:(()=>{ try{ return x[16] ? JSON.parse(x[16]) : null; }catch(e){ return null; } })(), typeProjet:x[17]||'', accuse:x[18]||''})).filter(x=>x.cle);
    }catch(e){ existe = false; }
    try{
      if(idA){ const d = await lireCache(idA, 'Documents!A1:L', force);
        const vus = new Set();
        recues = (d.result.values||[]).slice(1)
          .filter(r=>r[0] && r[1]==='Soumission' && !/gagnon/i.test(r[0]))          // Groupe Gagnon = portes et fenêtres (perso)
          .filter(r=>{ const k = r[6] || (r[0]+'|'+r[2]+'|'+r[3]); if(vus.has(k)) return false; vus.add(k); return true; })
          .map(r=>({fournisseur:r[0], num:r[2]||'', date:r[3]||'', ref:soumRefOk(r[4]||''), total:cvNum(r[5]), pdf:r[6]||'', fichier:r[7]||'', articles:r[11]||''})); }
    }catch(e){}
    setEtat({lu:true, existe, liste, recues, err:''});
  },[id, idA]);
  useEffect(()=>{ lire(); },[lire, refreshKey]);
  // Statut / note d'une ligne (colonnes M–O seulement).
  const marquer = async (s, statut, note)=>{
    const le = new Date().toLocaleString('fr-CA');
    setEtat(e=>({...e, liste:e.liste.map(x=>x.cle===s.cle ? {...x, statut, le, note: note ?? x.note} : x)}));
    await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Soumissions!M'+s.row+':O'+s.row, valueInputOption:'RAW', resource:{values:[[statut, le, note ?? s.note]]}});
  };
  // Dossier de photos créé par le CRM (colonne P).
  const dossierPhotos = async (s, d)=>{
    setEtat(e=>({...e, liste:e.liste.map(x=>x.cle===s.cle ? {...x, photos:d} : x)}));
    await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Soumissions!P1', valueInputOption:'RAW', resource:{values:[['Photos']]}});
    await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Soumissions!P'+s.row, valueInputOption:'RAW', resource:{values:[[d]]}});
  };
  // Type de projet choisi par William (R) et accusé de réception envoyé (S) : colonnes du CRM seulement.
  const majCol = async (s, col, val, champ)=>{
    setEtat(e=>({...e, liste:e.liste.map(x=>x.cle===s.cle ? {...x, [champ]:val} : x)}));
    await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Soumissions!Q1:S1', valueInputOption:'RAW', resource:{values:[['Infos demande','Type de projet','Accusé envoyé']]}});
    await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Soumissions!'+col+s.row, valueInputOption:'RAW', resource:{values:[[val]]}});
  };
  // Soumission à faire ajoutée à la main.
  const ajouter = async (texte, details, photos)=>{
    if(!etat.existe) await ensureSheetsExist(id, [{name:'Soumissions', headers:SOUM_ONGLET_ENTETE}]);
    const ligne = ['M-'+Date.now(), 'À faire', cvDay(new Date().toISOString()), '', texte, '', texte, details||'', '', '', '', '', '', '', '', photos||''];
    await sheetsAppendRow(id, 'Soumissions', ligne);
    await lire(true);
  };
  return {...etat, marquer, ajouter, dossierPhotos, majCol, relire:()=>lire(true)};
}

// ── Dépôt de photos dans Drive (permission drive.file : le CRM ne voit/modifie que ce qu'il a créé lui-même).
const PHOTOS_RACINE = 'Saran CRM — Photos soumissions';
async function driveFetch(url, opts){
  const tok = window.gapi.client.getToken() && window.gapi.client.getToken().access_token;
  const r = await fetch(url, {...(opts||{}), headers:{...((opts&&opts.headers)||{}), Authorization:'Bearer '+tok}});
  if(!r.ok){ const t = await r.text().catch(()=>''); throw new Error((r.status===403?'Permission Drive manquante — ':'Drive '+r.status+' ')+t.slice(0,120)); }
  return r.json();
}
async function driveDossier(nom, parent){
  const q = encodeURIComponent("name='"+nom.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false and '"+(parent||'root')+"' in parents");
  const l = await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&pageSize=1');
  if(l.files && l.files[0]) return l.files[0].id;
  const c = await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:nom, mimeType:'application/vnd.google-apps.folder', parents:[parent||'root']})});
  return c.id;
}
// Réduit une photo (max 1600 px, JPEG) pour qu'elle monte vite du chantier ; sinon le fichier tel quel.
async function reduirePhoto(f){
  if(!/^image\/(jpeg|png|webp)/i.test(f.type)) return f;
  try{
    const img = await createImageBitmap(f);
    const k = Math.min(1, 1600/Math.max(img.width, img.height));
    if(k>=1 && f.size<1.5e6) return f;
    const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const b = await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    return b ? new File([b], f.name.replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}) : f;
  }catch(e){ return f; }
}
async function driveDeposer(fichier, dossier){
  const f = await reduirePhoto(fichier);
  const limite = 'crm'+Date.now();
  const corps = new Blob(['--'+limite+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:f.name||'photo.jpg', parents:[dossier]})+
    '\r\n--'+limite+'\r\nContent-Type: '+(f.type||'application/octet-stream')+'\r\n\r\n', f, '\r\n--'+limite+'--']);
  return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+limite}, body:corps});
}
// Bouton « 📷 Photos » : choisit/prend des photos et les dépose dans le dossier de la soumission.
// La 1re fois, Google demande la permission (bouton « Autoriser »), une seule fois.
function SoumDeposer({titre, dossier, onDossier, toast, libelle}){
  const [etat,setEtat]=useState('');
  const [ok,setOk]=useState(peutDeposer());
  const ref = useRef(null);
  const autoriser = async()=>{ try{ await requestToken('consent'); setOk(peutDeposer()); if(!peutDeposer()) toast && toast('Permission refusée — coche « fichiers Drive » dans la fenêtre Google.'); }catch(e){ toast && toast('Connexion annulée'); } };
  const deposer = async(files)=>{
    if(!files || !files.length) return;
    try{
      let d = dossier;
      if(!d){ setEtat('Dossier…'); d = await driveDossier(titre, await driveDossier(PHOTOS_RACINE)); await onDossier(d); }
      for(let i=0;i<files.length;i++){ setEtat('Photo '+(i+1)+'/'+files.length+'…'); await driveDeposer(files[i], d); }
      delete SOUM_PHOTOS[d];
      toast && toast(files.length+' photo'+(files.length>1?'s':'')+' ajoutée'+(files.length>1?'s':''));
      setEtat(''); onDossier(d, true);
    }catch(e){ setEtat(''); toast && toast('Erreur photos : '+e.message); }
  };
  if(!ok) return <button className="btn btn-sm" onClick={autoriser} title="Une seule fois : permet au CRM de déposer des photos dans ton Drive">🔓 Autoriser les photos</button>;
  return <>
    <input ref={ref} type="file" accept="image/*,application/pdf" multiple style={{display:'none'}} onChange={e=>{ const f=[...e.target.files]; e.target.value=''; deposer(f); }}/>
    <button className="btn btn-sm" disabled={!!etat} onClick={()=>ref.current && ref.current.click()}>{etat || libelle || '📷 Photos'}</button>
  </>;
}

// Photos d'une note « Soumission … » (dossier Drive gardé par soumissions.gs en colonne J).
const SOUM_PHOTOS = {};
function SoumPhotos({dossier, tick}){
  const [fichiers,setFichiers]=useState(SOUM_PHOTOS[dossier]||null);
  useEffect(()=>{
    if(!dossier || SOUM_PHOTOS[dossier]) return;
    let vivant=true;
    (async()=>{ try{
      const tok = window.gapi.client.getToken() && window.gapi.client.getToken().access_token;
      const q = encodeURIComponent("'"+dossier+"' in parents and trashed=false");
      const r = await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,mimeType,thumbnailLink,webViewLink)&pageSize=50&supportsAllDrives=true&includeItemsFromAllDrives=true', {headers:{Authorization:'Bearer '+tok}});
      const f = r.ok ? ((await r.json()).files||[]) : [];
      SOUM_PHOTOS[dossier]=f; if(vivant) setFichiers(f);
    }catch(e){ if(vivant) setFichiers([]); } })();
    return ()=>{vivant=false};
  },[dossier, tick]);
  if(!dossier) return null;
  return <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginTop:6}}>
    {(fichiers||[]).slice(0,8).map(f=><a key={f.id} href={f.webViewLink} target="_blank" rel="noopener" title={f.name}>
      {f.thumbnailLink ? <img src={f.thumbnailLink} alt={f.name} referrerPolicy="no-referrer" style={{width:64,height:64,objectFit:'cover',borderRadius:6,border:'1px solid var(--border2)'}}/>
        : <span className="badge" style={{background:'var(--bg3)'}}>📄 {f.name.slice(0,20)}</span>}
    </a>)}
    <a href={'https://drive.google.com/drive/folders/'+dossier} target="_blank" rel="noopener" style={{color:'var(--accent)',fontSize:12.5}}>📷 {fichiers ? fichiers.length+' fichier'+(fichiers.length>1?'s':'') : 'Photos'} ↗</a>
  </div>;
}
// Texte d'une note : 3 lignes, puis « Voir tout ».
function SoumNote({txt}){
  const [ouvert,setOuvert]=useState(false);
  if(!txt) return null;
  const long = txt.length>220 || (txt.match(/\n/g)||[]).length>2;
  return <div style={{marginTop:4}}>
    <div style={{fontSize:12.5,whiteSpace:'pre-wrap',...(ouvert||!long ? {} : {display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'})}}>{txt}</div>
    {long && <button className="btn btn-sm" style={{marginTop:3,fontSize:11.5,padding:'1px 8px'}} onClick={()=>setOuvert(!ouvert)}>{ouvert?'▴ Moins':'▾ Voir tout'}</button>}
  </div>;
}

function SoumissionsView({cfg, data, toast, refreshKey, onNavigate}){
  const S = useSoumissions(cfg, refreshKey);
  const [onglet,setOnglet]=useState('afaire');
  const [voirFinies,setVoirFinies]=useState(false);
  const [filtre,setFiltre]=useState('');
  const [q,setQ]=useState('');
  const [nouveau,setNouveau]=useState(null);
  const [details,setDetails]=useState('');
  const [fichiers,setFichiers]=useState([]);
  const [tick,setTick]=useState(0);
  const [ouverte,setOuverte]=useState('');
  const refFichiers = useRef(null);
  const [occupe,setOccupe]=useState('');
  const [prepKey,setPrepKey]=useState(0);
  const [filtreAF,setFiltreAF]=useState('');
  const aFaire = S.liste.filter(s=>s.type==='À faire').sort((a,b)=>b.date.localeCompare(a.date));
  const envoyees = S.liste.filter(s=>s.type==='Envoyée').sort((a,b)=>b.date.localeCompare(a.date) || (+b.no||0)-(+a.no||0));
  const ouvertes = aFaire.filter(s=>!SOUM_FINI.includes(s.statut));
  // Envoyée : à classer (rien de coché) -> ⏳ en attente (on attend la réponse du client) -> acceptée ou refusée.
  const etatEnv = s => s.statut==='Acceptée' ? 'acceptee' : s.statut==='Refusée' ? 'refusee' : s.statut==='En attente' ? 'attente' : 'aclasser';
  const cherche = (txt)=> !q || cvNorm(txt).includes(cvNorm(q));
  const action = async (s, statut, note)=>{
    setOccupe(s.cle);
    try{ await S.marquer(s, statut, note); toast && toast(statut ? 'Soumission : '+statut.toLowerCase() : 'Remise à faire');
      if(statut==='Acceptée') soumAccepteeVersEnAttente(cfg, s, toast); }
    catch(e){ toast && toast('Erreur : '+apiErrMsg(e)); S.relire(); }
    setOccupe('');
  };
  const lienGmail = s => s.lien && <a href={s.lien} target="_blank" rel="noopener" style={{color:'var(--accent)',fontSize:12.5,whiteSpace:'nowrap'}}>Courriel ↗</a>;
  const lienPdf = id => id && <a href={'https://drive.google.com/file/d/'+id+'/view'} target="_blank" rel="noopener" style={{color:'var(--accent)',fontSize:12.5,whiteSpace:'nowrap'}}>PDF ↗</a>;
  const pill = (k, label, n, cur, set) => <button key={k} className={'btn btn-sm'+(cur===k?' btn-p':'')} onClick={()=>set(k)}>{label}{n!=null && <> ({n})</>}</button>;
  const vieux = (data && data.soums) || [];

  // Infos d'une demande : lues par soumissions.gs (colonne Q), sinon ce qu'on a ; type = le tien (R), sinon deviné.
  const infosDe = s => { const i = s.infos || {};
    return {nom:i.nom || s.client || '', tel:i.tel || '', courriel:(i.courriel || s.courriel || '').toLowerCase(), adresse:i.adresse || '', travaux:i.travaux || s.extrait || '', demande:i.demande || '',
      type: s.typeProjet || i.type || soumTypeDevine([s.sujet, i.travaux || s.extrait].join(' '))}; };
  const preparer = s => { const i = infosDe(s), sujet = (s.sujet||'').replace(/^\s*(re|tr|fwd?)\s*:\s*/i,'').replace(/^\s*soumission\s*[-:–]?\s*/i,'').replace(/^Contact depuis votre site\s*:\s*/i,'');
    DOC_PREFILL = {type:'Soumission', typeProjet:i.type, origine:s.cle, nom:i.nom, tel:i.tel, courriel:i.courriel, adresse:i.adresse,
      titre: i.type ? i.type+(i.adresse ? ' — '+i.adresse.split(',')[0] : '') : sujet, travaux:i.travaux, dossier:s.pdf||s.photos||''};
    setPrepKey(k=>k+1); setOnglet('preparer'); window.scrollTo(0,0); };
  const accuse = async s => { const i = infosDe(s); if(!i.courriel){ toast && toast('Pas de courriel pour ce client'); return; }
    const formulaire = /linkeo|contact depuis votre site/i.test(s.sujet+' '+s.courriel) || (s.infos && s.infos.formulaire);
    const sujet = formulaire ? 'Votre demande de soumission — Saran Électrique' : 'Re: '+(s.sujet||'').replace(/^\s*(re|tr|fwd?)\s*:\s*/i,'');
    const corps = 'Bonjour'+(i.nom ? ' '+i.nom.split(' ')[0] : '')+',\n\nNous avons bien reçu votre demande de soumission et nous vous revenons très bientôt.\n\nCordialement,\n\nSaran Électrique inc.\nWilliam Saran, Président\n(438) 490-3412\ninfo@saranelectrique.com';
    window.open('https://mail.google.com/mail/?authuser=info@saranelectrique.com&view=cm&fs=1&to='+encodeURIComponent(i.courriel)+'&su='+encodeURIComponent(sujet)+'&body='+encodeURIComponent(corps), '_blank');
    try{ await S.majCol(s, 'S', cvDay(new Date().toISOString()), 'accuse'); }catch(e){} };
  const choisirType = async (s, t) => { try{ await S.majCol(s, 'R', t, 'typeProjet'); }catch(e){ toast && toast('Erreur : '+apiErrMsg(e)); } };

  // Devis envoyés à la même personne après la demande : proposés (jamais cochés tout seuls).
  const proposes = s => !s.courriel ? [] : envoyees.filter(e=>e.courriel===s.courriel && e.date>=s.date && e.no && !aFaire.some(x=>x!==s && x.note==='Devis #'+e.no)).slice(0,3);

  const CarteAFaire = ({s})=>{
    const j = soumJours(s.date), fini = SOUM_FINI.includes(s.statut), i = infosDe(s), attente = s.statut==='En attente';
    return <div style={{padding:'10px 0',borderBottom:'1px solid var(--border)',opacity:fini?.6:1}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
        <div style={{minWidth:0,flex:'1 1 220px'}}>
          <div onClick={()=>setOuverte(o=>o===s.cle?'':s.cle)} style={{fontWeight:700,fontSize:14,cursor:'pointer'}}>{ouverte===s.cle?'▾ ':'▸ '}{s.client || s.sujet}</div>
          {s.client && s.sujet && !cvNorm(s.sujet).includes(cvNorm(s.client)) && <div><SoumRef txt={s.sujet.replace(/^\s*(re|tr|fwd?)\s*:\s*/i,'')}/></div>}
          <div className="muted" style={{fontSize:11.5}}>{cvFmtDay(s.date)}{j!=null && j>0 && <> · il y a {j} jour{j>1?'s':''}</>}{s.cle.startsWith('M-') && <> · ajoutée à la main</>}</div>
          {(i.tel || i.courriel || i.adresse) && <div style={{fontSize:12,marginTop:2,display:'flex',gap:10,flexWrap:'wrap'}}>
            {i.tel && <a href={'tel:'+i.tel.replace(/[^\d+]/g,'')} style={{color:'var(--text)'}}>📞 {i.tel}</a>}
            {i.courriel && <span>✉ {i.courriel}</span>}
            {i.adresse && <span>📍 {i.adresse}</span>}
          </div>}
          {!fini && <div style={{marginTop:4,display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
            <select value={i.type} onChange={e=>choisirType(s, e.target.value)} style={{fontSize:12,padding:'2px 4px'}} title={s.typeProjet ? 'Type choisi par toi' : 'Type deviné — change-le au besoin'}>
              <option value="">Type de projet…</option>{TYPES_PROJET.map(t=><option key={t}>{t}</option>)}</select>
            {i.type && !s.typeProjet && <span className="muted" style={{fontSize:11}}>(deviné)</span>}
            {attente && <span className="badge" style={{background:'var(--bg3)'}}>⏳ En attente{s.note ? ' · '+s.note : ''}</span>}
            {s.accuse && <span className="muted" style={{fontSize:11.5}}>✉ accusé envoyé le {cvFmtDay(s.accuse)}</span>}
          </div>}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'flex-start',flexWrap:'wrap'}}>
          {lienGmail(s)}
          {!fini ? <>
            <button className="btn btn-sm btn-p" onClick={()=>preparer(s)} title="Ouvre la soumission déjà remplie (client, téléphone, courriel, adresse, travaux)">📝 Faire la soumission</button>
            {i.courriel && !s.accuse && <button className="btn btn-sm" onClick={()=>accuse(s)} title="« Nous avons bien reçu votre demande… » — Gmail s'ouvre, tu n'as qu'à envoyer">✉️ Accusé de réception</button>}
            <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s, attente ? '' : 'En attente', s.note)} title={attente ? 'Remettre à faire' : 'En attente (ex. visite à faire, info du client)'}>{attente ? '↩ Reprendre' : '⏳ En attente'}</button>
            <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s,'Faite')} style={{borderColor:'var(--green, #2e9e5b)',color:'var(--green, #2e9e5b)'}}>✓ Faite</button>
            <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s, s.cle.startsWith('M-')?'Annulée':'Ignorée')} title="Annulée, ou ce n'était pas une soumission à faire">✕</button>
          </> : <>
            <span className="badge" style={{background:'var(--bg3)'}}>{s.statut}{s.note && ' · '+s.note}</span>
            <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s,'', '')}>↩</button>
          </>}
        </div>
      </div>
      {ouverte!==s.cle ? (s.extrait && <div className="muted" onClick={()=>setOuverte(s.cle)} style={{fontSize:12,marginTop:3,cursor:'pointer',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.extrait.split('\n')[0]}{(s.pdf||s.photos) ? '  · 📎 PDF / photos' : ''}</div>) : <>
      <SoumNote txt={s.extrait}/>
      {s.pdf && <SoumPhotos dossier={s.pdf}/>}
      {s.photos && <SoumPhotos dossier={s.photos} tick={tick}/>}
      {!s.extrait && !s.pdf && !s.photos && <div className="muted" style={{fontSize:12,marginTop:4}}>Pas de note. Ouvre le courriel ↗ ou ajoute des photos.</div>}
      </>}
      {!fini && ouverte===s.cle && <div style={{marginTop:6}}><SoumDeposer titre={(s.client||s.sujet||'Soumission').slice(0,60)+' ('+s.date+')'} dossier={s.photos} toast={toast}
        onDossier={async(d, fin)=>{ if(fin) setTick(t=>t+1); else await S.dossierPhotos(s, d); }}/></div>}
      {s.reponse && <div className="muted" style={{fontSize:11.5,marginTop:3}}>↪ {s.reponse}</div>}
      {!fini && proposes(s).map(e=><div key={e.cle} style={{marginTop:6,fontSize:12.5,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',background:'var(--bg3)',padding:'5px 8px',borderRadius:8}}>
        <span>📤 Devis <b>#{e.no}</b> envoyé à cette personne le {cvFmtDay(e.date)}{e.montant!=null && <> · {cvMoney(e.montant)}</>} — c'est celle-là ?</span>
        <button className="btn btn-sm btn-p" disabled={occupe===s.cle} onClick={()=>action(s,'Faite','Devis #'+e.no)}>✓ Oui, faite</button>
      </div>)}
    </div>;
  };

  const CarteEnvoyee = ({s})=>{
    const st = etatEnv(s);
    return <div style={{padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
        <div style={{minWidth:0,flex:'1 1 220px'}}>
          <div style={{fontSize:14}}>{s.no ? <b>#{s.no} </b> : null}<b>{s.client}</b>{s.montant!=null && <> · <b>{cvMoney(s.montant)}</b> <span className="muted" style={{fontSize:11}}>avant taxes</span></>}</div>
          {s.extrait ? <div><SoumRef txt={s.extrait.slice(0,120)}/></div> : (!s.no && s.sujet && <div className="muted" style={{fontSize:12}}>{s.sujet}</div>)}
          <div className="muted" style={{fontSize:11.5}}>Envoyée le {cvFmtDay(s.date)}{s.courriel && <> · {s.courriel}</>}{(st==='attente'||st==='aclasser') && soumJours(s.date)>0 && <> · il y a {soumJours(s.date)} jours</>}</div>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'flex-start',flexWrap:'wrap'}}>
          {lienPdf(s.pdf)}{lienGmail(s)}
          {st==='aclasser' && <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s,'En attente')} title="Envoyée, j'attends la réponse du client">⏳ En attente</button>}
          {(st==='aclasser' || st==='attente') ? <>
            <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s,'Acceptée')} style={{borderColor:'var(--green, #2e9e5b)',color:'var(--green, #2e9e5b)'}}>✓ Acceptée</button>
            <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s,'Refusée')}>✕ Refusée</button>
            {st==='attente' && <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s,'')} title="Remettre « à classer »">↩</button>}
          </> : <>
            <span className="badge" style={{background: st==='acceptee' ? 'var(--green, #2e9e5b)' : 'var(--bg3)', color: st==='acceptee' ? '#fff' : undefined}}>{s.statut}</span>
            <button className="btn btn-sm" disabled={occupe===s.cle} onClick={()=>action(s,'En attente')} title="Remettre en attente">↩</button>
          </>}
        </div>
      </div>
      {s.reponse && <div style={{fontSize:12.5,marginTop:4,color:'var(--accent)'}}>💬 Le client a répondu le {/^\d{4}-\d{2}-\d{2}/.test(s.reponse) ? cvFmtDay(s.reponse.slice(0,10))+s.reponse.slice(10) : s.reponse}</div>}
    </div>;
  };

  const listeAFaire = (voirFinies ? aFaire : ouvertes).filter(s=>cherche([s.client,s.sujet,s.extrait,s.courriel,(s.infos||{}).adresse,(s.infos||{}).tel].join(' ')))
    .filter(s=>!filtreAF || (filtreAF==='attente' ? s.statut==='En attente' : filtreAF==='nouvelles' ? s.statut!=='En attente' : infosDe(s).type===filtreAF));
  const typesAF = [...new Set(ouvertes.map(s=>infosDe(s).type).filter(Boolean))];
  const filtreEnv = filtre || (envoyees.some(s=>etatEnv(s)==='aclasser') ? 'aclasser' : 'attente');
  const listeEnv = envoyees.filter(s=>(filtreEnv==='tout' || etatEnv(s)===filtreEnv) && cherche([s.no,s.client,s.extrait,s.courriel].join(' ')));
  // Reçues : documents des fournisseurs (Achats) + ce qu'Éclairage Saran envoie par courriel (lignes « Reçue »).
  const recuesTout = [...S.recues, ...S.liste.filter(s=>s.type==='Reçue').map(s=>({fournisseur:s.client||'Éclairage Saran', num:'', date:s.date, ref:s.sujet, total:s.montant, pdf:s.pdf, fichier:s.extrait, lien:s.lien}))];
  const recues = recuesTout.filter(d=>cherche([d.fournisseur,d.num,d.ref,d.fichier].join(' '))).sort((a,b)=>b.date.localeCompare(a.date));
  const nEnv = k => envoyees.filter(s=>etatEnv(s)===k).length;
  const totalAttente = envoyees.filter(s=>etatEnv(s)==='attente').reduce((t,s)=>t+(s.montant||0),0);

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>
      <h2 className="fh" style={{margin:0,fontSize:20}}>Soumissions</h2>
      <button className="btn btn-sm" onClick={()=>S.relire()}>⟳</button>
    </div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      {pill('afaire','📝 À faire',ouvertes.length,onglet,setOnglet)}
      {pill('envoyees','📤 Envoyées',envoyees.filter(s=>['aclasser','attente'].includes(etatEnv(s))).length,onglet,setOnglet)}
      {pill('recues','📥 Reçues des fournisseurs',recuesTout.length,onglet,setOnglet)}
      {pill('preparer','✏️ Préparer une soumission',null,onglet,k=>{ setOnglet(k); })}
    </div>
    {onglet==='preparer' && <AppelServiceView key={'prep'+prepKey} cfg={cfg} toast={toast} mode="soumission" onEnvoye={doc=>{
      const s = doc.origine && S.liste.find(x=>x.cle===doc.origine);
      if(s) S.marquer(s, 'Faite', 'Soumission '+doc.numero).catch(()=>{});
      setTimeout(()=>S.relire(), 1500); }}/>}
    {onglet!=='preparer' && <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Chercher (client, adresse, numéro…)" style={{width:'100%',boxSizing:'border-box',marginBottom:10}}/>}
    {!S.lu && <div className="muted">Chargement…</div>}
    {S.err && <div className="card" style={{color:'var(--red, #c0392b)'}}>{S.err}</div>}
    {S.lu && !S.existe && onglet!=='recues' && <div className="card muted" style={{fontSize:12.5,marginBottom:10}}>L'onglet « Soumissions » du registre des jobs n'existe pas encore. Il sera rempli tout seul quand le script <b>soumissions.gs</b> sera installé dans La mémoire. Tu peux quand même en ajouter à la main.</div>}

    {onglet==='afaire' && <div className="card">
      <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:4}}>
        <button className="btn btn-sm btn-p" onClick={()=>setNouveau(nouveau===null?'':null)}>+ Ajouter</button>
        <button className="btn btn-sm" onClick={()=>{ DOC_PREFILL = null; setPrepKey(k=>k+1); setOnglet('preparer'); }}>✏️ Nouvelle soumission</button>
        {pill('','Toutes',null,filtreAF,setFiltreAF)}
        {pill('nouvelles','Nouvelles',ouvertes.filter(s=>s.statut!=='En attente').length,filtreAF,setFiltreAF)}
        {pill('attente','⏳ En attente',ouvertes.filter(s=>s.statut==='En attente').length,filtreAF,setFiltreAF)}
        {typesAF.length>1 && <select value={TYPES_PROJET.includes(filtreAF)?filtreAF:''} onChange={e=>setFiltreAF(e.target.value)} style={{fontSize:12}}><option value="">Tous les types</option>{typesAF.map(t=><option key={t}>{t}</option>)}</select>}
        <label className="muted" style={{fontSize:12,display:'flex',gap:4,alignItems:'center',marginLeft:'auto'}}><input type="checkbox" checked={voirFinies} onChange={e=>setVoirFinies(e.target.checked)}/> Voir les terminées ({aFaire.length-ouvertes.length})</label>
      </div>
      {nouveau!==null && <div style={{margin:'6px 0',display:'grid',gap:6}}>
        <input autoFocus value={nouveau} onChange={e=>setNouveau(e.target.value)} placeholder="Pour qui / où — ex. : Borne — Jean Tremblay, 12 rue X"/>
        <textarea value={details} onChange={e=>setDetails(e.target.value)} rows={4} placeholder={"Ce qu'il faut faire et le stock nécessaire (une ligne par article)…"} style={{resize:'vertical',fontFamily:'inherit'}}/>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          {peutDeposer() ? <>
            <input ref={refFichiers} type="file" accept="image/*,application/pdf" multiple style={{display:'none'}} onChange={e=>{ setFichiers(f=>[...f, ...e.target.files]); e.target.value=''; }}/>
            <button className="btn btn-sm" onClick={()=>refFichiers.current && refFichiers.current.click()}>📷 Photos{fichiers.length ? ' ('+fichiers.length+')' : ''}</button>
            {fichiers.length>0 && <button className="btn btn-sm" onClick={()=>setFichiers([])} title="Enlever les photos choisies">✕</button>}
          </> : <button className="btn btn-sm" title="Une seule fois : permet au CRM de déposer des photos dans ton Drive"
              onClick={async()=>{ try{ await requestToken('consent'); }catch(e){} setTick(t=>t+1); if(!peutDeposer()) toast && toast('Permission refusée — coche « fichiers Drive » dans la fenêtre Google.'); }}>🔓 Autoriser les photos</button>}
          <button className="btn btn-sm btn-p" disabled={!nouveau.trim() || occupe==='+'} onClick={async()=>{
            setOccupe('+');
            try{
              let d = '';
              if(fichiers.length){
                d = await driveDossier(nouveau.trim().slice(0,60)+' ('+cvDay(new Date().toISOString())+')', await driveDossier(PHOTOS_RACINE));
                for(let i=0;i<fichiers.length;i++){ toast && toast('Photo '+(i+1)+'/'+fichiers.length+'…'); await driveDeposer(fichiers[i], d); }
              }
              await S.ajouter(nouveau.trim(), details.trim(), d);
              setNouveau(null); setDetails(''); setFichiers([]); toast && toast('Soumission à faire ajoutée');
            }catch(e){ toast && toast('Erreur : '+(e.message||apiErrMsg(e))); }
            setOccupe('');
          }}>{occupe==='+' ? 'Ajout…' : 'Ajouter'}</button>
          <button className="btn btn-sm" onClick={()=>{ setNouveau(null); setDetails(''); setFichiers([]); }}>Annuler</button>
        </div>
      </div>}
      {listeAFaire.map(s=><React.Fragment key={s.cle}>{CarteAFaire({s})}</React.Fragment>)}
      {S.lu && !listeAFaire.length && <div className="muted" style={{fontSize:13,padding:'8px 0'}}>{ouvertes.length||q ? 'Aucune ne correspond.' : 'Rien à faire 👍'}</div>}
    </div>}

    {onglet==='envoyees' && <div className="card">
      <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:4}}>

const PROFILS = ['Base','Profit 5%','Profit 10%','Profit 15%','Profit 20%','Profit 25%','Profit 30%','Profit 35%','Profit 40%','Profit 45%','Profit 50%'];
function profitPct(cout, profil){
  if(profil && profil!=='Base'){ const p = Number((profil.match(/\d+/)||[])[0]); if(p) return p; }
  return (POLITIQUE_BASE.find(([max])=>cout < max)||[0,20])[1];

function prixPolitique(cout, profil){ if(cout==null || !(cout>0)) return null; return arrondi(cout / (1 - profitPct(cout, profil)/100)); }
// Jetons d'un code de facture : « NMD2C14X150 NMD2C14 », « MO SA01 », « 125V T5825-W » (les 125V, 4-HOLES… ne sont pas des codes).
const codeJetons = s => String(s||'').split(/[\s,]+/).map(codeNorm).filter(t=>t.length>=4 && !/^\d+(V|KA|W|A)$/.test(t) && !/HOLES$/.test(t) && !/^\d+$/.test(t));

const FIL_COUL = [[/YELLOW|\b(YEL|JAUNE|YL)\b|YEL(?=X|\d|$)/,'jaune','YEL'],[/\b(RED|ROUGE|RD)\b|RED(?=X|\d|$)/,'rouge','RED'],[/\b(BLK|BLACK|NOIR|BK)\b|BLK/,'noir','BLK'],

const FIL_UN_COND = ['RW90','T90'];
// Est-ce un fil/câble ? (pour ne jamais confondre une boîte ou un connecteur « pour NMD » avec du fil)
const RE_CODE_FIL = /^(WIRE-|CAB|NMD|NMWU|LVT|ACWU|AC\d|AC90|BX\d|TECK|RW|T90|SOOW|SJOOW|TELE4P|CAT ?6)/i;
const estFil = (code, desc, cat) => cvNorm(cat)==='fil' || RE_CODE_FIL.test(String(code||'').trim()) || /^(electrical cable|cable|câble|fil|wire|sonecable)\b/i.test(String(desc||'').trim());
const FIL_NMD_NORMAL = {'14':'blanc','12':'jaune','10':'orange','8':'noir','6':'noir'};
function sigFil(code, desc){
  const sansAcc = x => String(x||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const C = sansAcc(code), D = sansAcc(desc), T = C+' '+D;
  if(/CONN|CONNECT|BOITE|BOX|CLIP|COUV|PLAQUE|BRIDE|STRAP|EMBOUT|RACCORD/.test(T)) return null;
  const lum = C.match(/^CAB(\d+(?:\/0)?)\/(\d)([DW])/);           // Lumen : cab14/2d… = NMD90, cab6/2w… = NMWU
  let type = '';
  if(/NMWU/.test(T) || (lum && lum[3]==='W')) type='NMWU';
  else if(/NMD|LOOMEX/.test(T) || (lum && lum[3]==='D')) type='NMD';
  else if(/ACWU/.test(T)) type='ACWU';
  else if(/AC90|\bBX\b|^BX|^AC\d/.test(T)) type='AC90';
  else if(/TECK/.test(T)) type='TECK';
  else if(/RW90|^RW\d/.test(T)) type='RW90';
  else if(/\bT90\b|\dT90/.test(T)) type='T90';
  else if(/LVT/.test(T)) type='LVT';
  else if(/SJOOW/.test(T)) type='SJOOW';
  else if(/SOOW/.test(T)) type='SOOW';
  else if(/CAT ?6A|PR6A/.test(T)) type='CAT6A';
  else if(/CAT ?6|4PR6|PCAT6/.test(T)) type='CAT6';
  if(!type) return null;
  let g='', c='';
  const essais = [
    s=>{ const m=s.match(/\b(\d)\s+C\s+(\d+\/0|\d+)\s*(?:AWG|MCM|KCMIL)/); return m && [m[2],m[1]]; },                // Dubo : 3 C 10 AWG
    s=>{ const m=s.match(/(?:^|[^0-9])(\d)C\s*(\d+\/0|\d+)(?!\d)/); return m && [m[2],m[1]]; },                          // 2C14, 3C2/0
    s=>{ const m=s.match(/(\d+\/0|\d+)(?:\(\d+\))?(?:\s*AWG)?(?:\s+|\s*[-\/]\s*)(\d)C\b/); return m && [m[1],m[2]]; },     // 6(7) 2C, 14 3C, 6AWG/3C, 12-3C
    s=>{ const m=s.match(/\b(\d+)-(\d)C?\b/); return m && [m[1],m[2]]; },                                                // NMWU 14-2
    s=>{ const m=s.match(/\b(\d+)\/(\d)\b(?!\d)/); return m && m[2]!=='0' && [m[1],m[2]]; },                             // 14/2
  ];
  if(FIL_UN_COND.includes(type)){
    c='1';
    const m = C.match(/^CAB(\d+(?:\/0)?)(?:\/\d+)?(?:RW90|T90)/) || C.match(/^RW(?:90)?-?(\d+(?:\/0)?)/) || C.match(/^T90-?(\d+(?:\/0)?)/) || D.match(/(\d+\/0|\d+)\s*(?:\(\d+\))?\s*(?:MCM\s*)?(?:RW90|T90)/) || D.match(/(\d+)\s*MCM/);
    if(m) g=m[1];
  } else if(type==='CAT6' || type==='CAT6A'){ g='-'; c='-'; }
  else {
    if(lum){ g=lum[1]; c=lum[2]; }
    else for(const src of [D, C]){ for(const f of essais){ const r=f(src); if(r){ g=r[0]; c=r[1]; break; } } if(g) break; }
  }
  if(!g || !c) return null;
  g = {'0':'1/0','00':'2/0','000':'3/0','0000':'4/0'}[g] || g;   // « deux fois le zéro » = 2/0
  let coul='', cc=''; for(const [re,n,k] of FIL_COUL){ if(re.test(C) || re.test(D)){ coul=n; cc=k; break; } }
  if(!['NMD','RW90','T90','CAT6','CAT6A'].includes(type)){ coul=''; cc=''; }              // NMWU, ACWU, AC90, TECK… : la gaine ne change rien
  if(type==='NMD' && FIL_NMD_NORMAL[g]===coul) coul='';                                   // NMD 14 blanc, 12 jaune, 10 orange, 8-6 noir = normal
  const alu = type==='ACWU' || (type!=='AC90' && /ALU|NUAL|ALUMIN|\bAL\b|AL(BLK|WHI)|\dAL$|KVAL$/.test(T));   // AC90 : l'armure est en alu, pas les fils
  return {type, g, c, coul, cc, alu, base:[type,c,g,alu?'AL':''].join('|'), cle:[type,c,g,alu?'AL':'',coul].join('|')};
}
// Ton nom de code : NMD2C14, NMWU2C12, AC902C14, ACWU3C2, TECK3C4, RW90-2WHTALU, RW90-2/0BLK, T90-6BLK… (+ couleur si le même fil existe en d'autres couleurs, + ALU)
const calibreCode = g => g;   // v133 : tu écris 1/0, 2/0, 4/0 dans tes codes (00 ou 0000 sont quand même reconnus à la lecture)
function codeFil(s, couleurUtile){
  if(s.type==='CAT6' || s.type==='CAT6A') return '';
  const g = calibreCode(s.g);
  const base = FIL_UN_COND.includes(s.type) ? s.type+'-'+g : s.type+s.c+'C'+g;   // RW90-2…, T90-6…
  return base + ((couleurUtile || FIL_UN_COND.includes(s.type)) && s.cc ? s.cc : '') + (s.alu && s.type!=='ACWU' ? 'ALU' : '');

// v125 : format de commande d'un prix fournisseur — « rouleau 150 m », « au mètre », « à la coupe »
const LONG_M = {m:1, pi:0.3048};
function prixEnUnite(prix, uniteOffre, uniteProduit){
  const a = uniteNorm(uniteOffre), b = uniteNorm(uniteProduit);
  return (LONG_M[a] && LONG_M[b] && a!==b && prix!=null) ? Math.round(prix*LONG_M[b]/LONG_M[a]*10000)/10000 : prix;
}
function formatDe(o){
  const v = String(o.vendu||'').trim();
  const m = v.match(/multiples?\s+de\s+(\d+(?:[.,]\d+)?)\s*(m|mètres?|metres?|pi|pieds?|ft)\b/i);
  if(m){ const n = +m[1].replace(',','.'), u = /^m/i.test(m[2]) ? 'm' : 'pi'; return n<=1 ? {txt:u==='m' ? 'au mètre' : 'au pied', coupe:true} : {txt:'rouleau '+n+' '+u, long:n, u}; }
  if(/coupe/i.test(v)) return {txt:'à la coupe', coupe:true};
  const c = String(o.codeF||'').toUpperCase().trim();
  const k = c.match(/X(\d{2,4})M?$/) || c.match(/D7(?:RED|YEL|WHI|BLK|BLU)?(\d{2,3})$/) || String(o.fab+' '+o.desc).toUpperCase().match(/\b(\d{2,4})\s?M\b/);
  if(k) return {txt:'rouleau '+(+k[1])+' m', long:+k[1], u:'m'};
  return v ? {txt:v.length>28 ? v.slice(0,28)+'…' : v} : null;
}
// v127 : catégories PROPOSÉES (tu confirmes dans « 🏷 Classer ») — entrée électrique, panneaux et disjoncteurs par marque,
// connecteurs par type de fil (ou tuyau), raccordement / MALT, fil par type (NMD, TECK…) + réseau / télécom.
const SOUS_SUGG = {

  'CONNECTEURS':['NMD','AC90 / BX','TECK','ACWU','EMT','PVC','Liquidtight','Autres'],

  'DISJONCTEURS':['QO · Square D','Homeline · Schneider (CHOM)','BR · Eaton','Siemens','GE','Autres'],

  'DÉCORA':['Prises','Interrupteurs','Gradateurs','Intelligent','Plaques','Minuteries et détecteurs','Fiches','Carillons']};
// v131 : Décora par sous-catégorie (on ne change pas la catégorie, seulement la sous-catégorie)
function sousDecora(T){
  if(/CASETA|PICO\b|^PICO|WI-?FI|SMART|INTELLIGENT|ZIGBEE|Z-?WAVE|\bRA2\b|MYQ|HOMEKIT|KIT PICO|KSC2V|\bKSC/.test(T)) return 'Intelligent';
  if(/GRADATEUR|DIMMER|VARIATEUR|DVCL|\bDIVA\b|^DV|MACL|CTCL|\bMA-?\d|LUTDV/.test(T)) return 'Gradateurs';
  if(/MINUTERIE|TIMER|\bTI\d|OCCUPANCY|VACANCY|MOUVEMENT|MOTION|HUMIDIT|DETECTEUR DE PRESENCE|\bDHS|ODS|\bPIR\b/.test(T)) return 'Minuteries et détecteurs';
  if(/PLAQUE|PLATE|WALLPLATE|\dGPJ|\dGSW|VIERGE|COUVERCLE|COUV\b|\bWP\d|INTEMP|80714/.test(T)) return 'Plaques';
  if(/PRISE|RECEPT|OUTLET|\bGFI|GFCI|DDFT|\bUSB|^T5\d{3}|GFTR|SECHEUSE|POELE|14-30|14-50|10-30|DUPLEX|RECPT|5-15|5-20/.test(T)) return 'Prises';
  if(/PLUG\b(?!-IN)|\bFICHE/.test(T)) return 'Fiches';
  if(/CARILLON|SONNETTE|CHIME|DOORBELL|BOUTON C/.test(T)) return 'Carillons';
  if(/INTERRUPTEUR|\bINTERR\b|SWITCH|^56\d{2}|\b56\d{2}-|3-VOIES|4-VOIES|3 VOIES|4 VOIES|UNIPOLAIRE|SINGLE POLE|\bSPST/.test(T)) return 'Interrupteurs';
  return '';

const FIL_SOUS = {NMD:'NMD', NMWU:'NMWU', AC90:'AC90 / BX', ACWU:'ACWU', TECK:'TECK', RW90:'RW90', T90:'T90', LVT:'LVT', SOOW:'SOOW', SJOOW:'SOOW', CAT6:'Réseau', CAT6A:'Réseau'};
function marquePanneau(T){
  if(/SIEMENS|^SIE|\bSIEQ|^Q\d{3}|^B\d{3,4}\b|\bQP\b/.test(T)) return 'Siemens';
  if(/CHOM|HOMELINE|\bHOM\d|^HOM/.test(T)) return 'Homeline · Schneider (CHOM)';
  if(/\bQO|^QO|SQUARE ?D|\bSQD|^CQO|^CQ0/.test(T)) return 'QO · Square D';
  if(/EATON|CUTLER|^BR[\/\d -]|\bBR\d{3}|\bBR\/STAB|\bBR\b|DNPL|^EAT-/.test(T)) return 'BR · Eaton';
  if(/\bGE\b|^GE\d|THQ/.test(T)) return 'GE';
  return '';
}
const CAT_FIXES = /^(BORNES|D[ÉE]CORA|[ÉE]CLAIRAGE|SERVICES|ADMIN|CONTR[ÔO]LE|D[ÉE]TECTION|CHAUFFAGE)/i;   // on ne déplace pas ces produits-là
function classerProduit(code, desc, catActuelle){
  const sansAcc = x => String(x||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const C = sansAcc(code), D = sansAcc(desc), T = C+' '+D, cat = String(catActuelle||'');
  if(/^D[ÉE]CORA/i.test(cat)){
    if(/BREAKER|DISJ|\bBRK\b|PLUG-IN|TWIN \d|SIEMENS TWIN/.test(T) || (sigDisj(code, desc) && !/PRISE|RECEPT|PLUG|FICHE/.test(T))) return {cat:'DISJONCTEURS', sous:marquePanneau(T)};   // disjoncteur rangé dans Décora par erreur
    const sd = sousDecora(T); return sd ? {cat, sous:sd} : null; }
  if(CAT_FIXES.test(cat)) return null;
  // entrée électrique (pas les panneaux : ils ont leur catégorie)
  if(/DISCONNECT|SECTIONNEUR|DISCONNECTEUR|^DIS \d|\bDIS \d+A|SAFETY SWITCH|NON-?FUS/.test(T)) return {cat:'ENTRÉE ÉLECTRIQUE', sous:'Sectionneur'};
  if(/METER ?BASE|METER ?SOCKET|EMBASE|BASE DE COMPTEUR|BOITE DE COMPTEUR/.test(T)) return {cat:'ENTRÉE ÉLECTRIQUE', sous:'Embase de compteur'};
  if(/\bMAST\b|\bMAT DE|SERVICE ?HEAD|TETE DE SERVICE|WEATHER ?HEAD|ENTRANCE CAP|CHAPEAU DE MAT/.test(T)) return {cat:'ENTRÉE ÉLECTRIQUE', sous:'Mât et tête de service'};
  if(/^BO[IÎ]TES/i.test(cat)) return null;
  // disjoncteurs et panneaux
  const panneau = /PANNEAU|LOAD ?CENTRE|LOAD ?CENTER|LOADCENTER|LOAD CTR|PANELBOARD|^CQO|^CQ0|^QO C|^CHOM \d{4}|^SIEQ \d|^SIESEQ/.test(T) && !/PASSE ?FIL|COUVERCLE|COVER|\bTRIM\b|SERRURE|LOCK|PLASTIQUE|PICTO/.test(T);
  const disj = /BREAKER|\bBRK\b|DISJONCTEUR|DIJONCT|\bDISJ\b|^BR\/STAB|^QOB?\d|^HOM\d|^CHOM\d|^BR ?\d|^QBH|^Q\d{3}|^SIEQ?\d{3}|^SIEB\d|^DNPL|PCAFI|\bPDF\b|^DOUBLE \d{4}|^GE\d{3}/.test(T);
  if(disj && !panneau) return {cat:'DISJONCTEURS', sous:marquePanneau(T)};
  if(panneau) return {cat:'PANNEAUX', sous:marquePanneau(T)};
  // raccordement et mise à la terre
  const malt = /GROUND|\bMALT\b|MISE A LA TERRE|\bGND\b|TIGE DE|ACORN|BONDING|\bMASSE\b/.test(T);
  const racc = /MARRETTE|WIRE ?NUT|WAGO|SPLIT ?BOLT|LEVER ?NUT|COSSE|\bLUGS?\b|TERMINAL BLOCK|BORNIER|POLARIS|CONN H\b|H-TAP|CONN BOULON|CONNECTEUR HYDRO|CONNECTEUR DE FILS|ANTI ?OX/.test(T);
  if(/^CONNEXION/i.test(cat)) return (malt || racc) ? {cat:'CONNEXIONS / MALT', sous: malt ? 'MALT' : 'Raccordement'} : null;
  if(malt) return {cat:'CONNEXIONS / MALT', sous:'MALT'};
  if(racc) return {cat:'CONNEXIONS / MALT', sous:'Raccordement'};
  // connecteurs (fil ou tuyau)
  if(/\bCONN\b|CONN |CONNECTOR|CONNECTEUR|^CI ?\d|^RTA\b|COUPLING|COUPLAGE|^REC\b|BUSHING|EMBOUT .*PO|LOCKNUT|CONTRE-ECROU|C-CLIP/.test(T)){
    const s = /NMD|LOOMEX|ROMEX|\bNM\b|C-CLIP/.test(T) ? 'NMD' : /TECK/.test(T) ? 'TECK' : /ACWU/.test(T) ? 'ACWU' : /\bBX\b|BX\/|AC90|FLEX|ARMOU?R/.test(T) ? 'AC90 / BX'
      : /LIQUID|\bLT\b|SEALTITE/.test(T) ? 'Liquidtight' : /EMT|SET ?SCREW|COMPRESS/.test(T) ? 'EMT' : /PVC|^RTA|PLAST/.test(T) ? 'PVC' : '';

  }

  if(/^FIL/i.test(cat) || estFil(code, desc, cat)){
    const z = sigFil(code, desc); if(z && FIL_SOUS[z.type]) return {cat:'FIL', sous:FIL_SOUS[z.type]};
    if(/CAT ?5|CAT ?6|COAX|RG ?6|RG59|FIBRE|FIBER|\d{2}\/4PR/.test(T) && !/JACK|PLAQUE|PLATE|ADAPT|FICHE|PLUG/.test(T)) return {cat:'FIL', sous:'Réseau'};
    if(/TELEPH|ALARM|SPEAKER|HAUT-PARLEUR|\bSH\b|\d{2}-\d ?PR|\dPR\b|FT4|SPOS|\d{2}\/\d\b/.test(T)) return {cat:'FIL', sous:'Télécom'};
  }
  return null;
}
// v127 : recherche souple — « 54-C1 » trouve BC54-C1 et IBE54C1 ; plusieurs mots = tous doivent y être ;
// « 1500W » / « 1 500 W » trouve aussi les plinthes STEB 1502, STEPR 1502, STEMIR 1502 (code Stelpro = watts ÷ 10 + 2)
function rechercheOk(texte, q){
  const t = cvNorm(texte), n = cvNorm(q); if(!n) return true; if(t.includes(n)) return true;
  const toks = String(q).replace(/(\d)[\s\u00a0]+(?=\d{3}\b)/g,'$1').replace(/(\d)\s+(w|watts?|a|amp|v|po|pi|m)\b/gi,'$1$2').split(/\s+/).map(cvNorm).filter(Boolean);
  const alt = k => { const m = k.match(/^(\d{3,4})(w|watts?)?$/); if(!m) return []; const w = +m[1]; return w%50===0 ? [String(w/10).padStart(3,'0')+'2'] : []; };
  return toks.length>0 && toks.every(k => t.includes(k) || alt(k).some(a=>t.includes(a)));
}
const texteProduit = p => [p.code, ...autresCodes(p), p.desc, p.sous||'', p.cat||'', p.fab||'', ...(p.membres||[]).map(m=>m.desc)].join(' ');
// Disjoncteur : « 2P20A » (QO220, BR230, CHOM115, BR/STAB 220, « 20A 2P »…) — sert à proposer « Ressemble à »
function sigDisj(code, desc){
  const C = String(code||'').toUpperCase().replace(/^[A-Z]{2,4}-(?=\S)/,''), D = String(desc||'').toUpperCase();
  if(!/BREAKER|DISJ|DIJONC|\bBRK\b|^QO|^CHOM|^HOM|^BR|^Q\d|^B\d|^SIE|^GE\d|^THQ/.test(C+' '+D)) return '';
  const p = D.match(/\b([1-4])\s*-?\s*P(?:OLES?)?\b/), a = D.match(/\b(\d{2,3})\s*-?\s*A(?:MPS?)?\b/);
  if(p && a) return p[1]+'P'+(+a[1])+'A';
  const m = C.match(/^(?:QOB?|CHOM|HOM|BR(?:\/STAB)?|SIEQ|SIEB|Q|B|GE|THQL)\s*([1-4])(\d{2,3})(?![0-9])/);
  return m ? m[1]+'P'+(+m[2])+'A' : '';
}
const codeDansDesc = d => { const t = String(d||'').trim().split(/\s+/).slice(0,3).find(w=>/^[A-Z0-9][A-Z0-9\-\/\.]*\d[A-Z0-9\-\/\.]*$/i.test(w) && w.replace(/[^A-Z0-9]/gi,'').length>=4); return t ? t.toUpperCase() : ''; };
const autresCodes = p => [...new Set([p.alias, ...(p.membres||[]).flatMap(m=>[m.code, m.alias])].filter(Boolean))];
const codesPunch = p => [...new Set([p.alias, ...(p.membres||[]).filter(m=>m.src==='punch').map(m=>m.code), ...(p.membres||[]).map(m=>m.alias)].filter(Boolean))];
function descFil(s, couleurUtile){
  const coul = (couleurUtile || FIL_UN_COND.includes(s.type)) && s.coul ? ' '+s.coul : '';
  return (FIL_UN_COND.includes(s.type) ? s.type+' '+s.g : s.type+' '+s.c+' conducteurs '+s.g) + coul + (s.alu && s.type!=='ACWU' ? ' aluminium' : '');
}

function uniteDevinee(cat, sous, desc){
  if(cat==='FIL') return 'm';
  if(cat==='CONDUIT' && (/conduit rigide/i.test(sous) || /\bCONDUIT\b.*X ?10|X10\b|10 ?PI|10'/i.test(desc))) return 'pi';

}
// Lecture d'un CSV (virgules ou points-virgules, guillemets, retours de ligne dans les champs)
function csvLire(txt){
  txt = String(txt||'').replace(/^﻿/,'');
  const l1 = txt.split(/\r?\n/)[0]||''; const sep = (l1.split(';').length > l1.split(',').length) ? ';' : ',';
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===sep){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f.replace(/\r$/,'')); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f!=='' || row.length){ row.push(f.replace(/\r$/,'')); rows.push(row); }
  if(!rows.length) return [];
  const h = rows[0].map(x=>cvNorm(x));
  return rows.slice(1).filter(r=>r.some(x=>String(x).trim())).map(r=>{ const o={}; h.forEach((k,i)=>{ if(k && o[k]===undefined) o[k]=String(r[i]==null?'':r[i]).trim(); }); return o; });
}
// Quel genre de fichier ? 'offres' (prix fournisseurs), 'photos' (photos fournisseurs) ou 'produits' (ta liste)
function csvGenre(objs){
  const k = objs[0] ? Object.keys(objs[0]) : [];
  if(k.includes('fournisseur') && k.includes('codefournisseur')) return (k.includes('monprix') || k.includes('prix')) ? 'offres' : (k.includes('urlphoto') ? 'photos' : 'offres');
  if(k.includes('codecrm') || k.includes('codecomptable') || k.includes('code')) return 'produits';
  return '';
}

// Photo d'un produit : adresse web (site fournisseur) ou fichier Drive (photo prise avec le CRM)

function useCatalogue(cfg){
  const [etat,setEtat]=useState({lu:false, produits:[], cats:[], toutesCats:[], prix:{}, liens:{}, facture:{}, achats:[], offres:[], profil:'Base', err:''});
  const idS = cfg.stockSpreadsheetId, idJ = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    if(!idS){ setEtat(s=>({...s, lu:true, err:'Le Sheet STOCK PUNCH PRO n\'est pas configuré (Réglages).'})); return; }
    // v122 : tout est lu en même temps (au lieu d'un onglet après l'autre)
    const tot = f => { try{ return f().then(r=>({r}), e=>({e})); }catch(e){ return Promise.resolve({e}); } };
    const att = pr => pr.then(x=>{ if(x.e) throw x.e; return x.r; });
    const pFiches = tot(()=>lireCache(idJ, 'Produits!A1:L', force)), pOffres = tot(()=>lireCache(idJ, "'Prix fournisseurs'!A1:Q", force));
    const pPrix = tot(()=>lireCache(idJ, 'Prix!A1:C', force)), pLiens = tot(()=>lireCache(idJ, 'Correspondances!A1:D', force));
    const pFact = tot(()=>lireCache(cfg.memoireFacturesSpreadsheetId, 'Lignes!A1:F', force)), pAch = tot(()=>sheetsBatchGet(cfg.memoireAchatsSpreadsheetId, ['A1:C', 'Lignes!A1:F']));
    try{
      const meta = await window.gapi.client.sheets.spreadsheets.get({spreadsheetId:idS, fields:'sheets.properties.title'});
      const cats = (meta.result.sheets||[]).map(x=>x.properties.title).filter(t=>!STOCK_HORS_CATALOGUE.includes(t));
      const vals = await sheetsBatchGet(idS, cats.map(c=>qSheet(c)+'!A1:E'));
      const produits = [];
      cats.forEach((c,i)=>(vals[i]||[]).slice(1).forEach((r,k)=>{ if(r[0]) produits.push({cat:c, row:k+2, code:String(r[0]).trim(), desc:r[1]||'', unite:r[2]||'', notes: c==='Stock personnalisé' ? '' : (r[3]||'')}); }));
      produits.forEach(p=>{ p.src='punch'; p.onglet=p.cat; });   // onglet de STOCK PUNCH PRO (pour y écrire) ; p.cat = catégorie affichée
      // v116 : fiches produits (ta liste du logiciel comptable, classée) et prix des sites fournisseurs — La mémoire — Jobs
      const parK = {}; produits.forEach(p=>{ parK[codeNorm(p.code)] = p; });
      const fichesLues = [];
      try{ const fp = await att(pFiches);
        (fp.result.values||[]).slice(1).forEach((r,i)=>{ const code = String(r[0]||'').trim(); const k = codeNorm(code); if(!k) return;
          const f = {row:i+2, code, desc:r[1]||'', cat:r[2]||'À CLASSER', sous:r[3]||'', unite:r[4]||'', photo:r[5]||'', fab:r[6]||'', notes:r[7]||'', source:r[8]||'', le:r[9]||'', alias:String(r[10]||'').trim(), groupe:String(r[11]||'').trim()};
          fichesLues.push(f);
          const x = parK[k];
          if(x){ if(!x.fiche){ x.fiche=f; x.photo=f.photo; x.sous=f.sous; x.fab=f.fab; if(f.cat && f.cat!=='À CLASSER') x.cat=f.cat; } }
          else { const n = {cat:f.cat, sous:f.sous, code, desc:f.desc, unite:f.unite||'un', notes:f.notes, photo:f.photo, fab:f.fab, src:'fiche', fiche:f}; produits.push(n); parK[k]=n; } }); }catch(e){}
      // v120 : même produit, deux codes (PunchPro « NMD2C14 » = logiciel « NMD2C14X150 ») → un seul produit, au code du logiciel.
      // Le produit de PunchPro garde sa ligne dans STOCK PUNCH PRO (les gars ne voient aucun changement).
      fichesLues.forEach(f=>{ if(!f.alias) return; const n = parK[codeNorm(f.code)], pp = parK[codeNorm(f.alias)];
        if(!n || !pp || n===pp || pp.src!=='punch' || n.src==='punch') return;
        n.alias = pp.code; n.punch = {code:pp.code, cat:pp.cat, row:pp.row, desc:pp.desc};
        const i = produits.indexOf(pp); if(i>=0) produits.splice(i,1); parK[codeNorm(pp.code)] = n; });
      // v121 : « Regroupé sous » (colonne L) — ce produit se range sous ton code maître ; ses codes, prix, achats et factures suivent.
      // Rien n'est changé dans STOCK PUNCH PRO : le produit PunchPro garde sa ligne et son code.
      const groupeDe = {}; fichesLues.forEach(f=>{ if(f.groupe && f.groupe!=='≠') groupeDe[codeNorm(f.code)] = codeNorm(f.groupe); });
      const racine = k => { let x=k, n=0; while(groupeDe[x] && groupeDe[x]!==x && n<8){ x=groupeDe[x]; n++; } return x; };
      Object.keys(groupeDe).forEach(k=>{ const n = parK[k], m = parK[racine(k)]; if(!n || !m || n===m) return;
        m.membres = [...(m.membres||[]), n, ...(n.membres||[])]; n.membres = [];
        ['photo','fab','sous'].forEach(c=>{ if(!m[c] && n[c]) m[c]=n[c]; }); if(m.cat==='À CLASSER' && n.cat && n.cat!=='À CLASSER') m.cat=n.cat;
        const i = produits.indexOf(n); if(i>=0) produits.splice(i,1);
        Object.keys(parK).forEach(x=>{ if(parK[x]===n) parK[x]=m; }); });
      // v126 : le fil est TOUJOURS en mètres dans le CRM (prix, soumissions). STOCK PUNCH PRO garde son unité (on ne l'écrase pas).
      produits.forEach(p=>{ const u = uniteNorm(p.unite); if(estFil(p.code, p.desc, p.cat) && (u==='pi' || u==='m' || !u)){ if(u!=='m') p.unitePunch = p.unite || 'pi'; p.unite = 'm'; } });
      let offres = [];
      try{ const op = await att(pOffres);
        offres = (op.result.values||[]).slice(1).map((r,i)=>({row:i+2, f:r[0]||'', codeF:r[1]||'', fab:r[2]||'', marque:r[3]||'', desc:r[4]||'', cat:r[5]||'', unite:r[6]||'', prix:cvNum(r[7]),
          liste:cvNum(r[8]), stock:r[9]||'', succ:r[10]||'', url:r[11]||'', photo:r[12]||'', vendu:r[13]||'', saran:r[14]||'', corr:r[15]||'', date:r[16]||''})).filter(o=>o.f && o.codeF); }catch(e){}
      const ordre = c => { const i = CAT_ORDRE.indexOf(c); return i<0 ? 50 : i; };
      const toutesCats = [...new Set([...cats, ...produits.map(p=>p.cat), ...CAT_ORDRE.filter(c=>c!=='Stock personnalisé')])].sort((a,b)=>ordre(a)-ordre(b) || a.localeCompare(b));
      produits.sort((a,b)=>ordre(a.cat)-ordre(b.cat) || (a.sous||'').localeCompare(b.sous||'') || String(a.code).localeCompare(String(b.code)));
      // Mes prix + réglages (onglet « Prix » : PROFIL = profil de profit) et correspondances fournisseur → produit
      const prix = {}; let profil = 'Base';
      try{ const p = await att(pPrix); (p.result.values||[]).slice(1).forEach((r,i)=>{ if(!r[0]) return; if(r[0]==='PROFIL'){ profil = r[1]||'Base'; prix.PROFIL={row:i+2}; return; } prix[codeNorm(r[0])] = {prix:cvNum(r[1]), row:i+2, code:r[0]}; }); }catch(e){}
      const liens = {};
      try{ const l = await att(pLiens); (l.result.values||[]).slice(1).forEach((r,i)=>{ if(r[0]) liens[codeNorm(r[0])] = {produit:r[2]||'', row:i+2, fournisseur:r[1]||''}; }); }catch(e){}
      // Dernier prix facturé à tes clients : chaque jeton de la colonne Codes (registre des factures › Lignes)
      const facture = {};
      try{ const f = await att(pFact);
        (f.result.values||[]).slice(1).forEach(r=>{ const p=cvNum(r[4]); const n=Number(r[0])||0; if(p==null) return;
          codeJetons(r[1]).forEach(k=>{ if(!facture[k] || n>=facture[k].n) facture[k]={prix:p, n}; }); }); }catch(e){}
      // Achats (factures fournisseurs) : une ligne par article acheté, avec la date de la facture
      let achats = [];
      try{
        const [ent, lig] = await att(pAch);
        const dates = {}; (ent||[]).slice(1).forEach(r=>{ if(r[0]) dates[r[0]+'|'+r[1]] = r[2]||''; });
        achats = (lig||[]).slice(1).map(r=>{ const q=cvNum(r[4])||0, m=cvNum(r[5]); return {fournisseur:r[0]||'', facture:r[1]||'', code:r[2]||'', desc:r[3]||'', qte:q, cout: q>0 && m!=null ? arrondi(m/q) : null, date:dates[(r[0]||'')+'|'+(r[1]||'')]||''}; })
          .filter(a=>a.code && a.cout!=null && a.cout>0);
      }catch(e){}
      setEtat({lu:true, produits, cats, toutesCats, prix, liens, facture, achats, offres, profil, err:''});
    }catch(e){ setEtat(s=>({...s, lu:true, err:apiErrMsg(e)})); }
  },[idS, idJ, cfg.memoireFacturesSpreadsheetId, cfg.memoireAchatsSpreadsheetId]);
  useEffect(()=>{ lire(); },[lire]);

  // Produit du catalogue pour un code fournisseur : lien confirmé, sinon code identique (sans la marque), sinon rien (« à confirmer »).
  const parCode = useMemo(()=>{ const m={}; etat.produits.forEach(p=>{ m[codeNorm(p.code)] = p; }); etat.produits.forEach(p=>{ autresCodes(p).forEach(c=>{ if(!m[codeNorm(c)]) m[codeNorm(c)] = p; }); }); return m; },[etat.produits]);
  const codeMaitre = code => { const p = parCode[codeNorm(code)]; return p ? p.code : code; };   // v120 : le code PunchPro mène au même produit
  // v123 : un fil se reconnaît à sa signature (type, conducteurs, calibre, couleur, alu) — la longueur du rouleau ne compte pas.
  // WIRE-NMD3C10X75 (Dubo) va donc tout seul sous ton NMD3C10. Seulement si UN seul de tes produits a cette signature.
  const parSig = useMemo(()=>{ const m={};
    etat.produits.forEach(p=>{ [p, ...(p.membres||[])].forEach(x=>{ const z = estFil(x.code, x.desc, x.cat) && sigFil(x.code, x.desc); if(z) (m[z.cle] = m[z.cle] || new Set()).add(p); }); });
    return m; },[etat.produits]);
  const parSignature = (code, desc)=>{ const z = estFil(code, desc) && sigFil(code, desc); const l = z && parSig[z.cle]; return l && l.size===1 ? [...l][0] : null; };
  const produitDe = useCallback((codeF, desc) => {
    const l = etat.liens[codeNorm(codeF)];
    if(l) return l.produit ? (parCode[codeNorm(l.produit)] || {code:l.produit, desc:'', cat:''}) : null;   // lien vide = ignoré
    const k1 = codeNorm(codeF), k2 = codeSansMarque(codeF);
    const kd = desc!==undefined ? codeNorm(codeDansDesc(desc)) : '';
    return parCode[k1] || parCode[k2] || (kd ? parCode[kd] : null) || (desc!==undefined ? parSignature(codeF, desc) : null) || null;
  },[etat.liens, parCode, parSig]);
  // Achats de chaque produit, par fournisseur (le plus récent de chacun)
  const achatsParProduit = useMemo(()=>{
    const m = {};
    etat.achats.forEach(a=>{ const p = produitDe(a.code, a.desc||''); if(!p) return; const k = codeNorm(p.code);
      const x = (m[k] = m[k] || {});
      if(!x[a.fournisseur] || a.date > x[a.fournisseur].date || (a.date===x[a.fournisseur].date && a.facture > x[a.fournisseur].facture)) x[a.fournisseur] = a; });
    return m;
  },[etat.achats, produitDe]);
  // Codes achetés qui ne sont reliés à aucun produit (ni ignorés) : « à confirmer »

    for(const x of maj) await sheetsUpdateRow(idJ, 'Correspondances', x.row, [x.codeF, x.f||'', x.produit||'', le]);
  };
  const ajouterFichesEnLot = async liste=>{ if(!liste.length) return;
    const rows = await lireOnglet('Produits', 'A1:L'); const idx = new Set(rows.map(r=>codeNorm(r[0]))); const le = maintenant();
    liste.forEach(f=>{ const k = codeNorm(f.code); if(!k || idx.has(k)) return; rows.push(ficheLigne({...f, source:'Saran', le})); idx.add(k); });
    await ecrireOnglet('Produits', PROD_ENTETE, rows);
  };
  const pasPareil = async membres=>{ await assurerColL(); for(const p of membres) await marquer(p, '≠'); };
  const retirerDuGroupe = async p=>{ await marquer(p, ''); };
  return {...etat, lire, coutDe, coutsDe, factureDe, suggereDe, prixDe, produitDe, aConfirmer, majPrix, majProfil, ajouterProduit, lier, modifierProduit,
    offresDe, meilleureOffre, monPrix, codeMaitre, offresLibres:liensOffres.libres, fournisseurs, comparaison, importerProduits, importerOffres, ajouterFiche, modifierFiche,
    propositions, trouverProduit, regrouper, pasPareil, retirerDuGroupe, aClasser, classerEnLot, lierEnLot, ajouterFichesEnLot};
}

// Choisir un produit du catalogue (pour lier un code fournisseur)
function ChoixProduit({produits, onChoix, defaut}){
  const [q,setQ]=useState(defaut||'');
  const l = q.trim().length<2 ? [] : produits.filter(p=>rechercheOk(texteProduit(p), q)).slice(0,8);
  return <div style={{marginTop:6}}>
    <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Chercher le produit (ex. prise 15A, BC1110)…" style={{width:'100%',boxSizing:'border-box'}}/>
    {l.map(p=><div key={p.cat+p.code} onClick={()=>onChoix(p)} style={{padding:'5px 8px',borderBottom:'1px solid var(--border)',cursor:'pointer',fontSize:13}}><b>{p.code}</b> · {p.desc} <span className="muted" style={{fontSize:11}}>· {p.cat}</span></div>)}
  </div>;
}

        </table>
      </div>
      {comp.length>lim && <div style={{textAlign:'center',marginTop:8}}><button className="btn btn-sm" onClick={()=>setLim(lim+300)}>Afficher plus</button></div>}
    </>}

    {vue==='regrouper' && <RegrouperVue C={C} toast={toast} err={err} q={q}/>}

    {vue==='relier' && <RelierVue C={C} toast={toast} err={err} libres={libres}/>}

    {vue==='confirmer' && <RelierVue C={C} toast={toast} err={err} achats libres={aConf.map(x=>({f:x.fournisseur, codeF:x.code, desc:x.desc, prix:x.cout, unite:'', cat:'', fab:'', photo:'', vendu:'', info:'acheté '+x.fois+' fois · '+cvFmtDay(x.date)}))}/>}
  </div>;
}

// v129 : Prix à relier, regroupés — un même produit chez Dubo et Lumen = UNE carte. Pour chaque carte :
// « Ressemble à » (un de tes produits proches), « + Créer » (ton code proposé), « ✕ Ignorer ». Tout se fait aussi en lot (cases à cocher).
function RelierVue({C, toast, err, libres, achats}){
  const [ed,setEd]=useState({}); const [off,setOff]=useState({}); const [faits,setFaits]=useState({}); const [occupe,setOccupe]=useState(''); const [lien,setLien]=useState(''); const [lim,setLim]=useState(60);
  const codeGen = c => String(c||'').replace(/^[A-Z]{2,4}-(?=\S)/i,'');
  const strict = c => String(c||'').toUpperCase().replace(/[\s\-_.]/g,'');
  const existeVraiment = c => { const p = C.trouverProduit(c); return p && [p.code, ...autresCodes(p)].some(x=>strict(x)===strict(c)) ? p : null; };
  const groupes = useMemo(()=>{
    const g = new Map();
    libres.forEach(o=>{ const z = estFil(o.codeF, o.desc, o.cat) && sigFil(o.codeF, o.desc);
      const k = z ? 'F|'+z.cle : (o.fab ? 'B|'+codeNorm(o.fab) : 'C|'+(codeNorm(codeDansDesc(o.desc)) || codeSansMarque(o.codeF)));
      if(!g.has(k)) g.set(k, {k, z, offres:[]}); g.get(k).offres.push(o); });
    const sigP = C.produits.map(p=>({p, s: estFil(p.code, p.desc, p.cat) && sigFil(p.code, p.desc)})).filter(x=>x.s);
    const disjP = C.produits.map(p=>({p, d: sigDisj(p.code, p.desc)})).filter(x=>x.d);
    return [...g.values()].map(x=>{ const o0 = x.offres[0];
      const fil = !!(x.z && codeFil(x.z, !!x.z.coul));
      const code = fil ? codeFil(x.z, !!x.z.coul) : (codeDansDesc(o0.desc) || codeGen(o0.codeF).toUpperCase());
      const desc = fil ? descFil(x.z, !!x.z.coul) : o0.desc;
      const dz = !x.z && sigDisj(o0.codeF, o0.desc);
      const proches = x.z ? sigP.filter(y=>y.s.type===x.z.type && y.s.c===x.z.c && y.s.g===x.z.g).map(y=>y.p) : dz ? disjP.filter(y=>y.d===dz).sort((u,v)=>{ const mq = marquePanneau(String(o0.codeF+' '+o0.desc).toUpperCase()); const mu = y=>mq && marquePanneau(String(y.p.code+' '+y.p.desc).toUpperCase())===mq ? 0 : 1; return mu(u)-mu(v); }).map(y=>y.p) : [];
      const deja = existeVraiment(code);
      const cl = fil ? null : classerProduit(code, o0.desc, catSimple(o0.cat));
      return {...x, code, desc, deja, cat: fil ? 'FIL' : (cl ? cl.cat : catSimple(o0.cat)), sous: fil ? (FIL_SOUS[x.z.type]||'') : (cl ? cl.sous : ''), unite: fil ? 'm' : (uniteNorm(o0.unite)||'un'),
        fab: o0.fab||'', photo:(x.offres.find(o=>o.photo)||{}).photo||'', proches: [...new Set([...(deja ? [deja] : []), ...proches])].slice(0,3)};
    }).sort((a,b)=>(b.proches.length>0)-(a.proches.length>0) || String(a.cat).localeCompare(String(b.cat)) || String(a.code).localeCompare(String(b.code)));
  },[libres, C.produits]);
  const liste = groupes.filter(g=>!faits[g.k]);
  const val = g => ({code:g.code, desc:g.desc, ...(ed[g.k]||{})});
  const coches = liste.filter(g=>!off[g.k]);
  const aCreer = coches.filter(g=>!existeVraiment(val(g).code));   // jamais de doublon : un code qui existe déjà se relie
  const fini = (gs, msg)=>{ setFaits(f=>({...f, ...Object.fromEntries(gs.map(g=>[g.k,true]))})); toast&&toast(msg); };
  const relierA = async (g, p)=>{ setOccupe('…'); try{ await C.lierEnLot(g.offres.map(o=>({codeF:o.codeF, f:o.f, produit:p.code}))); fini([g], g.offres.length+' prix → '+p.code); setLien(''); }catch(e){ err(e); } setOccupe(''); };
  const creer = async gs=>{ setOccupe('Création…');
    try{ const fiches = gs.map(g=>{ const v = val(g); return {code:v.code.trim(), desc:v.desc, cat:g.cat, sous:g.sous, unite:g.unite, photo:g.photo, fab:g.fab, notes:''}; }).filter(f=>f.code);
      await C.ajouterFichesEnLot(fiches);
      await C.lierEnLot(gs.flatMap(g=>g.offres.map(o=>({codeF:o.codeF, f:o.f, produit:val(g).code.trim()}))));
      fini(gs, fiches.length+' produit'+(fiches.length>1?'s':'')+' créé'+(fiches.length>1?'s':'')); await C.lire(true); }catch(e){ err(e); }
    setOccupe(''); };
  const ignorer = async gs=>{ setOccupe('…'); try{ await C.lierEnLot(gs.flatMap(g=>g.offres.map(o=>({codeF:o.codeF, f:o.f, produit:''})))); fini(gs, gs.length+' ignoré'+(gs.length>1?'s':'')); }catch(e){ err(e); } setOccupe(''); };
  if(C.lu && !liste.length) return <div className="card muted" style={{fontSize:13}}>Tous les prix sont reliés 👍</div>;
  return <div style={{display:'grid',gap:8}}>
    <div className="card" style={{display:'grid',gap:6,fontSize:12.5}}>
      <div>{achats ? <>Ces articles sont sur tes <b>factures fournisseurs</b>, mais leur code n'est pas dans ta liste de produits (la liste exportée de ton logiciel comptable + PunchPro). Ex. SCH-QO220 : tu n'as pas de QO220 dans ta liste.</>
        : <>Ces prix viennent de Manus : il a aussi ramené des grosseurs et des formats <b>que tu n'as pas dans ta liste</b>.</>} Le CRM ne crée jamais un produit tout seul — c'est toi qui choisis : <b>+ Créer</b> (ton code est proposé), <b>Ressemble à</b> un de tes produits, ou <b>✕ Ignorer</b>. Un même produit chez Dubo et Lumen = une seule carte.</div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
        <span className="muted">{liste.length} produits · {coches.length} cochés</span>
        <button className="btn btn-sm" onClick={()=>setOff(Object.keys(off).length ? {} : Object.fromEntries(liste.map(g=>[g.k,true])))}>{Object.keys(off).length ? 'Tout cocher' : 'Tout décocher'}</button>
        <button className="btn btn-sm btn-p" onClick={()=>creer(aCreer)} disabled={!!occupe || !aCreer.length}>+ Créer les cochés ({aCreer.length})</button>
        <button className="btn btn-sm" disabled={!!occupe || !coches.length} onClick={()=>{ if(confirm('Ignorer '+coches.length+' produits (leurs prix ne seront plus proposés) ?')) ignorer(coches); }}>✕ Ignorer les cochés</button>
        {occupe && <span className="muted">{occupe}</span>}
      </div>
    </div>
    {liste.slice(0,lim).map(g=>{ const v = val(g); return <div key={g.k} className="card" style={{display:'grid',gap:6,opacity:off[g.k]?0.6:1}}>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <input type="checkbox" checked={!off[g.k]} onChange={e=>setOff(o=>{ const n={...o}; if(e.target.checked) delete n[g.k]; else n[g.k]=true; return n; })}/>
        <ProdPhoto src={g.photo} taille={40}/>
        <input value={v.code} onChange={e=>setEd(x=>({...x, [g.k]:{...v, code:e.target.value}}))} style={{flex:'0 1 150px',fontWeight:700}}/>
        <input value={v.desc} onChange={e=>setEd(x=>({...x, [g.k]:{...v, desc:e.target.value}}))} style={{flex:'1 1 220px'}}/>
        <span className="muted" style={{fontSize:11.5}}>{g.cat}{g.sous ? ' · '+g.sous : ''} · {g.unite}</span>
      </div>
      <div style={{fontSize:12}}>{g.offres.map(o=><div key={o.f+o.codeF} className="muted"><b style={{color:'var(--text)'}}>{o.f}</b> {o.codeF} · {o.prix>0 ? cvMoney(o.prix)+(o.unite?'/'+o.unite:'') : 'sans prix'}{formatDe(o) ? ' · '+formatDe(o).txt : ''} — {String(o.desc).slice(0,70)}</div>)}</div>
      {g.offres.some(o=>o.info) && <div className="muted" style={{fontSize:11.5}}>{g.offres.map(o=>o.info).filter(Boolean).join(' · ')}</div>}
      {g.proches.length>0 && <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',fontSize:12.5}}>
        <span style={{color:'var(--warning)'}}>Ressemble à :</span>
        {g.proches.map(p=><button key={p.code} className="btn btn-sm" disabled={!!occupe} title={p.desc} onClick={()=>relierA(g, p)}>🔗 {p.code}</button>)}
        <span className="muted" style={{fontSize:11.5}}>({g.z ? 'même fil, autre couleur ou format' : 'même nombre de pôles et d\'ampères'} — relie si c'est pareil pour toi)</span>
      </div>}
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {existeVraiment(v.code) ? <button className="btn btn-sm btn-p" disabled={!!occupe} onClick={()=>relierA(g, existeVraiment(v.code))}>🔗 Relier à {existeVraiment(v.code).code} (existe déjà)</button>
          : <button className="btn btn-sm btn-p" disabled={!!occupe || !v.code.trim()} onClick={()=>creer([g])}>+ Créer {v.code}</button>}
        <button className="btn btn-sm" disabled={!!occupe} onClick={()=>setLien(lien===g.k?'':g.k)}>🔗 Relier à un autre produit</button>
        <button className="btn btn-sm" disabled={!!occupe} onClick={()=>ignorer([g])}>✕ Ignorer</button>
      </div>
      {lien===g.k && <ChoixProduit produits={C.produits} defaut={g.fab||''} onChoix={p=>relierA(g, p)}/>}
    </div>; })}
    {liste.length>lim && <div style={{textAlign:'center'}}><button className="btn btn-sm" onClick={()=>setLim(lim+60)}>Afficher plus ({liste.length-lim} autres)</button></div>}
  </div>;
}

// v127 : classement proposé — coche, puis Appliquer (une seule écriture dans « Produits »)
function ClasserPanel({C, toast, err, onFini}){
  const [off,setOff]=useState({}); const [occupe,setOccupe]=useState(false);
  const parCat = {}; C.aClasser.forEach(x=>{ (parCat[x.cat] = parCat[x.cat] || []).push(x); });
  const choisis = C.aClasser.filter(x=>!off[x.p.code]);
  const fmt = (c, s) => c + (s ? ' · '+s : '');
  return <div className="card" style={{marginBottom:10,display:'grid',gap:8}}>
    <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      <div style={{fontSize:13}}>Classement proposé pour <b>{C.aClasser.length}</b> produits. Décoche ce qui ne va pas, puis Appliquer. PunchPro garde ses onglets.</div>
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-sm" onClick={()=>setOff(Object.keys(off).length ? {} : Object.fromEntries(C.aClasser.map(x=>[x.p.code,true])))}>{Object.keys(off).length ? 'Tout cocher' : 'Tout décocher'}</button>
        <button className="btn btn-sm btn-p" disabled={occupe || !choisis.length} onClick={async()=>{ setOccupe(true); try{ await C.classerEnLot(choisis); toast&&toast(choisis.length+' produits classés'); await C.lire(true); onFini&&onFini(); }catch(e){ err(e); } setOccupe(false); }}>{occupe ? 'Classement…' : 'Appliquer ('+choisis.length+')'}</button>
      </div>
    </div>
    {Object.entries(parCat).sort((a,b)=>CAT_ORDRE.indexOf(a[0])-CAT_ORDRE.indexOf(b[0])).map(([cat,l])=><div key={cat}>
      <div style={{fontWeight:700,fontSize:13,margin:'4px 0'}}>{cat} ({l.length})</div>
      {l.map(x=><label key={x.p.code} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',fontSize:12.5,padding:'2px 0',opacity:off[x.p.code]?0.5:1}}>
        <input type="checkbox" checked={!off[x.p.code]} onChange={e=>setOff(o=>{ const n={...o}; if(e.target.checked) delete n[x.p.code]; else n[x.p.code]=true; return n; })}/>
        <b style={{minWidth:90}}>{x.p.code}</b><span style={{flex:'1 1 200px'}}>{String(x.p.desc).slice(0,70)}</span>
        <span className="muted" style={{fontSize:11.5}}>{fmt(x.p.cat, x.p.sous)} → <b style={{color:'var(--text)'}}>{fmt(x.cat, x.sous)}</b></span>
      </label>)}
    </div>)}
  </div>;
}

// v121 : codes rangés sous ce produit (logiciel comptable, PunchPro…) — retirer ou ajouter un code au groupe
function GroupeFiche({p, C, toast, err}){
  const [ajout,setAjout]=useState(false); const [occupe,setOccupe]=useState(false); const [retires,setRetires]=useState({});
  const fais = async (f, msg)=>{ setOccupe(true); try{ await f(); toast&&toast(msg); await C.lire(true); }catch(e){ err(e); setRetires({}); } setOccupe(false); };
  const src = m => m.src==='punch' ? 'PunchPro' : ((m.fiche && m.fiche.source) || 'Logiciel comptable');
  return <div style={{display:'grid',gap:4,fontSize:12.5}}>
    {(p.membres||[]).length>0 && <div className="muted" style={{fontSize:12}}>Codes regroupés sous {p.code} :</div>}
    {(p.membres||[]).filter(m=>!retires[m.code]).map(m=><div key={m.code} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
      <b>{m.code}</b><span>{m.desc}</span><span className="muted" style={{fontSize:11}}>· {src(m)}</span>
      <button className="btn btn-sm" style={{padding:'1px 6px',fontSize:11}} disabled={occupe} title="Ce n'est pas le même produit" onClick={()=>{ setRetires(r=>({...r, [m.code]:true})); fais(()=>C.retirerDuGroupe(m), 'Retiré du groupe : '+m.code); }}>retirer</button>
    </div>)}
    <div><button className="btn btn-sm" disabled={occupe} onClick={()=>setAjout(!ajout)}>🧩 Ranger un autre code sous {p.code}</button></div>
    {ajout && <ChoixProduit produits={C.produits.filter(x=>x!==p)} onChoix={x=>{ setAjout(false); fais(()=>C.regrouper(p.code, '', [x]), x.code+' → '+p.code); }}/>}
  </div>;
}

function RegrouperVue({C, toast, err, q}){
  const [ed,setEd]=useState({}); const [occupe,setOccupe]=useState(''); const [faits,setFaits]=useState({});
  const [lim,setLim]=useState(60);
  const base = g => ({code:g.code, desc:g.desc, coche:Object.fromEntries(g.membres.map(m=>[codeNorm(m.p.code), m.fort]))});
  const etatDe = g => ed[g.id] || base(g);
  const maj = (g, x) => setEd(s=>({...s, [g.id]:{...etatDe(g), ...x}}));
  const choisis = g => { const e = etatDe(g); return g.membres.filter(m=>e.coche[codeNorm(m.p.code)]).map(m=>m.p); };
  const valide = g => { const e = etatDe(g), k = codeNorm(e.code); return k && choisis(g).filter(p=>codeNorm(p.code)!==k).length>=1; };
  const liste = C.propositions.filter(g=>!faits[g.id]).filter(g=>!q || cvNorm(g.code+' '+g.desc+' '+g.membres.map(m=>m.p.code+' '+m.p.desc).join(' ')).includes(cvNorm(q)));
  const filsOk = liste.filter(g=>g.fil && valide(g));
  const confirmer = async gs=>{ setOccupe('Regroupement…'); setFaits(f=>({...f, ...Object.fromEntries(gs.map(g=>[g.id,true]))}));
    try{ for(const g of gs){ const e = etatDe(g); await C.regrouper(e.code, e.desc, choisis(g)); }
      await C.lire(true); setEd({}); toast&&toast(gs.length>1 ? gs.length+' groupes faits' : 'Regroupé sous '+etatDe(gs[0]).code); }catch(e){ err(e); setFaits({}); await C.lire(true); }
    setOccupe(''); };
  const refuser = async g=>{ setOccupe('…'); setFaits(f=>({...f, [g.id]:true})); try{ const e = etatDe(g); await C.pasPareil(g.membres.map(m=>m.p).filter(p=>codeNorm(p.code)!==codeNorm(e.code))); await C.lire(true); toast&&toast('Noté : pas le même produit'); }catch(e){ err(e); } setOccupe(''); };
  const src = p => p.src==='punch' ? 'PunchPro' : ((p.fiche && p.fiche.source) || 'Logiciel comptable');
  if(C.lu && !liste.length) return <div className="card muted" style={{fontSize:13}}>Rien à regrouper 👍</div>;
  return <div style={{display:'grid',gap:8}}>
    {filsOk.length>1 && <div className="card" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
      <span style={{fontSize:13}}>{filsOk.length} groupes de fils prêts (tel que proposé ci-dessous).</span>
      <button className="btn btn-sm btn-p" disabled={!!occupe} onClick={()=>confirmer(filsOk)}>✓ Regrouper tous les fils</button>
      {occupe && <span className="muted" style={{fontSize:12}}>{occupe}</span>}
    </div>}
    {liste.slice(0,lim).map(g=>{ const e = etatDe(g); const m = C.trouverProduit(e.code); const nouveauCode = !m;
      return <div key={g.id} className="card" style={{display:'grid',gap:6}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          <span className="muted" style={{fontSize:12}}>Ton code :</span>
          <input value={e.code} onChange={x=>maj(g,{code:x.target.value})} list={'grp-'+g.id} style={{flex:'0 1 150px',fontWeight:700}}/>
          <datalist id={'grp-'+g.id}>{g.membres.map(x=><option key={x.p.code} value={x.p.code}/>)}</datalist>
          <input value={e.desc} onChange={x=>maj(g,{desc:x.target.value})} disabled={m && m.src==='punch'} placeholder="Description" style={{flex:'1 1 220px'}}/>
        </div>
        <div className="muted" style={{fontSize:11.5}}>{nouveauCode ? 'Nouveau code : il sera créé dans ta liste (pas dans PunchPro).' : (m.src==='punch' ? 'Code PunchPro : la description reste celle de PunchPro.' : 'Code existant.')}</div>
        {g.membres.map(x=>{ const k = codeNorm(x.p.code), estM = k===codeNorm(e.code); const os = C.offresDe(x.p.code);
          return <label key={k} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',fontSize:13,opacity:e.coche[k]||estM?1:0.6}}>
            <input type="checkbox" checked={!!e.coche[k] || estM} disabled={estM} onChange={y=>maj(g,{coche:{...e.coche, [k]:y.target.checked}})}/>
            <b>{x.p.code}</b><span>{x.p.desc}</span>
            <span className="muted" style={{fontSize:11}}>· {src(x.p)}{os.length ? ' · '+os.map(o=>o.f+(o.prix>0?' '+cvMoney(o.prix)+(o.unite?'/'+o.unite:''):'')).join(', ') : ''}{estM ? ' · code maître' : ''}</span>
          </label>; })}
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <button className="btn btn-sm btn-p" disabled={!!occupe || !valide(g)} onClick={()=>confirmer([g])}>✓ Regrouper sous {e.code||'…'}</button>
          <button className="btn btn-sm" disabled={!!occupe} onClick={()=>refuser(g)}>Pas le même produit</button>
        </div>
      </div>; })}
    {liste.length>lim && <div style={{textAlign:'center'}}><button className="btn btn-sm" onClick={()=>setLim(lim+60)}>Afficher plus ({liste.length-lim} autres)</button></div>}
  </div>;
}

// Modifier la fiche d'un produit : description, unité, catégorie, sous-catégorie, photo (site fournisseur ou prise avec le téléphone)
function FicheEdit({p, edit, setEdit, C, toast, err, photoDe}){
  const [occupe,setOccupe]=useState('');
  const ref = useRef(null);
  const offres = C.offresDe(p.code);
  const photoFourn = offres.filter(o=>o.photo);
  const deposer = async f => { if(!f) return;
    try{ if(!peutDeposer()){ await requestToken('consent'); if(!peutDeposer()){ toast&&toast('Permission Drive refusée'); return; } }
      setOccupe('Envoi de la photo…'); const d = await driveDossier('Saran CRM — Photos produits');
      const r = await driveDeposer(new File([f], (edit.code||'produit').replace(/[\\/]/g,'-')+'.jpg', {type:f.type||'image/jpeg'}), d);
      setEdit(e=>({...e, photo:r.id})); setOccupe(''); toast&&toast('Photo ajoutée — clique Enregistrer');
    }catch(e){ setOccupe(''); err(e); } };
  return <div style={{display:'grid',gap:8,padding:'6px 0'}}>
    <div style={{display:'flex',gap:10,alignItems:'flex-start',flexWrap:'wrap'}}>
      <ProdPhoto src={edit.photo || photoDe(p)} taille={96}/>
      <div style={{display:'grid',gap:6,flex:'1 1 300px'}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <input value={edit.code} onChange={e=>setEdit({...edit,code:e.target.value})} style={{flex:'1 1 110px'}} placeholder="Code"/>
          <input value={edit.desc} onChange={e=>setEdit({...edit,desc:e.target.value})} style={{flex:'3 1 220px'}} placeholder="Description"/>
          <input value={edit.unite} onChange={e=>setEdit({...edit,unite:e.target.value})} style={{flex:'0 1 70px'}} placeholder="Unité"/>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <select value={edit.cat} onChange={e=>setEdit({...edit,cat:e.target.value})} style={{flex:'0 1 170px'}}>{[...new Set([...C.toutesCats, edit.cat])].map(c=><option key={c}>{c}</option>)}</select>
          <input value={edit.sous} onChange={e=>setEdit({...edit,sous:e.target.value})} list="prod-sous" style={{flex:'1 1 150px'}} placeholder="Sous-catégorie (ex. PVC, NMD, Thermostats)"/>
          <datalist id="prod-sous">{[...new Set([...(SOUS_SUGG[edit.cat]||[]), ...C.produits.filter(x=>x.cat===edit.cat && x.sous).map(x=>x.sous)])].map(s=><option key={s} value={s}/>)}</datalist>
