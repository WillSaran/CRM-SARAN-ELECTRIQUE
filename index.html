      {sansPO.length>0 && <div className="muted" style={{fontSize:11.5,padding:'4px 10px'}}>Sans PO</div>}
      {sansPO.map(j=>Ligne({j}))}
    </div>
    {!liste.length && <div className="muted" style={{fontSize:12}}>Aucune job ne correspond.</div>}
  </div>;
}

// Choix de destination : inventaire, shop, camions, puis contracteur → job, ou ton propre texte.
// v164 : destinations d'achat tirées du Répertoire (particuliers, commerces, contracteurs et leurs jobs)
function repDestinations(R){
  if(!R) return [];

  R.contr.forEach(c=>out.push({id:c.id, icone:'🏗', nom:c.code+' '+c.nom, cherche:[c.code, c.nom, ...(c.contacts||[]).map(k=>k.nom)].join(' '), dest:c.code,
    jobs:c.listeJobs.slice(0,40).map(j=>({label:j.label+(j.po?' · '+j.po:''), dest:j.ficheJob ? j.ficheJob.canon : cvJobCle({code:c.code}, {name:j.nom, po:j.po})}))}));
  R.pers.filter(p=>!p.masque && !p.sansNom).forEach(p=>out.push({id:p.id, icone:p.commerce?'🏪':'👤', nom:p.nom, cherche:[p.nom, ...p.noms, ...p.courriels].join(' '), dest:p.nom,
    lies:(p.lies||[]).filter(q=>!q.sansNom).map(q=>({id:q.id, icone:q.commerce?'🏪':'👤', nom:q.nom, dest:q.nom})),
    jobs:p.listeJobs.map(j=>({label:j.label, dest:j.ficheJob ? j.ficheJob.canon : ([...j.cles][0] || p.nom)}))}));
  return out;
}
function RepChoixDest({R, refAchat, onChoix}){

  const auto = !nq && motsRef.length ? L.filter(x=>x.icone!=='🏗' && x.nom.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=4).some(w=>motsRef.includes(w))).slice(0,4) : [];

        {x.jobs.length>0 && <button className="btn btn-sm" style={{fontSize:11}} onMouseDown={e=>e.preventDefault()} onClick={()=>setOuvert(ouvert===x.id?'':x.id)}>{ouvert===x.id ? '▲' : '▼'} {x.jobs.length} job{x.jobs.length>1?'s':''}</button>}
      </div>

      </div>}
    </div>)}

}
function CvChoixJob({clients, propose, autrePropose, suggestions, date, refAchat, onChoix, R}){
  const [groupe,setGroupe]=useState('');
  const [autre,setAutre]=useState(null);
  const [emp,setEmp]=useState(false);
  const today = cvDay(new Date(Date.now()-120*864e5).toISOString());
  const groupes = Object.values(clients).filter(c=>c.jobs.some(j=>j.last>=today)).sort((a,b)=>(a.code==='PART')-(b.code==='PART')||a.code.localeCompare(b.code));
  const g = groupes.find(c=>c.code===groupe);
  const pill = (txt, on, extra) => <button key={txt} className="btn btn-sm" onClick={on} style={extra}>{txt}</button>;
  return <div style={{marginTop:6}}>
    <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
      {propose && pill('✓ '+propose, ()=>onChoix(propose), {background:'var(--accent)',color:'#fff',border:'none'})}
      {[...(suggestions||[]), ...(autrePropose && autrePropose!==propose ? [autrePropose] : [])].filter((x,i,t)=>x!==propose && t.indexOf(x)===i).map(x=>pill('👤 '+x, ()=>onChoix(x), {borderColor:'var(--accent)',color:'var(--accent)',fontWeight:700}))}
      {CV_DESTS.map(d=>pill(cvIconeDest(d)+d, ()=>onChoix(d)))}
      {pill('✏️ Autre…', ()=>setAutre(autre===null?'':null))}
    </div>
    {R && <RepChoixDest R={R} refAchat={refAchat} onChoix={onChoix}/>}
    {(()=>{ const ag = agendaAchat(date, clients, refAchat).filter(x=>x.cle!==propose); if(!ag.length) return null;
      return <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:5,alignItems:'center'}}>
        <span className="muted" style={{fontSize:11.5}}>📅 À l'agenda :</span>
        {ag.map(x=><button key={x.cle} className="btn btn-sm" onClick={()=>onChoix(x.cle)} title={x.crew} style={(suggestions||[]).includes(x.cle)?{borderColor:'var(--accent)',color:'var(--accent)',fontWeight:700}:null}>
          {x.cle}{x.adr && <span style={{fontSize:11}}> · 📍 {x.adr}</span>}<span className="muted" style={{fontSize:10.5}}> · {x.mm?'même jour':cvFmtDay(x.jour)}{x.phase?' · '+x.phase:''}{x.crew?' · '+x.crew:''}</span></button>)}
      </div>; })()}
    <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:5}}>
      {groupes.map(c=>pill(c.code==='PART'?'Particuliers':c.code, ()=>setGroupe(groupe===c.code?'':c.code), groupe===c.code?{borderColor:'var(--accent)',color:'var(--accent)',fontWeight:700}:null))}
      {pill('💡 Éclairage Saran', ()=>onChoix('Éclairage Saran'))}
      {pill('👷 Employé', ()=>setEmp(!emp), emp?{borderColor:'var(--accent)',color:'var(--accent)',fontWeight:700}:null)}
    </div>
    {emp && <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:5,paddingLeft:8,borderLeft:'2px solid var(--accent)'}}>
      {CV_EMPLOYES.map(n=>pill(n, ()=>onChoix('Employé — '+n)))}
    </div>}
    {g && <CvListeJobs key={g.code} jobs={g.jobs.filter(j=>j.last>=today).map(j=>({cle:cvJobCle(g,j), po:j.po, label:j.name, info:(CV_STATUS[j.status]||[''])[0]+' · '+cvFmtDay(j.last)}))} onChoix={onChoix}/>}
    {autre!==null && <div style={{display:'flex',gap:5,marginTop:5}}>
      <input value={autre} onChange={e=>setAutre(e.target.value)} placeholder="Ex. : Outils, Bureau, Job Rejean Roy…" style={{flex:1}}/>
      <button className="btn btn-sm btn-p" disabled={!autre.trim()} onClick={()=>onChoix(autre.trim())}>OK</button>
    </div>}
  </div>;
}

    </div>}
    <CvDocuments docs={(documents||[]).filter(d=>!vue || !vue.fournisseur || d.fournisseur===vue.fournisseur)} type={docType} setType={setDocType} fournisseur={vue && vue.fournisseur}/>

  </div>;
}

// Barre « où on est » d'une job dans Projets : une pastille par phase (rough, finition, service…) —
// ✓ fait, date du prochain passage, ou « en attente ». Plusieurs à la fois (ex. finition cédulée + un service en attente).
// « + Passage » en ajoute un autre directement à l'agenda (ou dans En Attente).
const PJ_PHASES_ORDRE = ['ROUGH','FINITION','SERV','AJUST','RAPUP'];
function cvPhasesJob(job){
  const today = cvDay(new Date().toISOString());
  const par = {};
  job.events.forEach(e=>{ const ph = e.phase || 'SERV'; (par[ph] = par[ph] || []).push(e); });
  return Object.keys(par).sort((a,b)=>{ const ia=PJ_PHASES_ORDRE.indexOf(a), ib=PJ_PHASES_ORDRE.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); }).map(ph=>{
    const L = par[ph], reels = L.filter(e=>!e.attente), avenir = reels.filter(e=>e.day>=today).sort((a,b)=>a.day.localeCompare(b.day)), faits = reels.filter(e=>e.day<today);
    if(avenir.length) return {ph, etat:'prevu', texte: cvFmtDay(avenir[0].day)};
    if(L.some(e=>e.attente)) return {ph, etat:'attente', texte:'en attente'};
    return {ph, etat:'fait', texte: faits.length ? cvFmtDay(faits[faits.length-1].day) : ''};
  });
}
function CvPhasesJob({job, onDone}){
  const phases = cvPhasesJob(job);
  const style = {fait:{c:'var(--success)', bg:'rgba(63,185,80,0.13)', i:'✓ '}, prevu:{c:'var(--accent)', bg:'rgba(88,166,255,0.13)', i:'📅 '}, attente:{c:'var(--warning)', bg:'rgba(210,153,34,0.15)', i:'⏳ '}};
  return <div onClick={e=>e.stopPropagation()} style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center',margin:'5px 0 3px',cursor:'default'}}>
    {phases.length ? phases.map(p=>{ const st = style[p.etat];
      return <span key={p.ph} title={p.etat==='fait'?'Fait':p.etat==='prevu'?'Prochain passage':'Dans En Attente — pas encore cédulé'}
        style={{fontSize:11.5,fontWeight:700,padding:'2px 8px',borderRadius:999,background:st.bg,color:st.c,whiteSpace:'nowrap'}}>{st.i}{p.ph.charAt(0)+p.ph.slice(1).toLowerCase()}{p.texte ? ' · '+p.texte : ''}</span>; })
      : <span className="muted" style={{fontSize:12}}>Rien de planifié</span>}
    <CvAjouterPassage job={job} libelle="+ Passage" onDone={onDone}/>
  </div>;
}

function ProjetsListeView({data, cfg, toast, refreshKey}){

  useEffect(()=>{
    if(!cfg || !cfg.calendarIds){ setLoadingEv(false); return; }
    let cancelled=false;
    setLoadingEv(true); setErrEv('');
    const now=new Date();
    const timeMin=new Date(now); timeMin.setDate(timeMin.getDate()-180);
    const timeMax=new Date(now); timeMax.setDate(timeMax.getDate()+180);
    const calIds=(cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);

      .then(evs=>{ if(!cancelled) setEvents(evs); })
      .catch(e=>{ if(!cancelled) setErrEv(apiErrMsg(e)||'Erreur de chargement du calendrier.'); })

// v126 : convertisseur pieds ⇄ mètres (accepte aussi 10'6")
function ConvertisseurCard(){
  const [pi,setPi]=useState(''); const [m,setM]=useState('');
  const lire = v => { const t = String(v||'').trim().replace(',','.'); const fi = t.match(/^(\d+(?:\.\d+)?)\s*(?:'|pi|pieds?)\s*(?:(\d+(?:\.\d+)?)\s*(?:"|po)?)?$/i);
    if(fi) return +fi[1] + (fi[2] ? +fi[2]/12 : 0); const n = parseFloat(t); return isNaN(n) ? null : n; };
  const f = n => n==null ? '' : String(Math.round(n*100)/100).replace('.',',');
  const pouces = n => { if(n==null) return ''; const tot = Math.round(n*12); return Math.floor(tot/12)+"' "+(tot%12)+'"'; };
  const nPi = lire(pi);
  return <div className="card" style={{maxWidth:420,marginBottom:16,boxSizing:'border-box'}}>
    <div style={{fontWeight:700,fontSize:13.5,marginBottom:8}}>📏 Pieds ⇄ mètres</div>

      <input value={pi} inputMode="decimal" placeholder="pieds" onChange={e=>{ setPi(e.target.value); const n=lire(e.target.value); setM(n==null ? '' : f(n*0.3048)); }} style={{flex:'1 1 70px',minWidth:0,textAlign:'right'}}/><span>pi</span>
      <span className="muted">=</span>
      <input value={m} inputMode="decimal" placeholder="mètres" onChange={e=>{ setM(e.target.value); const n=lire(e.target.value); setPi(n==null ? '' : f(n/0.3048)); }} style={{flex:'1 1 70px',minWidth:0,textAlign:'right'}}/><span>m</span>
    </div>
    <div className="muted" style={{fontSize:11,marginTop:6}}>{nPi!=null && pi ? pouces(nPi)+' · ' : ''}1 m = 3,281 pi · 1 pi = 0,3048 m</div>
  </div>;
}

// Écrit une adresse SEULEMENT dans les événements qui n'en ont pas : relit chaque événement juste avant,
// et ne touche jamais une adresse déjà là (même si tu l'as ajoutée entre-temps à la main).
// ── Adresses Google ─────────────────────────────────────────────────────
// Champ d'adresse avec les suggestions de Google : on tape le début, on choisit, et l'adresse complète
// (avec ville et code postal) est mise dans le champ. Places API (New) d'abord, sinon l'ancienne API Places.
// Si aucune n'est activée sur la clé Google, le champ reste un champ texte normal (avec un petit avis).
const ADR = {mode:'', panne:''};
const ADR_BIAS = {center:{lat:45.307, lng:-73.262}, radius:50000};   // autour de Saint-Jean-sur-Richelieu
function adrNettoyer(s){ return String(s||'').replace(/,\s*Canada$/i,'').trim(); }
async function adrGoogle(){
  for(let i=0; i<20 && !(window.google && window.google.maps); i++) await new Promise(r=>setTimeout(r,250));
  return window.google && window.google.maps;
}
async function adrNouvelle(g, texte, session){
  const lib = g.importLibrary ? await g.importLibrary('places') : null;
  if(!lib || !lib.AutocompleteSuggestion) throw new Error('Places API (New) absente');
  if(!session.jeton && lib.AutocompleteSessionToken) session.jeton = new lib.AutocompleteSessionToken();
  const r = await lib.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:texte, sessionToken:session.jeton, includedRegionCodes:['ca'], language:'fr', locationBias:ADR_BIAS});
  return (r.suggestions||[]).filter(x=>x.placePrediction).slice(0,5).map(x=>({
    texte: x.placePrediction.text.toString(),
    choisir: async()=>{ const pl = x.placePrediction.toPlace(); await pl.fetchFields({fields:['formattedAddress']}); session.jeton = null; return adrNettoyer(pl.formattedAddress || x.placePrediction.text.toString()); }
  }));
}
async function adrAncienne(g, texte){
  const P = g.places;
  if(!P || !P.AutocompleteService) throw new Error('Places non chargé');
  const liste = await new Promise((ok,ko)=>new P.AutocompleteService().getPlacePredictions(
    {input:texte, componentRestrictions:{country:'ca'}, types:['address'], language:'fr', locationBias:ADR_BIAS},
    (r,st)=> (st===P.PlacesServiceStatus.OK || st===P.PlacesServiceStatus.ZERO_RESULTS) ? ok(r||[]) : ko(new Error(String(st)))));
  return liste.slice(0,5).map(p=>({
    texte: p.description,
    choisir: ()=>new Promise(ok=>new P.PlacesService(document.createElement('div')).getDetails({placeId:p.place_id, fields:['formatted_address']},
      d=>ok(adrNettoyer((d && d.formatted_address) || p.description))))
  }));
}
async function adrSuggestions(texte, session){
  const g = await adrGoogle();
  if(!g) throw new Error('Google Maps ne s\'est pas chargé');
  if(ADR.mode!=='old'){
    try{ const r = await adrNouvelle(g, texte, session); ADR.mode='new'; return r; }
    catch(e){ if(ADR.mode==='new') throw e; console.warn('[adresses] Places API (New) :', e); }
  }
  try{ const r = await adrAncienne(g, texte); ADR.mode='old'; return r; }
  catch(e){ ADR.panne = String(e.message||e); throw e; }
}
function ChampAdresse({value, onChange, placeholder, style, inputStyle}){
  const [sugg,setSugg]=useState([]);
  const [msg,setMsg]=useState('');
  const tape=useRef(false), session=useRef({}), minuterie=useRef(null), dernier=useRef('');
  useEffect(()=>{
    if(!tape.current) return;
    tape.current=false;
    const t = String(value||'').trim();
    clearTimeout(minuterie.current);
    if(t.length<4 || ADR.panne){ setSugg([]); if(ADR.panne) setMsg('Suggestions Google pas activées — écris l\'adresse à la main.'); return; }
    minuterie.current = setTimeout(async()=>{
      dernier.current = t;
      try{ const r = await adrSuggestions(t, session.current); if(dernier.current===t){ setSugg(r); setMsg(''); } }
      catch(e){ setSugg([]); setMsg('Suggestions Google pas activées — écris l\'adresse à la main.'); }
    }, 300);
  },[value]);
  useEffect(()=>()=>clearTimeout(minuterie.current),[]);
  const choisir = async s=>{ setSugg([]); let a = s.texte; try{ a = await s.choisir(); }catch(e){} onChange(a); };
  return <div style={{flex:'1 1 220px',minWidth:0,...style}}>
    <input value={value||''} onChange={e=>{ tape.current=true; onChange(e.target.value); }} placeholder={placeholder} autoComplete="off"
      onKeyDown={e=>{ if(e.key==='Escape') setSugg([]); }} style={{width:'100%',...inputStyle}}/>
    {sugg.length>0 && <div style={{border:'1px solid var(--border2)',borderRadius:8,marginTop:3,background:'var(--bg2)',overflow:'hidden'}}>
      {sugg.map((s,i)=><div key={i} onClick={()=>choisir(s)} style={{padding:'8px 10px',cursor:'pointer',fontSize:13,borderTop:i?'1px solid var(--border)':undefined}}>📍 {s.texte}</div>)}
      <div className="muted" style={{fontSize:10.5,padding:'2px 10px 4px',textAlign:'right'}}>Adresses Google</div>
    </div>}
    {msg && <div className="muted" style={{fontSize:11,marginTop:2}}>{msg}</div>}
  </div>;
}

async function ecrireAdresseVide(evs, adresse){
  let n = 0;
  for(const {eventId, calendarId} of evs){
    const ev = await window.gapi.client.calendar.events.get({calendarId, eventId});
    if(String(ev.result.location||'').trim()) continue;
    await window.gapi.client.calendar.events.patch({calendarId, eventId, resource:{location:adresse}});
    n++;
  }
  return n;
}
// Adresses manquantes : propositions du script « adresses » (onglet « Adresses » du registre des jobs).
// ✓ écrit l'adresse dans tous les événements de la job (agenda) ; ✕ la refuse.
function useAdresses(cfg){
  const [etat,setEtat]=useState({liste:[], lu:false});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    if(!id) return;
    try{
      const r = await lireCache(id, 'Adresses!A1:J', force);
      const liste = (r.result.values||[]).slice(1).map((v,i)=>({row:i+2, cle:v[0]||'', job:v[1]||'', date:v[2]||'', evs:(v[3]||'').split(';').filter(Boolean), adresse:v[4]||'', autres:(v[5]||'').split(' | ').filter(Boolean), source:v[6]||'', lien:v[7]||'', statut:v[8]||''}));
      setEtat({liste, lu:true});
    }catch(e){ setEtat({liste:[], lu:true}); }
  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  const decider = async (a, adresse)=>{
    const statut = adresse ? 'Écrite' : 'Refusée';
    setEtat(s=>({...s, liste:s.liste.map(x=>x.row===a.row ? {...x, statut} : x)}));
    try{
      if(adresse) await ecrireAdresseVide(a.evs.map(ev=>{ const [eventId, calendarId] = ev.split('|'); return {eventId, calendarId}; }), adresse);
      await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Adresses!E'+a.row+':J'+a.row, valueInputOption:'RAW',
        resource:{values:[[adresse||a.adresse, a.autres.join(' | '), a.source, a.lien, statut, new Date().toLocaleString('fr-CA')]]}});
    }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); lire(); }
  };
  return [etat.liste.filter(a=>a.statut==='Proposée').sort((x,y)=>x.date.localeCompare(y.date)), decider, etat.liste.filter(a=>/^Rien/.test(a.statut)).length];
}
// Adresse d'une job dans Projets : affichée si elle existe ; sinon un champ (avec la proposition trouvée, s'il y en a une)
// pour l'écrire dans les passages qui n'en ont pas.
function CvAdresseJob({job, propositions, onDone, onPasDAdresse}){
  const sans = job.events.filter(e=>!String(e.location||'').trim() && e.id && e.calId);
  const prop = (propositions||[]).find(a=>a.evs.some(x=>sans.some(e=>x.startsWith(e.id+'|'))));
  const [txt,setTxt]=useState(prop ? prop.adresse : '');
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState('');
  if(!sans.length) return job.address ? <div style={{fontSize:12.5,margin:'6px 0'}}>📍 {job.address}</div> : null;
  const ecrire = async ()=>{
    setBusy(true); setMsg('');
    try{ const n = await ecrireAdresseVide(sans.map(e=>({eventId:e.id, calendarId:e.calId})), txt.trim()); setMsg('✅ Adresse ajoutée à '+n+' passage'+(n>1?'s':'')+'.'); onDone && onDone(); }
    catch(e){ setMsg('Impossible : '+apiErrMsg(e)); }
    setBusy(false);
  };
  return <div style={{margin:'8px 0',padding:8,border:'1px dashed var(--border2)',borderRadius:8,fontSize:12.5}}>
    <div style={{marginBottom:4}}>📍 {job.address ? <>Adresse : <b>{job.address}</b> — mais {sans.length} passage{sans.length>1?'s':''} sans adresse.</> : <>Pas d'adresse sur {sans.length} passage{sans.length>1?'s':''}.</>}{prop && <span className="muted"> Proposée par La mémoire.</span>}</div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
      <ChampAdresse value={txt} onChange={setTxt} placeholder={job.address || 'Commence à taper : 123 rue Dauphine…'} inputStyle={{padding:'6px 10px'}}/>
      {job.address && !txt && <button className="btn btn-sm" onClick={()=>setTxt(job.address)}>Même adresse</button>}
      <button className="btn btn-sm btn-p" disabled={busy || !txt.trim()} onClick={ecrire}>{busy?'…':'✓ Écrire'}</button>
    </div>
    {msg && <div style={{marginTop:4}}>{msg}</div>}
    <div className="muted" style={{fontSize:11,marginTop:3}}>Écrit seulement dans les passages sans adresse — les adresses déjà là ne sont jamais touchées.</div>
  </div>;
}

// Fils marqués « réglé » à la main dans Courriels : onglet « CourrielsSuivi » du registre des jobs (Lien | Statut | Le).
function useCourrielsReglés(cfg){

  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  const marquer = async (cle, statut)=>{
    const le = new Date().toLocaleDateString('fr-CA');
    setEtat(s=>{ const map={...s.map}; if(statut) map[cle]={statut, le}; else delete map[cle]; return {...s, map}; });
    try{
      if(!etat.existe) await ensureSheetsExist(id, [{name:'CourrielsSuivi', headers:['Fil','Statut','Le']}]);
      const ligne=[cle, statut||'', le];
      if(etat.rows[cle]) await sheetsUpdateRow(id, 'CourrielsSuivi', etat.rows[cle], ligne); else await sheetsAppendRow(id, 'CourrielsSuivi', ligne);
      await lire(true);
    }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); lire(true); }
  };
  return [etat.map, marquer];
}
// Fin de la semaine prochaine (dimanche) : les commandes à placer = cette semaine + la prochaine, comme dans Agenda.
function cvFinSemaineProchaine(){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow+13); return localDateStr(d); }
function cvJoursDepuis(d){ const t=Date.parse(String(d).slice(0,10)); return isNaN(t) ? null : Math.floor((Date.now()-t)/864e5); }

// ── UI: Courriels — suivi des fils de courriels de tes jobs (onglet « Courriels » rempli par La mémoire).
function CourrielsView({cfg, refreshKey}){
  const {loading, err, events, registry, factures, courriels} = useClientsData(cfg, refreshKey+'|c');
  const [reglés, marquer] = useCourrielsReglés(cfg);
  const [filtre,setFiltre]=useState('repondre');
  const [q,setQ]=useState('');
  const clients = useMemo(()=>cvBuildClients(events, registry, factures),[events, registry, factures]);
  if(loading) return <div className="card" style={{display:'flex',gap:10,alignItems:'center'}}><div className="spin"></div><span className="muted">Lecture des courriels…</span></div>;
  if(err) return <div className="card" style={{color:'var(--danger)'}}>Impossible de lire : {err}</div>;
  const jobs = Object.values(clients).flatMap(c=>c.jobs.map(j=>({c,j})));
  const nomPO = po => { const x = jobs.find(t=>t.j.po===po); return x ? (x.c.code!=='PART'?x.c.code+' ':'')+x.j.name : po; };
  const tous = Object.entries(courriels||{}).flatMap(([po,l])=>l.map(f=>({...f, po, cle:f.lien||(po+'|'+f.sujet), job:nomPO(po), jours:cvJoursDepuis(f.dernier)})));
  const regle = f => { const r = reglés[f.cle]; return r && r.le >= String(f.dernier).slice(0,10); };   // un nouveau message après « réglé » le fait revenir
  const groupes = {
    repondre:{l:'À toi de répondre', f:x=>/toi de r/i.test(x.statut) && !regle(x)},
    attente:{l:'En attente de leur réponse', f:x=>/attente/i.test(x.statut) && !regle(x)},
    recu:{l:'Reçus', f:x=>/^re[çc]u/i.test(x.statut) && !regle(x)},
    regles:{l:'Réglés', f:x=>regle(x) || /^r[ée]pondu/i.test(x.statut)},
    info:{l:'Automatiques', f:x=>/info/i.test(x.statut)}
  };
  const liste = tous.filter(groupes[filtre].f).filter(x=>!q || cvNorm([x.sujet,x.job,x.de,x.extrait,x.po].join(' ')).includes(cvNorm(q)))
    .sort((a,b)=> filtre==='regles'||filtre==='info' ? String(b.dernier).localeCompare(String(a.dernier)) : String(a.dernier).localeCompare(String(b.dernier)));
  const couleur = j => j==null ? 'var(--muted)' : j>=7 ? 'var(--danger)' : j>=3 ? 'var(--warning)' : 'var(--success)';
  return <div>
    <h2 className="fh" style={{margin:'0 0 4px',fontSize:22}}>Courriels</h2>
    <div className="muted" style={{fontSize:13,marginBottom:12}}>Les fils de courriels de tes jobs, lus par La mémoire à midi et à minuit. Les plus vieux en premier : ce qui attend depuis longtemps est en rouge.</div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      {Object.entries(groupes).map(([k,g])=><button key={k} className={'btn btn-sm'+(filtre===k?' btn-p':'')} onClick={()=>setFiltre(k)}>{g.l} ({tous.filter(g.f).length})</button>)}
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Chercher (sujet, job, personne)…" style={{flex:'1 1 160px',width:'auto',minWidth:0,padding:'6px 10px'}}/>
    </div>
    <div className="card">
      {!liste.length && <div className="muted" style={{fontSize:13}}>{filtre==='repondre' ? '✅ Aucun courriel n\'attend ta réponse.' : 'Rien ici.'}</div>}
      {liste.map(f=><div key={f.cle} style={{padding:'10px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
          <div style={{minWidth:0}}><b>{f.sujet}</b><div className="muted" style={{fontSize:12}}>{f.job}{f.de ? ' · dernier message : '+f.de : ''}{f.n ? ' · '+f.n+' messages' : ''}</div></div>
          <div style={{textAlign:'right',whiteSpace:'nowrap'}}>
            <span style={{fontWeight:800,color:couleur(f.jours)}}>{f.jours==null ? '' : f.jours===0 ? "aujourd'hui" : 'il y a '+f.jours+' j'}</span>
            <div className="muted" style={{fontSize:11.5}}>{cvFmtDay(String(f.dernier).slice(0,10))}</div>
          </div>
        </div>
        {f.extrait && <div className="muted" style={{fontSize:12.5,margin:'4px 0',fontStyle:'italic'}}>« {f.extrait} »</div>}
        <div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap',alignItems:'center'}}>
          {f.lien && <a className="btn btn-sm btn-p" href={f.lien} target="_blank" rel="noopener" style={{textDecoration:'none'}}>{filtre==='attente' ? 'Relancer dans Gmail ↗' : 'Ouvrir dans Gmail ↗'}</a>}
          {filtre!=='regles' && filtre!=='info' && <button className="btn btn-sm" onClick={()=>marquer(f.cle,'Réglé')}>✓ Réglé</button>}
          {filtre==='regles' && reglés[f.cle] && <button className="btn btn-sm" onClick={()=>marquer(f.cle,'')}>Annuler « réglé »</button>}
          {filtre==='attente' && f.jours>=5 && <span style={{fontSize:12,color:'var(--warning)'}}>Pas de réponse depuis {f.jours} jours — une relance ?</span>}
        </div>
      </div>)}
    </div>
    <div className="muted" style={{fontSize:11.5,marginTop:8}}>Seuls les fils liés à une job (PO ou numéro de job dans le sujet ou le courriel) sont ici. « ✓ Réglé » le retire de la liste ; il revient tout seul si un nouveau message arrive.</div>
  </div>;
}

// ── UI: Tableau de bord — tout ce qui demande ton attention, tiré des mêmes données que

// v109 : job sans couleur -> un clic sur l'équipe met SA couleur sur l'événement dans Google Agenda (ne change que la couleur).
function AttitrerEquipe({ev, toast, onFait}){
  const [enCours,setEnCours]=useState('');
  if(!ev || !ev.id || !ev.calId) return null;
  const choisir = async (k, clic) => { clic.stopPropagation(); if(enCours) return; setEnCours(k);
    try{ await patchEventFull(ev.calId, ev.id, {colorId:k}); ev.colorId = k; ev.couleurId = k; toast && toast('✅ Attitrée à '+equipeNom(k)+' (couleur mise dans l\'agenda)'); onFait && onFait(); }
    catch(e){ toast && toast('Erreur : '+((e && e.result && e.result.error && e.result.error.message) || e.message || e)); }
    setEnCours(''); };
  return <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:3}} onClick={c=>c.stopPropagation()}>
    <span className="muted" style={{fontSize:11}}>À qui ?</span>
    {EQUIPES_ORDRE.filter(k=>CREW_COLORS[k]).map(k=><button key={k} className="btn btn-sm" disabled={!!enCours} title={'Mettre la couleur de '+equipeNom(k)+' sur cet événement'}
      style={{padding:'1px 8px',fontSize:11,background:GCAL_COLOR_MAP[k],color:texteSur(GCAL_COLOR_MAP[k]),border:'none'}} onClick={c=>choisir(k,c)}>{enCours===k?'…':equipeNom(k)}</button>)}
  </div>;
}

// ── UI: Heures employés — LECTURE SEULE depuis le Sheet PunchPro ─────────
// Semaines confirmées (« Confirmer ma semaine » dans PunchPro → courriel → La mémoire, script semaines.gs)
// Onglet « Semaines confirmées » du registre des jobs : Id, Semaine, Employé, Confirmée le, Total heures, Heures supp, Banque, Déplacement, Note, Lien.
// Retourne {pret, absent, de(semaine, nom)} — de() donne la confirmation la plus récente de l'employé pour la semaine.
// v122 : tu peux aussi confirmer une semaine à la main (ex. l'employé te l'a confirmée par courriel) — une ligne « CRM-… » est ajoutée
// au même onglet (le script semaines.gs ne fait qu'ajouter ses lignes, il ne touche pas aux tiennes). « Annuler » ajoute une ligne ANNULÉE.
const SEM_ENTETE_CRM = ['Id','Semaine','Employé','Confirmée le','Total heures','Heures supp','Banque','Déplacement (min)','Note','Lien'];
function useSemainesConfirmees(cfg, refreshKey){
  const [etat,setEtat]=useState({pret:false, absent:false, map:{}});
  const [tick,setTick]=useState(0);
  const id = cfg.memoireJobsSpreadsheetId;
  useEffect(()=>{ if(!id) return; let ok=true;
    lireCache(id, qSheet('Semaines confirmées')+'!A1:J', !!refreshKey || tick>0).then(r=>{ if(!ok) return;
      const map={}; (r.result.values||[]).slice(1).forEach(x=>{ if(!x[1]||!x[2]) return;
        const k=x[1]+'|'+cvNorm(x[2]), c={id:x[0]||'', semaine:x[1], employe:x[2], le:x[3]||'', total:cvNum(x[4]), supp:cvNum(x[5]), banque:cvNum(x[6]), dep:cvNum(x[7]), note:x[8]||'', lien:x[9]||''};
        if(!map[k] || c.le>=map[k].le) map[k]=c; });
      setEtat(s=>({pret:true, absent:false, map})); }).catch(()=>{ if(ok) setEtat({pret:true, absent:true, map:{}}); });
    return ()=>{ ok=false; }; },[id, refreshKey, tick]);
  const maintenant = ()=>{ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes()); };
  const ecrire = async (semaine, nom, total, note)=>{
    const ligne = ['CRM-'+Date.now(), semaine, nom, maintenant(), total!=null ? Math.round(total*100)/100 : '', '', '', '', note, ''];
    const k = semaine+'|'+cvNorm(nom);
    setEtat(s=>({...s, absent:false, map:{...s.map, [k]:{id:ligne[0], semaine, employe:nom, le:ligne[3], total:cvNum(ligne[4]), note, lien:''}}}));   // tout de suite à l'écran
    if(etat.absent) await ensureSheetsExist(id, [{name:'Semaines confirmées', headers:SEM_ENTETE_CRM}]);
    await sheetsAppendRow(id, qSheet('Semaines confirmées'), ligne);
    setTick(t=>t+1);
  };
  const annulee = c => c && /^ANNUL/i.test(c.note||'');
  return {...etat,
    de:(semaine, nom)=>{ const c = etat.map[semaine+'|'+cvNorm(nom)]; return c && !annulee(c) ? c : null; },
    confirmerMain:(semaine, nom, total, note)=>ecrire(semaine, nom, total, note||'Confirmée à la main dans le CRM'),
    annuler:(semaine, nom)=>ecrire(semaine, nom, null, 'ANNULÉE dans le CRM')};
}
// Pastille ✓ : confirmée (avec la date) ; ⚠ si le total de PunchPro a changé depuis de plus de 15 min.
function SemaineConfirmee({c, total}){
  if(!c) return <span className="muted" style={{fontSize:12}}>pas confirmée</span>;
  const ecart = c.total!=null && Math.abs((total||0)-c.total) > 0.25;
  const quand = c.le ? new Date(c.le.replace(' ','T')).toLocaleDateString('fr-CA',{weekday:'short',day:'numeric',month:'short'}) : '';
  return <a href={c.lien||undefined} target="_blank" rel="noopener" style={{textDecoration:'none',whiteSpace:'nowrap',fontSize:12.5,color:ecart?'var(--warning)':'var(--success)',fontWeight:700}}
    title={'Confirmée le '+c.le+(c.total!=null?' — '+fmtH(c.total):'')+(c.supp?' (supp '+fmtH(c.supp)+')':'')+(c.note?' — '+c.note:'')}>
    ✓ {quand}{/^CRM-/.test(c.id||'') && <span style={{fontWeight:500}}> (à la main)</span>}{ecart && <span style={{fontWeight:600}}> · ⚠ confirmé {fmtH(c.total)}, maintenant {fmtH(total)}</span>}</a>;
}
// Confirmer / annuler à la main dans la page Heures
function ConfirmerMain({conf, week, nom, total}){
  const [ouvert,setOuvert]=useState(false); const [note,setNote]=useState('Confirmée par courriel'); const [occupe,setOccupe]=useState(false);
  const c = conf.de(week, nom);
  const go = async f=>{ setOccupe(true); try{ await f(); setOuvert(false); }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); } setOccupe(false); };
  if(c) return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}><SemaineConfirmee c={c} total={total}/>
    {/^CRM-/.test(c.id||'') && <button className="btn btn-sm" style={{padding:'1px 6px',fontSize:11}} disabled={occupe} onClick={()=>{ if(confirm('Annuler la confirmation de '+nom+' ?')) go(()=>conf.annuler(week, nom)); }}>annuler</button>}</div>;
  if(!ouvert) return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}><span className="muted" style={{fontSize:12}}>pas confirmée</span>
    <button className="btn btn-sm" style={{padding:'1px 8px',fontSize:11.5}} onClick={()=>setOuvert(true)}>✓ Confirmer</button></div>;
  return <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
    <input value={note} onChange={e=>setNote(e.target.value)} placeholder="Note (ex. confirmée par courriel)" style={{width:170,padding:'3px 6px',fontSize:12}}/>
    <button className="btn btn-sm btn-p" disabled={occupe} onClick={()=>go(()=>conf.confirmerMain(week, nom, total, note))}>OK</button>
    <button className="btn btn-sm" disabled={occupe} onClick={()=>setOuvert(false)}>✕</button></div>;
}
// v136 : banque d'heures supp — total de tout temps (heures au-delà de 40 h par semaine, même calcul que PunchPro),
// valeur à un taux que tu fixes, moins les achats associés à l'employé (Fournisseurs › 👷 Employé). Onglet « Banque employés » (La mémoire — Jobs).
const BQ_ENTETE = ['Employé','Taux ($/h supp)','Heures déjà payées','Note','Mis à jour'];
function BanqueSupp({cfg, emps, pts}){
  const id = cfg.memoireJobsSpreadsheetId;
  const [reg,setReg]=useState({lu:false, rows:{}, absent:false});
  const [achats,setAchats]=useState([]);
  const lire = useCallback(async (force)=>{
    try{ const r = await lireCache(id, qSheet('Banque employés')+'!A1:E', force); const rows = {};
      (r.result.values||[]).slice(1).forEach((x,i)=>{ if(x[0]) rows[cvNorm(x[0])] = {nom:x[0], taux:cvNum(x[1]), payees:cvNum(x[2])||0, note:x[3]||'', row:i+2}; });
      setReg({lu:true, rows, absent:false}); }catch(e){ setReg({lu:true, rows:{}, absent:true}); }
    try{ const a = await lireCache(cfg.memoireAchatsSpreadsheetId, 'A1:L', force);
      setAchats((a.result.values||[]).slice(1).filter(r=>/^Employé — /.test(r[8]||'')).map(r=>({emp:String(r[8]).replace(/^Employé — /,''), st:cvNum(r[4])||0, total:cvNum(r[5])||0, date:r[2]||'', f:r[0]||'', num:r[1]||''}))); }catch(e){}
  },[id, cfg.memoireAchatsSpreadsheetId]);
  useEffect(()=>{ lire(); },[lire]);
  // heures supp de tout temps : chaque semaine, ce qui dépasse 40 h
  const supp = useMemo(()=>{ const sem = [...new Set(pts.map(p=>p.date && getWeek(new Date(p.date+'T12:00:00'))).filter(Boolean))]; const m = {};
    sem.forEach(w=>{ const t = heuresParEmployeSemaine(pts, w); Object.entries(t).forEach(([nom, jours])=>{ const h = Object.values(jours).reduce((a,b)=>a+b,0); if(h>40) m[nom] = (m[nom]||0) + (h-40); }); });
    return m; },[pts]);
  const prenom = n => cvNorm(String(n||'').split(/\s+/)[0]);
  const global = reg.rows[cvNorm('TOUS')] || {taux:null};
  const ecrire = async (nom, champs)=>{ const ex = reg.rows[cvNorm(nom)] || {nom, taux:'', payees:'', note:''};
    const ligne = [nom, champs.taux!==undefined ? champs.taux : (ex.taux!=null ? ex.taux : ''), champs.payees!==undefined ? champs.payees : (ex.payees||''), ex.note||'', new Date().toLocaleString('fr-CA')];
    setReg(r=>({...r, absent:false, rows:{...r.rows, [cvNorm(nom)]:{...ex, nom, taux:cvNum(ligne[1]), payees:cvNum(ligne[2])||0}}}));
    try{ if(reg.absent) await ensureSheetsExist(id, [{name:'Banque employés', headers:BQ_ENTETE}]);
      if(ex.row) await sheetsUpdateRow(id, qSheet('Banque employés'), ex.row, ligne); else await sheetsAppendRow(id, qSheet('Banque employés'), ligne);
      await lire(true); }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); } };
  const lignes = emps.map(e=>{ const r = reg.rows[cvNorm(e.nom)] || {}; const taux = r.taux!=null ? r.taux : global.taux;
    const h = Math.round((supp[e.nom]||0)*100)/100, payees = r.payees||0, reste = Math.max(0, h - payees);
    const ach = achats.filter(a=>prenom(a.emp)===prenom(e.nom)); const deduit = ach.reduce((t,a)=>t+(a.total||a.st),0);
    const valeur = taux!=null ? reste*taux : null;
    return {e, h, payees, reste, taux, perso:r.taux!=null, ach, deduit, valeur, solde: valeur!=null ? valeur-deduit : null}; });
  const champ = (val, onSave, w, ph) => <input key={String(val)} defaultValue={val==null?'':val} placeholder={ph} inputMode="decimal" onBlur={e=>{ const v=e.target.value.trim().replace(',','.'); if(v!==String(val==null?'':val)) onSave(v); }} style={{width:w||64,textAlign:'right',padding:'3px 6px'}}/>;
  return <div className="card" style={{marginTop:16,padding:0,overflowX:'auto'}}>
    <div style={{padding:'12px 14px',display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap',alignItems:'center'}}>
      <div><div className="fh" style={{fontSize:16}}>Banque d'heures supp</div>
        <div className="muted" style={{fontSize:11.5}}>Depuis le début dans PunchPro : heures au-delà de 40 h par semaine. Valeur = heures × taux. Les achats associés à l'employé (Fournisseurs › 👷 Employé) sont déduits.</div></div>
      <div style={{display:'flex',gap:6,alignItems:'center'}}><span className="muted" style={{fontSize:12}}>Valeur d'une heure supp :</span>{champ(global.taux, v=>ecrire('TOUS', {taux:v}), 70, '$/h')}<span className="muted">$/h</span></div>
    </div>
    <table>
      <thead><tr><th>Employé</th><th style={{textAlign:'right'}}>H supp (total)</th><th style={{textAlign:'right'}}>Déjà payées</th><th style={{textAlign:'right'}}>Taux</th><th style={{textAlign:'right'}}>Valeur</th><th style={{textAlign:'right'}}>Achats déduits</th><th style={{textAlign:'right'}}>Solde</th></tr></thead>
      <tbody>{lignes.map(l=><tr key={l.e.nom}>
        <td><span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:l.e.couleur,marginRight:6}}></span>{l.e.nom}</td>
        <td style={{textAlign:'right',fontWeight:700}}>{fmtH(l.h)}</td>
        <td style={{textAlign:'right'}}>{champ(l.payees||'', v=>ecrire(l.e.nom, {payees:v}), 60, 'h')}</td>
        <td style={{textAlign:'right'}}>{champ(l.perso ? l.taux : '', v=>ecrire(l.e.nom, {taux:v}), 60, l.taux!=null ? String(l.taux) : '$/h')}</td>
        <td style={{textAlign:'right'}}>{l.valeur!=null ? cvMoney(l.valeur) : <span className="muted">fixe le taux</span>}</td>
        <td style={{textAlign:'right'}} title={l.ach.map(a=>a.f+' #'+a.num+' · '+a.date+' · '+cvMoney(a.total||a.st)).join('\n')}>{l.deduit ? '− '+cvMoney(l.deduit) : '—'}{l.ach.length ? <span className="muted" style={{fontSize:11}}> ({l.ach.length})</span> : null}</td>
        <td style={{textAlign:'right',fontWeight:800,color:l.solde==null?'var(--muted)':l.solde<0?'var(--danger)':'var(--success)'}}>{l.solde!=null ? cvMoney(l.solde) : '—'}{l.solde!=null && l.taux ? <div className="muted" style={{fontSize:10.5,fontWeight:400}}>{fmtH(Math.max(0,l.solde)/l.taux)} restantes</div> : null}</td>
      </tr>)}</tbody>
    </table>
  </div>;
}
function HeuresView({cfg, refreshKey}){
  const [loading,setLoading]=useState(true);
  const [emps,setEmps]=useState([]);
  const [pts,setPts]=useState([]);
  const [err,setErr]=useState('');
  const [week,setWeek]=useState(()=>semaineHeures(new Date()));
  const conf = useSemainesConfirmees(cfg, refreshKey);

  useEffect(()=>{
    if(!cfg.punchproSpreadsheetId) { setLoading(false); return; }
    let cancelled=false;
    setLoading(true); setErr('');
    getPunchProDataBatched(cfg.punchproSpreadsheetId)
      .then(({emps:e,pts:p})=>{ if(!cancelled){ setEmps(e); setPts(p); } })
      .catch(e=>{ if(!cancelled) setErr((e&&e.result&&e.result.error&&e.result.error.message)||'Erreur de chargement (accès au Sheet PunchPro?).'); })
      .finally(()=>{ if(!cancelled) setLoading(false); });
    return ()=>{ cancelled=true; };
  },[cfg.punchproSpreadsheetId, refreshKey]);

  const dates = weekDatesArr(week);
  const dateStrs = dates.map(localDateStr);
  const table = useMemo(()=>heuresParEmployeSemaine(pts, week), [pts, week]);
  const joursLabel = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  function prevWeek(){ const d=mondayOfWeek(week); d.setDate(d.getDate()-7); setWeek(getWeek(d)); }
  function nextWeek(){ const d=mondayOfWeek(week); d.setDate(d.getDate()+7); setWeek(getWeek(d)); }
  function thisWeek(){ setWeek(semaineHeures(new Date())); }
  const empsSorted = [...emps].sort((a,b)=>a.nom.localeCompare(b.nom));
  const grandTotal = empsSorted.reduce((s,e)=>{ const row=table[e.nom]||{}; return s+dateStrs.reduce((a,d)=>a+(row[d]||0),0); },0);
  const nbConf = empsSorted.filter(e=>conf.de(week, e.nom)).length;

  return <div>
    <h2 className="fh" style={{margin:'0 0 6px',fontSize:20}}>Employés — heures (PunchPro)</h2>
    <div className="muted" style={{fontSize:11.5,marginBottom:14}}>Heures lues dans PunchPro (lecture seule). Tu peux confirmer une semaine à la main si l'employé te l'a confirmée autrement.</div>
    {!cfg.punchproSpreadsheetId && <div className="card">Configure l'ID du Sheet PunchPro (Heures &amp; Employés) dans Réglages.</div>}
    {err && <div className="card" style={{borderColor:'var(--danger)',color:'var(--danger)',marginBottom:12}}>{err}</div>}
    {cfg.punchproSpreadsheetId && <>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap'}}>
        <button className="btn btn-sm" onClick={prevWeek}>← Sem. préc.</button>
        <div style={{fontWeight:700}}>{weekRangeLabel(week)}</div>
        <button className="btn btn-sm" onClick={nextWeek}>Sem. suiv. →</button>
        <button className="btn btn-sm" onClick={thisWeek}>Cette semaine</button>
        {conf.pret && !conf.absent && empsSorted.length>0 && <span style={{fontSize:13,fontWeight:700,color:nbConf===empsSorted.length?'var(--success)':'var(--muted)'}}>✓ {nbConf}/{empsSorted.length} semaines confirmées</span>}
      </div>
      {conf.absent && <div className="muted" style={{fontSize:12,marginBottom:10}}>Les ✓ « semaine confirmée » de PunchPro apparaîtront quand le script semaines.gs de La mémoire aura rempli l'onglet « Semaines confirmées ». Tu peux déjà confirmer à la main (✓ Confirmer).</div>}
      {loading ? <div className="muted">Chargement...</div> :
      <div className="card" style={{padding:0,overflowX:'auto'}}>
        <table>
          <thead><tr>
            <th>Employé</th>
            {joursLabel.map((j,i)=><th key={i}>{j} {dates[i].getDate()}</th>)}
            <th>Total</th>
            <th>Confirmée</th>
          </tr></thead>
          <tbody>
            {empsSorted.map(e=>{
              const row = table[e.nom]||{};
              const total = dateStrs.reduce((s,d)=>s+(row[d]||0),0);
              return <tr key={e.nom}>
                <td><span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:e.couleur,marginRight:6}}></span>{e.nom}</td>
                {dateStrs.map((d,i)=><td key={i}>{row[d]?fmtH(row[d]):'—'}</td>)}
                <td style={{fontWeight:700,color:'var(--accent)'}}>{fmtH(total)}</td>
                <td>{conf.pret ? <ConfirmerMain conf={conf} week={week} nom={e.nom} total={total}/> : ''}</td>
              </tr>;
            })}
            {empsSorted.length===0 && <tr><td colSpan="10" className="muted" style={{padding:16}}>Aucun employé trouvé dans le Sheet PunchPro.</td></tr>}
          </tbody>
        </table>
      </div>}
      {!loading && empsSorted.length>0 && <div className="muted" style={{fontSize:12,marginTop:10}}>Total équipe cette semaine: <strong style={{color:'var(--text)'}}>{fmtH(grandTotal)}</strong></div>}
      {!loading && empsSorted.length>0 && <BanqueSupp cfg={cfg} emps={empsSorted} pts={pts}/>}
    </>}
  </div>;
}

    setBusy(true);
    try{
      const start = date+'T'+heure+':00';
      const end = date+'T'+(String(Math.min(23,parseInt(heure.split(':')[0])+2)).padStart(2,'0'))+':'+heure.split(':')[1]+':00';
      const calId = cfg.calendarIds.split(',')[0].trim();
      const ev = await window.gapi.client.calendar.events.insert({
        calendarId: calId,
        resource: {
          summary: titre || adresse,
          description: 'Client: '+(client||'')+'\nTéléphone: '+(telephone||'')+'\nNotes: '+(notes||'')+'\n(créé depuis SoumissionPro — Agenda)',
          location: adresse,
          start:{dateTime:start, timeZone:'America/Toronto'},
          end:{dateTime:end, timeZone:'America/Toronto'}
        }
      });
      await addProjet({
        opportuniteId:'', adresse, titre, contracteur:prefixe, phase, typeTravail:'',
        client, telephone, notes, eventId: ev.result.id
      });
      saveLastJobDefaults(prefixe, phase);
      toast('Job créée.','ok');
      onDone && onDone();
      onClose();
    }catch(e){ toast('Erreur création job: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }

  return <Modal title="Nouvelle job (depuis l'Agenda)" onClose={onClose}>
    <div className="field"><label>Adresse</label><ChampAdresse value={adresse} onChange={setAdresse} placeholder="Commence à taper une adresse…"/></div>
    <div className="row2">
      <div className="field"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      <div className="field"><label>Heure</label><input type="time" value={heure} onChange={e=>setHeure(e.target.value)}/></div>
    </div>
    <div className="row2">
      <div className="field"><label>Contracteur</label>
        <select value={prefixe} onChange={e=>setPrefixe(e.target.value)}>
          {CONTRACTEURS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="field"><label>Phase</label>
        <ChoixPhase phase={phase} setPhase={setPhase} sous={sous} setSous={setSous}/>
      </div>
    </div>
    <div className="row2">
      <div className="field"><label>Client (optionnel)</label><input value={client} onChange={e=>setClient(e.target.value)}/></div>
      <div className="field"><label>Téléphone</label><input value={telephone} onChange={e=>setTelephone(e.target.value)}/></div>
    </div>
    <div className="field tag-input"><label>Notes</label><textarea value={notes} onChange={e=>setNotes(e.target.value)}/></div>
    <div className="field"><label>Titre généré</label><input value={titre} disabled/></div>
    <div className="muted" style={{fontSize:12,marginBottom:10}}>Ajoute une ligne dans "Projets" (CRM) + crée l'événement sur {cfg.calendarIds.split(',')[0]}.</div>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
      <button className="btn btn-s" onClick={onClose}>Annuler</button>
      <button className="btn btn-p" onClick={handleCreate} disabled={busy}>{busy?'Création...':'Créer la job'}</button>
    </div>
  </Modal>;
}

// ── UI: Agenda — Jour / Semaine / Mois (grille), + création de job ───────
// ── UI: Modal modification de l'heure d'un événement existant ────────────
// ── UI: fiche complète d'un événement Calendar — même niveau de détail que
// directement dans Google Agenda: titre, lieu, description, heures, pièces
// jointes Drive (par lien de partage) et suppression.
function EditEventModal({event, onClose, onSaved, toast}){
  const startDt = new Date(event.start);
  const endDt = event.end ? new Date(event.end) : new Date(startDt.getTime()+3600000);
  const [titre,setTitre]=useState(event.title||'');
  const [lieu,setLieu]=useState(event.location||'');
  const [desc,setDesc]=useState(event.description||'');
  const [date,setDate]=useState(localDateStr(startDt));
  const [heureDebut,setHeureDebut]=useState(String(startDt.getHours()).padStart(2,'0')+':'+String(startDt.getMinutes()).padStart(2,'0'));
  const [heureFin,setHeureFin]=useState(String(endDt.getHours()).padStart(2,'0')+':'+String(endDt.getMinutes()).padStart(2,'0'));
  const [attachments,setAttachments]=useState(event.attachments||[]);
  const [newFileUrl,setNewFileUrl]=useState('');
  const [newFileTitre,setNewFileTitre]=useState('');
  const [busy,setBusy]=useState(false);
  const [confirmDel,setConfirmDel]=useState(false);

  function addAttachment(){
    if(!newFileUrl.trim()) return;
    setAttachments([...attachments, {fileUrl:newFileUrl.trim(), title:newFileTitre.trim()||newFileUrl.trim()}]);
    setNewFileUrl(''); setNewFileTitre('');
  }
  function removeAttachment(i){ setAttachments(attachments.filter((_,idx)=>idx!==i)); }

  // Construit les champs start/end à partir de l'état courant du formulaire —
  // réutilisé pour Enregistrer ET pour Dupliquer, afin que la copie parte des
  // heures/jour actuellement affichés (utile si on vient de les changer avant
  // de dupliquer).
  function buildTimeFields(){
    if(event.allDay){
      // Les événements "toute la journée" utilisent des dates (pas dateTime), et
      // la date de fin est EXCLUSIVE — on préserve la durée d'origine (nb de jours)
      // en la réappliquant à partir de la nouvelle date choisie.
      const origStart = new Date(event.start+'T00:00:00');
      const origEnd = event.end ? new Date(event.end+'T00:00:00') : new Date(origStart.getTime()+86400000);
      const spanDays = Math.max(1, Math.round((origEnd-origStart)/86400000));
      const endD = new Date(date+'T00:00:00'); endD.setDate(endD.getDate()+spanDays);
      return { start:{date}, end:{date: localDateStr(endD)} };
    }
    return {
      start:{dateTime: date+'T'+heureDebut+':00', timeZone:'America/Toronto'},
      end:{dateTime: date+'T'+heureFin+':00', timeZone:'America/Toronto'}
    };
  }

  async function handleSave(){
    setBusy(true);
    try{
      const fields = { summary: titre, location: lieu, description: desc, attachments: attachments.map(a=>({fileUrl:a.fileUrl, title:a.title})), ...buildTimeFields() };
      await patchEventFull(event.calendarId, event.id, fields);
      toast('Événement mis à jour.','ok');
      onSaved(); onClose();
    }catch(e){ toast('Erreur: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }
  async function handleDuplicate(){
    setBusy(true);
    try{
      const fields = { summary: titre, location: lieu, description: desc, attachments: attachments.map(a=>({fileUrl:a.fileUrl, title:a.title})), ...buildTimeFields() };
      await insertCalendarEvent(event.calendarId, fields);
      toast('Événement dupliqué.','ok');
      onSaved(); onClose();
    }catch(e){ toast('Erreur: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }
  async function handleDelete(){
    setBusy(true);
    try{
      await deleteCalendarEvent(event.calendarId, event.id);
      toast('Événement supprimé.','ok');
      onSaved(); onClose();
    }catch(e){ toast('Erreur: '+apiErrMsg(e),'err'); }
    setBusy(false);
  }

  return <Modal title="Modifier l'événement" onClose={onClose} wide>
    <div className="field"><label>Titre</label><input value={titre} onChange={e=>setTitre(e.target.value)}/></div>
    <div className="field"><label>Adresse / lieu</label><input value={lieu} onChange={e=>setLieu(e.target.value)}/></div>
    <div className="field"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
    {!event.allDay ? <div className="row2">
      <div className="field"><label>Début</label><input type="time" value={heureDebut} onChange={e=>setHeureDebut(e.target.value)}/></div>
      <div className="field"><label>Fin</label><input type="time" value={heureFin} onChange={e=>setHeureFin(e.target.value)}/></div>
    </div> : <div className="muted" style={{fontSize:12,marginBottom:10}}>Événement "toute la journée" — seule la date peut être changée ici (déplace l'événement, sans changer sa durée).</div>}
    <div className="field tag-input"><label>Notes / description</label><textarea value={desc} onChange={e=>setDesc(e.target.value)}/></div>

    <div className="field">
      <label>Pièces jointes (Google Drive)</label>
      {attachments.length>0 && <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:8}}>
        {attachments.map((a,i)=>
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg3)',borderRadius:8,padding:'6px 10px'}}>
            <a href={a.fileUrl} target="_blank" rel="noreferrer" style={{flex:1,fontSize:12.5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.title||a.fileUrl}</a>
            <button className="btn btn-sm btn-danger" onClick={()=>removeAttachment(i)}>×</button>
          </div>
        )}
      </div>}
      <div className="row2" style={{gridTemplateColumns:'2fr 1fr'}}>
        <input placeholder="Lien Google Drive (copier le lien de partage)" value={newFileUrl} onChange={e=>setNewFileUrl(e.target.value)}/>
        <input placeholder="Nom du fichier (optionnel)" value={newFileTitre} onChange={e=>setNewFileTitre(e.target.value)}/>
      </div>
      <button className="btn btn-sm" style={{marginTop:6}} onClick={addAttachment}>+ Ajouter le fichier</button>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginTop:6}}>
      {!confirmDel ? <button className="btn btn-sm btn-danger" onClick={()=>setConfirmDel(true)}>Supprimer l'événement</button>
        : <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span className="muted" style={{fontSize:12}}>Supprimer définitivement?</span>
            <button className="btn btn-sm btn-danger" onClick={handleDelete} disabled={busy}>Confirmer</button>
            <button className="btn btn-sm" onClick={()=>setConfirmDel(false)}>Annuler</button>
          </div>}
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-s" onClick={onClose}>Fermer</button>
        <button className="btn btn-s" onClick={handleDuplicate} disabled={busy} title="Crée une copie de cet événement avec les mêmes infos">{busy?'...':'Dupliquer'}</button>
        <button className="btn btn-p" onClick={handleSave} disabled={busy}>{busy?'Sauvegarde...':'Enregistrer'}</button>
      </div>
    </div>
  </Modal>;
}

function AgendaView({cfg, data, toast, isDesktop, refreshKey}){
  const [viewMode,setViewMode]=useState('semaine'); // 'jour'|'semaine'|'mois'
  const [anchor,setAnchor]=useState(()=>new Date());
  // Commandes de la semaine (même semaine que l'agenda) : jobs, heures, équipe, OT et commande placée ou non.
  const cd = useClientsData(cfg, refreshKey);
  const cdClients = useMemo(()=>cvBuildClients(cd.events, cd.registry, cd.factures),[cd.events, cd.registry, cd.factures]);
  const [commandes, basculerCommande] = useCommandes(cfg);
  const [manuelsAg] = useEtapesManuelles(cfg);
  const [loading,setLoading]=useState(true);
  const [events,setEvents]=useState([]);
  const [err,setErr]=useState('');
  const [showJobModal,setShowJobModal]=useState(false);
  const [jobDate,setJobDate]=useState(null);
  const [jobHeure,setJobHeure]=useState(null);
  const [editEvent,setEditEvent]=useState(null);
  const [reloadKey,setReloadKey]=useState(0);
  const dayColRefs = useRef([]);
  const dragInfoRef = useRef(null);
  const draggedElRef = useRef(null);
  const resizeInfoRef = useRef(null);

  const days = useMemo(()=>getRangeDays(viewMode, anchor), [viewMode, anchor.getTime()]);

  useEffect(()=>{
    let cancelled=false;
    setLoading(true); setErr('');
    const timeMin = new Date(days[0]); timeMin.setHours(0,0,0,0);
    const timeMax = new Date(days[days.length-1]); timeMax.setHours(23,59,59,999);
    const calIds = (cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
    listCalendarEventsRange(calIds, timeMin.toISOString(), timeMax.toISOString())
      .then(evs=>{ if(!cancelled) setEvents(evs); })
      .catch(e=>{ if(!cancelled) setErr(apiErrMsg(e)||'Erreur de chargement du calendrier.'); })
      .finally(()=>{ if(!cancelled) setLoading(false); });
    return ()=>{ cancelled=true; };
  },[viewMode, anchor.getTime(), cfg.calendarIds, reloadKey, refreshKey]);

  function goPrev(){ const d=new Date(anchor); if(viewMode==='jour') d.setDate(d.getDate()-1); else if(viewMode==='mois') d.setMonth(d.getMonth()-1); else d.setDate(d.getDate()-7); setAnchor(d); }
  function goNext(){ const d=new Date(anchor); if(viewMode==='jour') d.setDate(d.getDate()+1); else if(viewMode==='mois') d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+7); setAnchor(d); }
  function goToday(){ setAnchor(new Date()); }
  function openNewJob(dStr, heureStr){ setJobDate(dStr||todayISO()); setJobHeure(heureStr||null); setShowJobModal(true); }
  function rangeLabel(){
    if(viewMode==='jour') return anchor.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    if(viewMode==='mois') return anchor.toLocaleDateString('fr-CA',{month:'long',year:'numeric'});
    return weekRangeLabel(getWeek(anchor));
  }

  const HOUR_START=6, HOUR_END=20, PX_H=isDesktop?64:46;
  const hours = Array.from({length:HOUR_END-HOUR_START+1},(_,i)=>HOUR_START+i);
  const todayStr = localDateStr(new Date());
  // Colonnes responsives (minmax(0,1fr)) sur desktop pour remplir toute la largeur
  // de l'écran — le vrai bug qui causait le désalignement "les carrés ne fittent
  // pas" et le débordement horizontal du mois n'était PAS minmax(...,1fr) en soi,
  // mais le fait que les cellules de la grille ont par défaut min-width:auto: un
  // titre d'événement en whiteSpace:nowrap forçait alors la colonne à s'élargir
  // au-delà de sa part de 1fr. Le fix est minWidth:0 sur chaque cellule de grille
  // (voir plus bas) + overflow:hidden sur le texte. Sur mobile, on garde un minimum
  // de largeur par colonne en vue semaine pour rester lisible (scroll horizontal
  // naturel au doigt), géré par le overflowX:auto du conteneur .card.
  const DAY_COL_MIN = (!isDesktop && days.length>1) ? '92px' : '0';
  const gridCols = 'repeat('+days.length+',minmax('+DAY_COL_MIN+',1fr))';

  function eventsForDay(dStr){ return events.filter(e=>String(e.start).slice(0,10)===dStr && !e.allDay); }
  function allDayForDay(dStr){ return events.filter(e=>String(e.start).slice(0,10)===dStr && e.allDay); }

  // ── Glisser un événement pour changer son heure/jour directement dans la grille ──
  function handleEventPointerDown(e, ev){
    if(e.button!==undefined && e.button!==0) return;
    const el = e.currentTarget;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const startMs = new Date(ev.start).getTime();
    const endMs = ev.end ? new Date(ev.end).getTime() : startMs+3600000;
    const elRect = el.getBoundingClientRect();
    // Offset du point où on a "attrapé" le bloc, par rapport à SON PROPRE haut —
    // sans ça, si on saisit l'événement au milieu, le drop est décalé (ex: on vise
    // 7h00 mais ça tombe à 7h15) puisqu'on utiliserait la position du curseur telle
    // quelle au lieu de la position du haut du bloc.
    const grabOffsetY = e.clientY - elRect.top;
    dragInfoRef.current = {pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, grabOffsetY, moved:false, ev, origStartMs:startMs, durationMs:endMs-startMs};
    draggedElRef.current = el;
  }
  function handleEventPointerMove(e){
    const info = dragInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const dx=e.clientX-info.startX, dy=e.clientY-info.startY;
    if(!info.moved && Math.hypot(dx,dy)>6) info.moved=true;
    if(info.moved && draggedElRef.current){
      draggedElRef.current.style.transform='translate('+dx+'px,'+dy+'px)';
      draggedElRef.current.style.zIndex='30';
      draggedElRef.current.style.opacity='0.85';
      draggedElRef.current.style.boxShadow='0 4px 14px rgba(0,0,0,.4)';
    }
  }
  function handleEventPointerUp(e){
    const info = dragInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const el = draggedElRef.current;
    if(el){ el.style.transform=''; el.style.zIndex=''; el.style.opacity=''; el.style.boxShadow='0 1px 3px rgba(0,0,0,.25)'; }
    if(!info.moved){
      setEditEvent(info.ev);
    } else {
      let targetDayIdx=null;
      for(let i=0;i<dayColRefs.current.length;i++){
        const rect = dayColRefs.current[i] && dayColRefs.current[i].getBoundingClientRect();
        if(rect && e.clientX>=rect.left && e.clientX<=rect.right){ targetDayIdx=i; break; }
      }
      let newStartMs = info.origStartMs;
      if(targetDayIdx!==null){
        const rect = dayColRefs.current[targetDayIdx].getBoundingClientRect();
        const blockTopY = e.clientY - info.grabOffsetY;
        let hourFloat = HOUR_START + (blockTopY-rect.top)/PX_H;
        hourFloat = Math.max(0, Math.min(24, Math.round(hourFloat*4)/4));
        const target = new Date(days[targetDayIdx]); target.setHours(0,0,0,0);
        target.setMinutes(Math.round(hourFloat*60));
        newStartMs = target.getTime();
      }
      const newEndMs = newStartMs + info.durationMs;
      patchEventTimes(info.ev.calendarId, info.ev.id, new Date(newStartMs).toISOString(), new Date(newEndMs).toISOString())
        .then(()=>{ toast('Job déplacée.','ok'); setReloadKey(k=>k+1); })
        .catch(err=>toast('Erreur: '+apiErrMsg(err),'err'));
    }
    dragInfoRef.current=null; draggedElRef.current=null;
  }

  // ── Redimensionner un événement (poignée en bas) — change seulement la fin ──
  function handleResizePointerDown(e, ev){
    e.stopPropagation();
    const handleEl = e.currentTarget;
    const blockEl = handleEl.parentElement;
    try{ handleEl.setPointerCapture(e.pointerId); }catch(err){}
    const startMs = new Date(ev.start).getTime();
    const origEndMs = ev.end ? new Date(ev.end).getTime() : startMs+3600000;
    resizeInfoRef.current = {pointerId:e.pointerId, startY:e.clientY, ev, startMs, origEndMs, blockEl, origHeight: blockEl.offsetHeight};
  }
  function handleResizePointerMove(e){
    const info = resizeInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const dy = e.clientY-info.startY;
    info.blockEl.style.height = Math.max(18, info.origHeight+dy)+'px';
    info.blockEl.style.zIndex='30';
    info.blockEl.style.boxShadow='0 4px 14px rgba(0,0,0,.4)';
  }
  function handleResizePointerUp(e){
    const info = resizeInfoRef.current;
    if(!info || e.pointerId!==info.pointerId) return;
    const dy = e.clientY-info.startY;
    info.blockEl.style.zIndex=''; info.blockEl.style.boxShadow='0 1px 3px rgba(0,0,0,.25)';
    const deltaMin = Math.round((dy/PX_H*60)/15)*15; // arrondi au 1/4h
    let newEndMs = Math.max(info.startMs+15*60000, info.origEndMs + deltaMin*60000);
    patchEventTimes(info.ev.calendarId, info.ev.id, new Date(info.startMs).toISOString(), new Date(newEndMs).toISOString())
      .then(()=>{ toast('Durée mise à jour.','ok'); setReloadKey(k=>k+1); })
      .catch(err=>{ toast('Erreur: '+apiErrMsg(err),'err'); info.blockEl.style.height=info.origHeight+'px'; });
    resizeInfoRef.current=null;
  }

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
      <div>
        <h2 className="fh" style={{margin:'0 0 6px',fontSize:20}}>Agenda</h2>
        <div className="muted" style={{fontSize:11.5,marginBottom:14}}>Calendrier Google utilisé par PunchPro. Les couleurs sont celles réellement assignées dans Google Calendar.</div>
      </div>
      {data && <button className="btn btn-p" onClick={()=>openNewJob(todayISO())}>+ Nouvelle job</button>}
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap'}}>
      <button className="btn btn-sm" onClick={goPrev}>←</button>
      <div style={{fontWeight:700,textTransform:'capitalize',minWidth:160}}>{rangeLabel()}</div>
      <button className="btn btn-sm" onClick={goNext}>→</button>
      <button className="btn btn-sm" onClick={goToday}>Aujourd'hui</button>
      <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
        {[['jour','Jour'],['semaine','Semaine'],['mois','Mois']].map(([id,label])=>
          <button key={id} className="btn btn-sm" onClick={()=>setViewMode(id)} style={viewMode===id?{background:'var(--accent)',color:'#fff',border:'none'}:null}>{label}</button>
        )}
      </div>
    </div>
    {cd.loading ? <div className="card muted" style={{marginBottom:16,fontSize:13}}>Lecture des jobs et des commandes…</div>
      : <CvSemaine clients={cdClients} appels={cd.appels||{parNumero:{},parFacture:{},liste:[]}} ancre={anchor} commandes={commandes} onCommande={basculerCommande} manuels={manuelsAg} isDesktop={isDesktop}/>}
    {err && <div className="card" style={{borderColor:'var(--danger)',color:'var(--danger)',marginBottom:12}}>{err}</div>}
    {loading ? <div className="muted">Chargement...</div> :

    viewMode==='mois' ?
    <div className="card" style={{padding:8}}>
      {/* Une seule grille (7 colonnes x 7 rangées: en-têtes + 6 semaines) pour que
          les jours de la semaine et les cases du mois restent alignés. */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gridTemplateRows:'auto repeat(6,1fr)',gap:isDesktop?8:4}}>
        {['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map((j,i)=><div key={j} style={{gridColumn:i+1,gridRow:1}} className="muted"><div style={{textAlign:'center',fontSize:isDesktop?13:11,fontWeight:700}}>{j}</div></div>)}
        {days.map((d,i)=>{
          const dStr = localDateStr(d);
          const inMonth = d.getMonth()===anchor.getMonth();
          const dayEvents = [...eventsForDay(dStr), ...allDayForDay(dStr)].sort((a,b)=>String(a.start).localeCompare(String(b.start)));
          const maxShow = isDesktop?6:3;
          return <div key={i} onClick={()=>{ setViewMode('jour'); setAnchor(new Date(d)); }}
            style={{gridColumn:(i%7)+1, gridRow:Math.floor(i/7)+2, minWidth:0, minHeight:isDesktop?150:80,border:'1px solid var(--border)',borderRadius:6,padding:isDesktop?8:4,cursor:'pointer',opacity:inMonth?1:.4,background:dStr===todayStr?'rgba(47,128,237,.08)':'transparent',overflow:'hidden'}}>
            <div style={{fontSize:isDesktop?15:11,fontWeight:700,marginBottom:5}}>{d.getDate()}</div>
            {dayEvents.slice(0,maxShow).map(e=><div key={e.id} title={e.title} onClick={(ev)=>{ ev.stopPropagation(); setEditEvent(e); }} style={{cursor:'pointer',background:eventColor(e),color:texteSur(eventColor(e)),fontSize:isDesktop?11.5:9.5,padding:isDesktop?'3px 6px':'1px 4px',borderRadius:3,marginBottom:3,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{e.title}</div>)}

// Un appel de service sans facture associée = "facture manquante".
// Lit le dossier PAD (Drive) et regroupe les fichiers par passage : « AP_1274_CRS finition Gregoire.jpg », « OT_1745_… », « … - Tout.pdf ».
let PAD_CACHE = null;
async function lirePad(force){
  if(!force && PAD_CACHE && Date.now()-PAD_CACHE.t < 120000) return PAD_CACHE.g;
  const tok = window.gapi.client.getToken() && window.gapi.client.getToken().access_token;
  const q = encodeURIComponent("'"+PAD_DOSSIER+"' in parents and trashed=false");
  const r = await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,createdTime,webViewLink)&pageSize=300&supportsAllDrives=true&includeItemsFromAllDrives=true&orderBy=createdTime desc', {headers:{Authorization:'Bearer '+tok}});
  if(!r.ok) throw new Error(r.status===403||r.status===401 ? 'acces' : 'Drive '+r.status);
  const files = (await r.json()).files || [];
  const g = {};
  files.forEach(f=>{
    const base = f.name.replace(/\.[a-z0-9]{2,5}$/i,'');
    const m = base.match(/^(AP|OT)[\s_-]*(\d+)[\s_-]+(.+)$/i);
    const titre = (m ? m[3] : base.replace(/\s*-\s*Tout$/i,'')).trim();
    const k = cvNorm(titre);
    const x = g[k] || (g[k] = {titre, cle:k, ap:[], ot:[], fichiers:[], depose:f.createdTime});
    if(m && m[1].toUpperCase()==='AP' && !x.ap.includes(m[2])) x.ap.push(m[2]);
    if(m && m[1].toUpperCase()==='OT' && !x.ot.includes(m[2])) x.ot.push(m[2]);
    x.fichiers.push({nom:f.name, lien:f.webViewLink || 'https://drive.google.com/file/d/'+f.id+'/view'});
    if(f.createdTime < x.depose) x.depose = f.createdTime;
  });
  const liste = Object.values(g).sort((a,b)=>String(a.depose).localeCompare(String(b.depose)));
  PAD_CACHE = {t:Date.now(), g:liste};
  return liste;
}
// Le papier PAD qui correspond à une ligne du Suivi (même titre d'événement).
function padMots(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().split(/[^A-Z0-9]+/).filter(m=>m.length>=3); }
function padPourLigne(pad, r){
  const k = cvNorm(r.projet); if(!k) return null;
  const mr = new Set(padMots(r.projet));
  return (pad||[]).find(p=>{ if(p.cle===k) return true;
    const mp = padMots(p.titre); if(mp.length<2 && (mp[0]||'').length<5) return false;
    return mp.length>0 && mp.every(m=>mr.has(m));              // tous les mots du nom du papier sont dans le titre du Suivi
  }) || null;
}

// ── UI: Factures — suivi des factures à partir du Sheet « SUIVI TRAVAUX SARAN ÉLECTRIQUE » (colonnes K/L/M).
// À facturer = passages faits sans appel de service (manquant) ou avec appel mais sans facture (en traitement).
// « Pas à facturer » écrit « ** » dans K et M : la ligne sort de la liste (et « Remettre » l'y ramène).
// ── v180 : Paiements reçus (virements Interac lus dans Gmail par La mémoire + chèques / comptant entrés à la main) ──
// Onglet « Paiements » de La mémoire — Factures : A Id courriel | B Date | C Envoyé par | D Montant | E Message | F Référence
//   | G Factures lues | H Lien Gmail | I Source | J Factures confirmées | K Statut | L Note.  Le CRM écrit seulement J à L
//   (ou une nouvelle ligne pour un paiement entré à la main). Rien n'est associé sans que tu confirmes (mode essai).
const PAI_ENTETE = ['Id courriel','Date','Envoyé par','Montant','Message','Référence','Factures lues dans le message','Lien Gmail','Source','Factures confirmées','Statut','Note'];
const PAI_DEBUT = '2026-06-01';   // v190 : début de l'année financière — tout ce qui est avant n'apparaît plus dans le CRM (factures et paiements)
const PAI_MOTS_VIDES = new Set(['inc','ltee','ltd','limited','quebec','qc','canada','et','and','de','du','la','le','les','des','property','properties','gestion','construction','constructions','compagnie','cie','enr','senc','corp','corporation']);
function paiNums(s){ return [...new Set(String(s||'').replace(/\b(19|20)\d{2}[-/.]\d{1,2}[-/.]\d{1,2}\b|\b\d{1,2}[-/.]\d{1,2}[-/.](19|20)\d{2}\b/g,' ').match(/\b\d{4}\b/g)||[])]; }
function paiMots(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=3 && !PAI_MOTS_VIDES.has(w) && !/^\d+$/.test(w)); }
function paiJours(d){ const t = Date.parse(String(d||'').slice(0,10)); return isNaN(t) ? null : Math.floor((Date.now()-t)/864e5); }
function paiLireFactures(rows){
  const fh=(rows[0]||[]).map(h=>cvNorm(h)), fc=re=>fh.findIndex(h=>re.test(h));
  const fx={num:fc(/^facture/),date:fc(/^date/),cli:fc(/^client/),po:fc(/^po$/),nom:fc(/^nom/),desc:fc(/^description/),ht:fc(/^montant/),ttc:fc(/^total/),env:fc(/^envoyee/),pdf:fc(/^pdf/),st:fc(/^statut/)};
  const g=(r,k)=> fx[k]>=0 ? String(r[fx[k]]||'').trim() : '';
  const out={}, tous=new Set(); Object.defineProperty(out,'__cols',{value:fx, enumerable:false}); Object.defineProperty(out,'__tous',{value:tous, enumerable:false});
  rows.slice(1).forEach((r,i)=>{ const n=g(r,'num'); if(!n) return; tous.add(n);
    const d = g(r,'date'), env = g(r,'env'); if(d && d.slice(0,10) < PAI_DEBUT && !(env && env.slice(0,10) >= PAI_DEBUT)) return;   // v190-191 : facture datée ET envoyée avant le 1er juin = pas dans le CRM
    out[n]={num:n, row:i+2, date:g(r,'date'), client:g(r,'cli'), po:g(r,'po'), nom:g(r,'nom'), desc:g(r,'desc'), ttc:cvNum(g(r,'ttc'))||0, envoi:g(r,'env'), pdf:g(r,'pdf'), annulee:/^annul/.test(cvNorm(g(r,'st'))), statut:g(r,'st'),
      ouverte:/^ouverte/i.test(g(r,'st')), estime:/^montant calcul/i.test(g(r,'st'))}; });   // v187 : importées du logiciel comptable
  Object.defineProperty(out,'__stCol',{value: fx.st>=0 ? fx.st : Math.max(fh.length, 10), enumerable:false});
  Object.defineProperty(out,'__stEntete',{value: fx.st>=0, enumerable:false});
  return out;
}
// v185 : annuler une facture dans le registre (colonne Statut = « Annulée (date) »), comme dans « À vérifier »

function paiLirePaiements(rows){
  return rows.slice(1).map((r,i)=>({row:i+2, id:String(r[0]||''), date:String(r[1]||''), de:String(r[2]||''), montant:cvNum(r[3])||0, message:String(r[4]||''), ref:String(r[5]||''),
    lues:paiNums(r[6]).filter(n=>!new RegExp('\\b'+n+'[-/.]\\d{1,2}[-/.]\\d{1,2}\\b').test(String(r[4]||''))), lien:String(r[7]||''), source:String(r[8]||'Interac'), confirmees:paiNums(r[9]), statut:String(r[10]||'').trim(), note:String(r[11]||'')}))
    .filter(p=>(p.id || p.montant) && !(String(p.date).slice(0,10) < PAI_DEBUT));   // v190 : paiements d'avant le 1er juin = pas dans le CRM

// Nom affiché du client d'une facture : contracteur (code) ou nom écrit sur la facture, sinon le courriel.
function paiClientNom(f){ const c = String(f.client||'').trim(); const code = c.toUpperCase();
  if(CLIENT_CODES[code]) return CLIENT_CODES[code]; return f.nom || c || '—'; }
function paiClientCle(f){ return cvNorm(f.client) || cvNorm(f.nom) || 'f'+f.num; }
// Mots qui représentent le client d'une facture (nom, courriel, nom du contracteur).
function paiMotsFacture(f){ const c = String(f.client||''), code = c.toUpperCase();
  return {mots:new Set([...paiMots(f.nom), ...paiMots(f.nomRep||''), ...paiMots(CLIENT_CODES[code]||''), ...paiMots(c.split('@')[0])]), courriel: c.includes('@') ? cvNorm(c.split('@')[0]) : ''}; }
// Ressemblance entre « Envoyé par » d'un virement et le client d'une facture (0 = rien).
function paiScoreNom(de, f){
  const m = paiMots(de); if(!m.length) return 0; const {mots, courriel} = paiMotsFacture(f);
  let s = 0; m.forEach((w,i)=>{ if(mots.has(w) || (w.length>=4 && courriel.includes(w))) s += (i===m.length-1 ? 2 : 1); });
  return s;
}
// Toutes les combinaisons de 2 à maxN factures dont la somme = montant (± 2 ¢), au plus 3 solutions.
function paiSommes(liste, montant, maxN){
  const out=[], n=liste.length, cible=Math.round(montant*100), v=liste.map(f=>Math.round(f.solde*100));
  const rec=(i, pris, tot)=>{ if(out.length>=3) return;
    if(pris.length>=2 && Math.abs(tot-cible)<=2){ out.push(pris.map(k=>liste[k])); return; }
    if(pris.length>=maxN || tot>cible+2) return;
    for(let k=i;k<n;k++){ pris.push(k); rec(k+1, pris, tot+v[k]); pris.pop(); if(out.length>=3) return; } };
  rec(0, [], 0); return out;
}
// Analyse : solde de chaque facture (paiements confirmés) et propositions pour les paiements pas encore confirmés.
// v186 : nomDe(courriel) = {nom} trouvé dans le Répertoire (fiche du particulier / commerce, contact d'un contracteur)
function paiementsAnalyser(factures, paiements, nomDe, separes, adr){
  const F = {}; Object.values(factures).forEach(f=>{ F[f.num] = {...f, paye:0, paiements:[]};
    const c = String(f.client||'').trim().toLowerCase(); if(nomDe && c.includes('@')){ const r = nomDe(c); if(r) F[f.num].nomRep = r.nom; else F[f.num].sansFiche = c; } });
  const conf = paiements.filter(p=>/^confirm/i.test(p.statut) && p.confirmees.length).sort((a,b)=>a.date.localeCompare(b.date));
  // Ce qu'on a appris : tel « Envoyé par » paie pour tel client.
  const appris = {};
  conf.forEach(p=>{ let reste = p.montant; const fs = p.confirmees.map(n=>F[n]).filter(Boolean);
    fs.forEach((f,i)=>{ const du = Math.max(0, f.ttc - f.paye); const part = i===fs.length-1 ? reste : Math.min(reste, du);
      f.paye += part; reste -= part; f.paiements.push({date:p.date, de:p.de, montant:part, source:p.source, row:p.row}); });

    {sous==='recevoir' && <div className="card">

              </span>
            </div>)}
          </div>); })()}
    </div>}

    {sous==='payees' && <div className="card">

      </div>)}
    </div>}

    {sous==='tous' && <div className="card">
      {A.archives.length>0 && <div style={{marginBottom:6}}><button className="btn btn-sm" onClick={()=>setVoirArch(!voirArch)}>{voirArch ? 'Cacher' : 'Voir'} les archives d'avant le 1er juin 2026 ({A.archives.length})</button></div>}

      {tous.map(p=><div key={p.row} style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap',fontSize:12.5,padding:'5px 0',borderBottom:'1px dashed var(--border)',opacity:/^(ignor|annul)/i.test(p.statut)?.55:1}}>
        <span><b>{String(p.date).slice(0,10)}</b> · {p.de||'—'} · <b>{cvMoney(p.montant)}</b> <span className="muted">· {p.source}</span>{p.message ? <span className="muted"> · « {p.message} »</span> : ''}</span>

          {p.lien && <a href={p.lien} target="_blank" rel="noopener" style={{color:'var(--accent)'}}>↗</a>}
        </span>
      </div>)}
    </div>}
  </div>;
}

function FacturesView({cfg, cfgRep, refreshKey, contacts}){

    return ()=>{ ok=false; }; },[cfg.memoireAppelsSpreadsheetId, refreshKey, tick]);
  useEffect(()=>{ let ok=true; lirePad(refreshKey>0).then(g=>{ if(ok){ setPapiers(g); setPadErr(''); } })
    .catch(e=>{ if(ok) setPadErr(e.message==='acces' ? 'acces' : apiErrMsg(e)); }); return ()=>{ ok=false; }; },[refreshKey, tick]);
  useEffect(()=>{
    if(!id){ setLoading(false); return; }

  },[id, refreshKey, tick]);
  const marquer = async (r, annule)=>{
    const k = r.onglet+r.ligne; setBusy(k);
    try{ await suiviMarquerAnnule(id, r, annule); setRows(rs=>rs.map(x=>x===r ? {...x, statutFacture: annule?'annule':(x.appelService && !/^\*\*/.test(x.appelService) ? 'en_traitement':'manquant'), factureManquante:!annule && x.estPasseOuAujourdhui} : x)); setTick(t=>t+1); }
    catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); }
    setBusy('');
  };
  const nom = c => c==='PARTICULIER' ? 'Particuliers' : c;
  const contracteurs = [...new Set(rows.map(r=>r.contracteur))].sort((a,b)=>(a==='PARTICULIER')-(b==='PARTICULIER') || a.localeCompare(b,'fr'));
  const base = rows.filter(r=>(!filterC || r.contracteur===filterC) && (!q || cvNorm([r.projet,r.adresse,r.appelService,r.facture,r.contracteur].join(' ')).includes(cvNorm(q))));
  // AP / OT du registre (sans facture, pas encore inscrits nulle part au Suivi) → le passage « rien d'inscrit » le plus récent de cette job.
  const GENERIQUES = new Set(['CRS','SERV','SERVICE','FINITION','ROUGH','AJUST','AJUSTEMENT','AJUSTEMENTS','PART','PAY','PAYNE','ASC','SAR','GGP','BOM','GOU','JOY','RROY','5PIL','PREP','EXTRA','BORNE']);
  const inscrits = new Set(rows.flatMap(r=>[r.appelService, r.ordreTravail]).flatMap(v=>String(v||'').split(/[\s,;]+/)).filter(Boolean));

        (po && cvNorm(r.projet).includes(po)) || (mots.length>0 && (()=>{ const mr=new Set(padMots(r.projet)); return mots.every(w=>mr.has(w)); })())))
        .sort((a,b)=>(b.dateObj||0)-(a.dateObj||0))[0];

function useModeles(cfg){

function soumJours(d){ if(!d) return null; const t=new Date(d+'T12:00:00'); return isNaN(t) ? null : Math.round((Date.now()-t)/864e5); }
function useSoumissions(cfg, refreshKey){
  const id = cfg.memoireJobsSpreadsheetId, idA = cfg.memoireAchatsSpreadsheetId;
  const [etat,setEtat]=useState({lu:false, existe:false, liste:[], recues:[], err:''});
