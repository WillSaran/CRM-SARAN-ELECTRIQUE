// Ce qui reste à vérifier pour un client : passages passés sans facture inscrite, et factures écrites aussi
// sur une autre job (sauf celles marquées « C'est la même job »). Les jobs archivées ne comptent plus.
function cvAVerifierJob(j, reglees){
  const today = cvDay(new Date().toISOString());
  // Une facture par visite : on montre le dernier passage de chaque visite pas encore facturée.
  // Visite avec un appel de service inscrit = « en traitement » (le papier est reçu, la facture s'en vient) : pas à vérifier.
  const aAppel = v => v.events.some(e=>e.as && e.as!=='**' && e.as!=='-');
  const sansFac = cvVisites(j).filter(v=>v.faite && !v.facturee);
  const passages = sansFac.filter(v=>!aAppel(v)).map(v=>v.events[v.events.length-1]);
  const traitement = sansFac.filter(aAppel).map(v=>v.events.find(e=>e.as && e.as!=='**' && e.as!=='-') || v.events[v.events.length-1]);
  const dups = (j.dupFac||[]).filter(n=>!estRegleDup(reglees, n));
  return {passages, traitement, dups, n: passages.length + dups.length};
}
function cvAVerifierClient(client, reglees, archives){
  const jobs = client.jobs.filter(j=>!(archives||{})[j.id]).map(j=>({job:j, ...cvAVerifierJob(j, reglees)})).filter(x=>x.n || x.traitement.length);
  // Une facture en double compte une fois, même si elle est sur deux jobs de ce client.
  return {jobs, ids:new Set(jobs.filter(x=>x.n).map(x=>x.job.id)), n: jobs.reduce((t,x)=>t+x.passages.length,0) + new Set(jobs.flatMap(x=>x.dups)).size,
    traitement: jobs.reduce((t,x)=>t+x.traitement.length,0)};
}
// En haut de la fiche d'un client : une barre « À vérifier » qui s'ouvre avec la flèche.
// Chaque point se règle sur place ; il disparaît de la liste et le compteur descend jusqu'à zéro.
// Particulier qui est en fait une job de contracteur : « 🔗 Rajouter un PO » → choisir le contracteur, puis la job.
// Le titre des événements devient « CODE PHASE NOM PO (initiales) » ; l'ancien titre est gardé dans la description.
function CvRattacherPO({job, clients, onDone}){
  const [ouvert,setOuvert]=useState(false);
  const [code,setCode]=useState('');
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState('');
  if(!job || job.client!=='PART' || !clients) return null;
  const contracteurs = Object.values(clients).filter(c=>c.code!=='PART').sort((a,b)=>a.label.localeCompare(b.label,'fr'));
  const jobs = code && clients[code] ? clients[code].jobs.slice().sort((a,b)=>(!a.po)-(!b.po) || a.name.localeCompare(b.name,'fr')) : [];
  const evs = job.events.filter(e=>e.id && e.calId);
  const rattacher = async cible=>{
    setBusy(true); setMsg('');
    try{
      let n = 0;
      for(const e of evs){
        const ini = String(e.title).split(/\s+/).filter(t=>CREW_INITIALS[t] && t===t.toUpperCase());
        const titre = [code, e.phase || 'SERV', cible.name, cible.po, ...ini].filter(Boolean).join(' ');
        const ev = await window.gapi.client.calendar.events.get({calendarId:e.calId, eventId:e.id});
        const desc = cvComposerDescription((ev.result.description||'')+'\nAncien titre : '+e.title);
        await window.gapi.client.calendar.events.patch({calendarId:e.calId, eventId:e.id, resource:{summary:titre, description:desc}});
        n++;
      }
      setMsg('✅ '+n+' passage'+(n>1?'s':'')+' rattaché'+(n>1?'s':'')+' à '+code+' '+cible.name+(cible.po?' '+cible.po:'')+'.'); setOuvert(false); setCode('');
      onDone && onDone();
    }catch(err){ setMsg('Impossible : '+apiErrMsg(err)); }
    setBusy(false);
  };
  if(!ouvert) return <span>{msg && <span style={{fontSize:12,marginRight:6}}>{msg}</span>}
    <button className="btn btn-sm" style={{fontSize:11.5,padding:'2px 8px',marginLeft:6}} title="C'est une job d'un contracteur : la rattacher à son PO" onClick={()=>setOuvert(true)}>🔗 Rajouter un PO</button></span>;
  return <div style={{border:'1px solid var(--accent)',borderRadius:8,padding:8,margin:'6px 0',fontSize:12.5,display:'grid',gap:6}}>
    <div><b>1. Le contracteur</b></div>
    <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{contracteurs.map(c=><button key={c.code} className="btn btn-sm" style={code===c.code?{borderColor:'var(--accent)',color:'var(--accent)',fontWeight:700}:null} onClick={()=>setCode(c.code)}>{c.code} <span className="muted" style={{fontSize:11}}>{c.label!==c.code?c.label:''}</span></button>)}</div>
    {code && <><div><b>2. La job</b> <span className="muted">({jobs.length})</span></div>
      <div style={{display:'grid',gap:3,maxHeight:220,overflowY:'auto'}}>
        {jobs.map(cj=><button key={cj.id} className="btn btn-sm" disabled={busy} style={{textAlign:'left',justifyContent:'flex-start'}} onClick={()=>rattacher(cj)}>
          <b>{cj.name}</b>{cj.po ? <span className="muted"> · {cj.po}</span> : <span className="muted"> · sans PO</span>}<span className="muted"> · {cvFmtDay(cj.first)}</span></button>)}
        {!jobs.length && <span className="muted">Aucune job pour ce contracteur.</span>}
      </div></>}
    <div className="muted" style={{fontSize:11.5}}>Change le titre de {evs.length} passage{evs.length>1?'s':''} dans l'agenda (l'ancien titre reste dans la description).</div>
    <div><button className="btn btn-sm" disabled={busy} onClick={()=>{ setOuvert(false); setCode(''); }}>{busy?'…':'Annuler'}</button></div>
  </div>;
}

function CvAVerifierClient({av, cfg, factures, marquerRegle, onPick, onChanged, clients}){
  const [ouvert,setOuvert]=useState(false);
  const [grp,setGrp]=useState({fac:true, dup:true, trait:false});

// ── Anomalies : ce qui ne balance pas entre les factures, l'agenda et les PO ──────────────
function cvAnomalies(factures, clients, appels){
  const out = [];
  const F = Object.values(factures).filter(f=>!f.annulee && !f.ok && f.ht!=null);
  const lab = f => (f.client==='CRS' ? 'CRS '+(f.nom||f.po||'') : (f.client ? f.client+' ' : '')+(f.nom||'')).trim();
  const date = f => f.date ? ' du '+cvFmtDay(String(f.date).slice(0,10)) : '';
  // A) Deux factures au même montant, ou une facture = la somme de deux autres, chez le même client / même PO.
  const groupes = {};
  F.filter(f=>f.ht>1).forEach(f=>{ const k = f.client==='CRS' ? 'CRS|'+(f.po||'') : (f.client||'?'); (groupes[k]=groupes[k]||[]).push(f); });
  const vus = new Set();
  Object.values(groupes).forEach(g=>{
    if(g.length<2 || g.length>40) return;
    g.forEach(a=>g.forEach(b=>{
      if(a.num<b.num && Math.abs(a.ht-b.ht)<0.01 && !vus.has(a.num+b.num)){ vus.add(a.num+b.num);
        out.push({type:'double', cle:'double|'+a.num+'|'+b.num, titre:lab(a),
          texte:'Les factures #'+a.num+date(a)+' et #'+b.num+date(b)+' ont exactement le même montant ('+cvMoney(a.ht)+').',
          quoi:'Si c\'est la même chose facturée deux fois, annule celle en trop. Si ce sont deux travaux différents, « C\'est réglé ».', factures:[a,b]}); }
    }));
    g.forEach(a=>{ for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){ const b=g[i], c=g[j];
      if(b===a||c===a) continue;
      if(Math.abs(a.ht-b.ht-c.ht)<0.02 && !vus.has('s'+a.num)){ vus.add('s'+a.num);
        out.push({type:'double', cle:'remplace|'+a.num, titre:lab(a),
          texte:'La facture #'+a.num+' ('+cvMoney(a.ht)+') donne le même total que #'+b.num+' + #'+c.num+' ensemble.',
          quoi:'Si #'+a.num+' a été refaite en deux factures, annule #'+a.num+'. Sinon, « C\'est réglé ».', factures:[a]}); } } });
  });
  Object.values(clients).forEach(c=>c.jobs.forEach(j=>{
    // B) Une même facture écrite sur deux jobs différentes
    j.dupFac.forEach(n=>{ if(String(c.code+' '+j.name) > String((j.dupAvec[n]||[''])[0])) return;   // une seule fois par paire
      // Preuves : la facture elle-même (PDF, description, montant) et chaque passage où le numéro est écrit.
      const preuve = {n, facture: factures[n]||null, jobs: Object.values(clients).flatMap(cc=>cc.jobs.filter(jj=>jj.events.some(ev=>String(ev.fac).split(/[\s,–-]+/).includes(n))).map(jj=>({
        label:(cc.code!=='PART'?cc.code+' ':'')+jj.name, address:jj.address,
        passages: jj.events.filter(ev=>String(ev.fac).split(/[\s,–-]+/).includes(n)).map(ev=>({...ev}))})))};
      out.push({type:'dup', cle:'dup|'+n, job:j, preuve, titre:'Facture #'+n,
        texte:'La facture #'+n+' est écrite sur deux jobs différentes : '+(c.code!=='PART'?c.code+' ':'')+j.name+' et '+(j.dupAvec[n]||[]).join(', ')+'.',
        quoi:'Si c\'est la même job écrite de plusieurs façons, clique « ✓ C\'est la même job ». Sinon, ouvre la job qui n\'est pas la bonne et corrige le numéro avec ✏️ Modifier.', client:c.code}); });
    if(c.code==='PART') return;
    // C) Facturé plus que le PO (job terminée)
    if(j.status==='done' && j.reg && j.reg.ht>0 && j.billed>j.reg.ht*1.10)
      out.push({type:'po', cle:'po|'+j.id+'|'+Math.round(j.billed), job:j, titre:c.code+' '+j.name+(j.po?' · '+j.po:''),
        texte:'Facturé '+cvMoney(j.billed)+' pour un PO de '+cvMoney(j.reg.ht)+' (+'+Math.round((j.billed/j.reg.ht-1)*100)+' %) — factures '+j.factures.map(n=>'#'+n).join(', ')+'.',
        quoi:'Des extras ? Demande un PO révisé au contracteur. Si c\'est convenu, « C\'est réglé ».', client:c.code});
  }));
  return out;
}

// Vérifications réglées à la main (« C'est réglé ») : onglet « Verifications » du registre des jobs (Clé | Statut | Le).
function useVerifsReglees(cfg){
  const [etat,setEtat]=useState({map:{}, rows:{}, existe:false});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    if(!id) return;
    try{ const r = await lireCache(id, 'Verifications!A1:C', force);
      const map={}, rows={}; (r.result.values||[]).slice(1).forEach((v,i)=>{ if(!v[0]) return; rows[v[0]]=i+2; if(v[1]) map[v[0]]=v[2]||true; });
      setEtat({map, rows, existe:true});
    }catch(e){ setEtat({map:{}, rows:{}, existe:false}); }
  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  const marquer = async (cle, regle)=>{
    setEtat(s=>{ const map={...s.map}; if(regle) map[cle]=new Date().toLocaleDateString('fr-CA'); else delete map[cle]; return {...s, map}; });
    try{
      if(!etat.existe) await ensureSheetsExist(id, [{name:'Verifications', headers:['Clé','Statut','Le']}]);
      const ligne=[cle, regle?'Réglé':'', new Date().toLocaleDateString('fr-CA')];
      if(etat.rows[cle]) await sheetsUpdateRow(id, 'Verifications', etat.rows[cle], ligne); else await sheetsAppendRow(id, 'Verifications', ligne);
      await lire(true);
    }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); lire(true); }
  };
  return [etat.map, marquer];
}
// Ce qui reste à vérifier : sans les réglées, et sans les jobs terminées si la case « Terminées » est décochée.
// Une erreur d'argent reste à traiter même si la job est terminée : on enlève seulement celles marquées « réglé ».
function estRegleDup(reglees, n){ return Object.keys(reglees||{}).some(k=>k==='dup|'+n || k.startsWith('dup|'+n+'|')); }
function cvAnomaliesActives(liste, reglees){
  return liste.filter(a=>!(reglees||{})[a.cle] && !(a.type==='dup' && estRegleDup(reglees, a.cle.split('|')[1])));
}

// Dans la fiche d'une job : « la facture #n est aussi écrite sur… » avec quoi faire, sur place.
// Facture écrite sur plus d'une job : montre TOUS les passages qui ont ce numéro (cette job ET les autres),
// chacun avec son lien et « ✏️ Modifier », pour corriger celui qui n'est pas bon — ou « C'est la même job ».
function CvDupJob({job, n, facture, cfg, clients, onRegle, onChanged}){
  const aLeNo = e => String(e.fac||'').split(/[\s,–-]+/).includes(n);
  const toutes = clients ? Object.values(clients).flatMap(c=>c.jobs) : [job];
  const jobs = toutes.filter(j=>j.events.some(aLeNo)).sort((a,b)=>(a.id!==job.id)-(b.id!==job.id));
  const passages = jobs.reduce((t,j)=>t+j.events.filter(aLeNo).length,0);
  return <div className="card" style={{borderColor:'var(--danger)',padding:10,fontSize:13,marginBottom:10}}>
    <div><b>La facture #{n} est écrite sur {jobs.length} jobs ({passages} passages) :</b></div>
    {facture ? <div className="muted" style={{fontSize:12.5,marginTop:2}}>Ce que dit la facture : {[facture.client, facture.nom, facture.desc].filter(Boolean).join(' · ')}{facture.ht!=null ? ' · '+cvMoney(facture.ht) : ''}{facture.date ? ' · '+cvFmtDay(String(facture.date).slice(0,10)) : ''}
      {facture.pdf && <> · <a href={'https://drive.google.com/file/d/'+facture.pdf+'/view'} target="_blank" rel="noopener" style={{color:'var(--accent)',fontWeight:700}}>Voir le PDF ↗</a></>}</div>
      : <div className="muted" style={{fontSize:12.5,marginTop:2}}>Facture pas encore dans le registre (pas de PDF).</div>}
    <div style={{display:'grid',gap:8,margin:'8px 0'}}>
      {jobs.map(j=><div key={j.id} style={{border:'1px solid var(--border2)',borderRadius:8,padding:'6px 8px'}}>
        <div style={{fontWeight:700}}>{j.client!=='PART' ? j.client+' ' : ''}{j.name}{j.po ? <span className="muted" style={{fontWeight:400}}> · {j.po}</span> : ''}{j.address ? <span className="muted" style={{fontWeight:400}}> · {j.address}</span> : ''}
          {j.id===job.id && <span className="badge" style={{marginLeft:6,fontSize:10.5}}>cette job</span>}</div>
        {j.events.filter(aLeNo).map((e,i)=><div key={i} style={{paddingLeft:8,marginTop:3,fontSize:12.5}}>
          <b style={{fontVariantNumeric:'tabular-nums'}}>{cvFmtDay(e.day)}</b> <span style={{fontWeight:800,fontSize:11,color:'var(--accent)'}}>{e.phase}</span> « {e.title} »{e.as ? ' · appel '+e.as : ''} · facture {e.fac}
          {e.lien && <> · <a href={e.lien} target="_blank" rel="noopener" style={{color:'var(--accent)'}}>événement ↗</a></>}
          <CvInscrirePassage cfg={cfg} e={e} onDone={onChanged}/></div>)}
      </div>)}
    </div>
    <div className="muted" style={{fontSize:12.5}}>👉 Si c'est la même job écrite autrement : « C'est la même job ». Sinon, « ✏️ Modifier » le passage qui n'a pas le bon numéro.</div>
    <div style={{marginTop:6}}><button className="btn btn-sm btn-s" onClick={onRegle}>✓ C'est la même job</button></div>
  </div>;
}

// Une job dans les preuves : une ligne (nom, adresse, nombre de passages), les passages s'ouvrent au clic.

  const [ouvert,setOuvert]=useState(false);

const CV_ANOM_ORDRE = [['double','Facturé deux fois ?'],['dup','Facture écrite sur la mauvaise job ?'],['po','Plus que le PO']];

function CvAnomalies({cfg, factures, clients, appels, onOpen, onChanged}){
  const [ouvert,setOuvert]=useState(null);
  const [busy,setBusy]=useState('');
  const [confirme,setConfirme]=useState('');

// Semaine : les passages jour par jour (lun → dim), avec les heures, l'équipe, et ce qu'il faut commander.
function cvLundi(d){ const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function cvHeure(iso){ const m=String(iso||'').match(/T(\d{2}):(\d{2})/); return m ? (+m[1])+' h'+(m[2]!=='00'?' '+m[2]:'') : ''; }
// Commandes de stock : « placée » ou non, par passage (onglet « Commandes » du registre des jobs, partagé entre appareils).
// Étapes cochées à la main dans Projets : onglet « Etapes » du registre des jobs (Job | Étape | Statut | Le).
// Petites lectures partagées entre les onglets (Commandes, Etapes, Adresses) : gardées 2 min.
const LECT_CACHE = {};
// v122 : chaque écriture dans un Sheet est suivie (onglet + moment). Une lecture attend les écritures en cours sur son onglet,
// ignore le cache s'il est plus vieux que la dernière écriture, et relit si quelqu'un a écrit pendant qu'elle lisait.
// Résultat : après un lien ou un changement, l'écran ne revient plus en arrière.
const ECRIT = {};
const ongletDe = r => { const x = String(r||''); const m = x.match(/^'((?:[^']|'')+)'!/) || x.match(/^([^!']+)!/); return m ? m[1].replace(/''/g,"'") : (/^\$?[A-Z]+\$?\d*(:\$?[A-Z]+\$?\d*)?$/i.test(x) ? '*' : x); };
function ecritureSur(id, onglet, promesse){
  const e = (ECRIT[id] = ECRIT[id] || {}), x = (e[onglet] = e[onglet] || {t:0, p:new Set()});
  x.t = Date.now(); x.p.add(promesse); const fin = ()=>{ x.p.delete(promesse); x.t = Date.now(); }; promesse.then(fin, fin);
}
function derniereEcriture(id, onglet){ let t=0; const ps=[]; Object.entries(ECRIT[id]||{}).forEach(([k,x])=>{ if(onglet==='*' || k==='*' || k===onglet){ t=Math.max(t,x.t); ps.push(...x.p); } }); return {t, ps}; }
function suivreEcritures(){
  const s = window.gapi && window.gapi.client && window.gapi.client.sheets && window.gapi.client.sheets.spreadsheets; if(!s || s.__suivi) return; s.__suivi = true;
  const env = (obj, m, onglets)=>{ const f = obj && obj[m]; if(typeof f!=='function') return;
    obj[m] = function(o){ const pr = Promise.resolve(f.apply(this, arguments)); try{ onglets(o||{}).forEach(n=>ecritureSur(o.spreadsheetId, n, pr)); }catch(e){} return pr; }; };
  env(s.values,'update',o=>[ongletDe(o.range)]); env(s.values,'append',o=>[ongletDe(o.range)]); env(s.values,'clear',o=>[ongletDe(o.range)]);
  env(s.values,'batchUpdate',o=>((o.resource&&o.resource.data)||[]).map(d=>ongletDe(d.range))); env(s.values,'batchClear',o=>((o.resource&&o.resource.ranges)||[]).map(ongletDe));
  env(s,'batchUpdate',()=>['*']);
}
async function lireCache(id, range, force){
  suivreEcritures();
  const k = id+'|'+range, ong = ongletDe(range);
  for(let essai=0; essai<4; essai++){
    let w = derniereEcriture(id, ong);
    if(w.ps.length){ await Promise.allSettled(w.ps); w = derniereEcriture(id, ong); }
    const c = LECT_CACHE[k];
    if(!force && c && c.t > w.t && Date.now()-c.t < 120000) return c.r;
    const t0 = Date.now();
    const r = await window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId:id, range});
    const w2 = derniereEcriture(id, ong);
    if((w2.ps.length || w2.t >= t0) && essai<3){ force = true; continue; }   // écrit pendant la lecture → relire
    LECT_CACHE[k] = {t:Date.now(), r};
    return r;
  }
}
function useEtapesManuelles(cfg){
  const [etat,setEtat]=useState({map:{}, rows:{}, lu:false});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{

    try{
      const r = await lireCache(id, 'Etapes!A1:D', force);
      const map={}, rows={}; (r.result.values||[]).slice(1).forEach((row,i)=>{ if(!row[0]) return; const k=row[0]+'|'+row[1]; rows[k]=i+2; if(row[2]==='Fait') map[k]=true; });
      setEtat({map, rows, lu:true, existe:true});
    }catch(e){ setEtat({map:{}, rows:{}, lu:true, existe:false}); }
  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  const basculer = async (jobId, titre, fait)=>{
    const k = jobId+'|'+titre, ligne=[jobId, titre, fait?'Fait':'', new Date().toLocaleString('fr-CA')];
    setEtat(s=>{ const map={...s.map}; if(fait) map[k]=true; else delete map[k]; return {...s, map}; });
    try{

      if(etat.rows[k]) await sheetsUpdateRow(id, 'Etapes', etat.rows[k], ligne); else await sheetsAppendRow(id, 'Etapes', ligne);

let CMD_ENTETES_OK = false;
// « Commande » en gras (lettres grasses Unicode : visibles partout — iPhone, Google Agenda, Sheet).
const CMD_TITRE = '📦 𝗖𝗼𝗺𝗺𝗮𝗻𝗱𝗲';
const RE_CMD_LIGNE = /^📦 (𝗖𝗼𝗺𝗺𝗮𝗻𝗱𝗲|Commande) :/, RE_NOTE_LIGNE = /^📦 Note commande :/, RE_CLIENT_LIGNE = /^👤 Client :/;
// Remet la description d'un événement en ordre :
//   1. 📦 𝗖𝗼𝗺𝗺𝗮𝗻𝗱𝗲 : Dubo + Shop — à aller chercher
//   2. Appel de service / Ordre de travail / Facture (bloc « Suivi », comme avant)
//   3. la description des travaux (tout le reste, sans y toucher)
//   4. 📋 Liste de commande (s'il y en a une)
//   5. 👤 Client : nom · téléphone · courriel
// quoi.commande / quoi.liste / quoi.client : undefined = garder ce qui est là, '' = enlever.
// quoi.eviter : téléphone / courriel du client — s'ils sont déjà écrits dans les travaux, on n'ajoute pas la ligne client.
const RE_KLM_LIGNE = /^(Appel de service|Ordre de travail|Facture)\s*:/i, RE_LISTE_LIGNE = /^📋 Liste de commande/;
function cvComposerDescription(desc, quoi){
  quoi = quoi || {};
  let t = String(desc||'');
  let suivi = '';
  const i = t.indexOf('── Suivi ──'), k = t.indexOf('── ↑ ──');
  if(i>=0 && k>i){ suivi = t.slice(i, k+'── ↑ ──'.length); t = t.slice(0,i)+'\n'+t.slice(k+'── ↑ ──'.length); }
  let L = t.split('\n');
  const klm = L.filter(l=>RE_KLM_LIGNE.test(l.trim()));               // appel / OT / facture écrits hors du bloc
  L = L.filter(l=>!RE_KLM_LIGNE.test(l.trim()));
  let cmd = L.find(l=>RE_CMD_LIGNE.test(l)) || '', client = L.find(l=>RE_CLIENT_LIGNE.test(l)) || '', liste = '';
  const li = L.findIndex(l=>RE_LISTE_LIGNE.test(l));
  if(li>=0){ let fin = L.findIndex((l,x)=>x>li && (RE_CLIENT_LIGNE.test(l) || RE_CMD_LIGNE.test(l))); if(fin<0) fin = L.length;
    liste = L.slice(li, fin).join('\n').trim(); L = L.slice(0,li).concat(L.slice(fin)); }
  const vieilleNote = L.find(l=>RE_NOTE_LIGNE.test(l));                // ancien format « 📦 Note commande : … »
  if(vieilleNote && !liste) liste = '📋 Liste de commande :\n'+vieilleNote.replace(RE_NOTE_LIGNE,'').trim();
  L = L.filter(l=>!RE_CMD_LIGNE.test(l) && !RE_NOTE_LIGNE.test(l) && !RE_CLIENT_LIGNE.test(l));
  const travaux = L.join('\n').replace(/^\s+|\s+$/g,'').replace(/\n{3,}/g,'\n\n');
  if(quoi.commande!==undefined) cmd = quoi.commande;
  if(quoi.liste!==undefined) liste = quoi.liste ? '📋 Liste de commande :\n'+quoi.liste : '';
  if(quoi.client!==undefined && !(quoi.eviter||[]).some(x=>x && travaux.includes(x))) client = quoi.client;
  return [cmd, suivi || klm.join('\n'), travaux, liste, client].filter(Boolean).join('\n\n');
}
// Infos du client d'une job (registre) pour la fin de la description.
function cvClientInfo(j){ const r = (j && j.reg) || {}; return {client:[r.client, r.tel, r.courriel].filter(Boolean).join(' · '), eviter:[r.tel, r.courriel].filter(Boolean)}; }   // titres « Fournisseur » et « Mode » ajoutés à l'onglet Commandes (une fois)
function useCommandes(cfg){
  const [etat,setEtat]=useState({map:{}, pret:false});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    if(!id) return;
    try{
      const r = await lireCache(id, 'Commandes!A1:I', force);
      const map={}; (r.result.values||[]).slice(1).forEach((row,i)=>{ if(row[0]) map[row[0]]={row:i+2, statut:row[3]||'', quand:row[4]||'', note:row[6]||'', fournisseur:row[7]||'', mode:row[8]||''}; });
      setEtat({map, pret:true});
    }catch(e){ setEtat({map:{}, pret:true}); }
  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  // statut : 'Placée' | 'Rien à commander' | 'À placer' ; note : texte ajouté aussi à la description de l'événement.
  // extra : {fournisseur, mode} quand la commande est placée (ex. Dubo, « À aller chercher »).
  const enregistrer = async (cle, info, statut, note, extra)=>{
    const ex = etat.map[cle] || {};
    const placee = (statut ?? ex.statut) === 'Placée';
    const fournisseur = placee ? ((extra && extra.fournisseur) ?? ex.fournisseur ?? '') : '';
    const mode = placee ? ((extra && extra.mode) ?? ex.mode ?? '') : '';
    const ligne = [cle, info.day, info.job, statut ?? ex.statut ?? 'À placer', new Date().toLocaleString('fr-CA'), info.ot||'', note ?? ex.note ?? '', fournisseur, mode];
    setEtat(s=>({...s, map:{...s.map, [cle]:{...ex, statut:ligne[3], quand:ligne[4], note:ligne[6], fournisseur, mode}}}));
    try{
      if(!Object.keys(etat.map).length) await ensureSheetsExist(id, [{name:'Commandes', headers:['Clé','Date','Job','Statut','Mis à jour le','OT','Note','Fournisseur','Mode']}]);
      else if(!CMD_ENTETES_OK){ await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Commandes!H1:I1', valueInputOption:'RAW', resource:{values:[['Fournisseur','Mode']]}}); CMD_ENTETES_OK = true; }
      if(ex.row) await sheetsUpdateRow(id, 'Commandes', ex.row, ligne); else await sheetsAppendRow(id, 'Commandes', ligne);
      // Description de l'événement, dans cet ordre : en haut « 📦 Commande : Dubo — à aller chercher » (+ la note),
      // au centre tout le reste (sans y toucher), à la fin les infos du client.
      if((statut || note!==undefined) && info.eventId && info.calId){
        try{
          const ev = await window.gapi.client.calendar.events.get({calendarId:info.calId, eventId:info.eventId});
          const avant = ev.result.description||'';
          const quoi = {client: info.client ? '👤 Client : '+info.client : undefined, eviter: info.eviter};
          if(statut) quoi.commande = statut==='Placée' && (fournisseur || mode) ? CMD_TITRE+' : '+[fournisseur, mode ? mode.toLowerCase() : ''].filter(Boolean).join(' — ') : '';
          if(note!==undefined && note!==null) quoi.liste = note || '';
          const apres = cvComposerDescription(avant, quoi);
          if(apres!==avant) await window.gapi.client.calendar.events.patch({calendarId:info.calId, eventId:info.eventId, resource:{description:apres}});
        }catch(e){ console.warn('Commande : description non mise à jour', e); }
      }
      await lire(true);
    }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); lire(); }
  };
  return [etat.map, enregistrer];
}

const CMD_FAIT = ['Placée','Rien à commander'];
const CMD_FOURNISSEURS = ['Dubo','Lumen','Entrepôt'];   // un ou plusieurs (ex. Dubo + Entrepôt) — la shop = l'entrepôt
const CMD_MODES = ['À aller chercher'];   // pas de livraison des fournisseurs pour l'instant : Dubo / Lumen = à aller chercher
// Une seule commande pour les passages collés d'une même job et même phase (ex. rough sur 2 jours) :
// si un passage de la même phase à 7 jours ou moins est réglé, celui-ci l'est aussi (via).
function cvCmd(commandes, job, e){
  commandes = commandes || {};
  const cle = e.id || (e.day+'|'+job.id), direct = commandes[cle];
  if(direct && direct.statut) return {...direct, cle, fait: CMD_FAIT.includes(direct.statut)};
  const t = new Date(e.day+'T12:00:00').getTime();
  for(const o of job.events){
    if(o===e || o.attente || (o.phase||'')!==(e.phase||'') || Math.abs(new Date(o.day+'T12:00:00').getTime()-t) > 7*864e5) continue;
    const c = commandes[o.id || (o.day+'|'+job.id)];
    if(c && CMD_FAIT.includes(c.statut)) return {...c, cle, via:o.day, fait:true};
  }
  return {cle, fait:false};
}
function cvCmdTexte(cmd){ return cmd.statut==='Placée' ? '✅ '+([cmd.fournisseur, cmd.mode ? cmd.mode.toLowerCase() : ''].filter(Boolean).join(' · ') || 'Placée') : '✓ Pas besoin'; }
// Boutons d'une commande : ✅ Placée → choisir le fournisseur et livraison / à aller chercher ; ✓ Pas besoin ; ↩ pour défaire.

  </span>;
  if(choix){
    const bascule = f => setChoix(c=>({...c, f: c.f.includes(f) ? c.f.filter(x=>x!==f) : [...c.f, f]}));

      {fournisseurs.length>0 && <span className="muted" style={{fontSize:11.5}}>🏃 {fournisseurs.join(' et ')} : à aller chercher</span>}
      <span style={{display:'flex',gap:4}}>
        <button className="btn btn-sm btn-p" disabled={!choix.f.length} onClick={()=>{ onCommande(cmd.cle, info, 'Placée', undefined, {fournisseur:CMD_FOURNISSEURS.filter(f=>choix.f.includes(f)).join(' + '), mode:fournisseurs.length ? 'À aller chercher' : ''}); setChoix(null); }}>✓ Enregistrer</button>
        <button className="btn btn-sm" onClick={()=>setChoix(null)}>Annuler</button>
      </span>

  }
  return <span style={{display:'inline-flex',gap:4,flexWrap:'wrap'}}>
    <button className="btn btn-sm" title="Commande placée : Dubo, Lumen et/ou stock de la shop" onClick={()=>setChoix({f:[], mode:''})}>✅ Placée…</button>
    <button className="btn btn-sm" title="Pas besoin de commande (stock déjà là)" onClick={()=>onCommande(cmd.cle, info, 'Rien à commander')}>✓ Pas besoin</button>
  </span>;
}
function CvSemaine({clients, appels, onOpen, ancre, commandes, onCommande, manuels, isDesktop}){
  const [dec,setDec]=useState(0);

// ── v151 : Répertoire — fiches clients (particuliers + contracteurs) et fournisseurs ─────────────────
// Onglet privé « Fiches » de La mémoire — Jobs (jamais dans le code) :
//   Type | Nom | Code | Aussi écrit | Adresse | Ville | Téléphone | Courriel | Notes | PO | Client | Mis à jour
//   Type « Client »      : un particulier (Code PART) ou un contracteur (Code ASC…) — Aussi écrit = autres façons d'écrire son nom
//   Type « Job »         : regroupe/renomme des jobs (Aussi écrit = les noms d'origine) ; pour un particulier, Client = son nom
//   Type « Fournisseur » : notes sur un fournisseur
//   Type « Masqué »      : un nom à cacher du répertoire (ex. « Lettrage du camion 14 ») ; « Retiré » = ligne désactivée
// L'agenda n'est jamais modifié : le CRM lit seulement cette table.
const FICHE_ENTETE = ['Type','Nom','Code','Aussi écrit','Adresse','Ville','Téléphone','Courriel','Notes','PO','Client','Mis à jour'];
const ficheNorm = x => cvNorm(cvSansInit(String(x||'')));
function ficheNomJob(f){ return f.code==='PART' ? [f.client, f.nom].filter(Boolean).join(' — ') : f.nom; }
function lireFiches(rows){
  const F = {clients:[], jobs:[], fourn:[], masques:[], contacts:[], retirees:[]};
  (rows||[]).slice(1).forEach((r,i)=>{
    const t = cvNorm(r[0]); if(!t) return;
    const f = {row:i+2, type:String(r[0]||''), nom:String(r[1]||'').trim(), code:String(r[2]||'').trim().toUpperCase(),
      alias:String(r[3]||'').split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean), adresse:r[4]||'', ville:r[5]||'', tel:r[6]||'', courriel:String(r[7]||'').trim(),
      notes:r[8]||'', po:String(r[9]||'').trim(), client:String(r[10]||'').trim()};
    if(f.code==='PY') f.code = 'PAY';
    if(t==='job'){ f.ids = new Set(f.alias.filter(a=>/^id:/.test(a)).map(a=>a.slice(3))); f.alias = f.alias.filter(a=>!/^id:/.test(a));   // v158 : id exact de la job (même nom, autre adresse = autre job)
      f.canon = cvJobCle({code:f.code||'PART'}, {name:ficheNomJob(f), po:f.po}); f.aliasN = new Set([...f.alias, f.canon, ficheNomJob(f)].map(ficheNorm).filter(Boolean)); F.jobs.push(f); }
    else if(t==='jobretiree'){ f.ids = new Set(f.alias.filter(a=>/^id:/.test(a)).map(a=>a.slice(3))); f.alias = f.alias.filter(a=>!/^id:/.test(a));   // v181 : job retirée d'un contracteur / client
      f.aliasN = new Set([...f.alias, f.nom].map(ficheNorm).filter(Boolean)); F.retirees.push(f); }
    else if(t==='fournisseur') F.fourn.push(f);
    else if(t==='client'){ const l = f.client.split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean);   // v181 : colonne Client = fiches liées (« ≠ Nom » = pas lié)
      const cj = /^conjoint\s*:/i;   // v193 : « Conjoint: Nom » = conjoint(e) qui peut payer les factures
      f.conjoints = l.filter(x=>cj.test(x)).map(x=>x.replace(cj,'').trim()).filter(Boolean);
      f.liens = l.filter(x=>!/^≠/.test(x) && !cj.test(x)); f.pasLies = l.filter(x=>/^≠/.test(x)).map(x=>x.replace(/^≠\s*/,'')); F.clients.push(f); }
    else if(t==='masque' || t==='supprime') F.masques.push(f);   // v173 : « Supprimé » (ancien « Masqué ») = n'apparaît plus nulle part
    else if(t==='contact') F.contacts.push(f);   // v161 : employé d'un contracteur (Code = ASC, CRS…) ; Notes = rôle
  });
  return F;
}
// Nom d'origine d'une destination d'achat → nom de la job regroupée (« ASC Colibri » → « ASC Le Colibri ASC-012 »)
function ficheJobAlias(F){
  const m = {};
  ((F && F.jobs)||[]).forEach(f=>f.aliasN.forEach(a=>{ m[a] = f.canon; }));
  return m;
}
// v181 : job retirée (« n'a pas rapport avec ce contracteur ») : même code et même id, ou même nom
function ficheJobRetiree(F, code, ids, noms){
  const il = [...ids].filter(Boolean);
  return ((F && F.retirees)||[]).find(f=>(f.code||'PART')===code && (il.some(i=>f.ids.has(i)) || ((!f.ids.size || !il.length) && noms.some(n=>n && f.aliasN.has(ficheNorm(n))))));
}
// Regroupe dans cvBuildClients les jobs que tu as regroupées / renommées (fiches « Job »).
function ficheAppliquerJobs(jobs, F, regByPO){
  Object.values(jobs).forEach(j=>{ if(ficheJobRetiree(F, j.client, [j.id], [j.name])) delete jobs[j.id]; });
  ((F && F.jobs)||[]).forEach(f=>{
    const code = f.code || 'PART';
    let membres = f.ids.size ? Object.values(jobs).filter(j=>j.client===code && (f.ids.has(j.id) || (f.po && j.po===f.po))) : [];
    if(!membres.length) membres = Object.values(jobs).filter(j=>j.client===code && (f.aliasN.has(ficheNorm(cvJobCle({code}, j))) || f.aliasN.has(ficheNorm(j.name)) || (f.po && j.po===f.po)));
    if(!membres.length) return;
    const p = membres.find(j=>f.po && j.po===f.po) || membres.find(j=>j.po) || membres[0];
    membres.forEach(j=>{ if(j===p) return; p.events.push(...j.events); if(!p.reg && j.reg) p.reg = j.reg; delete jobs[j.id]; });
    p.name = ficheNomJob(f); p.po = f.po; p.reg = (f.po && regByPO[f.po]) || p.reg; p.ficheJob = f.row;
  });
}

// ── Personnes (particuliers) ────────────────────────────────────────────
// « Alain Cuisine Robichaud », « Alain Borne Robichaud » → même personne (alain robichaud), job « Cuisine » / « Borne ».
const REP_MOTS_JOB = new Set(['cuisine','cuisines','borne','bornes','sdb','salle','bain','bains','garage','spa','piscine','thermopompe','panneau','entree','electrique',
  'extra','rough','finition','finale','serv','service','ajustement','ajustements','ajust','soussol','ssol','chauffage','plinthe','plinthes','reno','renovation','cabanon',
  'generatrice','agrandissement','extension','chalet','condo','app','appt','appartement','unite','luminaire','luminaires','exterieur','interieur','demo','rapup',
  'prep','soumission','estimation','phase','deck','patio','tempo','temporaire','raccordement','recharge','rdc','etage','sdb2','fixtures','thermostat','thermostats','prise','prises']);
function repMots(nom){
  const brut = String(nom||'').split(/\s+—\s+/)[0];   // v158 : « Alain Robichaud — Néons » → le client est Alain Robichaud ; « Néons » est seulement le nom de la job
  const toks = cvSansInit(brut).split(/[\s,\/()+&.\-]+/).filter(Boolean);
  const garde = [], job = [];
  for(const t of toks){
    if(/\d/.test(t)) break;                                  // une adresse commence : on arrête (« Guy Bergeron 123 rue… »)
    const n = cvNorm(t); if(!n) continue;
    if(REP_MOTS_JOB.has(n)) job.push(t); else garde.push(t);
  }
  return {garde, job};
}
function persCle(nom){ const g = repMots(nom).garde.map(cvNorm).filter(Boolean); return g.join(' '); }
function persNomPropre(nom){ const g = repMots(nom).garde.join(' ').replace(/^[\s\-–—,]+|[\s\-–—,]+$/g,''); return g ? cvTitleCase(g) : ''; }
function persLabelJob(nom){ const j = repMots(nom).job; return j.length ? cvTitleCase(j.join(' ')) : ''; }
// Courriel d'une compagnie → contracteur (pour les factures/soumissions envoyées à leur courriel)
const CLIENT_DOMAINES = {'payneconstruction.ca':'PAY'};   // confirmé par William (19 oct. 2026) : seulement Payne
const CLIENT_COURRIELS = {'infopayneconstruction@gmail.com':'PAY'};
function repCodeCourriel(e, F){
  const d = String(e||'').toLowerCase().split('@')[1] || ''; if(!d) return '';
  if(CLIENT_COURRIELS[String(e).trim().toLowerCase()]) return CLIENT_COURRIELS[String(e).trim().toLowerCase()];
  const f = ((F && F.clients)||[]).find(x=>x.code && CLIENT_CODES[x.code] && String(x.courriel).toLowerCase().split(/[\s,;]+/).some(c=>c.split('@')[1]===d));
  return f ? f.code : (CLIENT_DOMAINES[d] || '');
}
// v154 : commerce (Éclairage Saran, St-Jean Pizzeria, dentiste, Actiforme…) ou particulier — deviné par des mots, corrigeable dans la fiche
const REP_COMMERCE_RE = /\b(pizzeria|pizza|dentiste|dentaire|denturologiste|clinique|centre|restaurant|resto|bistro|cafe|boutique|pharmacie|store|aubainerie|epicerie|depanneur|quincaillerie|garderie|cpe|ecole|eglise|paroisse|municipalite|ville de|hotel|motel|auberge|gym|actiforme|eclairage saran|eclairage moderne|inc|ltee|enr|cie|corporation|corp|cooperative|coop|caisse|desjardins|bureau|cabinet|notaire|avocats?|comptables?|pavage|construction|immobilier|gestion|entreprises?|industries?|magasin|marche|bar|brasserie|microbrasserie|dentistes?|veterinaire|optometriste|physio|chiro|spa nordique|condos? [a-z]+ inc)\b/;
const REP_COURRIEL_PERSO = /@(gmail|hotmail|outlook|live|yahoo|videotron|icloud|me|msn|sympatico|bell|cgocable|globetrotter|telus|aol|protonmail|mail|xplornet|cooptel|derytele|b2b2c|tlb)\./i;
function repEstCommerce(p){
  const t = [p.nom, ...p.noms].map(x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()).join(' | ');
  if(REP_COMMERCE_RE.test(t)) return true;
  return p.courriels.length>0 && p.courriels.every(e=>!REP_COURRIEL_PERSO.test(e));   // courriel de compagnie (@eclairagesaran.com, @pavagebarbeau.ca…)
}
const REP_SPECIAL = j => !j || CV_DESTS.includes(j) || j==='Éclairage Saran' || /^Employé — /.test(j);
function repProche(x, y){ if(x===y) return true; if(Math.abs(x.length-y.length)>1 || Math.min(x.length,y.length)<5) return false; let i=0, j=0, d=0; while(i<x.length && j<y.length){ if(x[i]===y[j]){ i++; j++; continue; } if(++d>1) return false; if(x.length>y.length) i++; else if(y.length>x.length) j++; else { i++; j++; } } return d + (x.length-i) + (y.length-j) <= 1; }

// Construit le répertoire à partir de tout ce que le CRM connaît (agenda, registre des jobs, factures envoyées, achats, soumissions, fiches).
// v170 : clé d'adresse « 632 champlain » (numéro + 1er mot de la rue) pour relier une job de l'agenda à un client du logiciel comptable
const REP_RUE = /^(rue|r|av|ave|avenue|boul|boulevard|bd|ch|chemin|route|rte|rang|montee|place|pl|croissant|terrasse|impasse|allee|de|du|des|la|le|les|l|d|st|ste|saint|sainte|app|apt|appartement|local|unite|suite)$/;
function repCleAdresse(txt){
  const t = String(txt||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const m = t.match(/(^|[^0-9a-z])(\d{1,5}[a-z]?)\s*[,\-]?\s+([^,\n]+)/); if(!m) return '';
  const w = m[3].split(/[^a-z0-9]+/).filter(x=>x && !REP_RUE.test(x)); return w.length ? m[2]+' '+w[0] : '';
}
// Contracteur nommé dans le logiciel comptable (« Payne construction inc. », « Cuisine Rive-Sud », « Ascension Construction »)
const CLIENT_MOTS = {CRS:['cuisinesrivesud','cuisinerivesud'], PAY:['payne'], ASC:['ascension'], SAR:['saranconstruction'], GOU:['goulet'], '5PIL':['5piliers','cinqpiliers'], BOM:['bomont'], RROY:['rroy']};
function repContrDeNom(n, F){
  const x = cvNorm(n); if(!x) return '';
  for(const [c, mots] of Object.entries(CLIENT_MOTS)) if(mots.some(m=>x.includes(m))) return c;
  const f = ((F && F.clients)||[]).find(f=>CLIENT_CODES[f.code] && f.nom && cvNorm(f.nom).length>=5 && x.includes(cvNorm(f.nom)));
  return f ? f.code : '';
}
function repConstruire({clients, registry, factures, achats, soumissions, F, contacts, gcmeq}){
  F = F || {clients:[], jobs:[], fourn:[], masques:[]}; F.retirees = F.retirees || [];
  const today = cvDay(new Date().toISOString());
  const jobFiche = (code, cle, po, id) => F.jobs.find(f=>(f.code||'PART')===code && ((f.po && po && f.po===po) || (id && f.ids.has(id)) || ((!id || !f.ids.size) && f.aliasN.has(ficheNorm(cle)))));
  // ---- Jobs (communes aux contracteurs et aux particuliers) ----
  const nouvelleJob = (code, key) => ({key, code, nom:'', po:'', adresse:'', cles:new Set(), ids:new Set(), events:[], factures:[], achats:[], reg:null, ficheJob:null, first:'', last:''});
  const ajouterJob = (jobsMap, code, src) => {        // src : {cle, nom, po, adresse, events, reg}
    const fj = jobFiche(code, src.cle, src.po, src.id);
    const key = fj ? 'F'+fj.row : src.po ? 'P'+src.po : src.id ? 'I'+src.id : 'N'+ficheNorm(src.nom || src.cle);
    const j = jobsMap[key] || (jobsMap[key] = nouvelleJob(code, key));
    if(fj){ j.ficheJob = fj; j.nom = fj.code==='PART' ? (fj.nom || '') : fj.nom; j.po = fj.po || j.po; }
    if(!j.nom && src.nom) j.nom = src.nom;
    if(!j.po && src.po) j.po = src.po;
    if(!j.adresse && src.adresse) j.adresse = src.adresse;
    if(src.reg && !j.reg) j.reg = src.reg;
    if(src.cle) j.cles.add(src.cle);
    if(src.id) j.ids.add(src.id);
    if(src.events) j.events.push(...src.events.filter(e=>!e.attente));
    return j;
  };
  // Une job nommée sans PO qui porte exactement le même nom qu'une job avec PO = la même
  const fusionNoms = jobsMap => {
    const avecPO = Object.values(jobsMap).filter(j=>j.key[0]==='P');
    Object.values(jobsMap).filter(j=>j.key[0]==='N' || j.key[0]==='I').forEach(j=>{
      let c = avecPO.filter(p=>ficheNorm(p.nom)===ficheNorm(j.nom));
      if(!c.length && j.key[0]==='N') c = Object.values(jobsMap).filter(p=>p!==j && (p.key[0]==='I' || p.key[0]==='F') && [...p.cles, p.nom].some(x=>ficheNorm(x)===ficheNorm(j.nom)));
      if(c.length>1 && j.key[0]==='N' && j.achats.length){   // même nom, deux adresses : la job dont les passages sont près de la date d'achat
        const t = new Date(String(j.achats[0].date||j.achats[0].recue)+'T12:00:00').getTime();
        const pres = c.filter(p=>p.events.some(e=>Math.abs(new Date(e.day+'T12:00:00').getTime()-t) <= 14*864e5)); if(pres.length===1) c = pres; }
      if(c.length!==1) return;
      const p = c[0]; j.cles.forEach(x=>p.cles.add(x)); p.events.push(...j.events); p.factures.push(...j.factures); p.achats.push(...j.achats); if(!p.adresse) p.adresse = j.adresse; delete jobsMap[j.key];
    });
  };
  const finirJob = j => {
    j.events.sort((a,b)=>a.day.localeCompare(b.day));
    const dates = [...j.events.map(e=>e.day), ...j.factures.map(f=>f.date), ...j.achats.map(a=>a.date||a.recue)].filter(Boolean).sort();
    j.first = dates[0] || ''; j.last = dates[dates.length-1] || '';
    j.facture = j.factures.filter(f=>!f.annulee).reduce((t,f)=>t+(f.ht||0),0);
    j.cout = j.achats.reduce((t,a)=>t+(a.st||0)*((a.part==null?100:a.part)/100),0);
    j.passages = new Set(j.events.map(e=>e.day)).size;
    // v169 : dernière visite (passé) et prochaine visite (à venir) — pour l'ordre des jobs
    const jours = [...new Set(j.events.map(e=>e.day))].sort();
    j.derniere = jours.filter(d=>d<=today).pop() || ''; j.prochaine = jours.find(d=>d>today) || '';
    j.equipe = [...new Set(j.events.flatMap(e=>e.crew||[]))];
  };
  // ---- Contracteurs ----
  const contr = {};
  const C = code => contr[code] || (contr[code] = {type:'contr', id:'C:'+code, code, nom:((F.clients.find(f=>f.code===code)||{}).nom) || CLIENT_CODES[code] || code, contact:CLIENT_CONTACT[code]||'',
    fiche:F.clients.find(f=>f.code===code)||null, jobs:{}, facturesSans:[], soum:[], contacts:[], achatsSans:[]});
  const codeDe = c => { c = String(c||'').toUpperCase(); if(c==='PY') c='PAY'; return CLIENT_CODES[c] ? c : ''; };
  Object.values(clients||{}).forEach(c=>{ if(c.code==='PART') return; c.jobs.forEach(j=>ajouterJob(C(c.code).jobs, c.code, {cle:cvJobCle(c,j), nom:j.name, po:j.po, adresse:j.address, events:j.events, reg:j.reg, id:j.id})); });
  (registry||[]).forEach(r=>{ const code = codeDe(r.code); if(!code) return;
    ajouterJob(C(code).jobs, code, {cle:cvJobCle({code}, {name:r.nom, po:r.po}), nom:cvTitleCase(r.nom||''), po:r.po, adresse:[r.adresse,r.ville].filter(Boolean).join(', '), reg:r}); });
  // ---- Personnes : union de noms et de courriels ----
  const parent = {}; const trouve = x => { while(parent[x] && parent[x]!==x){ parent[x] = parent[parent[x]] || parent[x]; x = parent[x]; } return x; };
  // v175 : deux fiches différentes ne se fusionnent jamais toutes seules (ex. « Robert Rondeau » et son commerce « Le jardin de la gaieté » ont le même courriel)
  const ficheR = {};
  const unir = (a, b) => { if(!a || !b) return; parent[a] = parent[a] || a; parent[b] = parent[b] || b; const ra = trouve(a), rb = trouve(b); if(ra===rb) return;
    const fa = ficheR[ra], fb = ficheR[rb]; if(fa && fb && fa!==fb) return; parent[rb] = ra; if(fb && !fa) ficheR[ra] = fb; };
  const noeud = x => { if(x) parent[x] = parent[x] || x; return x; };
  // v171 : « Robichaud Alain » = « Alain Robichaud » (mots triés) ; même téléphone = même client
  const nNom = nom => { const k = persCle(nom); return k && k.replace(/\s/g,'').length>=3 ? 'k:'+k.split(' ').sort().join(' ') : ''; };
  const nTel = t => { const d = String(t||'').replace(/\D/g,'').replace(/^1(?=\d{10}$)/,''); return d.length===10 ? 't:'+d : ''; };
  const nMail = e => { e = String(e||'').trim().toLowerCase(); return /@/.test(e) ? 'e:'+e : ''; };
  const recs = [];   // {noeud, nom, courriel, tel, adresse, kind, obj}
  const rec = r => { r.noeud = noeud(r.nNom || r.nMail || r.nAdr); if(r.nNom && r.nMail) unir(r.nNom, r.nMail); if(r.nAdr && r.noeud) unir(r.noeud, r.nAdr);
    const t = nTel(r.tel); if(t && r.noeud && telSur(t)) unir(r.noeud, t); if(r.noeud) recs.push(r); return r; };
  // v170 : adresses du logiciel comptable — une adresse qui appartient à UN seul client relie les jobs de l'agenda à ce client
  const gcLignes = (gcmeq||[]).map(r=>({nom:String(r[0]||'').trim(), lien:String(r[1]||'').trim(), adresse:[[r[2], r[3]].filter(Boolean).join(' ').trim(), r[4] ? 'app. '+r[4] : ''].filter(Boolean).join(', '),
    ville:String(r[5]||'').trim(), cp:String(r[7]||'').trim(), tel:String(r[8]||'').trim(), courriel:String(r[10]||'').trim().toLowerCase()})).filter(g=>g.nom && !/\?/.test(g.nom));
  const gcAdr = {}; gcLignes.forEach(g=>{ const k = repCleAdresse(g.adresse); if(k){ (gcAdr[k] = gcAdr[k] || new Set()).add(persCle(g.nom)); } });
  // même adresse, plusieurs noms : OK seulement si c'est la même famille (« Andrée Benn » et « Andrée et Robert Benn »)
  const adrSure = k => { const l = gcAdr[k] ? [...gcAdr[k]] : []; if(l.length===1) return true; if(!l.length) return false;
    const ws = l.map(n=>new Set(n.split(' ').filter(w=>w.length>=4))); return [...ws[0]].some(w=>ws.every(x=>x.has(w))); };
  const nAdresse = a => { const k = repCleAdresse(a); return k && adrSure(k) ? 'a:'+k : ''; };
  const gcTel = {}; gcLignes.forEach(g=>{ const t = nTel(g.tel); if(t) (gcTel[t] = gcTel[t] || new Set()).add(persCle(g.nom)); });
  const telSur = t => { const l = gcTel[t] ? [...gcTel[t]] : []; if(l.length<=1) return true;
    const ws = l.map(n=>new Set(n.split(' ').filter(w=>w.length>=4))); return [...ws[0]].some(w=>ws.every(x=>x.has(w))); };
  const masques = new Set(F.masques.flatMap(f=>[f.nom, ...f.alias]).map(x=>persCle(x)).filter(Boolean));
  const fichesTous = [...(F.contacts||[]).map(f=>({f, n:'c:'+f.row, id:'C:'+f.code+':'+cvNorm(f.nom)})),
    ...F.clients.filter(f=>f.code==='PART' || f.code==='COMMERCE' || !f.code).map(f=>({f, n:'f:'+f.row, id:'F:'+cvNorm(f.nom)}))];
  fichesTous.forEach(x=>{ noeud(x.n); ficheR[x.n] = x.id; });
  fichesTous.forEach(x=>{ const k = nNom(x.f.nom); if(k) unir(x.n, k); });   // le nom d'une fiche passe avant le « aussi écrit » d'une autre
  fichesTous.forEach(x=>{ x.f.alias.forEach(a=>{ const k = nNom(a); if(k) unir(x.n, k); });
    String(x.f.courriel||'').split(/[\s,;]+/).forEach(e=>{ const m = nMail(e); if(m) unir(x.n, m); }); });
  const part = (clients||{}).PART;
  (registry||[]).forEach(r=>{ if(codeDe(r.code) || !r.nom) return; rec({nNom:nNom(r.nom), nMail:nMail(r.courriel), nom:r.nom, tel:r.tel, courriel:r.courriel, adresse:[r.adresse,r.ville].filter(Boolean).join(', '), kind:'reg', obj:r}); });
  Object.values(factures||{}).forEach(f=>{
    const code = codeDe(f.client);
    if(code){ const po = /^aucun$/i.test(f.po) ? '' : f.po; const j = ajouterJob(C(code).jobs, code, {cle:cvJobCle({code}, {name:cvTitleCase(f.nom||''), po}), nom:cvTitleCase(f.nom||''), po}); j.factures.push(f); return; }
    const cc = repCodeCourriel(f.client, F); if(cc){ C(cc).facturesSans.push(f); return; }
    if(!f.nom && !/@/.test(f.client)) return;
    rec({nNom:nNom(f.nom), nMail:nMail(f.client), nom:f.nom, courriel:/@/.test(f.client)?f.client:'', kind:'fac', obj:f});
  });
  // v159 : un « particulier » dont le nom est exactement celui d'une job de contracteur (« Arnoux » = CRS Arnoux, « Dollier » = SAR Dollier)
  // est cette job, écrite sans le code dans l'agenda → on la range sous le contracteur (l'agenda n'est pas modifié).
  const contrCle = nom => String(cvSansInit(String(nom||'').split(/\s+—\s+/)[0])).replace(/(\d)([A-Za-zÀ-ÿ])/g,'$1 $2').split(/[\s,\/()+&.\-]+/)
    .map(cvNorm).filter(w=>w.length>=2 && !/\d/.test(w) && !REP_MOTS_JOB.has(w) && !/^(rough|finition|serv|service|ajust|demo|rapup|po)$/.test(w)).join(' ');
  const jobsContr = {};
  Object.values(contr).forEach(c=>Object.values(c.jobs).forEach(j=>[j.nom, ...j.cles].forEach(n=>{ const k = contrCle(String(n||'').replace(new RegExp('^'+c.code+'\\s+'),'')); if(k.replace(/\s/g,'').length>=4){ (jobsContr[k] = jobsContr[k] || new Set()).add(j); } })));
  const jobContrDe = nom => { const k = contrCle(nom); const l = k && jobsContr[k] ? [...jobsContr[k]] : [];
    const codes = new Set(l.map(j=>j.code)); if(codes.size!==1) return null;
    return l.sort((a,b)=>(!!b.po)-(!!a.po) || String(b.last||'').localeCompare(String(a.last||'')))[0]; };
  if(part) part.jobs.forEach(j=>{
    const jc = jobContrDe(j.name);
    if(jc){ jc.events.push(...j.events.filter(e=>!e.attente)); jc.cles.add(j.name); if(j.id) jc.ids.add(j.id); if(!jc.adresse && j.address) jc.adresse = jc.adresse || j.address; jc.sansCode = (jc.sansCode||[]).concat(j); return; }
    rec({nNom:nNom(j.name), nAdr:nAdresse(j.address), nom:String(j.name||'').split(/\s+—\s+/)[0], adresse:j.address, kind:'job', obj:j, tel:(j.reg&&j.reg.tel)||'', courriel:(j.reg&&j.reg.courriel)||''});
  });
  (soumissions||[]).forEach(s=>{
    const cc = repCodeCourriel(s.courriel, F) || repCodeCourriel(s.client, F); if(cc){ C(cc).soum.push(s); return; }
    const nom = /@/.test(s.client) ? '' : s.client;
    rec({nNom:nNom(nom), nMail:nMail(s.courriel || (/@/.test(s.client)?s.client:'')), nom, courriel:s.courriel, kind:'soum', obj:s});
  });
  gcLignes.forEach(g=>{
    const adr = [g.adresse, g.ville, g.cp].filter(Boolean).join(', ');
    const code = repCodeCourriel(g.courriel, F) || repContrDeNom(g.lien, F) || repContrDeNom(g.nom, F);
    if(code){ const c = C(code);
      if(repContrDeNom(g.nom, F)===code){ c.compta = c.compta || []; c.compta.push({adresse:adr, tel:g.tel, courriel:g.courriel}); }   // la compagnie elle-même
      else if(!c.contacts.some(k=>cvNorm(k.nom)===cvNorm(g.nom))) c.contacts.push({fiche:null, compta:true, nom:g.nom, role:g.lien||'', courriels:[g.courriel].filter(e=>/@/.test(e)), tels:[g.tel].filter(Boolean), noms:[g.nom]});
      return; }
    rec({nNom:nNom(g.nom), nMail:nMail(g.courriel), nAdr:nAdresse(g.adresse), nom:g.nom, tel:g.tel, courriel:g.courriel, adresse:adr, kind:'compta', obj:g});
  });
  // v157 : contacts de l'ancien onglet Contacts (nom, entreprise, téléphone, courriel, adresse, notes)
  (contacts||[]).forEach(k=>{ const nom = String(k.nom||'').trim() || String(k.entreprise||'').trim(); if(!nom && !k.email) return;
    const cc = repCodeCourriel(k.email, F); if(cc) return;
    rec({nNom:nNom(nom), nMail:nMail(k.email), nom, tel:k.telephone||'', courriel:k.email||'', adresse:k.adresse||'', kind:'contact', obj:k}); });
  // Achats : destination « CODE nom PO » → job du contracteur ; sinon le nom d'un particulier déjà connu
  const persConnues = new Set(Object.keys(parent).filter(x=>x[0]==='k'));
  (achats||[]).forEach(a=>{
    const d = String(a.job||'').trim(); if(REP_SPECIAL(d)) return;
    const m = d.match(/^(\S+)\s+(.*)$/); const code = m ? codeDe(m[1]) : '';
    if(code){ const reste = m[2], po = cvPO(reste) || ((reste.match(/\b[A-Z0-9]{2,4}-\d{3}\b/)||[])[0]||''); const nom = (po ? reste.replace(po,'') : reste).trim();
      const j = ajouterJob(C(code).jobs, code, {cle:d, nom:cvTitleCase(nom), po}); j.achats.push(a); return; }
    if(codeDe(d)){ C(codeDe(d)).achatsSans.push(a); return; }   // v164 : facture associée au contracteur lui-même (« SAR »)
    const jc = jobContrDe(d); if(jc){ jc.achats.push(a); jc.cles.add(d); return; }
    const k = nNom(d); if(k) rec({nNom:k, nom:d, kind:'achat', obj:a});   // v164 : tout nom inscrit sur une facture d'achat a sa fiche
  });
  const sansRetirees = (jobsMap, code) => Object.values(jobsMap).forEach(j=>{ if(ficheJobRetiree(F, code, j.ids, [...j.cles, j.nom])) delete jobsMap[j.key]; });

// Possibles doublons : même nom de famille et prénom pareil / initiale / une lettre de différence
function repDoublonsPers(pers, ignores){
  const out = [], L = pers.filter(p=>!p.masque).map(p=>({p, w:p.cle.split(' ').filter(Boolean)})).filter(x=>x.w.length);
  for(let i=0;i<L.length;i++) for(let k=i+1;k<L.length;k++){
    const a = L[i], b = L[k]; if(a.p.fiche && b.p.fiche && a.p.fiche.row===b.p.fiche.row) continue;
    const id = [a.p.id, b.p.id].sort().join('|'); if(ignores && ignores.has(id)) continue;
    const la = a.w[a.w.length-1], lb = b.w[b.w.length-1], fa = a.w[0], fb = b.w[0];
    let ok = false;
    if(a.w.length>=2 && b.w.length>=2 && la.length>=4 && repProche(la, lb)) ok = fa===fb || repProche(fa, fb) || (fa.length===1 && fb[0]===fa) || (fb.length===1 && fa[0]===fb);
    else if(a.w.length===1 && b.w.length>=2 && la.length>=5) ok = false;
    else ok = a.p.cle.replace(/\s/g,'').length>=8 && repProche(a.p.cle.replace(/\s/g,''), b.p.cle.replace(/\s/g,''));
    if(ok) out.push({id, a:a.p, b:b.p});
  }
  return out;
}
// Jobs d'un même client qui semblent être la même (ASC Colibri ×3) — en groupes (« Queen » ×7 = un seul groupe)
function repDoublonsJobs(c, ignores){
  const L = c.listeJobs, par = L.map((_,i)=>i), tr = i => par[i]===i ? i : (par[i] = tr(par[i]));
  for(let i=0;i<L.length;i++) for(let k=i+1;k<L.length;k++){
    const a = L[i], b = L[k];
    if(a.po && b.po && a.po!==b.po) continue;
    if(!cvMotsNom(a.nom).size || !cvMotsNom(b.nom).size) continue;
    if(cvMemeJob(a.nom, b.nom)) par[tr(k)] = tr(i);
  }
  const g = {}; L.forEach((j,i)=>{ (g[tr(i)] = g[tr(i)] || []).push(j); });
  return Object.values(g).filter(x=>x.length>1).map(x=>({id:c.id+'|'+x.map(j=>j.key).sort().join(','), jobs:x})).filter(x=>!ignores || !ignores.has(x.id));
}

// Écrit (ou met à jour) une ligne de l'onglet « Fiches » — crée l'onglet au besoin.
async function ficheEcrire(cfg, f){
  const id = cfg.memoireJobsSpreadsheetId; if(!id) throw new Error('ID de La mémoire — Jobs manquant (Réglages).');
  const ligne = [f.type, f.nom||'', f.code||'', (f.alias||[]).filter(Boolean).join(' ; '), f.adresse||'', f.ville||'', f.tel||'', f.courriel||'', f.notes||'', f.po||'', f.client||'', new Date().toLocaleString('fr-CA')];
  if(f.row) return sheetsUpdateRow(id, 'Fiches', f.row, ligne);
  const meta = await window.gapi.client.sheets.spreadsheets.get({spreadsheetId:id, fields:'sheets.properties.title'});
  if(!(meta.result.sheets||[]).some(x=>x.properties.title==='Fiches')){
    await window.gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:id, resource:{requests:[{addSheet:{properties:{title:'Fiches'}}}]}});
    await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:'Fiches!A1', valueInputOption:'RAW', resource:{values:[FICHE_ENTETE]}});
  }
  return sheetsAppendRow(id, 'Fiches', ligne);
}

    catch(e){ toast && toast('Erreur : '+apiErrMsg(e),'err'); return false; }
    finally{ setBusy(false); }
  };
  // ---- Fournisseurs ----
  const fourn = useMemo(()=>{
    const m = {};
    const F0 = n => m[n] || (m[n] = {nom:n, achats:[], docs:[], fiche:F.fourn.find(f=>cvNorm(f.nom)===cvNorm(n))||null});
    (d.achats||[]).forEach(a=>F0(a.fournisseur).achats.push(a));
    (d.documents||[]).forEach(x=>F0(x.fournisseur).docs.push(x));
    Object.keys(K.map||{}).forEach(n=>F0(n));
    const an = String(new Date().getFullYear());
    return Object.values(m).map(f=>{ const dt = a => a.date||a.recue||'';
      f.achats.sort((a,b)=>dt(b).localeCompare(dt(a)));
      f.annee = f.achats.filter(a=>dt(a).startsWith(an)).reduce((t,a)=>t+(a.st||0),0);
      f.total = f.achats.reduce((t,a)=>t+(a.st||0),0);
      f.last = f.achats[0] ? dt(f.achats[0]) : '';
      return f; }).sort((a,b)=>b.annee-a.annee || String(b.last).localeCompare(String(a.last)));
  },[d.achats, d.documents, K.map, d.fiches]);

  if(d.loading && !d.events.length) return <div className="card"><div className="spin"></div> Chargement du répertoire…</div>;
  if(suivi){
    let cl = null;
    if(suivi==='PART') cl = clients.PART;
    else if(suivi.startsWith('P:')){ const p = R.pers.find(x=>x.id===suivi);
      if(p && clients.PART){ const jobs = p.srcJobs; cl = {...clients.PART, label:p.nom, contact:'', jobs, active:jobs.filter(j=>j.status!=='done').length,
        poTotal:jobs.reduce((t,j)=>t+((j.reg&&j.reg.ht)||0),0), billed:jobs.reduce((t,j)=>t+(j.billed||0),0), lastDay:jobs.reduce((m,j)=>j.last>m?j.last:m,'')}; } }
    else cl = clients[suivi];
    if(cl) return <ClientDetailView client={cl} clients={clients} factures={d.factures} appels={d.appels || {parNumero:{}, parFacture:{}, liste:[]}} courriels={d.courriels} achats={d.achats}
      facLignes={d.facLignes} archives={d.archives} cfg={cfg} registry={d.registry} events={d.events} onChanged={()=>setTick(t=>t+1)} onBack={()=>setSuivi(null)} isDesktop={isDesktop}/>;
  }
  const nq = cvNorm(q);
  const trouve = txt => !nq || cvNorm(txt).includes(nq);
  const texteClient = c => c.type==='contr'
    ? [c.code, c.nom, c.contact, c.fiche&&c.fiche.tel, c.fiche&&c.fiche.courriel, ...(c.contacts||[]).flatMap(k=>[k.nom, k.role, ...k.courriels, ...k.tels]), ...c.listeJobs.flatMap(j=>[j.nom, j.po, j.adresse, ...j.factures.map(f=>f.num)])].join(' ')
    : [c.nom, ...c.noms, ...c.courriels, ...c.tels, ...c.adresses, c.fiche&&c.fiche.notes, ...c.listeJobs.flatMap(j=>[j.po, j.label, ...j.factures.map(f=>f.num), ...j.achats.map(a=>a.num)]), ...c.facturesSans.map(f=>f.num), ...c.soum.map(s=>s.no)].join(' ');
  const tous = [...R.contr, ...R.pers];
  const choisi = sel && sel.startsWith('F:') ? fourn.find(f=>'F:'+f.nom===sel) : (tous.find(c=>c.id===sel) || (selNom && R.pers.find(p=>p.nom===selNom)));

  // ---- comptes pour le menu ----
  const actifs = R.pers.filter(p=>!p.sansNom && !p.soumSeul);
  const nbPart = actifs.filter(p=>!p.commerce).length, nbCom = actifs.filter(p=>p.commerce).length;
  const nbSoumSeul = R.pers.filter(p=>p.soumSeul).length;
  const totalAV = Object.entries(aVerif).filter(([k])=>k!=='PART').reduce((t,[,n])=>t+n,0);

  if(choisi) return <div>{entete}

  // ---- briques d'affichage ----

          <div style={{textAlign:'right',fontSize:12}}>{p.listeJobs.length} job{p.listeJobs.length>1?'s':''}{p.facture ? <> · <b>{cvMoney(p.facture)}</b></> : ''}<div className="muted" style={{fontSize:11}}>{p.last ? cvFmtDay(p.last)+' '+p.last.slice(0,4) : ''}</div></div>

    {!l.length && <div className="muted" style={{padding:14}}>Aucun résultat.</div>}
  </div>;
  const Cubes = ({l}) => <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:8}}>

  const ListeFourn = ({l}) => <div className="card" style={{padding:0}}>
    {l.map(f=>{ const k = K.map[f.nom];

        <div><span style={{fontSize:12}}>🏭</span> <b>{f.nom}</b>{k && k.nom && <span className="muted" style={{fontSize:12}}> · {k.nom}{k.role?' ('+k.role+')':''}</span>}

        <div style={{textAlign:'right',fontSize:12.5}}><b>{cvMoney(f.annee)}</b><div className="muted" style={{fontSize:11}}>cette année (avant taxes)</div></div>

    {!l.length && <div className="muted" style={{padding:14}}>Aucun fournisseur trouvé.</div>}
  </div>;
  const ajouterClient = () => { const n = nouveau.nom.trim(); if(!n) return;
    ecrire([{type:'Client', code:nouveau.commerce ? 'COMMERCE' : 'PART', nom:n, alias:[], adresse:nouveau.adresse, ville:nouveau.ville, tel:nouveau.tel, courriel:nouveau.courriel, notes:nouveau.notes}],
      n+' ajouté aux '+(nouveau.commerce ? 'commerces.' : 'particuliers.')).then(ok=>{ if(ok){ setNouveau(null); setQ(''); setSel('', n); setAttendu({nom:n, t:Date.now()}); } }); };
  const champN = (k, l) => <input value={nouveau[k]} placeholder={l} onChange={e=>setNouveau({...nouveau,[k]:e.target.value})} style={{padding:'6px 9px'}}/>;
  const formNouveau = nouveau && <div className="card" style={{marginBottom:12}}>
    <b>Nouveau client</b>
    <div style={{display:'flex',gap:6,margin:'8px 0'}}>
      <button className={'btn btn-sm'+(!nouveau.commerce?' btn-p':'')} onClick={()=>setNouveau({...nouveau, commerce:false})}>👤 Particulier</button>
      <button className={'btn btn-sm'+(nouveau.commerce?' btn-p':'')} onClick={()=>setNouveau({...nouveau, commerce:true})}>🏪 Commerce</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:6}}>
      {champN('nom', nouveau.commerce ? 'Nom du commerce' : 'Prénom et nom')}{champN('adresse','Adresse')}{champN('ville','Ville')}{champN('tel','Téléphone')}{champN('courriel','Courriel')}{champN('notes','Notes')}
    </div>
    <div style={{display:'flex',gap:6,marginTop:8}}><button className="btn btn-sm btn-p" disabled={busy || !nouveau.nom.trim()} onClick={ajouterClient}>{busy ? 'Enregistrement…' : 'Ajouter'}</button><button className="btn btn-sm" onClick={()=>setNouveau(null)}>Annuler</button></div>
  </div>;
  const blocDoublons = !!doublons.length && <RepDoublons doublons={doublons} busy={busy} ecrire={ecrire} onIgnorer={id=>{ repIgnorer(id); setIgnores(repIgnores()); }}/>;
  const alpha = (a,b)=>a.nom.localeCompare(b.nom,'fr',{sensitivity:'base'});
  const contrTri = R.contr.slice().sort((a,b)=>a.code.localeCompare(b.code,'fr'));

  // ---- recherche : tout, peu importe la vue ----
  if(nq){
    const c = contrTri.filter(x=>trouve(texteClient(x))), p = R.pers.filter(x=>!x.sansNom && trouve(texteClient(x))).sort(alpha);
    const f = fourn.filter(x=>trouve(x.nom+' '+((K.map[x.nom]||{}).nom||'')));
    const s = R.pers.filter(x=>x.sansNom && trouve(texteClient(x)));
    return <div>{entete}{formNouveau}
      {!c.length && !p.length && !f.length && !s.length && <div className="card muted">Rien trouvé pour « {q} ».</div>}
      {c.length>0 && <>{titre('Contracteurs', c.length)}<Cubes l={c}/></>}
      {p.length>0 && <>{titre('Clients et commerces', p.length)}<Liste l={p}/></>}
      {f.length>0 && <>{titre('Fournisseurs', f.length)}<ListeFourn l={f}/></>}
      {s.length>0 && <RepSansNom l={s} R={R} busy={busy} ecrire={ecrire} onOuvrir={x=>setSel(x.id)}/>}
    </div>;
  }

  const persVerif = R.pers.filter(p=>aVerif[p.id]).sort(alpha);
  let corps = null;
  if(vue==='part' || vue==='com'){
    const com = vue==='com', l = actifs.filter(p=>!!p.commerce===com).sort(alpha);
    const sansNom = R.pers.filter(p=>p.sansNom && !p.soumSeul);
    corps = <>{blocDoublons}{titre(com ? 'Commerces' : 'Particuliers', l.length)}<Liste l={l} lettres/>
      {com && <div className="muted" style={{fontSize:11,margin:'4px 2px 0'}}>Mal classé ? Ouvre la fiche et clique « C'est un particulier ».</div>}
      {!com && sansNom.length>0 && <RepSansNom l={sansNom} R={R} busy={busy} ecrire={ecrire} onOuvrir={x=>setSel(x.id)}/>}</>;
  } else if(vue==='contr'){
    corps = <>{titre('Contracteurs', contrTri.length)}<Cubes l={contrTri}/></>;
  } else if(vue==='fourn'){
    corps = <>{titre('Fournisseurs', fourn.length)}<ListeFourn l={fourn}/></>;
  } else if(vue==='soum'){
    const l = R.pers.filter(p=>p.soumSeul).sort(alpha);
    corps = <>{titre('En attente / soumissions sans job', l.length)}<Liste l={l} lettres/>
      <div className="muted" style={{fontSize:11,margin:'4px 2px 0'}}>Ils reviennent tout seuls dans Particuliers ou Commerces dès qu'il y a une visite, une facture ou un achat.</div></>;
  } else if(vue==='verif'){
    const c = contrTri.filter(x=>aVerif['C:'+x.code]);
    corps = <>{c.length>0 && <>{titre('Contracteurs', c.length)}<Cubes l={c}/></>}
      {titre('Particuliers et commerces', persVerif.length)}{persVerif.length ? <Liste l={persVerif}/> : <div className="card muted">Rien à vérifier 👍</div>}
      {clients.PART && <div style={{marginTop:10}}><button className="btn btn-sm" onClick={()=>setSuivi('PART')}>🔎 Suivi de toutes les jobs de particuliers{aVerif.PART ? ' · '+aVerif.PART+' à vérifier' : ''}</button></div>}
      <div style={{height:16}}/>
      <CvAnomalies cfg={cfg} factures={d.factures} clients={clients} appels={d.appels || {parNumero:{}, parFacture:{}, liste:[]}} onOpen={code=>setSuivi(code)} onChanged={()=>setTick(t=>t+1)}/></>;
  } else {   // vue d'ensemble : contracteurs en cubes + seulement les particuliers/commerces à vérifier
    corps = <>{titre('Contracteurs', contrTri.length)}<Cubes l={contrTri}/>
      {titre('Particuliers et commerces à vérifier', persVerif.length)}
      {persVerif.length ? <Liste l={persVerif}/> : <div className="card muted" style={{fontSize:13}}>Rien à vérifier chez les particuliers et commerces 👍 — choisis « 👤 Particuliers » ou « 🏪 Commerces » dans le menu pour voir la liste complète.</div>}</>;
  }
  return <div>{entete}{formNouveau}{corps}</div>;
}

// Lier deux clients (particuliers ou commerces) : la fiche gardée reçoit les autres noms ; l'autre fiche est retirée.
function repLignesFusion(garde, autre){
  const base = garde.fiche || {type:'Client', code:garde.commerce ? 'COMMERCE' : 'PART'};
  const alias = [...new Set([...(base.alias||[]), ...garde.noms, ...autre.noms, autre.nom, ...(autre.fiche ? [autre.fiche.nom, ...autre.fiche.alias] : [])].filter(n=>n && n!==garde.nom && !/@/.test(n)))];
  const pick = k => (garde.fiche && garde.fiche[k]) || (autre.fiche && autre.fiche[k]) || '';
  const lignes = [{...base, type:'Client', code:base.code || (garde.commerce ? 'COMMERCE' : 'PART'), nom:garde.nom, alias, adresse:pick('adresse') || (garde.fiche ? '' : (garde.adresses[0]||autre.adresses[0]||'')), ville:pick('ville'),
    tel:pick('tel') || garde.tels[0] || autre.tels[0] || '', courriel:[...new Set([...String(pick('courriel')).split(/[\s,;]+/), ...garde.courriels, ...autre.courriels].map(e=>String(e).trim().toLowerCase()).filter(e=>/@/.test(e)))].join(', '), notes:[pick('notes'), autre.fiche && garde.fiche && autre.fiche.notes!==garde.fiche.notes ? autre.fiche.notes : ''].filter(Boolean).join('\n')}];
  if(autre.fiche && (!garde.fiche || autre.fiche.row!==garde.fiche.row)) lignes.push({...autre.fiche, type:'Retiré'});
  return lignes;
}
// v157 : courriels sans nom (factures ou soumissions envoyées à un courriel seulement) — à rattacher au bon client
function RepSansNom({l, R, busy, ecrire, onOuvrir}){
  const [ouvert,setOuvert]=useState(true);
  const [lier,setLier]=useState(null);   // {p, q}
  const [nom,setNom]=useState(null);     // {p, v}
  const rattacher = (garde, autre) => ecrire(repLignesFusion(garde, autre), autre.courriels[0]+' rattaché à '+garde.nom+'.').then(ok=>{ if(ok){ setLier(null); } });
  // v165 : rattacher à un contracteur = devient un de ses contacts (nom facultatif)
  const versContr = (c, p, nomP) => ecrire([{type:'Contact', code:c.code, nom:(nomP||'').trim() || p.courriels[0], alias:[], courriel:p.courriels.join(', '), tel:p.tels[0]||'', notes:''}],
    p.courriels[0]+' ajouté aux contacts de '+c.code+'.').then(ok=>{ if(ok) setLier(null); });
  const nommer = (p, v) => ecrire([{type:'Client', code:p.commerce ? 'COMMERCE' : 'PART', nom:v, alias:[], courriel:p.courriels.join(', '), tel:p.tels[0]||''}], p.courriels[0]+' → '+v+'.').then(ok=>{ if(ok) setNom(null); });
  return <div className="card" style={{marginTop:14}}>
    <div style={{display:'flex',justifyContent:'space-between',cursor:'pointer',gap:8}} onClick={()=>setOuvert(!ouvert)}>
      <b>📧 Courriels sans nom ({l.length})</b><span className="muted" style={{fontSize:12}}>{ouvert?'▲':'▼'} rattache-les au bon client ou donne-leur un nom</span>
    </div>
    {ouvert && l.map(p=>{ const nq = lier && lier.p.id===p.id ? cvNorm(lier.q) : '';
      return <div key={p.id} style={{padding:'8px 0',borderTop:'1px solid var(--border)',fontSize:13}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
          <span style={{cursor:'pointer'}} onClick={()=>onOuvrir(p)}><b>{p.courriels[0]}</b> <span className="muted">· {[p.facturesSans.length+p.listeJobs.reduce((t,j)=>t+j.factures.length,0) ? (p.facturesSans.length+p.listeJobs.reduce((t,j)=>t+j.factures.length,0))+' facture(s)' : '', p.soum.length ? p.soum.length+' soumission(s)' : '', p.facture ? cvMoney(p.facture) : ''].filter(Boolean).join(' · ')}</span></span>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:5}}>
          {p.suggere && <button className="btn btn-sm btn-p" disabled={busy} onClick={()=>rattacher(p.suggere, p)}>Rattacher à « {p.suggere.nom} »</button>}
          <button className="btn btn-sm" disabled={busy} onClick={()=>setLier(lier && lier.p.id===p.id ? null : {p, q:'', type:'part', nom:''})}>🔗 Rattacher à…</button>
          <button className="btn btn-sm" disabled={busy} onClick={()=>setNom(nom && nom.p.id===p.id ? null : {p, v:''})}>✏️ Donner un nom</button>
        </div>
        {lier && lier.p.id===p.id && (()=>{ const t = lier.type || 'part';
          const src = t==='contr' ? R.contr.map(c=>({id:c.id, nom:c.code+' '+c.nom, info:c.contact||'', obj:c}))
            : R.pers.filter(x=>!x.sansNom && !x.masque && x.id!==p.id && (t==='com' ? x.commerce : !x.commerce)).map(x=>({id:x.id, nom:x.nom, info:[x.adresse, x.courriel].filter(Boolean).join(' · '), obj:x}));
          const l = src.filter(x=>!nq || cvNorm(x.nom+' '+x.info).includes(nq)).slice(0, 12);

// v170 : import de la liste d'adresses du logiciel comptable (GCMEQ) — vieux format Excel (.xls BIFF2) ou .csv → onglet privé « Clients GCMEQ »
const GCMEQ_ENTETE = ['nom','lien_nom','no_civique','rue','appartement','ville','province','code_postal','telephone','telecopieur','courriel'];
function gcmeqLireFichier(buf, nom){
  let rows = [];
  if(/\.csv$|\.txt$/i.test(nom)){
    const txt = new TextDecoder(/\uFFFD/.test(new TextDecoder('utf-8').decode(buf)) ? 'windows-1252' : 'utf-8').decode(buf);
    const sep = (txt.split('\n')[0].match(/;/g)||[]).length > (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
    rows = txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>{ const o=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; continue; } if(ch===sep && !q){ o.push(cur); cur=''; } else cur+=ch; } o.push(cur); return o.map(x=>x.trim()); });
  } else {
    const d = new DataView(buf), dec = new TextDecoder('windows-1252'), cells = {}; let i = 0, maxR = 0, maxC = 0;
    if(d.getUint16(0,true)!==0x0009) throw new Error('Ce fichier Excel est dans un format plus récent. Dans Excel, fais « Enregistrer sous » → CSV, puis importe le .csv.');
    while(i+4<=d.byteLength){ const t=d.getUint16(i,true), l=d.getUint16(i+2,true), b=i+4; i+=4+l; if(i>d.byteLength) break;
      let r, c, v = null;
      if(t===0x0004 && l>=8){ r=d.getUint16(b,true); c=d.getUint16(b+2,true); v=dec.decode(new Uint8Array(buf, b+8, d.getUint8(b+7))); }
      else if(t===0x0003 && l>=15){ r=d.getUint16(b,true); c=d.getUint16(b+2,true); v=String(d.getFloat64(b+7,true)); }
      else if(t===0x0002 && l>=9){ r=d.getUint16(b,true); c=d.getUint16(b+2,true); v=String(d.getUint16(b+7,true)); }
      else if(t===0x000A) break;
      if(v!==null){ cells[r+'|'+c]=v; if(r>maxR) maxR=r; if(c>maxC) maxC=c; } }
    for(let r=0;r<=maxR;r++){ const l=[]; for(let c=0;c<=maxC;c++) l.push(cells[r+'|'+c]||''); rows.push(l); }
  }
  const tete = (rows[0]||[]).map(h=>cvNorm(h));
  const ix = GCMEQ_ENTETE.map(h=>tete.indexOf(cvNorm(h)));
  if(ix[0]<0) throw new Error('Colonne « nom » introuvable dans le fichier.');
  return rows.slice(1).map(r=>ix.map(k=>k<0 ? '' : String(r[k]||'').trim())).filter(r=>r[0]);
}

              : <span style={{display:'inline-flex',gap:4}}><input autoFocus value={conjN} onChange={e=>setConjN(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') ajouterConjoint(); }} placeholder="Prénom et nom" style={{padding:'3px 7px',width:170}}/>

              <button className="btn btn-sm" style={{padding:'0 5px',fontSize:10.5}} disabled={busy} title={'Ne plus lier '+c.nom+' et '+q.nom} onClick={()=>delier(q)}>✕</button></span>)}</div>}
          {pers && c.adresses.length>1 && <div className="muted" style={{fontSize:11.5}}>Autres adresses : {c.adresses.slice(1,4).join(' · ')}</div>}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}}>

          {pers && <button className="btn btn-sm" onClick={()=>{ setLien(lien===null ? '' : null); setLier(null); }} disabled={busy}>{c.commerce ? '🔗 Lier à un particulier' : '🔗 Lier à un commerce'}</button>}
          {pers && <button className="btn btn-sm" onClick={()=>{ setLier(lier===null ? '' : null); setLien(null); }} disabled={busy} title="Même client écrit de deux façons : une seule fiche">🔀 Fusionner avec…</button>}

          {pers && <button className="btn btn-sm" onClick={basculer} disabled={busy}>{c.commerce ? '👤 C\'est un particulier' : '🏪 C\'est un commerce'}</button>}

            ecrire(lignes, c.nom+' est maintenant un contact de '+k.code+'.').then(ok=>{ if(ok){ setVersContr(false); onContr && onContr(k.code); } }); }}><b>{k.code}</b> {k.nom}</button>)}

      {lien!==null && pers && (()=>{ const nq = cvNorm(lien);

        </div>; })()}
      {lier!==null && pers && (()=>{
        if(typeof lier==='object'){ const a = lier.autre;
          const lierEt = (garde, autre) => ecrire(repLignesFusion(garde, autre), autre.nom+' fusionné avec '+garde.nom+'.').then(ok=>{ if(ok){ setLier(null); onLie && onLie(garde.nom); } });

            <div style={{marginBottom:6}}>Fusionner <b>{c.nom}</b> et <b>{a.nom}</b> ({a.listeJobs.length} job{a.listeJobs.length>1?'s':''}) en une seule fiche : leurs jobs, factures et achats seront ensemble. Quel nom garder ?</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <button className="btn btn-sm btn-p" disabled={busy} onClick={()=>lierEt(c, a)}>Garder « {c.nom} »</button>

              <button className="btn btn-sm" onClick={()=>setLier('')}>← Choisir un autre</button>
            </div>
          </div>; }

        const cands = R.pers.filter(p=>p.id!==c.id && (nq.length<2 ? p.cle.split(' ').some(w=>w.length>=4 && c.cle.split(' ').includes(w)) : cvNorm([p.nom, ...p.noms, ...p.courriels].join(' ')).includes(nq))).slice(0,12);

            <span><b>{p.nom}</b> <span className="muted">{p.commerce ? '🏪' : '👤'} {[p.adresse, p.courriel].filter(Boolean).join(' · ')}</span></span>
            <span className="muted" style={{fontSize:12}}>{p.listeJobs.length} job{p.listeJobs.length>1?'s':''}</span></div>)}

        <div className="muted" style={{fontSize:11,marginTop:6}}>Enregistré dans La mémoire — Jobs › Fiches (privé). Ton agenda n'est pas modifié.</div>
      </div>}

      <b>📒 Dans le logiciel comptable</b>
      {c.compta.map((x,i)=><div key={i} style={{padding:'4px 0',borderTop:i?'1px dashed var(--border)':'none'}}>📍 {x.adresse || '—'}{x.tel && <> · <a href={repTel(x.tel)} style={{color:'var(--accent)'}}>📞 {x.tel}</a></>}{x.courriel && <> · <a href={'mailto:'+x.courriel} style={{color:'var(--accent)'}}>✉️ {x.courriel}</a></>}</div>)}

    {dupJobs.length>0 && !regroupe && <div className="card" style={{marginBottom:12,borderColor:'var(--warning)',fontSize:13}}>
      <div style={{display:'flex',justifyContent:'space-between',cursor:'pointer',gap:8}} onClick={()=>setVoirDup(!voirDup)}><b>🔁 Jobs qui semblent être la même ({dupJobs.length} groupe{dupJobs.length>1?'s':''})</b><span className="muted" style={{fontSize:12}}>{voirDup?'▲ cacher':'▼ voir'}</span></div>

        return <div key={g.id} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',padding:'6px 0',borderTop:'1px solid var(--border)'}}>
          <span style={{flex:'1 1 260px'}}>{g.jobs.map(j=>j.label+(j.po?' ('+j.po+')':'')).join('  ·  ')}</span>
          <button className="btn btn-sm" disabled={busy} onClick={()=>{ setRegroupe(new Set(g.jobs.map(j=>j.key))); setNomGroupe(p.label); window.scrollTo(0, 0); }}>Regrouper…</button>

        </div>; })}
    </div>}

        : <button className="btn btn-sm" onClick={()=>{ setRegroupe(new Set()); setNomGroupe(''); }}>🔗 Regrouper des jobs</button>)}
    </div>
    {c.listeJobs.map(j=>{ const o = ouverte===j.key;

          <div style={{minWidth:0}}>
            {regroupe && <input type="checkbox" readOnly checked={regroupe.has(j.key)} style={{width:15,height:15,marginRight:6,verticalAlign:'middle'}}/>}

          </div>
          <div style={{textAlign:'right',fontSize:12.5,fontVariantNumeric:'tabular-nums'}}>Facturé <b>{cvMoney(j.facture)}</b><div className="muted" style={{fontSize:11.5}}>Achats {cvMoney(j.cout)}{j.reg && j.reg.ht ? ' · PO '+cvMoney(j.reg.ht) : ''}</div></div>
        </div>
        {o && !regroupe && <div style={{marginTop:8}}>
          {renomme && renomme.key===j.key
