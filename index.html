// Lecture seule. Assemble, par client puis par job :
//  - les événements de l'agenda (dates, appel de service, OT, facture du bloc « Suivi »)
//  - le registre « La mémoire — Jobs » (montant du PO, client, dossier Drive), rempli par La mémoire.
const CLIENT_CODES = {
  CRS:'Cuisines Rive-Sud', PAY:'Payne Construction', PY:'Payne Construction', ASC:'Ascension', SAR:'Saran Construction',
  GOU:'Goulet', '5PIL':'Cinq Piliers', BOM:'Beaumont', JOY:'JOY', GGP:'GGP', RROY:'RROY'
};
const CLIENT_CONTACT = {CRS:'Jonathan Asselin', PAY:'Danny', ASC:'Cédric Gagnon'};
const CREW_INITIALS = {PB:'Philippe Bernier', MC:'Maude Charest', AU:'Adèle Underhill', DW:'Daniel Wenning', BP:'Brandon Pereira', AD:'AD (ancien employé)'};
const CREW_COLORS = {'3':'Philippe Bernier','4':'Daniel Wenning','5':'Maude Charest','9':'Brandon Pereira'};
const PHASES = [['ROUGH','ROUGH'],['FINITION','FINITION'],['FINALE','FINITION'],['SERV','SERV'],['SERVICE','SERV'],['AJUSTEMENTS','AJUST'],['AJUSTEMENT','AJUST'],['RAPUP','RAPUP'],['DÉMO','DÉMO'],['DEMO','DÉMO']];
const CLIENT_IGNORE = /^(mon plan|plan de la semaine|topo|ma journée|congé|vacances|prep|préparation)/i;
const CREW_CAL = 'saranelectrique@gmail.com';
// Calendrier « En Attente » : jobs à faire mais pas encore cédulées (la date est un samedi provisoire).
const EN_ATTENTE_CAL = 'c_7d3dd0732b25a3afd30d0f2c453bef2d31a41b08a6d7112b08accea16ff49daf@group.calendar.google.com';

function cvNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function cvNum(v){ const n=parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isNaN(n)?null:n; }
function cvMoney(n){ return n==null?'—':n.toLocaleString('fr-CA',{style:'currency',currency:'CAD'}); }
function cvDay(iso){ return String(iso||'').slice(0,10); }
function cvFmtDay(d){ if(!d) return '—'; const [y,m,j]=d.split('-'); const M=['','janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.']; return (+j)+' '+M[+m]; }
function cvTitleCase(s){ return s.toLowerCase().replace(/(^|[\s\-'’(])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase()); }
function cvSuivi(desc, label){
  const m = String(desc||'').replace(/<[^>]+>/g,'\n').match(new RegExp(label+'\\s*:\\s*([^\\n]*)','i'));
  const v = m ? m[1].trim() : '';
  if(/^\*\*/.test(v)) return '**';            // « ** » = pas à facturer (marqué dans Suivi Travaux)
  return /\d/.test(v) ? v.replace(/[^\d\-– ,]/g,'').trim() : '';
}
// Numéros de job : P0xxxx (PO de CRS) ou nos propres numéros « PAY-012 », « ASC-004 », « PART-031 ».
const CV_NOJOB_RE = /\b(PAY|PY|ASC|SAR|GOU|5PIL|BOM|JOY|GGP|RROY|PART|SE)\s?-\s?(\d{3})\b/i;
function cvPO(text){
  const t = String(text||'');
  const n = t.match(CV_NOJOB_RE);
  if(n) return (n[1].toUpperCase()==='PY'?'PAY':n[1].toUpperCase())+'-'+n[2];
  const m = t.match(/\bP[O0]?\s?0?(\d{4})\b/i);
  return m ? 'P0'+m[1] : '';
}
// Décortique le titre d'un événement : code client, phase, PO, initiales, nom.
function cvParseEvent(e){
  const title = String(e.title||'').trim();
  const toks = title.replace(new RegExp(CV_NOJOB_RE.source,'ig'),' ').replace(/[()]/g,' ').split(/[\s\-–]+/).filter(Boolean);
  let code='', phase='', initials=[], nameParts=[];
  toks.forEach(t=>{
    const T=t.toUpperCase();
    if(!code && CLIENT_CODES[T]){ code = (T==='PY'?'PAY':T); return; }
    const ph = PHASES.find(p=>p[0]===T); if(ph){ if(!phase) phase=ph[1]; return; }
    if(CREW_INITIALS[T] && t===T){ initials.push(T); return; }
    if(/^P[O0]?0?\d{4}$/i.test(T)) return;
    if(T==='CUI') return;
    nameParts.push(t);
  });
  const po = cvPO(title) || cvPO(e.description);
  const name = cvTitleCase(nameParts.join(' ').trim());
  const crew = new Set(initials.map(i=>CREW_INITIALS[i]));
  if(CREW_COLORS[e.colorId]) crew.add(CREW_COLORS[e.colorId]);
  return {
    code, phase: phase || (code?'SERV':''), po, name, key: cvNorm(name), crew:[...crew],
    as: cvSuivi(e.description,'Appel de service'), ot: cvSuivi(e.description,'Ordre de travail'), fac: cvSuivi(e.description,'Facture'),
    attente: e.calendarId===EN_ATTENTE_CAL, id: e.id||'', calId: e.calendarId||'', day: cvDay(e.start), start: e.start||'', end: e.end||'', allDay: !!e.allDay, location: e.location||'', title, attachments: e.attachments||[]
  };
}

// Dernières données lues : l'onglet Clients s'affiche tout de suite au retour, puis se met à jour en arrière-plan.
const CV_CACHE = {};
function useClientsData(cfg, refreshKey){
  const cle = [cfg.calendarIds, cfg.memoireJobsSpreadsheetId, cfg.memoireFacturesSpreadsheetId, cfg.memoireAppelsSpreadsheetId, cfg.memoireAchatsSpreadsheetId].join('|');
  const [state,setState]=useState(()=> CV_CACHE[cle] ? {...CV_CACHE[cle], loading:false, maj:true} : {loading:true, err:'', events:[], registry:[], factures:{}, appels:{}});
  // « force » change seulement avec ⟳ Refresh ou après une modification (tick) — pas en changeant d'onglet.
  const force = (String(refreshKey).includes('|') ? String(refreshKey) : refreshKey+'|0').replace(/\|[a-z]?/,'|').replace(/\|$/,'|0');
  useEffect(()=>{
    let alive=true;
    const c = CV_CACHE[cle];
    if(c && c.force===force && Date.now()-c.t < 120000){ setState({...c, loading:false, maj:false}); return; }   // lu il y a moins de 2 min
    (async()=>{
      setState(s=> CV_CACHE[cle] ? {...s, maj:true} : {...s,loading:true,err:''});
      try{
        const now=new Date();
        const min=new Date(now); min.setDate(min.getDate()-150);
        const max=new Date(now); max.setDate(max.getDate()+120);
        const calIds=(cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
        if(!calIds.includes(EN_ATTENTE_CAL)) calIds.push(EN_ATTENTE_CAL); // toujours lu ici, même s'il est caché dans l'agenda
        // Chaque source a 25 s max : si une bloque, on le dit au lieu de tourner sans fin.
        const lent = [];
        const delai = (p, nom, vide) => Promise.race([Promise.resolve(p), new Promise(r=>setTimeout(()=>{ lent.push(nom); r(vide); }, 25000))]);
        const readSheet = (id, nom, range) => id
          ? delai(Promise.resolve(window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId:id, range:range||'A1:Z'})).then(r=>r.result.values||[], ()=>[]), nom, [])
          : Promise.resolve([]);
        const [events, regRows, facRows, apRows, coRows, acRows, liRows, flRows, arRows, doRows] = await Promise.all([
          delai(listCalendarEventsRange(calIds, min.toISOString(), max.toISOString()), 'agenda', []),
          readSheet(cfg.memoireJobsSpreadsheetId, 'registre des jobs'),
          readSheet(cfg.memoireFacturesSpreadsheetId, 'registre des factures'),
          readSheet(cfg.memoireAppelsSpreadsheetId, 'registre des appels'),
          readSheet(cfg.memoireJobsSpreadsheetId, 'courriels', 'Courriels!A1:J'),
          readSheet(cfg.memoireAchatsSpreadsheetId, 'achats', 'A1:L'),
          readSheet(cfg.memoireAchatsSpreadsheetId, 'articles', 'Lignes!A1:F'),
          readSheet(cfg.memoireFacturesSpreadsheetId, 'articles facturés', 'Lignes!A1:F'),
          readSheet(cfg.memoireJobsSpreadsheetId, 'archives', 'Archives!A1:C'),
          readSheet(cfg.memoireAchatsSpreadsheetId, 'soumissions', 'Documents!A1:J')
        ]);
        // Soumissions, relevés de compte, confirmations des fournisseurs (onglet « Documents » du registre des achats)
        const documents = doRows.slice(1).filter(r=>r[0]).map(r=>({fournisseur:r[0], type:r[1]||'', num:r[2]||'', date:r[3]||'', ref:r[4]||'', total:cvNum(r[5]), pdf:r[6]||'', fichier:r[7]||''}));
        // Fils de courriels par PO (onglet « Courriels », rempli par Apps Script)
        const courriels = {};
        coRows.slice(1).forEach(r=>{ if(!r[0]) return; (courriels[r[0]]=courriels[r[0]]||[]).push({sujet:r[2]||'', premier:r[3]||'', dernier:r[4]||'', n:r[5]||'', de:r[6]||'', statut:r[7]||'', extrait:r[8]||'', lien:r[9]||''}); });
        Object.values(courriels).forEach(l=>l.sort((a,b)=>b.dernier.localeCompare(a.dernier)));
        // Achats fournisseurs (registre « La mémoire — Achats »)
        const archives = {}; arRows.slice(1).forEach((r,i)=>{ if(r[0]) archives[r[0]]=i+2; });
        const facLignes = {}; flRows.slice(1).forEach(r=>{ if(r[0]) (facLignes[r[0]]=facLignes[r[0]]||[]).push({codes:r[1]||'', desc:r[2]||'', qte:cvNum(r[3])||0, prix:cvNum(r[4])||0, montant:cvNum(r[5])||0}); });
        const articles = {}; liRows.slice(1).forEach(r=>{ if(r[0]&&r[1]) (articles[r[0]+'|'+r[1]]=articles[r[0]+'|'+r[1]]||[]).push({code:r[2]||'', desc:r[3]||'', qte:cvNum(r[4])||0, montant:cvNum(r[5])||0}); });
        const achats = acRows.slice(1).map((r,i)=>({row:i+2, fournisseur:r[0]||'', num:r[1]||'', date:r[2]||'', ref:r[3]||'', st:cvNum(r[4])||0, total:cvNum(r[5])||0, pdf:r[6]||'', propose:r[7]||'', job:r[8]||'', part: r[9]!==undefined && r[9]!=='' ? cvNum(r[9]) : 100, statut:r[10]||'', recue:r[11]||''})).filter(a=>a.fournisseur).map(a=>({...a, articles: articles[a.fournisseur+'|'+a.num]||null}));
        if(lent.length && alive) setState(s=>({...s, lent}));
        // Appels de service / OT papier : numéro -> photo, et facture -> appels
        const ah=(apRows[0]||[]).map(h=>cvNorm(h)), ac=re=>ah.findIndex(h=>re.test(h));
        const ax={as:ac(/^appel/),fac:ac(/^factures?$/),ot:ac(/^ordre/),po:ac(/^po$/),nom:ac(/^fichier$/),id:ac(/^fichierid/),st:ac(/^statut/)};
        const ag=(r,k)=> ax[k]>=0 ? (r[ax[k]]||'').trim() : '';
        const appels={parNumero:{}, parFacture:{}, liste:[]};
        apRows.slice(1).forEach(r=>{
          const a={as:ag(r,'as'), ot:ag(r,'ot'), po:ag(r,'po'), nom:ag(r,'nom'), id:ag(r,'id'), statut:ag(r,'st'), factures:ag(r,'fac').split(/[\s,]+/).filter(Boolean)};
          if(!a.id) return;
          appels.liste.push(a);
          if(a.as) appels.parNumero[a.as]=a; else if(a.ot) appels.parNumero[a.ot]=appels.parNumero[a.ot]||a;
          a.factures.forEach(f=>{ (appels.parFacture[f]=appels.parFacture[f]||[]).push(a); });
        });
        const fh=(facRows[0]||[]).map(h=>cvNorm(h)), fc=re=>fh.findIndex(h=>re.test(h));
        const fx={num:fc(/^facture/),date:fc(/^date/),cli:fc(/^client/),po:fc(/^po$/),nom:fc(/^nom/),desc:fc(/^description/),ht:fc(/^montant/),ttc:fc(/^total/),env:fc(/^envoyee/),pdf:fc(/^pdf/),st:fc(/^statut/)};
        const fg=(r,k)=> fx[k]>=0 ? (r[fx[k]]||'').trim() : '';
        const factures={};
        facRows.slice(1).forEach((r,i)=>{ const n=fg(r,'num'); if(!n) return; const st=cvNorm(fg(r,'st'));
          factures[n]={num:n, row:i+2, date:fg(r,'date'), client:fg(r,'cli'), po:fg(r,'po'), nom:fg(r,'nom'), desc:fg(r,'desc'), ht:cvNum(fg(r,'ht')), ttc:cvNum(fg(r,'ttc')), envoi:fg(r,'env'), pdf:fg(r,'pdf'),
            statut:fg(r,'st'), annulee:/^annul/.test(st), ok:/^(ok|correct|verifie)/.test(st)}; });
        // Colonne « Statut » du registre (créée par le CRM au premier clic si elle n'existe pas encore).
        Object.defineProperty(factures,'__statutCol',{value: fx.st>=0 ? fx.st : Math.max(fh.length, 10), enumerable:false});
        Object.defineProperty(factures,'__statutHeader',{value: fx.st>=0, enumerable:false});
        const head=(regRows[0]||[]).map(h=>cvNorm(h));
        const col=(re)=>head.findIndex(h=>re.test(h));
        const ix={code:col(/^code/),po:col(/^po$/),nom:col(/^nom/),adr:col(/^adresse/),ville:col(/^ville/),ht:col(/^montant/),dos:col(/^dossier/),cli:col(/^client/),tel:col(/^telephone/),mail:col(/^courriel/),proj:col(/^projet/),note:col(/^note/),st:col(/^statut/)};
        const g=(r,k)=> ix[k]>=0 ? (r[ix[k]]||'').trim() : '';
        const registry = regRows.slice(1).map((r,i)=>[r,i+2]).filter(([r])=>g(r,'po')||g(r,'nom')).map(([r,row])=>({row, statut: ix.st>=0 ? (r[ix.st]||'') : '',
          code:(g(r,'code')||'').toUpperCase(), po:g(r,'po'), nom:g(r,'nom'), key:cvNorm(g(r,'nom')),
          adresse:g(r,'adr'), ville:g(r,'ville'), ht:cvNum(g(r,'ht')), dossier:g(r,'dos'),
          client:g(r,'cli'), tel:g(r,'tel'), courriel:g(r,'mail'), projet:g(r,'proj'), note:g(r,'note')
        })).filter(r=>!/^fusionn/i.test(cvNorm(r.statut)));
        Object.defineProperty(registry,'__colStatut',{value: ix.st>=0 ? ix.st : Math.max(head.length, 12), enumerable:false});
        CV_CACHE[cle] = {err:'', events, registry, factures, appels, courriels, achats, facLignes, archives, documents, lent, t:Date.now(), force};
        if(alive) setState({loading:false, maj:false, err:'', events, registry, factures, appels, courriels, achats, facLignes, archives, documents, lent});
      }catch(e){ if(alive) setState({loading:false, err:apiErrMsg(e), events:[], registry:[], factures:{}, appels:{}}); }
    })();
    return ()=>{alive=false};
  },[cfg.calendarIds, cfg.memoireJobsSpreadsheetId, cfg.memoireFacturesSpreadsheetId, cfg.memoireAppelsSpreadsheetId, cfg.memoireAchatsSpreadsheetId, refreshKey]);
  return state;
}

// Regroupe les événements en clients → jobs.
function cvBuildClients(events, registry, factures){
  factures = factures || {};
  const today = cvDay(new Date().toISOString());
  const regByPO = {}; registry.forEach(r=>{ if(r.po) regByPO[r.po]=r; });
  const jobs = {};
  const getJob = (id, base)=> jobs[id] || (jobs[id] = {id, events:[], ...base});
  events.forEach(raw=>{
    if(CLIENT_IGNORE.test(String(raw.title||'').trim())) return;
    const p = cvParseEvent(raw);
    if(p.code){
      let po = p.po;
      if(!po && p.key){
        // Pas de PO dans le titre : on cherche une job du même client avec le même nom.
        const cands = registry.filter(r=>r.code===p.code && r.key===p.key);
        if(cands.length===1) po = cands[0].po;
        else if(cands.length>1){
          const loc = cvNorm(p.location);
          const byLoc = cands.find(c=>c.adresse && loc.includes(cvNorm(c.adresse).slice(0,8)));
          po = (byLoc||cands[0]).po;
        }
      }
      const id = po ? p.code+'|'+po : p.code+'|'+(p.key || cvNorm(p.location) || p.title);
      const reg = po ? regByPO[po] : null;
      const j = getJob(id, {client:p.code, po, name: reg ? reg.nom : (p.name || p.location || p.title), reg});
      j.events.push(p);
    } else {
      if(raw.calendarId !== CREW_CAL && raw.calendarId !== EN_ATTENTE_CAL) return; // particuliers : calendrier de l'équipe + En Attente
      const k = p.po || cvNorm(p.location).slice(0,24) || p.key || cvNorm(p.title);
      const reg = p.po ? regByPO[p.po] : null;
      const j = getJob('PART|'+k, {client:'PART', po:p.po||'', name: reg ? reg.nom : (p.name || p.title), reg});
      j.events.push(p);
    }
  });
  // Facture inscrite sur plus d'une job = à vérifier.
  const facJobs = {};
  Object.values(jobs).forEach(j=>j.events.forEach(e=>String(e.fac).split(/[\s,–-]+/).filter(t=>/\d/.test(t)).forEach(f=>{ (facJobs[f]=facJobs[f]||new Set()).add(j.id); })));
  Object.values(jobs).forEach(j=>{
    j.events.sort((a,b)=>a.day.localeCompare(b.day));
    const ro=j.events.filter(e=>e.phase==='ROUGH'), fi=j.events.filter(e=>e.phase==='FINITION');
    j.rough = ro[0] ? ro[0].day : ''; j.fin = fi.length ? fi[fi.length-1].day : '';
    // Les passages « En Attente » ont une date provisoire : ils ne comptent pas pour les dates ni le statut,
    // mais une job qui en a un n'est pas terminée.
    const reels = j.events.filter(e=>!e.attente);
    j.attente = j.events.filter(e=>e.attente);
    const base = reels.length ? reels : j.events;
    j.first = base[0].day; j.last = base[base.length-1].day;
    j.status = j.last < today ? 'done' : (j.first <= today ? 'cours' : 'avenir');
    if(j.attente.length && (!reels.length || j.status==='done')) j.status = 'cours'; // en attente = encore à faire
    const fromPO = j.po ? Object.values(factures).filter(f=>f.po===j.po).map(f=>f.num) : [];
    j.factures = [...new Set([...j.events.flatMap(e=>String(e.fac).split(/[\s,–-]+/).filter(t=>/\d/.test(t))), ...fromPO])].sort();
    j.billed = j.factures.reduce((t,f)=>t+((factures[f]&&!factures[f].annulee&&factures[f].ht)||0),0);
    j.crew = [...new Set(j.events.flatMap(e=>e.crew))];
    j.address = (j.reg && [j.reg.adresse,j.reg.ville].filter(Boolean).join(', ')) || (j.events.find(e=>e.location)||{}).location || '';
    j.missing = j.events.filter(e=>!e.attente && e.day < today && !e.fac).length;
    j.dupFac = j.factures.filter(f=>facJobs[f] && facJobs[f].size>1);
    j.flag = j.missing>0 || j.dupFac.length>0;
  });
  const clients = {};
  Object.values(jobs).forEach(j=>{
    const c = clients[j.client] || (clients[j.client] = {code:j.client, label: j.client==='PART' ? 'Particuliers' : (CLIENT_CODES[j.client]||j.client), contact: CLIENT_CONTACT[j.client]||'', jobs:[]});
    c.jobs.push(j);
  });
  Object.values(clients).forEach(c=>{
    c.jobs.sort((a,b)=>b.first.localeCompare(a.first));
    c.active = c.jobs.filter(j=>j.status!=='done').length;
    c.flags = c.jobs.filter(j=>j.flag).length;
    c.poTotal = c.jobs.reduce((t,j)=>t+((j.reg&&j.reg.ht)||0),0);
    c.billed = c.jobs.reduce((t,j)=>t+(j.billed||0),0);
    c.lastDay = c.jobs.reduce((m,j)=>j.last>m?j.last:m,'');
  });
  return clients;
}

// Ordres de travail d'une job : feuilles OT du registre (papier ou logiciel) rattachées à son PO,
// plus les numéros d'OT inscrits dans le bloc Suivi de ses événements.
function cvJobOTs(job, appels){
  const L = (appels && appels.liste) || [];
  const docs = job.po ? L.filter(a=>a.po===job.po && (a.ot || !a.as)) : [];
  const nums = [...new Set(job.events.map(e=>e.ot).filter(Boolean))];
  const out = docs.map(a=>({label:'OT '+(a.ot || (appels.parNumero && Object.keys(appels.parNumero).find(k=>appels.parNumero[k]===a)) || ''), id:a.id}));
  const pn=(appels&&appels.parNumero)||{};
  nums.forEach(n=>{ if(!out.some(o=>o.label==='OT '+n)) out.push({label:'OT '+n, id:(pn[n]||{}).id||''}); });
  return out;
}

// Cellule Rough / Finition : date + factures de l'étape; rouge si l'étape est faite sans facture.
function CvPhaseCell({job, phase}){

// Jauge facturé / PO. Le repère de 75 % vient des PO de Jonathan (« 75 % rough et 25 % finition »).
function CvGauge({job}){
  const po = job.reg && job.reg.ht;
  if(!po) return null;
  const today = cvDay(new Date().toISOString());
  const b = job.billed||0, pct = b/po, w = Math.min(pct,1.5)/1.5*100, m75 = 50, m100 = 100/1.5;
  const finDone = job.events.some(e=>!e.attente && e.phase==='FINITION' && e.day<today), roughDone = job.events.some(e=>!e.attente && e.phase==='ROUGH' && e.day<today);
  const etape = finDone ? 'Finition faite' : roughDone ? 'Rough fait, finition à venir' : 'Pas encore commencé';
  const reste = po-b, col = pct>1 ? 'var(--danger)' : (pct>0.75 && !finDone ? 'var(--warning)' : 'var(--success)');
  const msg = pct>1 ? <>Dépassement de <b>{cvMoney(-reste)}</b> ({Math.round((pct-1)*100)} % au-dessus du PO).</>
    : finDone ? <>Sous le PO de <b>{cvMoney(reste)}</b>.</>
    : <>Il reste <b>{cvMoney(reste)}</b> au PO pour {roughDone?'la finition':'la job'}.</>;
  return <div style={{border:'1px solid var(--border2)',borderRadius:10,padding:12,margin:'10px 0',background:'var(--bg3)'}}>
    <div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap',fontSize:13}}>
      <span>Facturé <b>{cvMoney(b)}</b> sur un PO de <b>{cvMoney(po)}</b> avant taxes</span><b>{Math.round(pct*100)} %</b>
    </div>
    <div style={{position:'relative',height:12,borderRadius:6,background:'var(--bg4)',margin:'10px 0 4px',overflow:'hidden'}}>
      <div style={{position:'absolute',left:0,top:0,bottom:0,width:w+'%',background:col,borderRadius:6}}></div>
      <div style={{position:'absolute',top:0,bottom:0,left:m75+'%',width:2,background:'var(--muted)'}}></div>
      <div style={{position:'absolute',top:0,bottom:0,left:m100+'%',width:3,background:'var(--text)'}}></div>
    </div>

      <span style={{position:'absolute',left:m75+'%',transform:'translateX(-50%)',whiteSpace:'nowrap'}}>fin du rough (75 %)</span>

    </div>

  </div>;
}

// Créer un numéro de job (« PAY-013 ») : inscrit au registre des jobs, puis ajouté au titre de tous les passages de la job.
function cvProchainNo(code, registry, events){
  const re = new RegExp('\\b'+code+'\\s?-\\s?(\\d{3})\\b','i');
  const nums = [...registry.map(r=>r.po), ...events.map(e=>e.title)].map(t=>{ const m=String(t||'').match(re); return m?+m[1]:0; });
  return code+'-'+String(Math.max(0,...nums)+1).padStart(3,'0');
}
async function cvRenommerPassages(job, ancien, nouveau, setEtat){
  let n=0;
  for(const e of job.events){
    if(!e.id || !e.calId) continue;
    const t = ancien ? e.title.replace(new RegExp('\\b'+ancien.replace('-','\\s?-\\s?')+'\\b','i'), nouveau) : (cvPO(e.title) ? e.title : e.title.trim()+' '+nouveau);
    if(t===e.title) continue;
    setEtat && setEtat('Mise à jour des passages… '+(++n));
    await window.gapi.client.calendar.events.patch({calendarId:e.calId, eventId:e.id, resource:{summary:t}});
  }
}

// Acheté (factures fournisseurs associées à la job) vs facturé (tes factures de la job), article par article.
const cvCode = c => String(c||'').toUpperCase().replace(/^[A-Z]{2,4}-(?=[A-Z0-9])/,'').replace(/[^A-Z0-9]/g,'');
function cvComparer(achats, mesLignes){
  const fact = mesLignes.filter(l=>!/^MO\b/.test(l.codes) && l.qte).map(l=>({...l, cles:l.codes.split(/\s+/).map(cvCode).filter(c=>c.length>=4), reste:l.qte}));
  const lignes = [];
  achats.forEach(a=>(a.articles||[]).filter(x=>x.code).forEach(x=>{
    const k = cvCode(x.code);
    const f = k.length>=4 && fact.find(l=>l.cles.some(c=>c===k || (Math.min(c.length,k.length)>=6 && (c.includes(k)||k.includes(c)))));
    const fq = f ? Math.min(f.reste, x.qte) : 0; if(f) f.reste -= fq;
    lignes.push({desc:x.desc, code:x.code, achete:x.qte, facture:fq, cout: x.qte ? x.montant/x.qte : 0, f:!!f});
  }));
  const surplus = lignes.reduce((t,l)=>t+Math.max(0,l.achete-l.facture)*l.cout,0);
  const nonAchete = fact.filter(l=>l.reste>0);
  return {lignes, surplus, nonAchete};
}

// ── Anomalies : ce qui ne balance pas entre les factures, l'agenda et les PO ──────────────
function cvAnomalies(factures, clients, appels){
  const out = [];
  const F = Object.values(factures).filter(f=>!f.annulee && !f.ok && f.ht!=null);
  const lab = f => (f.client==='CRS' ? 'CRS '+(f.nom||f.po||'') : (f.nom || f.client || '')).trim();
  // A) Même montant, ou une facture = la somme de deux autres, chez le même client.
  const groupes = {};
  F.filter(f=>f.ht>1).forEach(f=>{ const k = f.client==='CRS' ? 'CRS|'+(f.po||'') : (f.client||'?'); (groupes[k]=groupes[k]||[]).push(f); });
  const vus = new Set();
  Object.values(groupes).forEach(g=>{
    if(g.length<2 || g.length>40) return;
    g.forEach(a=>g.forEach(b=>{
      if(a.num<b.num && Math.abs(a.ht-b.ht)<0.01 && !vus.has(a.num+b.num)){ vus.add(a.num+b.num);
        out.push({type:'double', titre:'Même montant deux fois', texte:'#'+a.num+' et #'+b.num+' : '+cvMoney(a.ht)+' chacune ('+lab(a)+'). Facturée deux fois ?', factures:[a,b]}); }
    }));
    g.forEach(a=>{ for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++){ const b=g[i], c=g[j];
      if(b===a||c===a) continue;
      if(Math.abs(a.ht-b.ht-c.ht)<0.02 && !vus.has('s'+a.num)){ vus.add('s'+a.num);
        out.push({type:'double', titre:'Facture remplacée ?', texte:'#'+a.num+' ('+cvMoney(a.ht)+') = #'+b.num+' + #'+c.num+' ('+lab(a)+'). Si elle a été refaite, annule-la.', factures:[a]}); } } });
  });
  // B) Factures à 0,01 $
  F.filter(f=>f.ht<=0.01).forEach(f=>out.push({type:'zero', titre:'Facture à 0,01 $', texte:'#'+f.num+' · '+lab(f)+(f.desc?' · '+f.desc:'')+'. Garantie ou service après-vente ?', factures:[f]}));
  const today = cvDay(new Date().toISOString());
  Object.values(clients).forEach(c=>c.jobs.forEach(j=>{
    // C) Facture inscrite sur deux jobs
    j.dupFac.forEach(n=>out.push({type:'dup', titre:'Facture sur deux jobs', texte:'#'+n+' est inscrite sur '+c.code+' '+j.name+' et sur une autre job.', client:c.code}));
    if(c.code==='PART') return;
    // D) Passages faits sans facture
    const sans = j.events.filter(e=>!e.attente && e.day<today && !e.fac);
    if(sans.length) out.push({type:'nofac', titre:'Passage sans facture', texte:c.code+' '+j.name+' : '+sans.map(e=>cvFmtDay(e.day)+(e.phase?' ('+e.phase.toLowerCase()+')':'')).join(', '), client:c.code});
    // E) Facturé au-delà du PO (job terminée)
    if(j.status==='done' && j.reg && j.reg.ht>0 && j.billed>j.reg.ht*1.10)
      out.push({type:'po', titre:'Au-delà du PO', texte:c.code+' '+j.name+' : '+cvMoney(j.billed)+' facturé sur un PO de '+cvMoney(j.reg.ht)+' (+'+Math.round((j.billed/j.reg.ht-1)*100)+' %)', client:c.code});
  }));
  // F) Appels de service papier que le rangement n'a pas pu classer
  ((appels&&appels.liste)||[]).filter(a=>/^averifier/.test(cvNorm(a.statut))).forEach(a=>out.push({type:'appel', titre:'Appel papier à classer', texte:(a.as?'Appel '+a.as:'OT '+a.ot)+' · '+a.nom+' : '+a.statut, lien:'https://drive.google.com/file/d/'+a.id+'/view'}));
  return out;
}

const CV_ANOM_ORDRE = [['double','Factures en double'],['zero','Factures à 0,01 $'],['dup','Facture sur deux jobs'],['nofac','Passages sans facture'],['appel','Appels papier à classer'],['po','Au-delà du PO']];

    <div className="muted" style={{fontSize:12.5,marginBottom:8}}>Ce qui ne balance pas entre tes factures, l'agenda et les PO. Règle-le ici : c'est écrit dans le registre.</div>
    {msg && <div style={{fontSize:13,marginBottom:8,color:'var(--success)'}}>{msg}</div>}
    {groupes.map(([t,nom,items])=><div key={t} style={{borderTop:'1px solid var(--border)'}}>

        <span>{ouvert===t?'▾':'▸'} {nom}</span><span className="muted">{items.length}</span>
      </div>
      {ouvert===t && items.map((a,k)=><div key={k} style={{padding:'6px 2px 10px 18px',fontSize:13}}>
        <div>{a.texte}</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:5}}>

            {confirme===f.num
              ? <button className="btn btn-sm btn-danger" disabled={!!busy} onClick={()=>marquer(f,'Annulée')}>{busy===f.num+'Annulée'?'…':'Confirmer : annuler #'+f.num}</button>
              : <button className="btn btn-sm" disabled={!!busy} onClick={()=>setConfirme(f.num)}>Annuler #{f.num}</button>}
          </React.Fragment>)}
          {a.factures && <button className="btn btn-sm btn-s" disabled={!!busy} onClick={()=>a.factures.forEach(f=>marquer(f,'OK'))}>C'est correct</button>}
          {a.client && <button className="btn btn-sm" onClick={()=>onOpen(a.client)}>Ouvrir le client</button>}
          {a.lien && <a className="btn btn-sm" href={a.lien} target="_blank" rel="noopener" style={{textDecoration:'none'}}>Voir l'appel ↗</a>}
        </div>
      </div>)}
    </div>)}
  </div>;
}

// Semaine : les passages jour par jour (lun → dim), avec les heures, l'équipe, et ce qu'il faut commander.
function cvLundi(d){ const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function cvHeure(iso){ const m=String(iso||'').match(/T(\d{2}):(\d{2})/); return m ? (+m[1])+' h'+(m[2]!=='00'?' '+m[2]:'') : ''; }
// Commandes de stock : « placée » ou non, par passage (onglet « Commandes » du registre des jobs, partagé entre appareils).
// Étapes cochées à la main dans Projets : onglet « Etapes » du registre des jobs (Job | Étape | Statut | Le).
// Petites lectures partagées entre les onglets (Commandes, Etapes, Adresses) : gardées 2 min.
const LECT_CACHE = {};
async function lireCache(id, range, force){
  const k = id+'|'+range, c = LECT_CACHE[k];
  if(!force && c && Date.now()-c.t < 120000) return c.r;
  const r = await window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId:id, range});
  LECT_CACHE[k] = {t:Date.now(), r};
  return r;
}
function useEtapesManuelles(cfg){
  const [etat,setEtat]=useState({map:{}, rows:{}, lu:false});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    if(!id) return;
    try{
      const r = await lireCache(id, 'Etapes!A1:D', force);
      const map={}, rows={}; (r.result.values||[]).slice(1).forEach((row,i)=>{ if(!row[0]) return; const k=row[0]+'|'+row[1]; rows[k]=i+2; if(row[2]==='Fait') map[k]=true; });
      setEtat({map, rows, lu:true, existe:true});
    }catch(e){ setEtat({map:{}, rows:{}, lu:true, existe:false}); }
  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  const basculer = async (jobId, titre, fait)=>{
    const k = jobId+'|'+titre, ligne=[jobId, titre, fait?'Fait':'', new Date().toLocaleString('fr-CA')];
    setEtat(s=>{ const map={...s.map}; if(fait) map[k]=true; else delete map[k]; return {...s, map}; });
    try{
      if(!etat.existe) await ensureSheetsExist(id, [{name:'Etapes', headers:['Job','Étape','Statut','Le']}]);
      if(etat.rows[k]) await sheetsUpdateRow(id, 'Etapes', etat.rows[k], ligne); else await sheetsAppendRow(id, 'Etapes', ligne);
      await lire(true);
    }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); lire(); }
  };
  return [etat.map, basculer];
}

function useCommandes(cfg){
  const [etat,setEtat]=useState({map:{}, pret:false});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    if(!id) return;
    try{
      const r = await lireCache(id, 'Commandes!A1:G', force);
      const map={}; (r.result.values||[]).slice(1).forEach((row,i)=>{ if(row[0]) map[row[0]]={row:i+2, statut:row[3]||'', quand:row[4]||'', note:row[6]||''}; });
      setEtat({map, pret:true});
    }catch(e){ setEtat({map:{}, pret:true}); }
  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  // statut : 'Placée' | 'Rien à commander' | 'À placer' ; note : texte ajouté aussi à la description de l'événement.
  const enregistrer = async (cle, info, statut, note)=>{
    const ex = etat.map[cle] || {};
    const ligne = [cle, info.day, info.job, statut ?? ex.statut ?? 'À placer', new Date().toLocaleString('fr-CA'), info.ot||'', note ?? ex.note ?? ''];
    setEtat(s=>({...s, map:{...s.map, [cle]:{...ex, statut:ligne[3], quand:ligne[4], note:ligne[6]}}}));
    try{
      if(!Object.keys(etat.map).length) await ensureSheetsExist(id, [{name:'Commandes', headers:['Clé','Date','Job','Statut','Mis à jour le','OT','Note']}]);
      if(ex.row) await sheetsUpdateRow(id, 'Commandes', ex.row, ligne); else await sheetsAppendRow(id, 'Commandes', ligne);
      if(note && info.eventId && info.calId){
        const ev = await window.gapi.client.calendar.events.get({calendarId:info.calId, eventId:info.eventId});
        const desc = (ev.result.description||'').replace(/\n?📦 Note commande :.*$/m,'');
        await window.gapi.client.calendar.events.patch({calendarId:info.calId, eventId:info.eventId, resource:{description:(desc ? desc+'\n' : '')+'📦 Note commande : '+note}});
      }
      await lire(true);
    }catch(e){ alert('Impossible d\'enregistrer : '+apiErrMsg(e)); lire(); }
  };
  return [etat.map, enregistrer];
}

const CMD_FAIT = ['Placée','Rien à commander'];
function CvSemaine({clients, appels, onOpen, ancre, commandes, onCommande, isDesktop}){
  const [dec,setDec]=useState(0);
  const [noteDe,setNoteDe]=useState(null);
  const [noteTxt,setNoteTxt]=useState('');
  const lundi = cvLundi(ancre || new Date()); if(!ancre) lundi.setDate(lundi.getDate()+dec*7);
  const jours = [...Array(7)].map((_,i)=>{ const d=new Date(lundi); d.setDate(d.getDate()+i); return cvDay(d.toISOString()); });
  const today = cvDay(new Date().toISOString());
  commandes = commandes || {};
  const items = Object.values(clients).flatMap(c=>c.jobs.flatMap(j=>j.events.filter(e=>!e.attente && jours.includes(e.day)).map(e=>{
    const ots = c.code!=='PART' ? cvJobOTs(j, appels) : [];
    const cle = e.id || (e.day+'|'+j.id), cmd = commandes[cle]||{};
    return {c, j, e, ots, cle, cmd, fait: CMD_FAIT.includes(cmd.statut)};
  })));
  const aPlacer = items.filter(x=>!x.fait && x.e.day>=today).length;
  const fmtSem = d => d.toLocaleDateString('fr-CA',{day:'numeric',month:'long'});
  const dim = new Date(lundi); dim.setDate(dim.getDate()+6);
  const info = x => ({day:x.e.day, job:(x.c.code!=='PART'?x.c.code+' ':'')+x.j.name+(x.e.phase?' '+x.e.phase:''), ot:x.ots.map(o=>o.label).join(' '), eventId:x.e.id, calId:x.e.calId});
  const vert = {background:'rgba(63,185,80,0.15)',color:'var(--success)',borderColor:'var(--success)',fontWeight:700};
  const Item = ({x})=>{ const {c,j,e,ots,cle,cmd,fait}=x;
    return <div style={{border:'1px solid var(--border2)',borderLeft:'3px solid '+(fait?'var(--success)':(e.day>=today?'var(--warning)':'var(--border2)')),borderRadius:8,padding:'6px 7px',marginBottom:6,fontSize:12}}>
      <div style={{cursor:'pointer'}} onClick={()=>onOpen && onOpen(c.code)}>
        <div style={{fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{e.allDay ? 'Journée' : cvHeure(e.start)+(e.end?'–'+cvHeure(e.end):'')} <span style={{fontSize:10.5,fontWeight:800,color:'var(--accent)'}}>{e.phase}</span></div>
        <div style={{fontWeight:700,lineHeight:1.25}}>{c.code!=='PART'?c.code+' ':''}{j.name}</div>
        {e.crew.length>0 && <div className="muted" style={{fontSize:11}}>{e.crew.join(', ')}</div>}
      </div>
      {ots.length>0 && <div style={{marginTop:3}}><CvOTLinks ots={ots}/></div>}
      {cmd.note && <div style={{marginTop:3,fontSize:11.5}}>📦 {cmd.note}</div>}
      {onCommande && <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:5}}>
        {fait
          ? <button className="btn btn-sm" style={vert} title="Cliquer pour remettre « à placer »" onClick={()=>onCommande(cle, info(x), 'À placer')}>{cmd.statut==='Placée'?'✅ Placée':'✓ Rien à commander'}</button>
          : <>
            <button className="btn btn-sm" title="Commande placée chez le fournisseur" onClick={()=>onCommande(cle, info(x), 'Placée')}>✅ Placée</button>
            <button className="btn btn-sm" title="Pas besoin de commande (stock déjà là)" onClick={()=>onCommande(cle, info(x), 'Rien à commander')}>✓ Rien</button>
          </>}
        <button className="btn btn-sm" title="Ajouter une note (va aussi dans la description de l'événement)" onClick={()=>{ setNoteDe(cle); setNoteTxt(cmd.note||''); }}>📝</button>
      </div>}
      {noteDe===cle && <div style={{marginTop:5}}>
        <textarea value={noteTxt} onChange={ev=>setNoteTxt(ev.target.value)} rows={2} placeholder="Ex. : J'ai 10 gradateurs à la shop" style={{width:'100%',fontSize:12,boxSizing:'border-box'}}/>
        <div style={{display:'flex',gap:4,marginTop:3}}>
          <button className="btn btn-sm btn-p" onClick={()=>{ onCommande(cle, info(x), null, noteTxt.trim()); setNoteDe(null); }}>Enregistrer</button>
          <button className="btn btn-sm" onClick={()=>setNoteDe(null)}>Annuler</button>
        </div>
      </div>}
    </div>; };
  const nomJour = d => new Date(d+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'short',day:'numeric',month:'short'});
  return <div className="card" style={{marginBottom:16}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
      <div className="fh" style={{fontSize:15}}>Commandes de la semaine · {fmtSem(lundi)} au {fmtSem(dim)}</div>
      {!ancre && <div style={{display:'flex',gap:6}}>
        <button className="btn btn-sm" onClick={()=>setDec(d=>d-1)}>‹ Précédente</button>
        {dec!==0 && <button className="btn btn-sm btn-s" onClick={()=>setDec(0)}>Cette semaine</button>}
        <button className="btn btn-sm" onClick={()=>setDec(d=>d+1)}>Suivante ›</button>
      </div>}
    </div>
    <div className="muted" style={{fontSize:12.5,margin:'4px 0 10px'}}>
      {items.length} passage{items.length>1?'s':''} · {aPlacer ? <b style={{color:'var(--warning)'}}>{aPlacer} commande{aPlacer>1?'s':''} à confirmer</b> : <b style={{color:'var(--success)'}}>tout est confirmé ✓</b>}
      {' '}· ✅ placée, ✓ rien à commander, 📝 note (ajoutée à l'événement).
    </div>
    <div style={{overflowX:'auto'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,minmax('+(isDesktop?'0':'150px')+',1fr))',gap:6}}>
        {jours.map(d=>{ const du=items.filter(x=>x.e.day===d).sort((a,b)=>String(a.e.start).localeCompare(String(b.e.start)));
          return <div key={d} style={{minWidth:0}}>
            <div style={{fontSize:11.5,fontWeight:800,textTransform:'uppercase',letterSpacing:'.03em',color: d===today?'var(--accent)':'var(--muted)',padding:'4px 2px',borderBottom:'2px solid '+(d===today?'var(--accent)':'var(--border)'),marginBottom:6}}>{nomJour(d)}</div>
            {du.map(x=><React.Fragment key={x.cle}>{Item({x})}</React.Fragment>)}
          </div>; })}
      </div>
    </div>
    {!items.length && <div className="muted" style={{fontSize:13}}>Aucun passage cette semaine-là.</div>}
  </div>;
}

// Case « Terminées » : cachées par défaut, le choix est retenu sur cet appareil.
function useVoirTerminees(){
  const [v,setV]=useState(()=>{ try{ return localStorage.getItem('crmVoirTerminees')==='1'; }catch(e){ return false; } });
  const set = b=>{ setV(b); try{ localStorage.setItem('crmVoirTerminees', b?'1':'0'); }catch(e){} };
  return [v,set];
}
const CaseTerminees = ({v,set,n})=><label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,whiteSpace:'nowrap'}}><input type="checkbox" checked={v} onChange={e=>set(e.target.checked)}/> Terminées{n?' ('+n+')':''}</label>;

function ClientsView({cfg, refreshKey, isDesktop}){
  const [voirTerm,setVoirTerm]=useVoirTerminees();
  const [tick,setTick]=useState(0);
  const [deplie,setDeplie]=useState({});
  const {loading, err, events, registry, factures, appels, courriels, achats, facLignes, archives, lent} = useClientsData(cfg, refreshKey+'|'+tick);
  const appelsOk = appels || {parNumero:{}, parFacture:{}, liste:[]};
  const [open,setOpen]=useState(null);
  const clients = useMemo(()=>cvBuildClients(events, registry, factures),[events, registry, factures]);
  if(loading) return <div className="card" style={{display:'flex',gap:10,alignItems:'center'}}><div className="spin"></div><span className="muted">Lecture de l'agenda et de La mémoire…</span></div>;
  if(err) return <div className="card" style={{color:'var(--danger)'}}>Impossible de lire les clients : {err}</div>;
  const avisLent = lent && lent.length ? <div className="card" style={{marginBottom:12,fontSize:13,borderColor:'var(--warning)'}}>⚠️ Trop long à lire : {lent.join(', ')}. Les données affichées sont incomplètes — essaie « Actualiser » ou reconnecte-toi.</div> : null;
  if(open && clients[open]) return <ClientDetailView client={clients[open]} factures={factures} appels={appels} courriels={courriels} achats={achats} facLignes={facLignes} archives={archives} cfg={cfg} registry={registry} events={events} onChanged={()=>setTick(t=>t+1)} onBack={()=>setOpen(null)} isDesktop={isDesktop}/>;
  // Contracteurs et particuliers dans la même liste ; la flèche déplie les jobs du client.
  const tous = Object.values(clients).sort((a,b)=>(a.code==='PART')-(b.code==='PART') || b.jobs.length-a.jobs.length);
  const Card = ({c})=>{ const ouvert = deplie[c.code];
    return <div className="opp-card" style={{padding:14}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:8,alignItems:'flex-start'}}>
        <div style={{cursor:'pointer',flex:1}} onClick={()=>setOpen(c.code)}>
          <div className="t" style={{fontSize:15}}>{c.code!=='PART' && <span style={{color:'var(--accent)'}}>{c.code} </span>}{c.label}
            {c.flags>0 && <span className="badge" style={{background:'rgba(248,81,73,0.12)',color:'var(--danger)',marginLeft:8}}>{c.flags} à vérifier</span>}</div>
          {c.contact && <div className="a">{c.contact}</div>}
          <div className="a" style={{marginTop:6}}>{c.jobs.length} jobs · {c.active} en cours ou à venir{c.poTotal ? ' · '+Math.round(c.poTotal).toLocaleString('fr-CA')+' $ en PO' : ''}{c.billed ? ' · '+Math.round(c.billed).toLocaleString('fr-CA')+' $ facturé' : ''}</div>
          <div className="a">Dernière activité : {cvFmtDay(c.lastDay)}</div>
        </div>
        <button className="btn btn-sm" title={ouvert?'Cacher les jobs':'Voir les jobs'} onClick={()=>setDeplie(d=>({...d,[c.code]:!d[c.code]}))}>{ouvert?'▲':'▼'}</button>
      </div>
      {ouvert && <div style={{marginTop:8,borderTop:'1px solid var(--border)'}}>
        {!voirTerm && !c.jobs.some(j=>j.status!=='done') && <div className="muted" style={{fontSize:12.5,padding:'8px 0'}}>Toutes terminées — coche « Terminées » pour les voir.</div>}
        {c.jobs.filter(j=>voirTerm || j.status!=='done').map(j=><div key={j.id} className="remind-item" style={{cursor:'pointer'}} onClick={()=>setOpen(c.code)}>
          <div><b style={{fontSize:13.5}}>{j.name}</b>{j.po && <span className="muted" style={{fontSize:12}}> · {j.po}</span>}<div className="muted" style={{fontSize:12}}>{j.address}</div></div>
          <div className="muted" style={{fontSize:12,whiteSpace:'nowrap'}}>{cvFmtDay(j.last)}</div>
        </div>)}
      </div>}
    </div>; };
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,margin:'0 0 4px'}}>
      <h2 className="fh" style={{margin:0,fontSize:22}}>Clients</h2>
      {cfg.memoireMajUrl
        ? <button className="btn btn-sm" title="Va chercher les nouveaux PO et factures, met le registre à jour et range tout (prêt dans environ 15 min)" onClick={()=>window.open(cfg.memoireMajUrl,'_blank')}>⟳ Mettre à jour La mémoire</button>
        : <span className="muted" style={{fontSize:12}}>Bouton de mise à jour : ajoute l'adresse dans Réglages</span>}
    </div>
    {avisLent}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,marginBottom:14}}>
      <div className="muted" style={{fontSize:13}}>Tes contracteurs et tes particuliers. ▼ pour voir les jobs d'un client, clique le client pour sa fiche complète.</div>
      <CaseTerminees v={voirTerm} set={setVoirTerm}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:isDesktop?'minmax(0,1fr) minmax(0,1fr)':'1fr',gap:'0 16px',alignItems:'start'}}>
      {tous.length ? tous.map(c=><Card key={c.code} c={c}/>) : <div className="card muted">Aucun client trouvé dans l'agenda.</div>}
    </div>
    <div style={{height:16}}/>
    <CvAnomalies cfg={cfg} factures={factures} clients={clients} appels={appelsOk} onOpen={setOpen} onChanged={()=>setTick(t=>t+1)}/>
    {!registry.length && <div className="card muted" style={{marginTop:14,fontSize:12.5}}>Le registre « La mémoire — Jobs » n'a pas pu être lu : les montants de PO et les liens vers les dossiers ne s'affichent pas. Vérifie son ID dans Réglages.</div>}
  </div>;
}

function SettingsView({cfg, setCfg, toast}){

  const [theme,setTheme]=useTheme();
  const [busy,setBusy]=useState(false);
  async function handleInit(){
    if(!f.crmSpreadsheetId){ toast('Indique d\'abord l\'ID du Google Sheet du CRM.','err'); return; }
    setBusy(true);
    try{
      await ensureSheetsExist(f.crmSpreadsheetId, [
        {name:'Contacts', headers:CONTACTS_HEADERS},
        {name:'Opportunites', headers:OPP_HEADERS},
        {name:'Soumissions', headers:SOUM_HEADERS},
        {name:'Rappels', headers:RAPPELS_HEADERS}

    <h2 className="fh" style={{margin:'0 0 14px',fontSize:20}}>Réglages</h2>
    <div className="card grid" style={{gap:12}}>
      <div className="field"><label>Thème</label>
        <select value={theme} onChange={e=>setTheme(e.target.value)}><option value="dark">Sombre</option><option value="light">Clair</option></select>
      </div>
      <div className="field"><label>ID du Google Sheet CRM</label><input value={f.crmSpreadsheetId} onChange={e=>setF({...f,crmSpreadsheetId:e.target.value})} placeholder="Coller l'ID du Sheet ici"/></div>
      <div className="field"><label>ID du Google Sheet "PROJETS SARAN ÉLECTRIQUE"</label><input value={f.projetsSpreadsheetId} onChange={e=>setF({...f,projetsSpreadsheetId:e.target.value})} placeholder="Sheet séparé, sera donné à PunchPro plus tard"/></div>
      <button className="btn btn-s" onClick={handleInit} disabled={busy}>{busy?'Initialisation...':'Initialiser les onglets (Contacts/Opportunites/Soumissions/Rappels/Projets)'}</button>
      <hr style={{border:'none',borderTop:'1px solid var(--border)'}}/>
      <div className="field"><label>ID du Sheet PunchPro (Heures &amp; Employés) — lecture seule</label><input value={f.punchproSpreadsheetId} onChange={e=>setF({...f,punchproSpreadsheetId:e.target.value})} placeholder="Sheet de pointage PunchPro, jamais modifié par le CRM"/></div>
      <div className="field"><label>ID du Sheet "SUIVI TRAVAUX" (Factures) — lecture seule</label><input value={f.suiviTravauxSpreadsheetId} onChange={e=>setF({...f,suiviTravauxSpreadsheetId:e.target.value})} placeholder="Sheet des appels de service / factures, jamais modifié par le CRM"/></div>
      <div className="field"><label>ID du Sheet « La mémoire — Jobs » — lecture seule</label><input value={f.memoireJobsSpreadsheetId||''} onChange={e=>setF({...f,memoireJobsSpreadsheetId:e.target.value})}/></div>
      <div className="field"><label>ID du Sheet « La mémoire — Factures » — lecture seule</label><input value={f.memoireFacturesSpreadsheetId||''} onChange={e=>setF({...f,memoireFacturesSpreadsheetId:e.target.value})}/></div>
      <div className="field"><label>ID du Sheet « La mémoire — Appels de service » — lecture seule</label><input value={f.memoireAppelsSpreadsheetId||''} onChange={e=>setF({...f,memoireAppelsSpreadsheetId:e.target.value})}/></div>
      <div className="field"><label>Adresse « Mettre à jour La mémoire » (application Web Apps Script, finit par /exec)</label><input value={f.memoireMajUrl||''} placeholder="https://script.google.com/macros/s/…/exec" onChange={e=>setF({...f,memoireMajUrl:e.target.value.trim()})}/></div>
      <div className="field"><label>Calendriers (séparés par virgule)</label><input value={f.calendarIds} onChange={e=>setF({...f,calendarIds:e.target.value})}/></div>
      <button className="btn btn-p" onClick={()=>{ saveCfg(f); setCfg(f); toast('Réglages enregistrés.','ok'); }}>Enregistrer les réglages</button>
      <div className="muted" style={{fontSize:11.5}}>Version {APP_VERSION}</div>
    </div>
  </div>;
}

// ── App root ──────────────────────────────────────────────────────────────
function App(){
  const [cfg,setCfg]=useState(loadCfg);
  const [ready,setReady]=useState(false);
  const [authed,setAuthed]=useState(false);
  const [nav,setNav]=useState('dashboard');
  const [initErr,setInitErr]=useState('');
  const [show,toastNode]=useToast();
  const [refreshKey,setRefreshKey]=useState(0);
  const [refreshing,setRefreshing]=useState(false);
  const [navCollapsed,setNavCollapsedState]=useState(()=>{ try{ return localStorage.getItem('crm_nav_collapsed')==='1'; }catch(e){ return false; } });
  // Calendriers actifs — cases à cocher dans la barre du haut pour choisir de
  // voir les événements d'un seul compte (info@saranelectrique / gmail) ou des
  // deux. Persisté, mais toujours au moins un calendrier reste actif.
  const configuredCals = (cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
  const [activeCalsList,setActiveCalsList]=useState(()=>{
    try{ const raw=localStorage.getItem('crm_active_cals'); if(raw){ const arr=JSON.parse(raw); if(Array.isArray(arr) && arr.length) return arr; } }catch(e){}
    return null; // null = pas encore choisi → tous actifs par défaut
  });
  const activeCals = new Set(activeCalsList && activeCalsList.length ? activeCalsList.filter(c=>configuredCals.includes(c)) : configuredCals);
  function toggleCal(email){
    const next = new Set(activeCals);
    if(next.has(email)) next.delete(email); else next.add(email);
    if(next.size===0) return; // toujours garder au moins un calendrier actif
    const arr=[...next];
    setActiveCalsList(arr);
    try{ localStorage.setItem('crm_active_cals', JSON.stringify(arr)); }catch(e){}
  }
  const effectiveCfg = {...cfg, calendarIds: configuredCals.filter(c=>activeCals.has(c)).join(',')};
  useTheme();
  const isDesktop = useIsDesktop();
  function toggleNav(){ const v=!navCollapsed; setNavCollapsedState(v); try{ localStorage.setItem('crm_nav_collapsed', v?'1':'0'); }catch(e){} }

  async function handleRefresh(){
    if(tokenExpired()){ await reconnecter(); return; }
    setRefreshing(true);
    try{ await data.reload(); }catch(e){}
    setRefreshKey(k=>k+1);
    setRefreshing(false);
    show('Données actualisées.','ok');
  }

  const [expired,setExpired]=useState(false);
  useEffect(()=>{
    initGoogle(cfg).then(()=>{ if(restoreToken()) setAuthed(true); setReady(true); }).catch(e=>setInitErr('Erreur d\'initialisation Google: '+apiErrMsg(e)));
  },[]);
  // Surveille l'expiration du jeton (1 h) : au retour sur la page ou toutes les 30 s.
  useEffect(()=>{
    if(!authed) return;
    const verifier = ()=>{ if(tokenExpired()) setExpired(true); };
    const id = setInterval(verifier, 30000);
    window.addEventListener('focus', verifier);
    document.addEventListener('visibilitychange', verifier);
    return ()=>{ clearInterval(id); window.removeEventListener('focus', verifier); document.removeEventListener('visibilitychange', verifier); };
  },[authed]);
  // Reconnexion (clic = geste de l'utilisateur, donc la fenêtre Google n'est pas bloquée), puis on relit tout.
  async function reconnecter(){
    try{ await requestToken(''); setExpired(false); try{ await data.reload(); }catch(e){} setRefreshKey(k=>k+1); show('Reconnecté.','ok'); }
    catch(e){ show('Reconnexion annulée.','err'); }
  }

  const data = useCrmData(cfg, ready && authed);

  async function handleLogin(){
    try{ await requestToken(); setAuthed(true); setExpired(false); }
    catch(e){ show('Connexion refusée ou annulée.','err'); }
  }

  if(!ready) return <div className="login-screen"><div className="spin"></div>{initErr && <div className="muted">{initErr}</div>}</div>;
  if(!authed) return <div className="login-screen">
    <div className="logo"><span className="dot"></span>SoumissionPro</div>
    <div className="muted" style={{fontSize:11.5,marginTop:-12}}>{APP_VERSION}</div>
    <div className="muted">Gestion de contacts, pipeline de vente et soumissions — Saran Électrique</div>
    <button className="btn btn-p" onClick={handleLogin}>Se connecter avec Google</button>
    {!cfg.crmSpreadsheetId && <div className="muted" style={{fontSize:12,maxWidth:320,textAlign:'center'}}>Astuce: connecte-toi puis va dans Réglages pour indiquer l'ID du Google Sheet du CRM et l'initialiser.</div>}
  </div>;

  const navItems = [
    {id:'dashboard',label:'Tableau de bord'},
    {id:'projets',label:'Projets'},
    {id:'clients',label:'Clients'},
    {id:'agenda',label:'Agenda'},
    {id:'fournisseurs',label:'Fournisseurs'},
    {id:'courriels',label:'Courriels'},
    {id:'heures',label:'Heures'},
    {id:'factures',label:'Factures'},
    {id:'contacts',label:'Contacts'},
    {id:'rappels',label:'Rappels & Suivi'},
    {id:'soumissions',label:'Soumissions'},
    {id:'stock',label:'Stock'},
    {id:'reglages',label:'Réglages'}
  ];

  return <div>
    <div className="topbar">
      <div className="logo"><span className="dot"></span>SoumissionPro <span className="muted" style={{fontWeight:400,fontSize:11.5,fontFamily:'var(--font-body)'}}>{APP_VERSION}</span></div>
      <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
        {configuredCals.length>1 && <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {configuredCals.map(email=>
            <label key={email} className="muted" style={{display:'flex',alignItems:'center',gap:4,fontSize:11,cursor:'pointer'}} title={email}>
              <input type="checkbox" checked={activeCals.has(email)} onChange={()=>toggleCal(email)} style={{width:14,height:14}}/>
              {email.split('@')[0]}
            </label>
          )}
        </div>}
        {data.loading && <div className="muted" style={{fontSize:12}}>Chargement...</div>}
        {isDesktop && <button className="btn btn-sm" onClick={toggleNav} title="Afficher/cacher le menu">{navCollapsed?'☰ Menu':'⟨⟨ Cacher le menu'}</button>}
        <button className="btn btn-sm" onClick={handleRefresh} disabled={refreshing} title="Relire les Google Sheets et le calendrier">
          {refreshing ? 'Actualisation...' : '⟳ Refresh'}
        </button>
      </div>
    </div>
    {expired && <div style={{background:'rgba(210,153,34,0.15)',borderBottom:'1px solid var(--warning)',padding:'10px 16px',display:'flex',gap:12,alignItems:'center',justifyContent:'center',flexWrap:'wrap',fontSize:13.5}}>
      <span>⏱ Ta connexion Google a expiré (elle dure 1 h). Rien n'est perdu.</span>
      <button className="btn btn-sm btn-p" onClick={reconnecter}>Reconnecter</button>
    </div>}
    <div className="shell">
      <div className="nav" style={(isDesktop && navCollapsed) ? {width:0,minWidth:0,padding:0,overflow:'hidden',border:'none'} : null}>
        {navItems.map(n=><div key={n.id} className={"nav-item"+(nav===n.id?' active':'')} onClick={()=>setNav(n.id)}>{n.label}</div>)}
      </div>
      <div className="main" style={(nav==='agenda' && isDesktop) ? {maxWidth:'none',width:'100%'} : null}>
        {data.err && <div className="card" style={{borderColor:'var(--danger)',marginBottom:14,color:'var(--danger)'}}>{data.err}</div>}
        {!cfg.crmSpreadsheetId && <div className="card" style={{marginBottom:14}}>Configure d'abord l'ID du Google Sheet du CRM dans Réglages, puis clique "Initialiser les onglets".</div>}
        {nav==='dashboard' && <TableauDeBordView cfg={effectiveCfg} data={data} toast={show} refreshKey={refreshKey} onNavigate={setNav}/>}
        {nav==='clients' && <ClientsView cfg={effectiveCfg} refreshKey={refreshKey} isDesktop={isDesktop}/>}
        {nav==='courriels' && <CourrielsView cfg={effectiveCfg} refreshKey={refreshKey}/>}
        {nav==='fournisseurs' && <FournisseursView cfg={effectiveCfg} refreshKey={refreshKey} isDesktop={isDesktop}/>}
        {nav==='contacts' && <ContactsView data={data} toast={show}/>}
        {nav==='projets' && <ProjetsView data={data} cfg={effectiveCfg} toast={show} refreshKey={refreshKey}/>}
        {nav==='agenda' && <AgendaView cfg={effectiveCfg} data={data} toast={show} isDesktop={isDesktop} refreshKey={refreshKey}/>}
        {nav==='heures' && <HeuresView cfg={cfg} refreshKey={refreshKey}/>}
        {nav==='factures' && <FacturesView cfg={cfg} refreshKey={refreshKey}/>}
        {nav==='rappels' && <RemindersView data={data} toast={show}/>}
        {nav==='soumissions' && <SoumissionsView data={data}/>}
        {nav==='stock' && <StockView data={data}/>}
        {nav==='reglages' && <SettingsView cfg={cfg} setCfg={setCfg} toast={show}/>}
      </div>
    </div>
    {toastNode}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
