// Importer un CSV : ta liste de produits (logiciel comptable) ou les prix / photos des sites fournisseurs (Manus).
// L'import ne remplace jamais ce que tu as déjà classé ou corrigé : il ajoute les nouveaux et remplit les cases vides ; les prix fournisseurs sont mis à jour.
function ImportProduits({C, toast, onFini}){
  const [fichiers,setFichiers]=useState([]);
  const [occupe,setOccupe]=useState('');
  const lireFichiers = async fl => {
    const out = [];
    for(const f of Array.from(fl||[])){ const txt = await f.text(); const objs = csvLire(txt); const genre = csvGenre(objs); out.push({nom:f.name, objs, genre}); }
    setFichiers(out);
  };
  const resume = x => { if(x.genre==='produits'){ const l = x.objs.map(ficheDeCsv).filter(f=>f.code); const nv = l.filter(f=>!C.produits.some(p=>codeNorm(p.code)===codeNorm(f.code))).length;
      return l.length+' produits — '+nv+' nouveaux, '+(l.length-nv)+' déjà dans le catalogue'; }
    if(x.genre==='offres'){ const l = x.objs.map(offreDeCsv).filter(o=>o.f && o.codeF); const fs = [...new Set(l.map(o=>o.f))]; return l.length+' prix ('+fs.join(', ')+'), '+l.filter(o=>cvNum(o.prix)>0).length+' avec prix'; }
    if(x.genre==='photos') return x.objs.length+' photos de produits';
    return 'Format non reconnu — il faut une colonne « Code » (ta liste) ou « Fournisseur » + « Code fournisseur » (prix)'; };
  const go = async()=>{
    try{ let msg=[];
      for(const x of fichiers){
        setOccupe('Import de '+x.nom+'…');
        if(x.genre==='produits'){ const r = await C.importerProduits(x.objs.map(ficheDeCsv)); msg.push(r.nouveaux+' produits ajoutés, '+r.maj+' complétés'); }
        else if(x.genre==='offres' || x.genre==='photos'){ const r = await C.importerOffres(x.objs.map(offreDeCsv), x.genre==='photos'); msg.push(r.nouveaux+' prix ajoutés, '+r.maj+' mis à jour'); }
      }
      setOccupe(''); await C.lire(true); toast&&toast(msg.join(' · ')||'Rien à importer'); setFichiers([]); onFini&&onFini();
    }catch(e){ setOccupe(''); toast&&toast('Erreur : '+apiErrMsg(e)); }
  };
  return <div className="card" style={{marginBottom:10,display:'grid',gap:8}}>
    <b>Importer des fichiers CSV</b>
    <div className="muted" style={{fontSize:12}}>• <b>Ta liste de produits</b> (logiciel comptable) : colonnes Code, Description, Catégorie… → onglet « Produits » de La mémoire.<br/>
      • <b>Prix des fournisseurs</b> (Manus) : Fournisseur, Code fournisseur, Code fabricant, Mon prix, Quantité en stock, URL photo, Code CRM… → onglet « Prix fournisseurs ».<br/>• Le <b>Code CRM</b> relie chaque prix à ton produit. Source « Saran » = article créé à l'interne (SA, SO…).<br/>
      Rien n'est écrit dans STOCK PUNCH PRO. Ce que tu as déjà classé ou corrigé n'est jamais remplacé.</div>
    <input type="file" accept=".csv,text/csv" multiple onChange={e=>lireFichiers(e.target.files)}/>
    {fichiers.map(x=><div key={x.nom} style={{fontSize:13}}>📄 <b>{x.nom}</b> — {resume(x)}</div>)}
    <div style={{display:'flex',gap:6,alignItems:'center'}}>
      <button className="btn btn-sm btn-p" disabled={!fichiers.some(x=>x.genre) || !!occupe} onClick={go}>Importer</button>
      <button className="btn btn-sm" onClick={onFini}>Fermer</button>
      {occupe && <span className="muted" style={{fontSize:12}}>{occupe}</span>}
    </div>
  </div>;
}

// Documents faits dans le CRM (La mémoire — Jobs › « Documents CRM »)
function useDocumentsCrm(cfg){
  const [docs,setDocs]=useState([]);
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    try{ const r = await lireCache(id, "'Documents CRM'!A1:K", force);
      setDocs((r.result.values||[]).slice(1).map((x,i)=>({row:i+2, numero:x[0], type:x[1], date:x[2], client:x[3], courriel:x[4], titre:x[5], st:cvNum(x[6]), total:cvNum(x[9]), donnees:x[10]})).filter(d=>d.numero).reverse()); }
    catch(e){ setDocs([]); }
  },[id]);
  useEffect(()=>{ lire(); },[lire]);
  return {docs, lire};
}

// Calcul des montants d'un document (prix : ceux de la ligne, sinon mes prix / dernier facturé)
function docCalcul(d, prixDe){
  const h1 = d.jours.reduce((t,j)=>t+(cvNum(j.sa01)||0),0), h2 = d.jours.reduce((t,j)=>t+(cvNum(j.sa02)||0),0);
  const px = (code, l) => l && l.prix!=='' && l.prix!=null ? (cvNum(l.prix)||0) : (prixDe(code, l && l.unite)||0);
  const mat = d.lignes.reduce((t,l)=>t+px(l.code,l)*(cvNum(l.qte)||0),0);
  const mo = h1*(prixDe('SA01')||0) + h2*(prixDe('SA02')||0);
  const depl = d.depl ? (prixDe('DEPL')||0) : 0, quin = d.quin ? (prixDe('QUIN')||0) : 0;
  const st = cvNum(d.forfait)!=null && d.forfait!=='' ? cvNum(d.forfait) : mat+mo+depl+quin;
  const tps = arrondi(st*TPS), tvq = arrondi(st*TVQ);
  return {h1, h2, r1:prixDe('SA01')||0, r2:prixDe('SA02')||0, mat:arrondi(mat), mo:arrondi(mo), depl, quin, st:arrondi(st), tps, tvq, total:arrondi(st+tps+tvq), px};
}

// Chaque type pose ses questions (distance, panneau, parcours…) et remplit la soumission : titre, travaux, matériel,
// heures et prix forfaitaire. AUCUN prix ici (le code est public) : les tarifs sont dans « La mémoire — Jobs › Prix »
// (codes « BORNE-… », etc.), entrés une fois dans ⚙ Tarifs. Prochains types : entrée électrique, rough, finition,
// cuisine, salle de bain, maison neuve, blocs — même moule.
const piDe = m => Math.ceil((Number(m)||0)*3.281);
const arr5 = n => Math.round(n/5)*5;
const CALC_SOUMISSION = {
  borne: {
    nom:'🔌 Borne', typeProjet:'Borne de recharge',
    tarifs:[['BORNE-BASE','Installation de base ($) — disjoncteur, raccordement, déplacement, quincaillerie, mise en service'],
      ['BORNE-INCLUS-M','Mètres de câble inclus dans la base (m)'],['BORNE-M-INT','Câble à l\'intérieur, en plus ($/m)'],
      ['BORNE-SORTIE','Sortie à l\'extérieur ($) — percer le mur / la fondation'],['BORNE-M-EXT','Dehors, câble TECK/ACWU au mur ($/m)'],
      ['BORNE-M-TUYAU','Dehors, tuyau PVC au mur ($/m)'],['BORNE-M-SOUT','Sous terre — tranchée ($/m)'],['BORNE-BETON','Béton : percer, descendre au sol, remonter ($)'],
      ['BORNE-ENTRETOIT','Passage par l\'entretoit ($)'],['BORNE-DCC','Contrôleur de charge DCC ($)'],['FLOX3','Borne FLO Maison X3 fournie ($)']],
    // Longueurs : tapées dans l'unité choisie (m ou pi) ; changer l'unité convertit ; les calculs sont toujours en mètres.
    defaut:{lieu:'ext', unite:'m', dist:'', intCable:'NMD', segs:[{type:'TECK', long:'', fil:'RW90'}], borne:'flox3', modele:'', prixBorne:'', amp:'60', panneau:'QO', beton:false, entretoit:false, dcc:false, note:''},
    deviner(txt){ const t=String(txt||''), v={};
      const m=t.match(/(\d+(?:[.,]\d+)?)\s*(m\b|m[eè]tres?|pi\b|pieds?|')/i);
      if(m){ v.dist=m[1].replace(',','.'); v.unite=/^m/i.test(m[2])?'m':'pi'; }
      if(/ext[ée]rieur|dehors|all[ée]e|stationnement|entr[ée]e de cour/i.test(t)) v.lieu='ext'; else if(/garage|int[ée]rieur/i.test(t)) v.lieu='int';
      if(/wallbox|pulsar|tesla|grizzl/i.test(t)) { v.borne='autre'; v.modele=(t.match(/(wallbox[^,.\n]{0,20}|tesla[^,.\n]{0,20}|grizzl[^,.\n]{0,20})/i)||[])[1]||''; }
      if(/(j'ai|a d[ée]j[aà]|poss[eè]de).{0,25}borne/i.test(t)) v.borne='client';
      return v; },
    champs(v, maj){
      const sel = (val, on, opts, st) => <select value={val} onChange={e=>on(e.target.value)} style={st}>{opts.map(([a,b])=><option key={a} value={a}>{b}</option>)}</select>;
      const r = (k, opts) => sel(v[k], x=>maj({[k]:x}), opts);
      const c = (k, l) => <label style={{display:'flex',gap:4,alignItems:'center',fontSize:13}}><input type="checkbox" checked={!!v[k]} onChange={e=>maj({[k]:e.target.checked})}/> {l}</label>;
      const long = (val, on) => <input value={val} inputMode="decimal" placeholder={v.unite} onChange={e=>on(e.target.value)} style={{width:64}}/>;
      // Changer m ↔ pi convertit toutes les longueurs déjà tapées
      const unite = u => { if(u===v.unite) return; const f = u==='pi' ? 3.281 : 1/3.281, cv = x => { const n=cvNum(x); return n==null ? x : String(Math.round(n*f*10)/10); };
        maj({unite:u, dist:cv(v.dist), segs:v.segs.map(s=>({...s, long:cv(s.long)}))}); };
      const uSel = sel(v.unite, unite, [['m','mètres'],['pi','pieds']]);
      const majSeg = (i, p) => maj({segs:v.segs.map((s,k)=>k===i?{...s,...p}:s)});
      const ext = v.lieu==='ext';
      return <div style={{display:'grid',gap:8,fontSize:13}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}><b>1. Parcours</b> — la borne est {r('lieu',[['ext','à l\'extérieur'],['int','à l\'intérieur (garage)']])} · mesures en {uSel}</div>
        {!ext && <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',paddingLeft:12}}>Câble NMD du panneau à la borne : {long(v.dist, x=>maj({dist:x}))} {v.unite}</div>}
        {ext && <div style={{display:'grid',gap:5,paddingLeft:12}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>Du panneau jusqu'à la sortie : {long(v.dist, x=>maj({dist:x}))} {v.unite} en {r('intCable',[['NMD','NMD'],['TECK','TECK / ACWU']])}</div>
          <div>De la sortie jusqu'à la borne (dans l'ordre) :</div>
          {v.segs.map((s,i)=><div key={i} style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',paddingLeft:12}}>
            {i+1}. {sel(s.type, x=>majSeg(i,{type:x}), [['TECK','Câble TECK/ACWU au mur'],['TECK_SOL','Câble TECK/ACWU sous terre'],['TUYAU','Tuyau PVC au mur'],['TUYAU_SOL','Tuyau PVC sous terre']])}
            {long(s.long, x=>majSeg(i,{long:x}))} {v.unite}
            {/TUYAU/.test(s.type) && <>fils {sel(s.fil, x=>majSeg(i,{fil:x}), [['RW90','RW90'],['T90','T90'],['CABLE','le câble dans le tuyau']])}</>}
            {v.segs.length>1 && <button className="btn btn-sm" onClick={()=>maj({segs:v.segs.filter((x,k)=>k!==i)})}>✕</button>}
          </div>)}
          <div style={{paddingLeft:12}}><button className="btn btn-sm" onClick={()=>maj({segs:[...v.segs, {type:'TUYAU', long:'', fil:'RW90'}]})}>+ Un bout (ex. sous terre, puis remonter en tuyau)</button></div>
        </div>}
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>{c('beton','Béton / coin de maison : percer, descendre au sol, remonter')}{c('entretoit','Passage par l\'entretoit')}</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}><b>2. Borne</b> {r('borne',[['flox3','FLO Maison X3 (fournie)'],['autre','Autre borne (fournie)'],['client','Le client a sa borne']])}
          {v.borne!=='flox3' && <input value={v.modele} onChange={e=>maj({modele:e.target.value})} placeholder="Modèle" style={{width:140}}/>}
          {v.borne==='autre' && <input value={v.prixBorne} inputMode="decimal" placeholder="prix $" onChange={e=>maj({prixBorne:e.target.value})} style={{width:80}}/>}</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}><b>3. Panneau</b> {r('panneau',[['QO','Square D QO'],['HOM','Square D Homeline'],['BR','Eaton BR / CHOM'],['SIE','Siemens'],['AUTRE','Autre']])}
          disjoncteur {r('amp',[['60','2P 60 A (48 A de charge)'],['40','2P 40 A (32 A de charge)']])} {c('dcc','Panneau juste : contrôleur DCC')}</div>
        <input value={v.note} onChange={e=>maj({note:e.target.value})} placeholder="Emplacement exact de la borne (ex. au bout du mur, près de l'allée)"/>
      </div>; },
    calculer(v, t){
      const f = v.unite==='pi' ? 0.3048 : 1, m = x => Math.max(0, (cvNum(x)||0)*f), r1 = x => String(Math.round(x*10)/10).replace('.',',');
      const ext = v.lieu==='ext', six = v.amp==='60', amp = v.amp;
      const I = m(v.dist);                                                       // intérieur (ou tout le parcours si borne dedans)
      const segs = ext ? v.segs.map(s=>({...s, m:m(s.long), sol:/_SOL$/.test(s.type), tuyau:/^TUYAU/.test(s.type)})).filter(s=>s.m>0) : [];
      const E = segs.reduce((a,s)=>a+s.m,0), D = I+E, S = segs.filter(s=>s.sol).reduce((a,s)=>a+s.m,0);
      // --- Prix (tarifs de l'onglet Prix) ---
      const manque = []; const T = key => { const x = t(key); if(x==null) manque.push(key); return x||0; };
      const inclus = t('BORNE-INCLUS-M')!=null ? t('BORNE-INCLUS-M') : 0;
      let reste = inclus, inst = T('BORNE-BASE');
      const prend = x => { const p = Math.min(reste, x); reste -= p; return x-p; };
      const iExtra = prend(I); if(iExtra) inst += iExtra*T('BORNE-M-INT');
      if(ext) inst += T('BORNE-SORTIE');
      segs.forEach(s=>{ const x = s.sol ? s.m : prend(s.m); if(x) inst += x*T(s.sol ? 'BORNE-M-SOUT' : s.tuyau ? 'BORNE-M-TUYAU' : 'BORNE-M-EXT'); });
      if(v.beton) inst += T('BORNE-BETON');
      if(v.entretoit) inst += T('BORNE-ENTRETOIT');
      if(v.dcc) inst += T('BORNE-DCC');
      inst = arr5(inst);
      const nomBorne = v.borne==='flox3' ? 'FLO Maison X3' : (v.modele||'');
      const pBorne = v.borne==='flox3' ? T('FLOX3') : v.borne==='autre' ? (cvNum(v.prixBorne)||0) : 0;
      // --- Matériel / stock pour l'ordre de travail (codes de ton logiciel ; longueurs en pieds, +10 % de jeu) ---
      const L = []; const ajout = (code, desc, qte, unite) => { if(qte>0){ const ex = L.find(l=>l.code===code); if(ex) ex.qte = String(+ex.qte + qte); else L.push({code, desc, unite:unite||'un', qte:String(qte), prix:''}); } };
      const disj = {QO:'QO2', HOM:'HOM2', BR:'BR2', SIE:'SIEQ2'}[v.panneau];
      ajout(disj ? disj+amp : 'DISJ-2P'+amp, 'Disjoncteur 2P '+amp+' A '+({QO:'Square D QO',HOM:'Square D Homeline',BR:'Eaton BR',SIE:'Siemens Q2',AUTRE:''}[v.panneau]||''), 1);
      const g = six?6:8, gt = six?8:10;
      const NMD = six?'NMD2C6':'NMD2C8', TECK = six?'CAB6TECK2C1KV':'CAB8TECK2C1KV';
      // Conducteur de chaque bout : NMD, TECK (aussi le câble passé dans un tuyau), RW90 ou T90 (fils dans le tuyau)
      const intCond = ext ? v.intCable : 'NMD';
      const chaine = [{cond:intCond, m:I, int:true}, ...segs.map(s=>({...s, cond: s.tuyau ? (s.fil==='CABLE' ? 'TECK' : s.fil) : 'TECK'}))].filter(s=>s.m>0);
      chaine.forEach(s=>{
        const ft = piDe(s.m*1.1);
        if(s.cond==='NMD') ajout(NMD, 'Fil NMD 2C #'+g, ft, 'pi');
        else if(s.cond==='TECK') ajout(TECK, 'Câble TECK 2C #'+g+' 1 kV', ft, 'pi');
        else { const pre = s.cond==='RW90' ? 'RW90' : 'T90', code = pre+g+'BLK';
          ajout(code, 'Fil '+pre+' #'+g+' noir (2 conducteurs)', 2*piDe(s.m*1.15), 'pi'); ajout(pre+gt+'GRN', 'Fil '+pre+' #'+gt+' vert (mise à la terre)', piDe(s.m*1.15), 'pi'); }
        if(!s.int && !s.tuyau && !s.sol) ajout('RCS15-1','Sangle pour câble TECK', Math.ceil(s.m/1.5)+1);
      });
      // Boîtes de jonction : chaque fois que le conducteur change (NMD → TECK, TECK → fils RW90…)
      let jb = 0; chaine.forEach((s,i)=>{ if(i && s.cond!==chaine[i-1].cond) jb++; });
      ajout('RJB664','Boîte de jonction PVC 6×6×4 (changement de conducteur)', jb);
      // Connecteurs : 2 par bout de NMD ou de TECK (entrée et sortie)
      const runs = c => chaine.reduce((n,s,i)=>n + (s.cond===c && (!i || chaine[i-1].cond!==c) ? 1 : 0), 0);
      ajout('CI73','Connecteur NMD 1 po', 2*runs('NMD')); ajout('CI2216','Connecteur câble TECK 1 po', 2*runs('TECK'));
      // Tuyau PVC 1 po : longueurs de 10 pi, couplings, adaptateurs, coudes, sangles, colle
      const tuy = segs.filter(s=>s.tuyau);
      if(tuy.length){
        let barres = 0, couplings = 0, tRuns = 0;
        segs.forEach((s,i)=>{ if(s.tuyau && !(i && segs[i-1].tuyau)) tRuns++; });
        let run = 0; segs.forEach((s,i)=>{ if(s.tuyau) run += s.m; if(!s.tuyau || i===segs.length-1 || !segs[i+1].tuyau){ if(run){ const b = Math.ceil(piDe(run*1.1)/10); barres += b; couplings += Math.max(0,b-1); run = 0; } } });
        ajout('RC4001010','Conduit PVC rigide 1 po (longueurs de 10 pi)', barres*10, 'pi');
        ajout('REC20','Coupling PVC 1 po', couplings);
        ajout('RTA20','Adaptateur de boîte PVC 1 po', 2*tRuns);
        ajout('REE2090','Coude PVC 1 po 90°', tuy.filter(s=>s.sol).length*2);
        ajout('RPS20','Sangle PVC 1 po', tuy.filter(s=>!s.sol).reduce((n,s)=>n+Math.ceil(s.m)+1,0));
        ajout('RVOC475','Colle à solvant pour PVC', 1);
        ajout('CI2708','Bague isolante 1 po', 2*tRuns);
      }
      if(ext){ if(segs[0] && segs[0].tuyau) ajout('RSLB30S','LB PVC 1 po (sortie du mur)', 1); else ajout('CIDUCT-1','Composé scellant (passage du mur)', 1); }
      if(S) ajout('RUBAN-AVERT','Ruban d\'avertissement rouge (tranchée)', piDe(S), 'pi');
      if(v.beton) ajout('USC-72100','Tapcon 3/16 × 1-1/4 (boîte de 100)', 1);
      if(v.borne==='flox3') ajout('FLOX3','Borne FLO Maison X3, connecteur J1772',1);
      else if(v.borne==='autre') ajout('BORNE','Borne '+(v.modele||'de recharge'),1);
      if(v.dcc) ajout('DCC','Contrôleur de charge (DCC)',1);
      // --- Heures (ordre de travail ; le prix, lui, est le forfait) ---
      const h = Math.round((3 + (ext?1:0) + S*0.3 + jb*0.5 + (v.beton?1:0) + (v.entretoit?1.5:0) + (v.dcc?1:0) + D*0.04)*2)/2;
      // --- Texte pour le client ---
      const nomSeg = s => ({TECK:'câble TECK fixé au mur', TECK_SOL:'câble enterré', TUYAU:'tuyau PVC rigide au mur', TUYAU_SOL:'tuyau PVC rigide enterré'}[s.type]);
      const txt = [];
      txt.push(v.borne==='client' ? 'Installation d\'une borne de recharge de niveau 2 (240 V) fournie par le client'+(v.modele?' ('+v.modele+')':'')+'.' : 'Fourniture et installation d\'une borne de recharge '+nomBorne+' (niveau 2, 240 V).');
      txt.push('Emplacement : '+(ext?'à l\'extérieur':'à l\'intérieur (garage)')+(v.note?', '+v.note:'')+'.');
      txt.push('Raccordement au panneau électrique avec un nouveau disjoncteur 2 pôles '+amp+' A'+(v.dcc?' et contrôleur de charge (DCC) pour respecter la capacité du panneau':'')+'.');
      if(D) txt.push('Câblage d\'environ '+r1(D)+' m'+(ext ? ' : '+r1(I)+' m à l\'intérieur'+(v.entretoit?' (par l\'entretoit)':'')+', sortie par le mur'+(segs.length ? ', puis '+segs.map(s=>r1(s.m)+' m en '+nomSeg(s)).join(', ') : '')+' jusqu\'à la borne' : (v.entretoit?' en passant par l\'entretoit':' à l\'intérieur'))+'.');
      if(S) txt.push('Tranchée d\'environ '+r1(S)+' m pour la partie enterrée.');
      if(v.beton) txt.push('Perçage et fixation dans le béton (coin de maison / fondation) pour descendre au sol et remonter à la borne.');
      txt.push('Inclus : matériel électrique, déplacement, mise en service et essai de la borne.');
      const detail = pBorne ? 'Détail : borne '+nomBorne+' — '+cvMoney(pBorne)+' · câblage et installation — '+cvMoney(inst)+'.' : '';
      const exclus = (S||v.beton) ? 'Ne comprend pas la réfection du béton, de l\'asphalte ou de l\'aménagement paysager.' : '';
      return {manque:[...new Set(manque)], forfait: manque.length ? '' : arr5(inst+pBorne), installation:inst, borne:pBorne, metres:r1(D),
        titre: v.borne==='client' ? 'Installation borne de recharge' : 'Borne '+nomBorne, travaux: txt.join('\n'), remarques:[detail, exclus].filter(Boolean).join('\n'), lignes:L, heures:h};
    }
  },
};

// ===== v111 : agenda Google « Soumission » =====
// Les demandes de soumission vont dans un agenda « Soumission » (créé par William dans Google Agenda).
// Le CRM y prend le client (nom, téléphone, courriel, adresse, travaux) ; quand la soumission est acceptée,
// l'événement est déplacé dans « En Attente » (rien n'est effacé ni réécrit : on déplace seulement l'événement).
let SOUM_CAL_ID;
async function soumCalId(){
  if(SOUM_CAL_ID !== undefined) return SOUM_CAL_ID;
  try{ const r = await window.gapi.client.calendar.calendarList.list({maxResults:250, fields:'items(id,summary,summaryOverride)'});
    const c = (r.result.items||[]).find(x=>/^soumissions?$/i.test(String(x.summaryOverride||x.summary||'').trim()));
    SOUM_CAL_ID = c ? c.id : null; }catch(e){ SOUM_CAL_ID = null; }
  return SOUM_CAL_ID;
}
async function soumEvenements(){
  const id = await soumCalId(); if(!id) return {id:null, liste:[]};
  const min = new Date(); min.setDate(min.getDate()-150); const max = new Date(); max.setDate(max.getDate()+200);
  const r = await window.gapi.client.calendar.events.list({calendarId:id, timeMin:min.toISOString(), timeMax:max.toISOString(), singleEvents:true, orderBy:'startTime', maxResults:250});
  return {id, liste:(r.result.items||[]).filter(e=>e.status!=='cancelled').reverse()};
}
// Client d'un événement : « Client : … », « Tél : … », « Courriel : … » dans la description, sinon devinés.
function infosEvenement(ev){
  const desc = String(ev.description||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#39;/g,"'");
  const champ = re => ((desc.match(re)||[])[1]||'').trim();
  const courriel = (champ(/^\s*(?:courriel|e-?mail|email)\s*:\s*\S*?([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/im) || (desc.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/)||[''])[0]).toLowerCase();
  let tel = champ(/^\s*t[ée]l(?:[ée]phone)?\s*:\s*(.+)$/im) || ((desc.match(/(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/)||[''])[0]);
  const ch = tel.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,''); if(ch.length===10) tel = ch.slice(0,3)+' '+ch.slice(3,6)+'-'+ch.slice(6);
  const titre = String(ev.summary||'').trim();
  const nom = champ(/^\s*(?:client|nom)\s*:\s*(.+)$/im) || titre.replace(/^\s*(soum(ission)?|serv|borne|entr[ée]e)\b\s*[-–:]?\s*/i,'').replace(/\s*[-–]\s*.*$/,'').trim();
  const travaux = desc.split('\n').filter(l=>!/^\s*(client|nom|t[ée]l(?:[ée]phone)?|courriel|e-?mail|email|adresse)\s*:/i.test(l)).join('\n').replace(/\n{3,}/g,'\n\n').trim();
  return {nom, tel, courriel, adresse:ev.location||'', titre, travaux};
}
function ChoixEvenementSoumission({onChoix, toast}){
  const [ouvert,setOuvert]=useState(false);
  const [etat,setEtat]=useState(null);
  const [q,setQ]=useState('');
  const ouvrir = async ()=>{ setOuvert(!ouvert); if(etat) return; try{ setEtat(await soumEvenements()); }catch(e){ setEtat({id:null, liste:[], err:apiErrMsg(e)}); } };
  const liste = etat ? etat.liste.filter(e=>!q || cvNorm([e.summary,e.location,e.description].join(' ')).includes(cvNorm(q))) : [];
  return <div style={{marginTop:2}}>
    <button className="btn btn-sm" onClick={ouvrir}>📅 Prendre le client dans l'agenda « Soumission »</button>
    {ouvert && <div style={{marginTop:6,border:'1px solid var(--border2)',borderRadius:8,padding:6}}>
      {!etat && <div className="muted" style={{fontSize:12.5}}>Lecture de l'agenda…</div>}
      {etat && !etat.id && <div style={{fontSize:12.5}}>{etat.err ? 'Erreur : '+etat.err : 'Pas d\'agenda « Soumission » dans Google Agenda. Crée-le (Autres agendas › + › Créer un agenda, nom : Soumission), puis rouvre.'}</div>}
      {etat && etat.id && <>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Chercher (nom, adresse…)" style={{width:'100%',boxSizing:'border-box',marginBottom:4}}/>
        <div style={{maxHeight:240,overflowY:'auto'}}>
          {liste.map(e=><div key={e.id} onClick={()=>{ onChoix(e, etat.id); setOuvert(false); }} style={{padding:'5px 4px',borderBottom:'1px solid var(--border)',cursor:'pointer',fontSize:13}}>
            <b>{e.summary||'(sans titre)'}</b> <span className="muted" style={{fontSize:12}}>· {cvFmtDay(cvDay((e.start&&(e.start.dateTime||e.start.date))||''))}{e.location?' · 📍 '+e.location:''}</span>
          </div>)}
          {!liste.length && <div className="muted" style={{fontSize:12.5,padding:4}}>Aucun événement dans l'agenda « Soumission ».</div>}
        </div></>}
    </div>}
  </div>;
}
// Soumission acceptée : déplace son événement de l'agenda « Soumission » vers « En Attente ».
async function soumAccepteeVersEnAttente(cfg, s, toast){
  try{
    const calId = await soumCalId(); if(!calId) return;
    let ev = null;
    // 1) La soumission faite dans le CRM se souvient de son événement
    if(s.no){ try{ const r = await lireCache(cfg.memoireJobsSpreadsheetId, "'Documents CRM'!A1:K", true);
      const l = (r.result.values||[]).find(x=>x[0]===s.no || x[0]==='E-'+String(s.no).replace(/^E-/,''));
      const doc = l && l[10] ? JSON.parse(l[10]) : null; if(doc && doc.evenement && doc.evenement.calId===calId) ev = doc.evenement; }catch(e){} }
    // 2) Sinon : l'événement « Soumission » au même courriel ou au même nom
    if(!ev){ const {liste} = await soumEvenements(); const c = (s.courriel||'').toLowerCase(), n = cvNorm(s.client||'');

// pointillé = encastré / sous terre, carré = borne / prise / panneau, flèche + étiquette), ajoute des notes.
// L'image annotée va dans le dossier Drive de la soumission ; le PDF de la soumission (🖨️) ajoute une page « Plan des travaux ».
const PLAN_A_PHOTOGRAPHIER = {'Borne de recharge':['le panneau électrique','le chemin du câble (sortie, mur, tranchée)','l\'emplacement de la borne','au besoin, un 4e endroit du chemin'], 'Panneau / entrée électrique':['le panneau actuel','le mât / compteur','l\'emplacement du nouveau panneau'], 'Prises et circuits':['l\'emplacement actuel','le chemin','le nouvel emplacement']};
const PLAN_COULEURS = [['#e00000','Rouge'],['#111111','Noir'],['#1a73e8','Bleu']];
function planDessiner(ctx, W, formes){
  const lw = Math.max(3, W*0.006);
  formes.forEach(f=>{
    ctx.save(); ctx.strokeStyle = f.c; ctx.fillStyle = f.c; ctx.lineWidth = lw; ctx.lineCap='round'; ctx.lineJoin='round';
    if(f.t==='ligne' || f.t==='pointille'){ ctx.setLineDash(f.t==='pointille' ? [lw*2.2, lw*1.6] : []); ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke(); }
    else if(f.t==='rect'){ ctx.strokeRect(Math.min(f.x1,f.x2), Math.min(f.y1,f.y2), Math.abs(f.x2-f.x1), Math.abs(f.y2-f.y1)); }
    else if(f.t==='fleche'){ ctx.lineWidth = lw*0.6; ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke();
      const a = Math.atan2(f.y2-f.y1, f.x2-f.x1), h = lw*4; ctx.beginPath(); ctx.moveTo(f.x2,f.y2);
      ctx.lineTo(f.x2-h*Math.cos(a-0.45), f.y2-h*Math.sin(a-0.45)); ctx.lineTo(f.x2-h*Math.cos(a+0.45), f.y2-h*Math.sin(a+0.45)); ctx.closePath(); ctx.fill(); }
    else if(f.t==='texte'){ const fs = Math.max(16, W*0.024); ctx.font = '600 '+fs+'px Arial, sans-serif';
      const lignes = String(f.txt||'').split('\n'), larg = Math.max(...lignes.map(l=>ctx.measureText(l).width)), p = fs*0.45;
      ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fillRect(f.x1-p, f.y1-fs-p*0.4, larg+2*p, lignes.length*fs*1.2+p);
      ctx.fillStyle = '#111'; lignes.forEach((l,i)=>ctx.fillText(l, f.x1, f.y1+i*fs*1.2)); }
    ctx.restore();
  });
}
function PlanAnnoter({image, onSave, onClose}){
  const ref = useRef(null), imgRef = useRef(null);
  const [formes,setFormes]=useState([]);
  const [outil,setOutil]=useState('ligne');
  const [coul,setCoul]=useState('#e00000');
  const [texte,setTexte]=useState('');
  const [prete,setPrete]=useState(false);
  const enCours = useRef(null);
  // Image de fond (photo) ou feuille blanche quadrillée (croquis)
  useEffect(()=>{ let vivant=true;
    (async()=>{ const c = ref.current; if(!c) return;
      if(image){ const im = new Image(); im.src = image; await im.decode().catch(()=>{}); if(!vivant) return;
        const k = Math.min(1, 1600/Math.max(im.naturalWidth||1, im.naturalHeight||1)); c.width = Math.round((im.naturalWidth||1200)*k); c.height = Math.round((im.naturalHeight||900)*k); imgRef.current = im; }
      else { c.width = 1400; c.height = 1000; imgRef.current = null; }
      setPrete(true); })();
    return ()=>{ vivant=false; }; },[image]);
  const rendre = useCallback((extra)=>{ const c = ref.current; if(!c || !prete) return; const ctx = c.getContext('2d');
    if(imgRef.current) ctx.drawImage(imgRef.current, 0, 0, c.width, c.height);
    else { ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.strokeStyle='#e6e6e6'; ctx.lineWidth=1; for(let x=0;x<c.width;x+=50){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,c.height); ctx.stroke(); } for(let y=0;y<c.height;y+=50){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(c.width,y); ctx.stroke(); } }
    planDessiner(ctx, c.width, extra ? [...formes, extra] : formes); },[formes, prete]);
  useEffect(()=>{ rendre(); },[rendre]);
  const pos = e => { const c = ref.current, r = c.getBoundingClientRect(); return {x:(e.clientX-r.left)*c.width/r.width, y:(e.clientY-r.top)*c.height/r.height}; };
  const bas = e => { e.preventDefault(); const p = pos(e);
    if(outil==='texte'){ if(!texte.trim()) return; setFormes(f=>[...f, {t:'texte', c:'#111', x1:p.x, y1:p.y, txt:texte.trim()}]); setTexte(''); return; }
    enCours.current = {t:outil, c:coul, x1:p.x, y1:p.y, x2:p.x, y2:p.y}; try{ e.target.setPointerCapture(e.pointerId); }catch(x){} };
  const bouge = e => { if(!enCours.current) return; const p = pos(e); enCours.current = {...enCours.current, x2:p.x, y2:p.y}; rendre(enCours.current); };
  const haut = () => { const f = enCours.current; enCours.current = null; if(f && Math.hypot(f.x2-f.x1, f.y2-f.y1) > 6) setFormes(x=>[...x, f]); else rendre(); };
  const garder = () => ref.current.toBlob(b=>onSave(b), 'image/jpeg', 0.86);
  const btn = (k, l) => <button key={k} className={'btn btn-sm'+(outil===k?' btn-p':'')} onClick={()=>setOutil(k)}>{l}</button>;
  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:1000,display:'flex',flexDirection:'column',padding:8,gap:6}}>
    <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center',background:'var(--bg2)',padding:6,borderRadius:8}}>
      {btn('ligne','━ Câble')}{btn('pointille','┅ Encastré / sous terre')}{btn('rect','▢ Borne / prise / panneau')}{btn('fleche','➜ Flèche')}{btn('texte','T Étiquette')}
      {outil==='texte' && <input autoFocus value={texte} onChange={e=>setTexte(e.target.value)} placeholder="Texte, puis touche la photo" style={{width:200}}/>}
      {outil!=='texte' && PLAN_COULEURS.map(([c,n])=><button key={c} title={n} onClick={()=>setCoul(c)} style={{width:24,height:24,borderRadius:12,background:c,border:coul===c?'3px solid var(--accent)':'1px solid #999'}}/>)}
      <button className="btn btn-sm" disabled={!formes.length} onClick={()=>setFormes(f=>f.slice(0,-1))}>↶ Annuler</button>
      <span style={{marginLeft:'auto',display:'flex',gap:5}}><button className="btn btn-sm" onClick={onClose}>Fermer</button><button className="btn btn-sm btn-p" disabled={!prete} onClick={garder}>✓ Garder</button></span>
    </div>
    <div style={{flex:1,overflow:'auto',display:'flex',justifyContent:'center',alignItems:'flex-start'}}>
      <canvas ref={ref} onPointerDown={bas} onPointerMove={bouge} onPointerUp={haut} onPointerCancel={haut} style={{maxWidth:'100%',maxHeight:'100%',touchAction:'none',background:'#fff',borderRadius:6,cursor:'crosshair'}}/>
    </div>
  </div>;
}

const PLAN_IMG = {};
async function planImage(id){
  if(PLAN_IMG[id]) return PLAN_IMG[id];
  const tok = window.gapi.client.getToken() && window.gapi.client.getToken().access_token;
  const r = await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media&supportsAllDrives=true', {headers:{Authorization:'Bearer '+tok}});
  if(!r.ok) throw new Error('Drive '+r.status);
  const b = await r.blob();
  const url = await new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.readAsDataURL(b); });
  return (PLAN_IMG[id] = url);
}

  const enregistrer = async ()=>{
    setOccupe('save');
    try{
      const numero = d.numero || await prochainNumero();
      const doc = {...d, numero};
      const date = (doc.jours[0] && doc.jours[0].date) || cvDay(new Date().toISOString());
      // 1) STOCK PUNCH PRO › Appels de service : AUCUN prix (les gars le voient)
      const mat = JSON.stringify(doc.lignes.filter(l=>cvNum(l.qte)).map(l=>({code:l.code, desc:l.desc, qte:cvNum(l.qte), unite:l.unite})));
      const ligneStock = [numero, date, 'William (CRM)', doc.titre, doc.adresse, doc.nom, doc.tel, doc.courriel, calc.h1||'', calc.h2||'', doc.type,
        (doc.forfait!=='' && doc.forfait!=null) ? 'Oui' : '', doc.depl ? 'Oui' : '', doc.quin ? 'Oui' : '', mat, doc.remarques, 'Brouillon', new Date().toLocaleString('fr-CA')];
      const st = await window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId:cfg.stockSpreadsheetId, range:qSheet('Appels de service')+'!A1:A'});
      const iS = (st.result.values||[]).findIndex(r=>r[0]===numero);
      if(iS>0) await sheetsUpdateRow(cfg.stockSpreadsheetId, qSheet('Appels de service'), iS+1, ligneStock);
      else await sheetsAppendRow(cfg.stockSpreadsheetId, qSheet('Appels de service'), ligneStock);
      // 2) La mémoire — Jobs › Documents CRM : avec les prix (toi seulement)
      const ligneDoc = [numero, doc.type, date, doc.nom, doc.courriel, doc.titre, prix?calc.st:'', prix?calc.tps:'', prix?calc.tvq:'', prix?calc.total:'', JSON.stringify(doc)];
      const ex = D.docs.find(x=>x.numero===numero);
      if(ex) await sheetsUpdateRow(cfg.memoireJobsSpreadsheetId, qSheet('Documents CRM'), ex.row, ligneDoc);
      else { if(!D.docs.length) await ensureSheetsExist(cfg.memoireJobsSpreadsheetId, [{name:'Documents CRM', headers:DOCS_ENTETE}]); await sheetsAppendRow(cfg.memoireJobsSpreadsheetId, qSheet('Documents CRM'), ligneDoc); }
      setD(doc); await D.lire(true);
      toast && toast(doc.type+' '+numero+' enregistré'+(doc.type==='Facture'?' (brouillon à refaire dans ton logiciel)':''));
      return doc;
    }catch(e){ toast && toast('Erreur : '+apiErrMsg(e)); return null; }
    finally{ setOccupe(''); }
  };
  const courriel = async ()=>{
    const doc = d.numero ? d : await enregistrer(); if(!doc) return;
    const sujet = doc.type+' '+doc.numero+(doc.titre?' — '+doc.titre:'')+' : Saran Électrique Inc.';
    const corps = 'Bonjour'+(doc.nom?' '+doc.nom.split(' ')[0]:'')+',\n\nVoici '+(doc.type==='Soumission'?'notre soumission':doc.type==='Facture'?'votre facture':'l\'ordre de travail')+' '+doc.numero+(doc.titre?' pour '+doc.titre:'')+'.'+
      (prix ? '\n\nMontant avant taxes : '+cvMoney(calc.st)+'\nTotal avec taxes : '+cvMoney(calc.total) : '')+
      '\n\nLe document est en pièce jointe. N\'hésitez pas si vous avez des questions.\n\nCordialement,\n\nSaran Électrique inc.\nWilliam Saran, Président\n(438) 490-3412\ninfo@saranelectrique.com';
    window.open('https://mail.google.com/mail/?authuser=info@saranelectrique.com&view=cm&fs=1&to='+encodeURIComponent(doc.courriel||'')+'&su='+encodeURIComponent(sujet)+'&body='+encodeURIComponent(corps), '_blank');
    // Une soumission envoyée va dans Soumissions › Envoyées (à classer)
    if(doc.type==='Soumission'){
      try{
        const deja = await lireCache(cfg.memoireJobsSpreadsheetId, 'Soumissions!A1:A', true);
        if(!(deja.result.values||[]).some(r=>r[0]==='CRM-'+doc.numero)) await sheetsAppendRow(cfg.memoireJobsSpreadsheetId, 'Soumissions', ['CRM-'+doc.numero, 'Envoyée', cvDay(new Date().toISOString()), doc.numero, doc.nom, (doc.courriel||'').toLowerCase(), sujet, [doc.titre, doc.adresse].filter(Boolean).join(' — '), calc.st, '', '', '']);
      }catch(e){}
      onEnvoye && onEnvoye(doc);
    }
  };
  // Modèle : remplit le titre / travaux (si vides), les heures, déplacement, quincaillerie, forfait et le matériel.
  const appliquerModele = m => {
    if(d.lignes.some(l=>cvNum(l.qte)) && !confirm('Remplacer le matériel et les heures par le modèle « '+m.nom+' » ?')) return;
    const x = m.d || {}, jour0 = (d.jours[0] && d.jours[0].date) || cvDay(new Date().toISOString());
    setD(o=>({...o, typeProjet: o.typeProjet || m.type, titre: o.titre || x.titre || '', travaux: o.travaux || x.travaux || '',
      jours: (x.jours && x.jours.length ? x.jours : [{sa01:'',sa02:''}]).map((j,i)=>({date:(o.jours[i] && o.jours[i].date) || (i ? '' : jour0), sa01:j.sa01||'', sa02:j.sa02||''})),
      depl:!!x.depl, quin:!!x.quin, forfait:x.forfait||'', lignes:(x.lignes||[]).map(l=>({...l})), remarques: o.remarques || x.remarques || ''}));
    toast && toast('Modèle « '+m.nom+' » appliqué');
  };
  const modeles = [...M.liste].sort((a,b)=>((b.type && b.type===d.typeProjet)-(a.type && a.type===d.typeProjet)) || a.nom.localeCompare(b.nom));
  const ouvrir = doc => { try{ setD({...docVide(), ...JSON.parse(doc.donnees||'{}')}); window.scrollTo(0,0); }catch(e){ toast && toast('Impossible d\'ouvrir ce document'); } };

  const champ = (k, ph, extra) => <input value={d[k]} onChange={e=>maj({[k]:e.target.value})} placeholder={ph} style={{width:'100%',boxSizing:'border-box',...(extra||{})}}/>;
  const choisies = d.lignes.filter(l=>cvNum(l.qte));
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>
      <h2 className="fh" style={{margin:0,fontSize:soumMode?17:20}}>{soumMode ? 'Soumission' : 'Appel de service'} {d.numero && <span className="muted" style={{fontSize:15}}>{d.numero}</span>}</h2>
      <button className="btn btn-sm" onClick={()=>{ if(!d.nom && !d.lignes.length || confirm('Commencer un nouveau document ? Ce qui n\'est pas enregistré sera perdu.')) setD(docVide()); }}>+ Nouvelle</button>
    </div>
    {!soumMode && <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      {DOC_TYPES.map(([k,l])=><button key={k} className={'btn btn-sm'+(d.type===k?' btn-p':'')} onClick={()=>maj({type:k})}>{l}</button>)}
    </div>}

    <div className="card" style={{display:'grid',gap:6,marginBottom:10}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:6}}>
        {champ('nom','Nom du client')}{champ('tel','Téléphone')}{champ('courriel','Courriel')}{champ('titre','Titre du projet (ex. Borne Flo X3)')}
      </div>
      <ChampAdresse value={d.adresse} onChange={a=>maj({adresse:a})} placeholder="Adresse"/>
      {d.type==='Soumission' && <ChoixEvenementSoumission toast={toast} onChoix={(ev, calId)=>{ const i = infosEvenement(ev);
        setD(o=>({...o, nom:o.nom||i.nom, tel:o.tel||i.tel, courriel:o.courriel||i.courriel, adresse:o.adresse||i.adresse, titre:o.titre||i.titre, travaux:o.travaux||i.travaux, evenement:{id:ev.id, calId, titre:ev.summary||''}}));
        toast && toast('Client pris dans l\'agenda'); }}/>}
      {d.evenement && <div className="muted" style={{fontSize:12}}>📅 Lié à « {d.evenement.titre} » (agenda Soumission) — acceptée, il ira dans En Attente.</div>}
      <textarea value={d.travaux} onChange={e=>maj({travaux:e.target.value})} rows={d.travaux && d.travaux.length>160 ? 5 : 2} placeholder="Travaux…" style={{resize:'vertical',fontFamily:'inherit'}}/>
      {d.dossier && <div><span className="muted" style={{fontSize:12}}>PDF et photos du client :</span><SoumPhotos dossier={d.dossier}/></div>}
    </div>

    {d.type==='Soumission' && <div className="card" style={{marginBottom:10}}>
      <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',marginBottom:6}}>
        <b style={{fontSize:13.5}}>⚡ Soumission rapide</b>
        <select value={d.typeProjet} onChange={e=>maj({typeProjet:e.target.value})} style={{marginLeft:'auto'}}><option value="">Type de projet…</option>{TYPES_PROJET.map(t=><option key={t}>{t}</option>)}</select>
      </div>
      {modeles.length ? <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
        {modeles.map(m=><span key={m.row} style={{display:'inline-flex'}}>
          <button className={'btn btn-sm'+(m.type && m.type===d.typeProjet?' btn-p':'')} title={(m.type?m.type+' · ':'')+((m.d.lignes||[]).length)+' article(s)'} onClick={()=>appliquerModele(m)}>{m.nom}</button>
          <button className="btn btn-sm" title="Enlever ce modèle" style={{padding:'0 6px',opacity:.5}} onClick={async()=>{ if(!confirm('Enlever le modèle « '+m.nom+' » ?')) return; try{ await M.enlever(m); }catch(e){ toast&&toast('Erreur : '+apiErrMsg(e)); } }}>×</button>
        </span>)}
      </div> : <div className="muted" style={{fontSize:12}}>Pas encore de modèle. Prépare une soumission type (ex. une borne : heures, déplacement, fil, disjoncteur…), puis « Garder comme modèle ». La prochaine fois, un clic remplit tout.</div>}
      <CalculRapide C={C} d={d} setD={setD} toast={toast} onRempli={voirApercu}/>
      <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',marginTop:8}}>
        {nomModele===null ? <button className="btn btn-sm" disabled={!d.lignes.some(l=>cvNum(l.qte)) && !d.forfait && !d.jours.some(j=>cvNum(j.sa01))} onClick={()=>setNomModele(d.typeProjet ? d.typeProjet+(d.titre?' — '+d.titre:'') : d.titre||'')}>💾 Garder comme modèle</button>
        : <><input autoFocus value={nomModele} onChange={e=>setNomModele(e.target.value)} placeholder="Nom du modèle (ex. Borne 48 A — 15 m)" style={{flex:'1 1 220px'}}/>
          <button className="btn btn-sm btn-p" disabled={!nomModele.trim()} onClick={async()=>{ try{ await M.garder(nomModele.trim(), d.typeProjet, d); toast&&toast('Modèle gardé'); setNomModele(null); }catch(e){ toast&&toast('Erreur : '+apiErrMsg(e)); } }}>Garder</button>
          <button className="btn btn-sm" onClick={()=>setNomModele(null)}>Annuler</button></>}
      </div>
    </div>}

    <div className="card" style={{marginBottom:10}}>
      <div style={{fontWeight:700,marginBottom:6}}>Heures</div>
      {d.jours.map((j,i)=><div key={i} style={{display:'flex',gap:6,alignItems:'center',marginBottom:4,flexWrap:'wrap'}}>
        <input type="date" value={j.date} onChange={e=>maj({jours:d.jours.map((x,k)=>k===i?{...x,date:e.target.value}:x)})} style={{width:150}}/>
        <label className="muted" style={{fontSize:12}}>SA01</label><input value={j.sa01} inputMode="decimal" onChange={e=>maj({jours:d.jours.map((x,k)=>k===i?{...x,sa01:e.target.value}:x)})} placeholder="h" style={{width:60}}/>
        <label className="muted" style={{fontSize:12}}>SA02</label><input value={j.sa02} inputMode="decimal" onChange={e=>maj({jours:d.jours.map((x,k)=>k===i?{...x,sa02:e.target.value}:x)})} placeholder="h" style={{width:60}}/>
        {d.jours.length>1 && <button className="btn btn-sm" onClick={()=>maj({jours:d.jours.filter((x,k)=>k!==i)})}>✕</button>}
      </div>)}
      <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginTop:6}}>
        <button className="btn btn-sm" onClick={()=>maj({jours:[...d.jours,{date:'',sa01:'',sa02:''}]})}>+ Une date</button>
        <label style={{display:'flex',gap:4,alignItems:'center',fontSize:13}}><input type="checkbox" checked={d.depl} onChange={e=>maj({depl:e.target.checked})}/> Déplacement</label>
        <label style={{display:'flex',gap:4,alignItems:'center',fontSize:13}}><input type="checkbox" checked={d.quin} onChange={e=>maj({quin:e.target.checked})}/> Quincaillerie</label>
        {prix && <label style={{display:'flex',gap:4,alignItems:'center',fontSize:13}}>Prix forfaitaire <input value={d.forfait} inputMode="decimal" onChange={e=>maj({forfait:e.target.value})} placeholder="$" style={{width:90}}/></label>}
        {prix && <button className="btn btn-sm" onClick={()=>setTaux(!taux)}>⚙ Taux</button>}
      </div>
      {prix && taux && <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8,padding:8,background:'var(--bg3)',borderRadius:8,fontSize:12.5}}>
        {[['SA01','Compagnon ($/h)'],['SA02','Apprenti ($/h)'],['DEPL','Déplacement ($)'],['QUIN','Quincaillerie ($)']].map(([k,l])=><label key={k} style={{display:'flex',gap:4,alignItems:'center'}}>{l}
          <input key={k+(C.prixDe(k)||'')} defaultValue={C.prixDe(k)!=null?C.prixDe(k):''} inputMode="decimal" style={{width:70}} onBlur={async e=>{ const v=e.target.value.trim().replace(',','.'); if(v===String(C.prixDe(k)!=null?C.prixDe(k):'')) return; try{ await C.majPrix(k, v); toast&&toast('Taux enregistré'); }catch(er){ toast&&toast('Erreur : '+apiErrMsg(er)); } }}/></label>)}
        <span className="muted" style={{fontSize:11.5,width:'100%'}}>Gardés dans « La mémoire — Jobs › Prix » (toi seulement). Vide = prix de ta dernière facture.</span>
      </div>}
    </div>

    {d.type!=='Facture' && <PlanTravaux d={d} setD={setD} toast={toast}/>}

    <div className="card" style={{marginBottom:10}}>
      <div style={{fontWeight:700,marginBottom:6}}>Matériel {choisies.length>0 && <span className="muted" style={{fontWeight:400}}>· {choisies.length} article{choisies.length>1?'s':''}</span>}</div>
      {choisies.length>0 && <div style={{marginBottom:8,border:'1px solid var(--border2)',borderRadius:8}}>
        {choisies.map(l=><div key={l.code} style={{display:'flex',gap:6,alignItems:'center',padding:'5px 8px',borderBottom:'1px solid var(--border)',fontSize:13,flexWrap:'wrap'}}>
          <b style={{minWidth:90}}>{l.code}</b><span style={{flex:'1 1 140px'}}>{l.desc}</span>
          <input value={l.qte} inputMode="decimal" onChange={e=>changerQte(l, 0, e.target.value)} style={{width:56,textAlign:'right'}}/><span className="muted" style={{fontSize:11.5}}>{l.unite}</span>
          {prix && <input value={l.prix} inputMode="decimal" placeholder={C.prixDe(l.code, l.unite)!=null ? String(C.prixDe(l.code, l.unite)) : 'prix'} onChange={e=>setD(x=>({...x, lignes:x.lignes.map(y=>y.code===l.code?{...y,prix:e.target.value}:y)}))} style={{width:70,textAlign:'right'}} title="Prix unitaire (vide = ton prix habituel)"/>}
          {prix && <span style={{width:80,textAlign:'right'}}>{cvMoney(calc.px(l.code,l)*(cvNum(l.qte)||0))}</span>}
          <button className="btn btn-sm" onClick={()=>setD(x=>({...x, lignes:x.lignes.filter(y=>y.code!==l.code)}))}>✕</button>
        </div>)}
      </div>}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
        <button className={'btn btn-sm'+(!cat?' btn-p':'')} onClick={()=>setCat('')}>Tous</button>
        {C.cats.filter(c=>c!=='DIVERS').map(c=><button key={c} className={'btn btn-sm'+(cat===c?' btn-p':'')} onClick={()=>setCat(c)}>{c}</button>)}
      </div>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Chercher un article (code ou description)…" style={{width:'100%',boxSizing:'border-box',marginBottom:6}}/>
      <div style={{maxHeight:360,overflowY:'auto',border:'1px solid var(--border2)',borderRadius:8}}>
        {produits.map(p=>{ const n=qteDe(p.code); return <div key={p.cat+'|'+p.code} style={{display:'flex',gap:6,alignItems:'center',padding:'5px 8px',borderBottom:'1px solid var(--border)',fontSize:13,background:n?'var(--bg3)':undefined}}>
          <b style={{minWidth:100}}>{p.code}</b><span style={{flex:1}} className={n?'':'muted'}>{p.desc}</span>
          <button className="btn btn-sm" onClick={()=>changerQte(p,-1)} disabled={!n} style={{width:32}}>−</button>
          <span style={{width:28,textAlign:'center',fontWeight:700}}>{n||''}</span>
          <button className="btn btn-sm" onClick={()=>changerQte(p,1)} style={{width:32}}>+</button>
        </div>; })}
        {C.lu && !produits.length && <div className="muted" style={{padding:10,fontSize:13}}>Aucun article. Ajoute-le dans Produits.</div>}
        {!C.lu && <div className="muted" style={{padding:10}}>Chargement…</div>}
      </div>
    </div>

    <div className="card" style={{marginBottom:10}}>
      <textarea value={d.remarques} onChange={e=>maj({remarques:e.target.value})} rows={2} placeholder="Remarques…" style={{width:'100%',boxSizing:'border-box',resize:'vertical',fontFamily:'inherit'}}/>
      {prix && <div style={{marginTop:8,fontSize:13.5,display:'grid',gap:2,justifyItems:'end'}}>
        {!(d.forfait!=='' && d.forfait!=null) && <>
          {calc.mo>0 && <div>Main-d'œuvre ({calc.h1} h SA01{calc.h2?' + '+calc.h2+' h SA02':''}) : <b>{cvMoney(calc.mo)}</b></div>}
          {(calc.h1+calc.h2)>0 && !calc.mo && <div className="muted" style={{fontSize:12}}>Entre tes taux horaires dans ⚙ Taux.</div>}
          {calc.mat>0 && <div>Matériel : <b>{cvMoney(calc.mat)}</b></div>}
          {calc.depl>0 && <div>Déplacement : <b>{cvMoney(calc.depl)}</b></div>}
          {calc.quin>0 && <div>Quincaillerie : <b>{cvMoney(calc.quin)}</b></div>}
        </>}
        <div>Avant taxes : <b>{cvMoney(calc.st)}</b> <span className="muted">· TPS {cvMoney(calc.tps)} · TVQ {cvMoney(calc.tvq)}</span></div>
        <div style={{fontSize:16}}>Total : <b>{cvMoney(calc.total)}</b></div>
      </div>}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:10,justifyContent:'flex-end'}}>
        <button className="btn btn-sm btn-p" disabled={!!occupe} onClick={enregistrer}>{occupe==='save'?'Enregistrement…':'💾 Enregistrer'}</button>
        <button className="btn btn-sm" onClick={()=>apercu ? setApercu(false) : voirApercu()}>{apercu ? '🙈 Cacher l\'aperçu' : '👁 Aperçu PDF'}</button>
        <button className="btn btn-sm" disabled={!!occupe} onClick={imprimer}>🖨️ PDF / Imprimer</button>
        <button className="btn btn-sm" disabled={!!occupe} onClick={courriel}>📧 Courriel (Gmail)</button>
      </div>
      {d.type==='Facture' && <div className="muted" style={{fontSize:11.5,marginTop:6,textAlign:'right'}}>Facture = brouillon : rentre-la dans ton logiciel de facturation (numéro officiel).</div>}
    </div>

    {apercu && <ApercuPdf d={d} prixDe={C.prixDe} onImprimer={imprimer} onFermer={()=>setApercu(false)}/>}

    {D.docs.some(x=>!soumMode || x.type==='Soumission') && <div className="card">
      <div style={{fontWeight:700,marginBottom:6}}>{soumMode ? 'Dernières soumissions faites ici' : 'Derniers documents'}</div>
      {D.docs.filter(x=>!soumMode || x.type==='Soumission').slice(0,15).map(x=><div key={x.numero} onClick={()=>ouvrir(x)} style={{display:'flex',justifyContent:'space-between',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:13,cursor:'pointer'}}>
        <span><b>{x.numero}</b> · {x.type} · {x.client||'—'}{x.titre && <span className="muted"> · {x.titre}</span>}</span>
        <span className="muted">{cvFmtDay(x.date)}{x.total!=null && <> · {cvMoney(x.total)}</>}</span>
      </div>)}
    </div>}
  </div>;
}

// ── UI: COMMANDES — bons de commande aux fournisseurs (Dubo Saint-Jean, Lumen…) ────────────────
// Choisis la job (passages des 2 prochaines semaines) ou Shop / Camion, qui va chercher, les articles du catalogue,
// puis 📧 : Gmail s'ouvre avec la commande prête pour le comptoir. La référence (« CRS FINITION CURPAS P03056 »)
// revient sur la facture du fournisseur, et La mémoire — Achats l'associe toute seule à la job.
// Enregistré dans La mémoire — Jobs › « Bons de commande » (sans prix) ; la commande du passage passe à ✅ Placée
// (ligne 📦 Commande dans l'événement, liste avant les infos du client), comme les boutons de l'Agenda.
const BC_ENTETE = ['Numéro','Date','Fournisseur','Courriel','Référence','Job','Passage','Employé','Mode','Pour le','Articles','Note','Statut','Lien événement'];
const BC_COURRIELS = {Dubo:'stjean@dubo.qc.ca'};
// Venu du Tableau de bord (📦 Commander sur un passage) : {id, day, title} — CommandesView ouvre le bon déjà rempli.
let BC_PREFILL = null;
// Référence = le titre de l'événement, sans les initiales de l'équipe (ex. « CRS FINITION CURPAS P03056 MC » → « CRS FINITION CURPAS P03056 »)
function bcRefTitre(e){ return String(e.title||'').split(/\s+/).filter(t=>!(CREW_INITIALS[t] && t===t.toUpperCase())).join(' ').trim().toUpperCase(); }
function bcCourriel(f){ try{ const m = JSON.parse(localStorage.getItem('bc_courriels')||'{}'); return m[f] || BC_COURRIELS[f] || ''; }catch(e){ return BC_COURRIELS[f]||''; } }
function bcRetenirCourriel(f, c){ try{ const m = JSON.parse(localStorage.getItem('bc_courriels')||'{}'); m[f]=c; localStorage.setItem('bc_courriels', JSON.stringify(m)); }catch(e){} }
// v118 : contacts des fournisseurs (représentant, courriel pour les commandes et demandes de prix) — La mémoire — Jobs › « Contacts fournisseurs » (privé, pas dans le code)
const CF_ENTETE = ['Fournisseur','Nom','Rôle','Courriel commandes','Cellulaire','Succursale','Adresse de livraison','Note','Mis à jour'];
function useContactsFournisseurs(cfg){
  const [etat,setEtat]=useState({lu:false, map:{}});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{

// Onglet « Commandes fournisseurs » du registre des jobs, rempli par commandes.gs (La mémoire), colonnes A à J.
// Le CRM écrit seulement K (Job) et L (Attitrée le).
function useCommandesFournisseurs(cfg, refreshKey){
  const [etat,setEtat]=useState({pret:false, absent:false, liste:[]});
  const id = cfg.memoireJobsSpreadsheetId;
  const lire = useCallback(async(force)=>{
    if(!id) return;
    try{ const r = await lireCache(id, qSheet('Commandes fournisseurs')+'!A1:L', force);
      setEtat({pret:true, absent:false, liste:(r.result.values||[]).slice(1).map((x,i)=>({row:i+2, cle:x[0]||'', fournisseur:x[1]||'', source:x[2]||'', date:x[3]||'', no:x[4]||'', ref:x[5]||'',
        articles:String(x[6]||'').split('\n').map(t=>t.trim()).filter(Boolean), st:cvNum(x[7]), ramassage:x[8]||'', lien:x[9]||'', job:cvDest(x[10]||''), le:x[11]||''})).filter(c=>c.cle)
        .sort((a,b)=>b.date.localeCompare(a.date))}); }
    catch(e){ setEtat({pret:true, absent:true, liste:[]}); }
  },[id]);
  useEffect(()=>{ lire(!!refreshKey); },[lire, refreshKey]);
  const attitrer = async (c, job) => {
    const le = job ? cvDay(new Date().toISOString()) : '';
    setEtat(s=>({...s, liste:s.liste.map(x=>x.cle===c.cle?{...x, job, le}:x)}));
    await window.gapi.client.sheets.spreadsheets.values.update({spreadsheetId:id, range:qSheet('Commandes fournisseurs')+'!K'+c.row+':L'+c.row, valueInputOption:'RAW', resource:{values:[[job, le]]}});
  };
  return {...etat, lire, attitrer};
}
// Job proposée d'après la référence : camion / entrepôt / shop, sinon le PO, sinon le nom d'une job active à ±30 jours. Une seule, sinon rien.
function cmdProposer(ref, date, clients){
  const r = String(ref||''); if(!r) return '';
  const cam = r.match(/\bcamion\s*#?\s*0?(7|14|25)\b/i); if(cam) return 'Camion '+cam[1];
  if(/\b(entrep[oô]t|ent|inventaire|stock|shop|atelier)\b/i.test(r)) return 'Entrepôt';
  const po = cvPO(r), nr = cvNorm(r), t = date ? new Date(date+'T12:00:00').getTime() : null;
  const parPO = [], parNom = [];
  Object.values(clients||{}).forEach(c=>c.jobs.forEach(j=>{
    if(po && j.po===po) parPO.push(cvJobCle(c,j));
    else if(cvNorm(j.name).length>=4 && nr.includes(cvNorm(j.name)) && (!t || j.events.some(e=>Math.abs(new Date(e.day+'T12:00:00').getTime()-t)<=30*864e5))) parNom.push(cvJobCle(c,j));
  }));
  const l = [...new Set(parPO.length ? parPO : parNom)];
  return l.length===1 ? l[0] : '';
}
function cmdJobDe(label, clients){
  for(const c of Object.values(clients||{})) for(const j of c.jobs) if(cvJobCle(c,j)===label) return {c, j};
  return null;
}

// Lecture seule. Assemble, par client puis par job :
//  - les événements de l'agenda (dates, appel de service, OT, facture du bloc « Suivi »)
//  - le registre « La mémoire — Jobs » (montant du PO, client, dossier Drive), rempli par La mémoire.
const CLIENT_CODES = {
  CRS:'Cuisines Rive-Sud', PAY:'Payne Construction', PY:'Payne Construction', ASC:'Ascension', SAR:'Saran Construction',
  GOU:'Goulet', '5PIL':'Cinq Piliers', BOM:'Bomont', JOY:'JOY', GGP:'GGP', RROY:'RROY', DUL:'DUL'
};
const CLIENT_CONTACT = {CRS:'Jonathan Asselin', PAY:'Danny', ASC:'Cédric Gagnon'};
const CREW_INITIALS = {PB:'Philippe Bernier', MC:'Maude Charest', AU:'Adèle Underhill', DW:'Daniel Wenning', BP:'Brandon Pereira', AD:'AD (ancien employé)'};
const CREW_COLORS = {'3':'Philippe Bernier','4':'Daniel Wenning','5':'Maude Charest','9':'Brandon Pereira'};
// Équipes (camions) par couleur d'événement — ordre d'affichage au Tableau de bord : Dan (flamant rose), Brandon (myrtille), Phil (raisin), puis les autres.
const EQUIPES_ORDRE = ['4','9','3','5'];
const EQUIPE_SURNOM = {'Daniel Wenning':'Dan','Philippe Bernier':'Phil'};
function equipeDe(e){ const id = e && (e.couleurId || couleurIdEvenement(e)); return id && CREW_COLORS[id] ? id : 'autre'; }
function equipeNom(k){ if(k==='autre') return 'À attitrer'; const n = CREW_COLORS[k]||''; return EQUIPE_SURNOM[n] || n.split(' ')[0]; }
function equipeCouleur(k){ return k==='autre' ? 'var(--muted)' : (GCAL_COLOR_MAP[k]||'var(--muted)'); }
function equipeRang(k){ const i = EQUIPES_ORDRE.indexOf(k); return i<0 ? (k==='autre' ? 99 : 50) : i; }
const PHASES = [['ROUGH','ROUGH'],['FINITION','FINITION'],['FINALE','FINITION'],['SERV','SERV'],['SERVICE','SERV'],['AJUSTEMENTS','AJUST'],['AJUSTEMENT','AJUST'],['RAPUP','RAPUP'],['DÉMO','DÉMO'],['DEMO','DÉMO']];
const CLIENT_IGNORE = /^(off\b|mon plan|plan de la semaine|topo|ma journée|congé|vacances|prep|préparation)|(^|[\s\-–(])(rdv|rendez[\s-]?vous|r\.d\.v\.?)(?=$|[\s\-–).,:])/i;   // v160 : « OFF Adèle », « OFF WILL » = congés, pas des jobs
const CREW_CAL = 'saranelectrique@gmail.com';
// Calendrier « En Attente » : jobs à faire mais pas encore cédulées (la date est un samedi provisoire).
const EN_ATTENTE_CAL = 'c_7d3dd0732b25a3afd30d0f2c453bef2d31a41b08a6d7112b08accea16ff49daf@group.calendar.google.com';

function cvNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function cvNum(v){ const n=parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isNaN(n)?null:n; }
function cvMoney(n){ return n==null?'—':n.toLocaleString('fr-CA',{style:'currency',currency:'CAD'}); }
function cvDay(iso){ return String(iso||'').slice(0,10); }
function cvFmtDay(d){ if(!d) return '—'; const [y,m,j]=d.split('-'); const M=['','janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.']; return (+j)+' '+M[+m]; }
function cvTitleCase(s){ return s.toLowerCase().replace(/(^|[\s\-'’(])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase()); }
function cvSuivi(desc, label){
  const m = String(desc||'').replace(/<[^>]+>/g,'\n').match(new RegExp(label+'\\s*:\\s*([^\\n]*)','i'));
  const v = m ? m[1].trim() : '';
  if(/^\*\*/.test(v)) return '**';            // « ** » = pas à facturer (marqué dans Suivi Travaux)
  return /\d/.test(v) ? v.replace(/[^\d\-– ,]/g,'').trim() : '';
}
// Numéros de job : P0xxxx (PO de CRS) ou nos propres numéros « PAY-012 », « ASC-004 », « PART-031 ».
const CV_NOJOB_RE = /\b(PAY|PY|ASC|SAR|GOU|5PIL|BOM|JOY|GGP|RROY|PART|SE)\s?-\s?(\d{3})\b/i;
function cvPO(text){
  const t = String(text||'');
  const n = t.match(CV_NOJOB_RE);
  if(n) return (n[1].toUpperCase()==='PY'?'PAY':n[1].toUpperCase())+'-'+n[2];
  const m = t.match(/\bP[O0]?\s?0?(\d{4})\b/i);
  return m ? 'P0'+m[1] : '';
}
// Décortique le titre d'un événement : code client, phase, PO, initiales, nom.
function cvParseEvent(e){
  const title = String(e.title||'').trim();
  const toks = title.replace(new RegExp(CV_NOJOB_RE.source,'ig'),' ').replace(/[()]/g,' ').split(/[\s\-–\/,+&]+/).filter(Boolean);
  let code='', phase='', initials=[], nameParts=[], apresServ=false, servType='';
  toks.forEach(t=>{
    const T=t.toUpperCase();
    if(apresServ && !servType && SERV_TYPES.includes(T)){ servType=T; return; }   // « SERV PRISE … » : PRISE n'est pas le nom
    apresServ = T==='SERV' || T==='SERVICE';
    if(!code && T==='PAYNE'){ code = 'PAY'; return; }                 // « Payne Edison » = PAY
    if(!code && CLIENT_CODES[T]){ code = (T==='PY'?'PAY':T); return; }
    const ph = PHASES.find(p=>p[0]===T); if(ph){ if(!phase) phase=ph[1]; return; }
    if(CREW_INITIALS[T] && t===T){ initials.push(T); return; }
    if(/^P[O0]?0?\d{4}$/i.test(T)) return;
    if(T==='CUI') return;
    nameParts.push(t);
  });
  while(nameParts.length>1 && CREW_INITIALS[nameParts[nameParts.length-1].toUpperCase().replace(/\.$/,'')]) initials.push(nameParts.pop().toUpperCase().replace(/\.$/,''));   // « Bourne Au » à la fin = initiales
  const po = cvPO(title) || cvPO(e.description);
  const name = cvTitleCase(nameParts.join(' ').trim());
  const crew = new Set(initials.map(i=>CREW_INITIALS[i]));
  if(CREW_COLORS[e.colorId]) crew.add(CREW_COLORS[e.colorId]);
  return {
    code, phase: phase || (code?'SERV':''), servType, po, name, key: cvNorm(name), crew:[...crew],
    as: cvSuivi(e.description,'Appel de service'), ot: cvSuivi(e.description,'Ordre de travail'), fac: cvSuivi(e.description,'Facture'),
    attente: e.calendarId===EN_ATTENTE_CAL, id: e.id||'', calId: e.calendarId||'', day: cvDay(e.start), start: e.start||'', end: e.end||'', allDay: !!e.allDay, location: e.location||'', title, attachments: e.attachments||[], lien: e.htmlLink||'', colorId: e.colorId||'', calColor: e.calColor||'', couleurId: couleurIdEvenement(e)
  };
}

// Dernières données lues : l'onglet Clients s'affiche tout de suite au retour, puis se met à jour en arrière-plan.
const CV_CACHE = {};
function useClientsData(cfg, refreshKey){
  const cle = [cfg.calendarIds, cfg.memoireJobsSpreadsheetId, cfg.memoireFacturesSpreadsheetId, cfg.memoireAppelsSpreadsheetId, cfg.memoireAchatsSpreadsheetId].join('|');
  const [state,setState]=useState(()=> CV_CACHE[cle] ? {...CV_CACHE[cle], loading:false, maj:true} : {loading:true, err:'', events:[], registry:[], factures:{}, appels:{}});
  // « force » change seulement avec ⟳ Refresh ou après une modification (tick) — pas en changeant d'onglet.
  const force = (String(refreshKey).includes('|') ? String(refreshKey) : refreshKey+'|0').replace(/\|[a-z]?/,'|').replace(/\|$/,'|0');
  useEffect(()=>{
    let alive=true;
    const c = CV_CACHE[cle];
    if(c && c.force===force && Date.now()-c.t < 120000){ setState({...c, loading:false, maj:false}); return; }   // lu il y a moins de 2 min
    (async()=>{
      setState(s=> CV_CACHE[cle] ? {...s, maj:true} : {...s,loading:true,err:''});
      try{
        const now=new Date();
        const min=new Date(now); min.setDate(min.getDate()-150);
        const max=new Date(now); max.setDate(max.getDate()+120);
        const calIds=(cfg.calendarIds||'').split(',').map(s=>s.trim()).filter(Boolean);
        if(!calIds.includes(EN_ATTENTE_CAL)) calIds.push(EN_ATTENTE_CAL); // toujours lu ici, même s'il est caché dans l'agenda
        // Chaque source a 25 s max : si une bloque, on le dit au lieu de tourner sans fin.
        const lent = [];
        const delai = (p, nom, vide) => Promise.race([Promise.resolve(p), new Promise(r=>setTimeout(()=>{ lent.push(nom); r(vide); }, 25000))]);
        const readSheet = (id, nom, range) => id
          ? delai(Promise.resolve(window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId:id, range:range||'A1:Z'})).then(r=>r.result.values||[], ()=>[]), nom, [])
          : Promise.resolve([]);
        const [events, regRows, facRows, apRows, coRows, acRows, liRows, flRows, arRows, doRows, fiRows, soRows, gcRows, paRows] = await Promise.all([
          delai(listCalendarEventsRange(calIds, min.toISOString(), max.toISOString()), 'agenda', []),
          readSheet(cfg.memoireJobsSpreadsheetId, 'registre des jobs'),
          readSheet(cfg.memoireFacturesSpreadsheetId, 'registre des factures'),
          readSheet(cfg.memoireAppelsSpreadsheetId, 'registre des appels'),
          readSheet(cfg.memoireJobsSpreadsheetId, 'courriels', 'Courriels!A1:J'),
          readSheet(cfg.memoireAchatsSpreadsheetId, 'achats', 'A1:L'),
          readSheet(cfg.memoireAchatsSpreadsheetId, 'articles', 'Lignes!A1:F'),
          readSheet(cfg.memoireFacturesSpreadsheetId, 'articles facturés', 'Lignes!A1:F'),
          readSheet(cfg.memoireJobsSpreadsheetId, 'archives', 'Archives!A1:C'),
          readSheet(cfg.memoireAchatsSpreadsheetId, 'soumissions', 'Documents!A1:J'),
          readSheet(cfg.memoireJobsSpreadsheetId, 'fiches', 'Fiches!A1:L'),
          readSheet(cfg.memoireJobsSpreadsheetId, 'soumissions envoyées', 'Soumissions!A1:M'),
          readSheet(cfg.memoireJobsSpreadsheetId, 'clients du logiciel comptable', "'Clients GCMEQ'!A1:K"),
          readSheet(cfg.memoireFacturesSpreadsheetId, 'paiements', 'Paiements!A1:L')
        ]);
        const gcmeq = gcRows.slice(1).filter(r=>r[0]);   // v170 : liste d'adresses du logiciel comptable (GCMEQ)
        // v151 : fiches clients/jobs (onglet privé « Fiches ») et soumissions/OT envoyés (pour le Répertoire)
        const fiches = lireFiches(fiRows);
        const soumissions = soRows.slice(1).filter(r=>r[3]||r[0]).map(r=>({cle:r[0]||'', type:r[1]||'', date:r[2]||'', no:r[3]||'', client:r[4]||'', courriel:r[5]||'', sujet:r[6]||'', extrait:r[7]||'', montant:cvNum(r[8]), pdf:r[9]||'', lien:r[10]||'', statut:r[12]||''}));
        // Soumissions, relevés de compte, confirmations des fournisseurs (onglet « Documents » du registre des achats)
        const documents = doRows.slice(1).filter(r=>r[0]).map(r=>({fournisseur:r[0], type:r[1]||'', num:r[2]||'', date:r[3]||'', ref:r[4]||'', total:cvNum(r[5]), pdf:r[6]||'', fichier:r[7]||''}));
        // Fils de courriels par PO (onglet « Courriels », rempli par Apps Script)

// Mots significatifs d'un nom de job (pour savoir si deux noms parlent de la même job).
function cvMemeJob(a, b){ const A=[...cvMotsNom(a)], B=[...cvMotsNom(b)]; if(!A.length || !B.length) return true;   // nom trop vague : on ne conclut pas
  return A.some(x=>B.some(y=>x===y || (x.length>=5 && y.length>=5 && (x.includes(y) || y.includes(x))))); }
function cvMotsNom(n){ return new Set(String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/(\d)([A-Z])/g,'$1 $2').split(/[^A-Z0-9]+/)
  .filter(m=>m.length>=4 && !/^(ROUGH|FINITION|FINALE|SERV|SERVICE|AJUSTEMENTS?|RAPUP|CUISINE|SALLE|BAIN|BORNE|EXTRA|MAISON|ENTREE|PHIL)$/.test(m))); }
// Regroupe les événements en clients → jobs.
function cvBuildClients(events, registry, factures){
  factures = factures || {};
  const today = cvDay(new Date().toISOString());
  const regByPO = {}; registry.forEach(r=>{ if(r.po) regByPO[r.po]=r; });
  const jobs = {};
  const getJob = (id, base)=> jobs[id] || (jobs[id] = {id, events:[], ...base});
  const partNom = {};
  events.forEach(raw=>{
    if(CLIENT_IGNORE.test(String(raw.title||'').trim())) return;
    const p = cvParseEvent(raw);
    if(p.code){
      let po = p.po;
      if(!po && p.key){
        // Pas de PO dans le titre : on cherche une job du même client avec le même nom.
        const cands = registry.filter(r=>r.code===p.code && r.key===p.key);
        if(cands.length===1) po = cands[0].po;
        else if(cands.length>1){
          const loc = cvNorm(p.location);
          const byLoc = cands.find(c=>c.adresse && loc.includes(cvNorm(c.adresse).slice(0,8)));
          po = (byLoc||cands[0]).po;
        }
      }
      const id = po ? p.code+'|'+po : p.code+'|'+(p.key || cvNorm(p.location) || p.title);
      const reg = po ? regByPO[po] : null;
      const j = getJob(id, {client:p.code, po, name: reg ? reg.nom : (p.name || p.location || p.title), reg});
      j.events.push(p);
    } else {
      if(raw.calendarId !== CREW_CAL && raw.calendarId !== EN_ATTENTE_CAL) return; // particuliers : calendrier de l'équipe + En Attente
      let k = p.po || cvNorm(p.location).slice(0,24) || p.key || cvNorm(p.title);
      const pn = !p.po && p.key && partNom[p.key];                                    // v149 : même nom de particulier, une des deux sans adresse = même job
      if(pn && pn.k!==k && !jobs['PART|'+k] && (!pn.loc || !p.location)) k = pn.k;
      if(!p.po && p.key && !partNom[p.key]) partNom[p.key] = {k, loc:!!p.location};
      const reg = p.po ? regByPO[p.po] : null;
      const j = getJob('PART|'+k, {client:'PART', po:p.po||'', name: reg ? reg.nom : (p.name || p.title), reg});
      j.events.push(p);
    }
  });
  ficheAppliquerJobs(jobs, registry.__fiches, regByPO);   // v151 : jobs regroupées / renommées dans le Répertoire
  // Facture inscrite sur plus d'une job = à vérifier.
  const facJobs = {};
  Object.values(jobs).forEach(j=>j.events.forEach(e=>String(e.fac).split(/[\s,–-]+/).filter(t=>/\d/.test(t)).forEach(f=>{ (facJobs[f]=facJobs[f]||new Set()).add(j.id); })));
  Object.values(jobs).forEach(j=>{
    j.events.sort((a,b)=>a.day.localeCompare(b.day));
    const ro=j.events.filter(e=>e.phase==='ROUGH'), fi=j.events.filter(e=>e.phase==='FINITION');
    j.rough = ro[0] ? ro[0].day : ''; j.fin = fi.length ? fi[fi.length-1].day : '';
    // Les passages « En Attente » ont une date provisoire : ils ne comptent pas pour les dates ni le statut,
    // mais une job qui en a un n'est pas terminée.
    const reels = j.events.filter(e=>!e.attente);
    j.attente = j.events.filter(e=>e.attente);
    const base = reels.length ? reels : j.events;
    j.first = base[0].day; j.last = base[base.length-1].day;
    j.status = j.last < today ? 'done' : (j.first <= today ? 'cours' : 'avenir');
    // Un passage dans l'agenda En Attente = encore à faire, pas encore cédulé : la job est « À venir » (partout).
    if(j.attente.length && (!reels.length || j.status==='done')) j.status = 'avenir';
    j.etatClient = j.status;
    const fromPO = j.po ? Object.values(factures).filter(f=>f.po===j.po).map(f=>f.num) : [];
    j.factures = [...new Set([...j.events.flatMap(e=>String(e.fac).split(/[\s,–-]+/).filter(t=>/\d/.test(t))), ...fromPO])].sort();
    j.billed = j.factures.reduce((t,f)=>t+((factures[f]&&!factures[f].annulee&&factures[f].ht)||0),0);
    j.crew = [...new Set(j.events.flatMap(e=>e.crew))];
    j.address = (j.reg && [j.reg.adresse,j.reg.ville].filter(Boolean).join(', ')) || (j.events.find(e=>e.location)||{}).location || '';
    j.missing = cvVisites(j).filter(v=>v.faite && !v.facturee).length;   // une facture par visite
    // Facture sur deux jobs : seulement si les jobs n'ont AUCUN mot de nom en commun
    // (« CRS ROUGH AUBIN » et « CRS aubin », c'est la même job, écrite autrement).
    j.dupAvec = {};
    j.dupFac = j.factures.filter(f=>{ if(!facJobs[f] || facJobs[f].size<2) return false;
      const autres = [...facJobs[f]].filter(id=>id!==j.id).map(id=>jobs[id]).filter(Boolean).filter(o=>!cvMemeJob(o.name, j.name));
      if(autres.length) j.dupAvec[f] = autres.map(o=>(o.client!=='PART'?o.client+' ':'')+o.name);
      return autres.length>0; });
    j.flag = j.missing>0 || j.dupFac.length>0;
  });
  const clients = {};
  Object.values(jobs).forEach(j=>{
    const c = clients[j.client] || (clients[j.client] = {code:j.client, label: j.client==='PART' ? 'Particuliers' : (CLIENT_CODES[j.client]||j.client), contact: CLIENT_CONTACT[j.client]||'', jobs:[]});
    c.jobs.push(j);
  });
  Object.values(clients).forEach(c=>{
    c.jobs.sort((a,b)=>b.first.localeCompare(a.first));
    c.active = c.jobs.filter(j=>j.status!=='done').length;
    c.flags = c.jobs.filter(j=>j.flag).length;
    c.poTotal = c.jobs.reduce((t,j)=>t+((j.reg&&j.reg.ht)||0),0);
    c.billed = c.jobs.reduce((t,j)=>t+(j.billed||0),0);
    c.lastDay = c.jobs.reduce((m,j)=>j.last>m?j.last:m,'');
  });
  return clients;
}

// Visites d'une job : passages de la même phase collés (3 jours ou moins entre eux) = une visite = une facture.
// Ex. rough lundi + mardi = 1 visite ; finition 3 semaines plus tard = 1 autre ; un service ensuite = 1 autre.
function cvVisites(job){
  const out = [];
  job.events.filter(e=>!e.attente).slice().sort((a,b)=>a.day.localeCompare(b.day)).forEach(e=>{
    const ph = e.phase || 'SERV';
    const v = [...out].reverse().find(x=>x.phase===ph);
    if(v && (new Date(e.day+'T12:00:00')-new Date(v.events[v.events.length-1].day+'T12:00:00')) <= 3*864e5) v.events.push(e);
    else out.push({phase:ph, events:[e]});
  });
  const today = cvDay(new Date().toISOString());
  out.forEach(v=>{ v.debut=v.events[0].day; v.fin=v.events[v.events.length-1].day; v.faite = v.debut < today;
    v.fac = v.events.map(e=>e.fac).filter(Boolean); v.facturee = v.fac.length>0;
    v.label = v.phase.charAt(0)+v.phase.slice(1).toLowerCase()+' ('+cvFmtDay(v.debut)+(v.fin!==v.debut?'–'+cvFmtDay(v.fin):'')+')'; });
  return out;
}
// Ordres de travail d'une job : feuilles OT du registre (papier ou logiciel) rattachées à son PO,

function cvJobOTs(job, appels){

  const pn=(appels&&appels.parNumero)||{};

}

  return code+'-'+String(Math.max(0,...nums)+1).padStart(3,'0');

  });
  const utiliser = ()=>go(async()=>{
    const ancienReg = job.po && reg.find(r=>r.po===job.po);
    await cvRenommerPassages(job, job.po, cible, setEtat);

    {!job.po && <button className="btn btn-sm" onClick={()=>setMode('creer')}>＋ Créer le no de job ({no})</button>}
    {existants.length>0 && <button className="btn btn-sm" onClick={()=>setMode('utiliser')}>{job.po ? '🔗 Fusionner avec un autre no' : '🔗 Prendre un no existant'}</button>}
  </div>;
  return <div className="card" style={{padding:10,marginBottom:10,borderColor:'var(--accent)'}}>
    {mode==='creer' ? <>
      <div style={{fontWeight:800,marginBottom:6}}>Nouveau numéro : <span style={{color:'var(--accent)'}}>{no}</span></div>
      <div className="field"><label>Nom de la job</label><input value={nom} onChange={e=>setNom(e.target.value)}/></div>
      <div className="field"><label>Adresse</label><input value={adresse} onChange={e=>setAdresse(e.target.value)} placeholder="829 Riverside, Saint-Lambert"/></div>
      <div className="muted" style={{fontSize:12,margin:'4px 0 8px'}}>Le numéro sera ajouté au titre des {job.events.length} passage{job.events.length>1?'s':''} de cette job dans l'agenda.</div>
    </> : <>
      <div style={{fontWeight:800,marginBottom:6}}>{job.po ? 'Fusionner '+job.po+' avec :' : 'Cette job est en fait :'}</div>
      {Choix}
      <div className="muted" style={{fontSize:12,margin:'6px 0 8px'}}>{job.po ? 'Le numéro '+job.po+' sera remplacé par celui choisi dans tous ses passages, et marqué « fusionné » au registre.' : 'Le numéro choisi sera ajouté à ses '+job.events.length+' passages : les deux jobs n\'en feront plus qu\'une.'}</div>
    </>}
    <div style={{display:'flex',gap:6,alignItems:'center'}}>
      {mode==='creer'
        ? <button className="btn btn-sm btn-p" disabled={!!etat || !nom.trim()} onClick={creer}>Créer {no}</button>

      {etat && <span className="muted" style={{fontSize:12}}>{etat}</span>}
    </div>
  </div>;
}

// Archiver une job : elle disparaît des listes (onglet « Archives » du registre des jobs).
function CvArchiver({cfg, job, archives, onChanged}){
  const [busy,setBusy]=useState(false);
  const row = (archives||{})[job.id];
  const basculer = async ()=>{
    setBusy(true);
    try{
      const id = cfg.memoireJobsSpreadsheetId;
      if(row) await window.gapi.client.sheets.spreadsheets.values.clear({spreadsheetId:id, range:'Archives!A'+row+':C'+row});
      else {
        try{ await window.gapi.client.sheets.spreadsheets.values.get({spreadsheetId:id, range:'Archives!A1'}); }
        catch(e){ await ensureSheetsExist(id, [{name:'Archives', headers:['Job','Nom','Archivée le']}]); }
        await sheetsAppendRow(id, 'Archives', [job.id, (job.client!=='PART'?job.client+' ':'')+job.name, new Date().toLocaleDateString('fr-CA')]);
      }
      onChanged && onChanged();
    }catch(e){ alert('Impossible : '+apiErrMsg(e)); }
    setBusy(false);
  };
  return <button className="btn btn-sm" disabled={busy} onClick={basculer} style={{marginBottom:10}}>{busy?'…':row?'↩︎ Désarchiver':'🗄 Archiver'}</button>;
}

// Acheté (factures fournisseurs associées à la job) vs facturé (tes factures de la job), article par article.
const cvCode = c => String(c||'').toUpperCase().replace(/^[A-Z]{2,4}-(?=[A-Z0-9])/,'').replace(/[^A-Z0-9]/g,'');
function cvComparer(achats, mesLignes){
  const fact = mesLignes.filter(l=>!/^MO\b/.test(l.codes) && l.qte).map(l=>({...l, cles:l.codes.split(/\s+/).map(cvCode).filter(c=>c.length>=4), reste:l.qte}));
  const lignes = [];
  achats.forEach(a=>(a.articles||[]).filter(x=>x.code).forEach(x=>{
    const k = cvCode(x.code);
    const f = k.length>=4 && fact.find(l=>l.cles.some(c=>c===k || (Math.min(c.length,k.length)>=6 && (c.includes(k)||k.includes(c)))));
    const fq = f ? Math.min(f.reste, x.qte) : 0; if(f) f.reste -= fq;
    lignes.push({desc:x.desc, code:x.code, achete:x.qte, facture:fq, cout: x.qte ? x.montant/x.qte : 0, f:!!f});
  }));
  const surplus = lignes.reduce((t,l)=>t+Math.max(0,l.achete-l.facture)*l.cout,0);
  const nonAchete = fact.filter(l=>l.reste>0);
  return {lignes, surplus, nonAchete};
}
function CvAcheteFacture({job, achats, facLignes}){
  const [ouvert,setOuvert]=useState(false);
  const m = cvMateriel(job, achats);
  const mes = job.factures.flatMap(n=>(facLignes||{})[n]||[]);
  if(!m.liste.length) return null;
  const c = cvComparer(m.liste, mes);
  return <div style={{margin:'0 0 10px',fontSize:13}}>
    <div style={{cursor:'pointer'}} onClick={()=>setOuvert(!ouvert)}>
      <b>Acheté vs facturé</b> {ouvert?'▲':'▼'} <span className="muted">· {c.lignes.length} articles achetés{c.surplus>0.5 ? <> · <b style={{color:'var(--warning)'}}>{cvMoney(c.surplus)} pas facturé → inventaire ?</b></> : ''}{!mes.length ? ' · articles de tes factures pas encore lus' : ''}</span>
    </div>
    {ouvert && <div style={{marginTop:6}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 54px 54px 70px',gap:6,fontSize:11.5,fontWeight:800,color:'var(--muted)',borderBottom:'1px solid var(--border)',paddingBottom:3}}>
        <span>Article</span><span style={{textAlign:'right'}}>Acheté</span><span style={{textAlign:'right'}}>Facturé</span><span style={{textAlign:'right'}}>Surplus</span>
      </div>
      {c.lignes.map((l,i)=>{ const s=l.achete-l.facture; return <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 54px 54px 70px',gap:6,fontSize:12,padding:'3px 0',borderBottom:'1px dashed var(--border)'}}>
        <span>{l.desc} <span className="muted">{l.code}</span></span>
        <span style={{textAlign:'right'}}>{l.achete}</span>
        <span style={{textAlign:'right',color:l.f?undefined:'var(--muted)'}}>{l.f?l.facture:'—'}</span>
        <span style={{textAlign:'right',color:s>0?'var(--warning)':'var(--success)',fontWeight:700}}>{s>0 ? s+' · '+cvMoney(s*l.cout) : '✓'}</span>
      </div>; })}
      {c.nonAchete.length>0 && <div className="muted" style={{fontSize:12,marginTop:6}}>Facturé sans achat trouvé (pris dans l'inventaire ou un autre fournisseur) : {c.nonAchete.map(l=>l.reste+' × '+l.desc).join(' · ')}</div>}
      <div className="muted" style={{fontSize:11.5,marginTop:4}}>Le lien se fait par le code de l'article ; « — » veut dire que je n'ai pas trouvé l'article sur tes factures (code différent ou pas facturé).</div>
    </div>}
  </div>;
}
